ts du changement climatique sur les sociétés. B : mesure d'atténuation (elle réduit les émissions).", "img": "", "fixes": 0}, {"t": "D'après le rapport du GIEC de 2014, limiter le réchauffement à 2 °C suppose de réduire les émissions mondiales de gaz à effet de serre, entre 2010 et 2050, de :", "p": ["5 à 10 %.", "100 % dès 2020.", "40 à 70 %.", "0 % : aucune réduction n'est nécessaire."], "b": "C", "j": "Le rapport de 2014 indique une réduction de 40 à 70 % entre 2010 et 2050, puis des émissions proches de zéro à la fin du siècle.", "img": "", "fixes": 0}, {"t": "D'après le rapport du GIEC de 2014, si toutes les réserves de combustibles fossiles étaient utilisées :", "p": ["l'épuisement rapide des réserves suffirait à régler le problème climatique.", "le climat ne serait pas modifié.", "le réchauffement se poursuivrait au siècle suivant.", "le réchauffement atteindrait 4 à 5 °C en 2100."], "b": "CD", "j": "Les réserves (y compris pétroles et gaz non conventionnels) sont suffisamment importantes pour provoquer un réchauffement considérable : on ne peut pas compter sur leur épuisement.", "img": "", "fixes": 0}], "auto": [{"production": "Le rôle de l'Homme (consignes 1 à 3)", "criteres": [{"nom": "Contenu", "points": ["Tableau chronologique complet ; passage de « non démontrable » (1990) à « sans équivoque » (2021) expliqué.", "Trois paragraphes : modèles fiables (ils reproduisent le passé), réchauffement selon les scénarios, climat de 2100 lié à nos émissions.", "Je distingue modèle (outil fondé sur la physique) et scénario (hypothèse sur les émissions).", "Effort demandé (− 43 % d'ici 2030, neutralité vers 2050) comparé aux émissions réelles ; un obstacle précis par nature.", "Je ne confonds pas météo (quelques jours) et climat (moyennes sur au moins 30 ans)."]}]}, {"production": "Écosystèmes et texte final (consignes 4 et 5)", "criteres": [{"nom": "Contenu", "points": ["Recul de la banquise : réseau trophique perturbé, biodiversité de l'Arctique menacée."]}, {"nom": "Communication", "points": ["Réseau trophique arctique titré, flèches orientées (« est mangé par »).", "Schéma agricole lisible d'un coup d'œil : effet fertilisant du CO₂ limité, chaleur, sécheresse, montée du niveau marin."]}, {"nom": "Démarche", "points": ["Mon texte final répond à la problématique en s'appuyant sur toutes mes productions."]}]}]}, {"id": 65, "code": "608cc2a791", "titre": "Génétique – Activité 1 : Stabilité génétique et évolution clonale", "questions": [{"t": "Un clone cellulaire est :", "p": ["un ensemble de cellules issues, par mitoses successives, d'une même cellule et génétiquement identiques aux mutations près.", "un ensemble de cellules produites par méiose.", "un ensemble de cellules de même forme, quelle que soit leur origine.", "un ensemble de cellules issues de la fusion de deux gamètes."], "b": "A", "j": "La mitose conserve l'information génétique : toutes les cellules issues d'une même cellule forment un clone. « Aux mutations près » : de rares erreurs de réplication créent des différences.", "img": "", "fixes": 0}, {"t": "Parmi ces ensembles de cellules, lesquels sont des clones ?", "p": ["Une colonie bactérienne issue d'une seule bactérie.", "Les cellules d'une tumeur issue d'une cellule devenue cancéreuse.", "L'ensemble des gamètes produits par un individu.", "Les lymphocytes B issus de la multiplication d'un même lymphocyte activé."], "b": "ABD", "j": "Dans les trois cas, les cellules dérivent par mitoses d'une cellule unique (cellules séparées ou associées en tissu). C : les gamètes sont produits par méiose et sont génétiquement différents.", "img": "", "fixes": 0}, {"t": "Au sein d'un clone, des différences génétiques apparaissent entre cellules car :", "p": ["les cellules échangent des chromosomes entre elles.", "l'ADN polymérase commet de rares erreurs lors de la réplication.", "des crossing-over se produisent à chaque mitose.", "certaines erreurs échappent aux systèmes de réparation de l'ADN."], "b": "BD", "j": "Les erreurs de réplication non réparées sont la principale source de mutations. En l'absence d'échanges génétiques avec l'extérieur, la diversité d'un clone ne provient que de ces mutations.", "img": "", "fixes": 0}, {"t": "La probabilité qu'un nucléotide soit modifié lors d'une réplication est d'environ 1/10^{9}. Le génome d'une cellule humaine compte 6,4 × 10^{9} nucléotides. À chaque division, on attend donc en moyenne :", "p": ["environ 6 mutations par cellule.", "environ 6 milliards de mutations par cellule.", "une mutation toutes les 1 000 divisions.", "aucune mutation."], "b": "A", "j": "6,4 × 10^{9} × 1/10^{9} = 6,4. Le taux d'erreur est très faible, mais le génome est très grand.", "img": "", "fixes": 0}, {"t": "Bien que le taux d'erreur de la réplication soit très faible, les mutations sont très nombreuses à l'échelle d'un organisme car :", "p": ["le nombre de nucléotides du génome est très élevé.", "le nombre de divisions cellulaires au cours de la vie est considérable.", "les systèmes de réparation ne fonctionnent jamais.", "chaque cellule ne se divise qu'une seule fois."], "b": "AB", "j": "Environ 10^{17} divisions au cours d'une vie humaine, pour 6,4 × 10^{9} nucléotides à recopier à chaque fois : la survenue de mutations est inévitable. Les cellules d'un organisme ne sont donc pas toutes génétiquement identiques.", "img": "", "fixes": 0}, {"t": "Une mutation survient dans une cellule de la peau et n'est pas réparée.", "p": ["Elle est transmise à toutes les cellules qui descendent de cette cellule (sous-clone).", "Elle sera transmise aux enfants de l'individu.", "Elle se retrouve dans toutes les cellules de l'organisme.", "D'autres mutations peuvent s'y ajouter au fil des divisions."], "b": "AD", "j": "Une mutation devient pérenne pour toute la lignée cellulaire qui dérive de la cellule mutée, et les mutations s'accumulent. B : une mutation somatique n'est pas transmise à la descendance.", "img": "", "fixes": 0}, {"t": "Pour qu'une mutation soit transmise à la descendance d'un individu, elle doit :", "p": ["se produire après la naissance uniquement.", "toucher n'importe quelle cellule de l'organisme.", "toucher une cellule de la peau.", "toucher une cellule de la lignée germinale, à l'origine des gamètes."], "b": "D", "j": "Seules les mutations présentes dans les gamètes peuvent se retrouver dans la cellule-œuf, donc dans toutes les cellules du descendant.", "img": "", "fixes": 0}, {"t": "Qu'est-ce qui crée de nouveaux allèles ?", "p": ["La fécondation.", "Le brassage intrachromosomique.", "Le brassage interchromosomique.", "Les mutations."], "b": "D", "j": "Méiose et fécondation créent de nouvelles combinaisons d'allèles ; seules les mutations font apparaître de nouveaux allèles.", "img": "", "fixes": 0}], "auto": [{"production": "Clones et mutations (consignes 1 à 3)", "criteres": [{"nom": "Complétude", "points": ["Clone : cellules génétiquement identiques issues d'une seule cellule par mitoses (pomme de terre, intestin, lymphocytes B)."]}, {"nom": "Exactitude", "points": ["Calcul : 10⁻⁹ × 6,4 × 10⁹ ≈ 6 mutations par division ; × 10¹⁷ divisions ≈ 10¹⁷ à 10¹⁸ mutations dans une vie.", "Mutation précoce (premières divisions) : grand sous-clone ; mutation tardive : petit sous-clone (cellules sanguines)."]}]}, {"production": "p53 et schéma bilan (consignes 4 à 6)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Mon schéma répond à la problématique : la mitose conserve le génome, mais chaque mutation passe à toute la lignée."]}, {"nom": "Complétude", "points": ["Clone tumoral : mutations successives dans une même lignée (APC, Ras, p53) ou sur un site régulateur (Bcl2).", "Schéma : cellule-œuf, mitoses, mutations précoces et tardives, sous-clones emboîtés, clone tumoral."]}, {"nom": "Exactitude", "points": ["p53 : substitution C → T en position 833, proline → leucine au codon 278 ; la protéine ne bloque plus le cycle."]}, {"nom": "Conformité", "points": ["Schéma titré et légendé ; capture GeniGen2 titrée, position 833 repérée."]}]}]}, {"id": 66, "code": "ac2087af08", "titre": "Génétique – Activité 2 : Les lois de Mendel", "questions": [{"t": "La fécondation :", "p": ["réunit deux gamètes haploïdes.", "divise par deux le nombre de chromosomes.", "produit une cellule-œuf haploïde.", "constitue, pour chaque gène, une paire d'allèles : l'un d'origine paternelle, l'autre d'origine maternelle."], "b": "AD", "j": "La fécondation rassemble deux génomes d'origine indépendante (n + n = 2n). B : c'est la méiose qui réduit de moitié le nombre de chromosomes. La cellule-œuf est diploïde.", "img": "", "fixes": 0}, {"t": "Un individu de génotype (A//a) :", "p": ["est homozygote.", "est hétérozygote.", "produit deux types de gamètes, (A) et (a), en proportions égales.", "exprime forcément le phénotype associé à l'allèle a."], "b": "BC", "j": "Hétérozygote : deux allèles différents pour le gène. La séparation des chromosomes homologues en méiose donne 50 % de gamètes (A) et 50 % de gamètes (a). D : cela dépend des relations de dominance.", "img": "", "fixes": 0}, {"t": "On croise une plante de lignée pure à fleurs rouges avec une plante de lignée pure à fleurs blanches. Tous les descendants F1 ont des fleurs rouges.", "p": ["L'allèle « blanc » a disparu chez les F1.", "Les individus F1 sont homozygotes.", "Les individus F1 sont hétérozygotes.", "L'allèle « rouge » est dominant sur l'allèle « blanc »."], "b": "CD", "j": "Chaque parent de lignée pure (homozygote) transmet un allèle : les F1 sont hétérozygotes. Leur phénotype montre que l'allèle « rouge » s'exprime seul : il est dominant. L'allèle « blanc », récessif, est présent mais masqué.", "img": "", "fixes": 0}, {"t": "On croise entre elles des plantes hétérozygotes (R//b), l'allèle R (fleurs rouges) étant dominant sur l'allèle b (fleurs blanches). Dans la descendance, on attend :", "p": ["3/4 de fleurs rouges et 1/4 de fleurs blanches.", "100 % de fleurs rouges.", "1/4 de fleurs rouges et 3/4 de fleurs blanches.", "1/2 de fleurs rouges et 1/2 de fleurs blanches."], "b": "A", "j": "Chaque parent produit 1/2 de gamètes (R) et 1/2 de gamètes (b). Échiquier de croisement : 1/4 (R//R), 1/2 (R//b), 1/4 (b//b), soit 3/4 [rouge] et 1/4 [blanc].", "img": "", "fixes": 0}, {"t": "On croise entre elles des plantes hétérozygotes (R//b), l'allèle R (fleurs rouges) étant dominant sur l'allèle b (fleurs blanches). Parmi les descendants à fleurs rouges, la proportion d'hétérozygotes est de :", "p": ["1/4.", "1/2.", "2/3.", "3/4."], "b": "C", "j": "Les plantes rouges représentent 3/4 des descendants : 1/4 (R//R) et 2/4 (R//b). Parmi elles, 2 sur 3 sont hétérozygotes.", "img": "", "fixes": 0}, {"t": "Un individu possédant l'allèle A et l'allèle B du système ABO est de groupe sanguin [AB]. On dit que ces deux allèles sont :", "p": ["récessifs.", "codominants.", "liés.", "indépendants."], "b": "B", "j": "Codominance : les deux allèles s'expriment à part égale dans le phénotype de l'hétérozygote.", "img": "", "fixes": 0}, {"t": "Une lignée pure pour un caractère est constituée d'individus :", "p": ["hétérozygotes pour le gène étudié.", "issus d'un croisement-test.", "tous de même sexe.", "homozygotes pour le gène étudié."], "b": "D", "j": "Homozygotes, ils ne produisent qu'un seul type de gamètes pour ce gène : croisés entre eux, ils donnent toujours des descendants de même phénotype.", "img": "", "fixes": 0}, {"t": "La méiose :", "p": ["comporte deux divisions successives précédées d'une seule réplication de l'ADN.", "produit des cellules génétiquement identiques à la cellule de départ.", "produit deux cellules diploïdes à partir d'une cellule diploïde.", "sépare les chromosomes homologues lors de la première division."], "b": "AD", "j": "Première division : séparation des chromosomes homologues (passage de 2n à n). Deuxième division : séparation des chromatides. B : c'est la mitose qui conserve l'information génétique. Elle produit quatre cellules haploïdes.", "img": "", "fixes": 0}, {"t": "Au cours de la méiose :", "p": ["en anaphase I, les chromatides de chaque chromosome se séparent.", "en anaphase I, les chromosomes homologues de chaque paire se séparent.", "en anaphase II, les chromatides de chaque chromosome se séparent.", "à la fin de la première division, les cellules sont haploïdes, avec des chromosomes à deux chromatides."], "b": "BCD", "j": "Cette chronologie doit être parfaitement maîtrisée : elle explique à la fois les brassages et les anomalies de la méiose.", "img": "", "fixes": 0}], "auto": [{"production": "Les expériences de Mendel (consignes 1 et 2)", "criteres": [{"nom": "Complétude", "points": ["Intervalle [f − 1/√n ; f + 1/√n] calculé pour les 7 caractères : 0,75 y est toujours compris."]}, {"nom": "Exactitude", "points": ["Parents de lignée pure (V//V) et (v//v) ; F1 (V//v) à fleurs violettes : V dominant, v récessif.", "Méiose de F1 : homologues séparés en 1re division ; F1 produit 1/2 de gamètes (V) et 1/2 de (v).", "Tableau F1 × F1 : 3/4 de fleurs violettes, 1/4 de blanches (705 et 224 chez Mendel)."]}]}, {"production": "Groupes sanguins et texte (consignes 3 et 4)", "criteres": [{"nom": "Complétude", "points": ["Texte : la méiose donne un seul allèle par gamète ; la fécondation les réunit au hasard ; le tableau donne les probabilités.", "J'ai distingué allèles dominant, récessif et codominants (groupe [AB])."]}, {"nom": "Exactitude", "points": ["Sarah (IA//i) et Antoine (IB//i), justifiés par l'enfant [O] ; 1/4 de chance pour chaque groupe."]}, {"nom": "Conformité", "points": ["Schémas et tableaux titrés, génotypes bien écrits (A//a), phrases claires."]}]}]}, {"id": 67, "code": "d296e8afba", "titre": "Génétique – Activité 3 : Le brassage interchromosomique", "questions": [{"t": "Le brassage interchromosomique a pour origine :", "p": ["l'échange de portions de chromatides en prophase I.", "la disposition aléatoire de chaque paire de chromosomes en métaphase I, suivie de la séparation des homologues en anaphase I.", "la réplication de l'ADN avant la méiose.", "la rencontre au hasard des gamètes."], "b": "B", "j": "Chaque paire de chromosomes homologues s'oriente indépendamment des autres : un chromosome d'une paire peut se retrouver avec l'un ou l'autre des chromosomes des autres paires. A : brassage intrachromosomique.", "img": "", "fixes": 0}, {"t": "Chez la drosophile (2n = 8), le brassage interchromosomique seul permet de former :", "p": ["16 types de gamètes.", "64 types de gamètes.", "8 types de gamètes.", "4 types de gamètes."], "b": "A", "j": "2^{n} combinaisons, avec n = nombre de paires de chromosomes : 2^{4} = 16.", "img": "", "fixes": 0}, {"t": "Dans l'espèce humaine (2n = 46), le brassage interchromosomique seul permet de former environ :", "p": ["529 types de gamètes.", "46 types de gamètes.", "23 types de gamètes.", "8 millions de types de gamètes."], "b": "D", "j": "2^{23}, soit environ 8,4 millions. Ce nombre est très sous-évalué car il ne tient pas compte du brassage intrachromosomique.", "img": "", "fixes": 0}, {"t": "Un individu de génotype (A//a ; B//b), dont les deux gènes sont portés par deux paires de chromosomes différentes, produit :", "p": ["4 types de gamètes en proportions égales.", "uniquement 2 types de gamètes.", "25 % de gamètes (A ; b).", "une majorité de gamètes de type parental."], "b": "AC", "j": "Gènes indépendants : (A ; B), (A ; b), (a ; B), (a ; b), 25 % chacun, par brassage interchromosomique.", "img": "", "fixes": 0}, {"t": "On croise entre eux des individus F1 (A//a ; B//b), les deux gènes étant indépendants et les allèles A et B dominants. La proportion de descendants de phénotype [a ; b] est de :", "p": ["1/2.", "1/4.", "1/8.", "1/16."], "b": "D", "j": "Chaque F1 produit 1/4 de gamètes (a ; b). La rencontre de deux gamètes (a ; b) a une probabilité de 1/4 × 1/4 = 1/16 (proportions 9/16, 3/16, 3/16, 1/16).", "img": "", "fixes": 0}, {"t": "Un croisement-test consiste à croiser l'individu étudié avec :", "p": ["un individu homozygote dominant pour les gènes étudiés.", "un individu homozygote récessif pour les gènes étudiés.", "un individu hétérozygote pour les gènes étudiés.", "l'un de ses descendants."], "b": "B", "j": "Le parent double récessif ne produit qu'un seul type de gamètes, porteurs d'allèles récessifs qui ne masquent rien.", "img": "", "fixes": 0}, {"t": "L'intérêt d'un croisement-test est que :", "p": ["il fait apparaître de nouveaux allèles.", "le phénotype de chaque descendant révèle la combinaison d'allèles du gamète fourni par l'individu testé.", "les proportions des phénotypes obtenus sont celles des gamètes produits par l'individu testé.", "le parent récessif ne produit qu'un seul type de gamètes."], "b": "BCD", "j": "Le croisement-test permet de « lire » les gamètes produits par un individu F1, donc de savoir si les gènes sont indépendants ou liés.", "img": "", "fixes": 0}, {"t": "Chez la drosophile, un croisement-test entre une F1 [ailes longues, corps gris] et un individu [ailes vestigiales, corps ebony] donne : 248 [longues, gris], 252 [vestigiales, ebony], 247 [longues, ebony], 253 [vestigiales, gris].", "p": ["Les quatre phénotypes sont en proportions égales.", "Les phénotypes recombinés représentent environ 50 % des descendants.", "Les deux gènes sont liés.", "Les deux gènes sont portés par deux paires de chromosomes différentes."], "b": "ABD", "j": "Quatre phénotypes à environ 25 % chacun : F1 produit quatre types de gamètes équiprobables, ce qui signe deux gènes indépendants (brassage interchromosomique).", "img": "", "fixes": 0}, {"t": "Dans un croisement-test portant sur deux gènes, les phénotypes « recombinés » :", "p": ["présentent des combinaisons de caractères absentes chez les parents de lignée pure.", "représentent 50 % des descendants si les gènes sont indépendants.", "représentent plus de 50 % des descendants si les gènes sont liés.", "résultent de mutations."], "b": "AB", "j": "Gènes indépendants : 50 % de parentaux, 50 % de recombinés. Gènes liés : parentaux majoritaires, recombinés minoritaires.", "img": "", "fixes": 0}], "auto": [{"production": "Parents, F1 et anticipation (consignes 1 à 6)", "criteres": [{"nom": "Exactitude", "points": ["P1 (vg⁺//vg⁺ ; eb⁺//eb⁺), P2 (vg//vg ; eb//eb) ; F1 homogène (vg⁺//vg ; eb⁺//eb) : vg⁺ et eb⁺ dominants.", "Méiose de F1 : deux dispositions équiprobables des paires en métaphase I → 4 types de gamètes à 25 %."]}]}, {"production": "Croisement-test et réponse (consignes 7 à 13)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Croisement-test : P2 double récessif ne masque rien ; compter les phénotypes, c'est compter les gamètes de F1."]}, {"nom": "Complétude", "points": ["Comptage : 4 phénotypes proches de 25 %, deux parentaux et deux recombinés.", "Brassage interchromosomique en métaphase I, puis fécondation au hasard ; 2ⁿ gamètes (16 chez la drosophile, 2²³ chez l'humain)."]}, {"nom": "Exactitude", "points": ["Échiquier à 4 cases de 1/4, phénotypes recombinés repérés.", "25 % est dans l'intervalle de confiance de la classe : l'anticipation est validée."]}, {"nom": "Conformité", "points": ["Schéma de la méiose et échiquier titrés et légendés ; notation (A//a ; B//b) respectée."]}]}]}, {"id": 68, "code": "d43fdf141f", "titre": "Génétique – Activité 4 : Le brassage intrachromosomique", "questions": [{"t": "Le crossing-over :", "p": ["se produit en anaphase II de méiose.", "se manifeste par des figures appelées chiasmas.", "est un échange de portions de chromatides entre chromosomes homologues appariés.", "se produit en prophase I de méiose."], "b": "BCD", "j": "En prophase I, les chromosomes homologues s'apparient ; leurs chromatides s'entrecroisent (chiasmas) et peuvent échanger des portions.", "img": "", "fixes": 0}, {"t": "À propos de la fréquence des crossing-over :", "p": ["Plus deux gènes sont proches sur un chromosome, plus un crossing-over entre eux est fréquent.", "Il se produit au moins un crossing-over par paire de chromosomes à chaque méiose.", "Le crossing-over est un accident exceptionnel.", "Un crossing-over entre deux gènes donnés ne se produit que lors de certaines méioses."], "b": "BD", "j": "Le crossing-over est un phénomène normal de la méiose. Entre deux gènes donnés, il est d'autant plus rare que les gènes sont proches : les gamètes recombinés sont donc minoritaires.", "img": "", "fixes": 0}, {"t": "Le brassage intrachromosomique :", "p": ["crée de nouveaux allèles.", "modifie le nombre de chromosomes des gamètes.", "n'a de conséquence génétique que si l'individu est hétérozygote pour les gènes concernés.", "crée de nouvelles combinaisons d'allèles sur un même chromosome."], "b": "CD", "j": "Les brassages redistribuent des allèles déjà existants ; seules les mutations créent de nouveaux allèles. Chez un homozygote, l'échange de deux portions identiques ne change rien.", "img": "", "fixes": 0}, {"t": "Les brassages interchromosomique et intrachromosomique :", "p": ["se succèdent : intrachromosomique en prophase I, interchromosomique en anaphase I.", "produisent une diversité de gamètes d'autant plus grande que l'individu est hétérozygote pour de nombreux gènes.", "ont des effets qui s'ajoutent.", "s'excluent : une méiose ne réalise que l'un des deux."], "b": "ABC", "j": "Le brassage interchromosomique porte sur des chromosomes déjà remaniés par le brassage intrachromosomique : la diversité des gamètes est quasi infinie.", "img": "", "fixes": 0}, {"t": "Un croisement-test entre une femelle F1 [ailes longues, corps gris] et un mâle [ailes vestigiales, corps black] donne : 415 [longues, gris], 412 [vestigiales, black], 85 [longues, black], 88 [vestigiales, gris].", "p": ["Les phénotypes recombinés s'expliquent par des crossing-over survenus chez la F1.", "Les phénotypes recombinés représentent environ 17 % des descendants.", "Les deux gènes sont liés (portés par la même paire de chromosomes).", "Les deux gènes sont indépendants."], "b": "ABC", "j": "Phénotypes parentaux majoritaires (827/1000), recombinés minoritaires (173/1000, soit 17 %) : les gènes sont liés, et les gamètes recombinés proviennent des méioses avec crossing-over entre les deux loci.", "img": "", "fixes": 0}, {"t": "Un individu F1 a pour génotype (vg^{+} b^{+} // vg b) : les deux gènes sont liés. En l'absence de crossing-over entre ces gènes, il produit :", "p": ["4 types de gamètes à 25 % chacun.", "un seul type de gamètes.", "2 types de gamètes, (vg^{+} b^{+}) et (vg b), à 50 % chacun.", "2 types de gamètes, (vg^{+} b) et (vg b^{+}), à 50 % chacun."], "b": "C", "j": "Sans crossing-over, les allèles portés par un même chromosome restent associés : seuls les deux types de gamètes parentaux sont formés. D : ce sont les gamètes recombinés.", "img": "", "fixes": 0}, {"t": "Trois gènes A, B et C sont portés par le même chromosome. Le pourcentage de recombinés est de 5 % entre A et B, et de 20 % entre A et C. On en déduit que :", "p": ["le gène A est plus proche de B que de C.", "les trois gènes sont indépendants.", "le gène A est plus proche de C que de B.", "A et B sont sur des chromosomes différents."], "b": "A", "j": "Plus deux gènes liés sont éloignés, plus un crossing-over a de chances de se produire entre eux, et plus le pourcentage de recombinés est élevé.", "img": "", "fixes": 0}], "auto": [{"production": "Schéma « croisement avec crossing-over » (consigne 1)", "criteres": [{"nom": "Complétude", "points": ["Proportions du document 1 reportées sous chaque gamète, avec P ou R."]}, {"nom": "Exactitude", "points": ["Gènes liés : F1 (vg⁺ b⁺//vg b) ; sans crossing-over, seulement 2 types de gamètes.", "Crossing-over en prophase I entre chromatides d'homologues (chiasmas) : 2 gamètes parentaux, 2 recombinés."]}, {"nom": "Conformité", "points": ["Schéma complété, titré et légendé."]}]}, {"production": "Texte explicatif et ECE (consignes 2 et 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["ECE : tableau titré (effectifs, %, parental ou recombiné) ; recombinés < 50 % → gènes liés, intervalle de confiance."]}, {"nom": "Complétude", "points": ["78,7 % de parentaux : les allèles portés par un même chromosome sont transmis ensemble.", "21,3 % de recombinés : crossing-over entre les deux gènes, pas à chaque méiose : brassage intrachromosomique."]}, {"nom": "Exactitude", "points": ["Je n'attends pas 4 × 25 % : ce serait le cas de gènes indépendants."]}]}]}, {"id": 69, "code": "c0280c656c", "titre": "Génétique – Activité 5 : Analyses génétiques dans l'espèce humaine", "questions": [{"t": "Dans l'espèce humaine, l'analyse génétique repose surtout sur l'étude d'arbres généalogiques car :", "p": ["les humains ne font pas de méiose.", "on ne peut pas réaliser de croisements dirigés.", "le nombre de descendants par couple est faible.", "les lois de l'hérédité ne s'appliquent pas à l'espèce humaine."], "b": "BC", "j": "L'étude des familles est aujourd'hui complétée par le séquençage de l'ADN et la comparaison avec des bases de données.", "img": "", "fixes": 0}, {"t": "Deux parents sains ont un enfant atteint d'une maladie génétique due à un gène porté par un autosome.", "p": ["L'allèle responsable de la maladie est récessif.", "L'enfant malade possède deux allèles mutés.", "L'allèle responsable de la maladie est dominant.", "Les deux parents sont hétérozygotes."], "b": "ABD", "j": "Les parents portent l'allèle muté sans être malades : il est récessif, et ils sont hétérozygotes (porteurs sains). L'enfant a reçu un allèle muté de chacun.", "img": "", "fixes": 0}, {"t": "Deux parents sont hétérozygotes pour le gène CFTR (porteurs sains de la mucoviscidose). Pour chaque grossesse, le risque d'avoir un enfant atteint est de :", "p": ["1/8.", "1/4.", "1/2.", "3/4."], "b": "B", "j": "Chaque parent a une chance sur deux de transmettre son allèle muté : 1/2 × 1/2 = 1/4.", "img": "", "fixes": 0}, {"t": "Deux parents hétérozygotes pour le gène CFTR (porteurs sains de la mucoviscidose) ont un enfant sain. La probabilité que cet enfant soit porteur de l'allèle muté (hétérozygote) est de :", "p": ["1/4.", "1/2.", "2/3.", "3/4."], "b": "C", "j": "Sur quatre combinaisons équiprobables, une donne un enfant malade. Parmi les trois qui donnent un enfant sain, deux correspondent à un hétérozygote : 2/3.", "img": "", "fixes": 0}, {"t": "La mucoviscidose :", "p": ["est une maladie liée au chromosome X.", "est due à une seule et unique mutation, la même chez tous les malades.", "touche une protéine canal permettant la sortie des ions chlorure des cellules.", "est due à des mutations du gène CFTR, porté par le chromosome 7."], "b": "CD", "j": "Près de 2 000 mutations différentes du gène CFTR sont connues ; la plus fréquente en Europe est ΔF508.", "img": "", "fixes": 0}, {"t": "Deux parents sains sont tous deux porteurs d’un allèle muté du gène d’une maladie récessive portée par un autosome. Ils attendent un enfant.", "p": ["Le risque que l’enfant soit atteint est de 1/4.", "La probabilité que l’enfant soit porteur sain est de 1/2.", "Tous leurs enfants seront malades.", "L’analyse de l’ADN du fœtus permet de remplacer ce risque par une certitude."], "b": "ABD", "j": "Chaque parent transmet son allèle muté avec une probabilité de 1/2 : 1/2 × 1/2 = 1/4 d’être malade, 1/2 d’être hétérozygote (porteur sain). Le risque est une probabilité ; seule l’analyse de l’ADN donne une certitude.", "img": "", "fixes": 0}, {"t": "En génétique médicale, le séquençage de l'ADN :", "p": ["permet d'identifier les allèles portés par chaque membre d'une famille.", "s'appuie sur la comparaison des séquences obtenues avec des bases de données.", "rend possible un diagnostic prénatal.", "permet de modifier le génotype du fœtus."], "b": "ABC", "j": "Ces analyses servent au conseil génétique : estimer un risque, informer la famille, proposer un diagnostic. D : séquencer, c'est lire l'ADN, pas le modifier.", "img": "", "fixes": 0}, {"t": "Chez la drosophile, les croisements réciproques entre lignées pures [yeux rouges] et [yeux blancs] ne donnent pas les mêmes résultats.", "p": ["Le gène de la couleur des yeux est porté par un autosome.", "Le mâle ne possède qu'un seul exemplaire de ce gène.", "Le croisement femelle (X^{w}//X^{w}) × mâle (X^{w+}//Y) donne des femelles aux yeux rouges et des mâles aux yeux blancs.", "Le gène de la couleur des yeux est porté par le chromosome X."], "b": "BCD", "j": "Des résultats différents selon le sexe du parent qui porte le caractère signent un gène lié au sexe. Les fils reçoivent leur X de leur mère, les filles un X de chaque parent.", "img": "", "fixes": 0}, {"t": "Le daltonisme est dû à un allèle récessif porté par le chromosome X. Une femme porteuse saine (X^{D}//X^{d}) a des enfants avec un homme non daltonien (X^{D}//Y).", "p": ["Chaque fils a une chance sur deux d'être daltonien.", "Toutes les filles sont daltoniennes.", "Aucune fille n'est daltonienne.", "Chaque fille a une chance sur deux d'être porteuse saine."], "b": "ACD", "j": "Les fils reçoivent Y de leur père et X^{D} ou X^{d} de leur mère. Les filles reçoivent X^{D} de leur père : aucune n'est atteinte, mais la moitié est porteuse.", "img": "", "fixes": 0}, {"t": "Un homme daltonien (allèle récessif porté par X) transmet son allèle muté :", "p": ["à toutes ses filles et à aucun de ses fils.", "à la moitié de ses fils et à la moitié de ses filles.", "à aucun de ses enfants.", "à tous ses fils et à aucune de ses filles."], "b": "A", "j": "Un père transmet son chromosome X à ses filles et son chromosome Y à ses fils.", "img": "", "fixes": 0}, {"t": "Le daltonisme est beaucoup plus fréquent chez les hommes que chez les femmes car :", "p": ["le gène est porté par le chromosome Y.", "un homme ne possède qu'un chromosome X : un seul allèle muté suffit pour qu'il soit atteint.", "les femmes ne possèdent pas ce gène.", "une femme doit posséder deux allèles mutés pour être atteinte."], "b": "BD", "j": "Environ 8 % des hommes d'origine européenne sont daltoniens, contre moins de 1 % des femmes.", "img": "", "fixes": 0}], "auto": [{"production": "Mucoviscidose (consignes 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["Transmission récessive (III-1 malade, parents sains) et autosomique (II-2 malade, père sain).", "Père R553X (codon stop), mère ΔF508 (délétion de 3 nucléotides) : III-1 a les deux, aucun canal fonctionnel.", "Risque pour le fœtus : 1/2 × 1/2 = 1/4 ; probabilité d'être porteur sain : 1/2."]}, {"nom": "Conformité", "points": ["Captures GeniGen2 titrées et légendées, mutations repérées."]}]}, {"production": "Hérédité liée au sexe (consignes 3 et 4)", "criteres": [{"nom": "Exactitude", "points": ["Croisements réciproques différents → gène porté par X ; le mâle (X//Y) exprime son unique allèle.", "Hommes daltoniens (Xd//Y), mères conductrices (XD//Xd) : plus d'hommes atteints (8 % contre 0,6 %)."]}]}, {"production": "Synthèse (consigne 5)", "criteres": [{"nom": "Complétude", "points": ["Méthode : récessif ou dominant ? autosome ou X ? puis génotypes et tableau de croisement pour le risque.", "Le risque est une probabilité ; conseil génétique et analyse de l'ADN du fœtus la remplacent par une certitude."]}, {"nom": "Conformité", "points": ["Une page au maximum, structurée, vocabulaire précis."]}]}]}, {"id": 70, "code": "c466908145", "titre": "Génétique – Activité 6 : Les accidents de la méiose", "questions": [{"t": "Un gamète humain portant deux chromosomes 21 peut résulter :", "p": ["d'une mutation ponctuelle.", "de la non-séparation des deux chromatides d'un chromosome 21 en anaphase II.", "de la non-séparation des deux chromosomes 21 homologues en anaphase I.", "d'un crossing-over."], "b": "BC", "j": "Une non-disjonction, en première ou en deuxième division de méiose, produit des gamètes ayant un chromosome en trop ou en moins.", "img": "", "fixes": 0}, {"t": "La fécondation d'un gamète portant deux chromosomes 21 par un gamète normal donne un zygote :", "p": ["monosomique, à 45 chromosomes.", "trisomique, à 47 chromosomes.", "normal, à 46 chromosomes.", "à 69 chromosomes."], "b": "B", "j": "24 + 23 = 47 chromosomes, dont trois chromosomes 21 : trisomie 21.", "img": "", "fixes": 0}, {"t": "Lors d'une méiose, les deux chromosomes homologues d'une paire ne se séparent pas en première division ; la deuxième division est normale. Parmi les quatre gamètes formés :", "p": ["tous sont normaux.", "deux portent un chromosome en trop et deux un chromosome en moins.", "deux sont normaux, un porte un chromosome en trop et un porte un chromosome en moins.", "tous portent un chromosome en trop."], "b": "B", "j": "Les deux homologues migrent vers le même pôle : une cellule en reçoit deux, l'autre aucun. C : situation obtenue lors d'une non-disjonction des chromatides en deuxième division.", "img": "", "fixes": 0}, {"t": "À propos des anomalies du nombre de chromosomes dans l'espèce humaine :", "p": ["Elles sont dues à la modification d'un seul nucléotide.", "Elles peuvent concerner les chromosomes sexuels (XXY, XYY, X seul).", "La trisomie 21 est la plus fréquente.", "Elles sont visibles sur un caryotype."], "b": "BCD", "j": "Elles résultent d'une mauvaise répartition des chromosomes à la méiose. Une monosomie correspond à un seul chromosome au lieu de deux, une trisomie à trois.", "img": "", "fixes": 0}, {"t": "Un crossing-over inégal :", "p": ["est un échange de portions qui ne sont pas strictement homologues.", "est à l'origine de duplications de gènes.", "donne un chromosome portant un gène en double et un chromosome ayant perdu ce gène.", "se produit en anaphase II."], "b": "ABC", "j": "Si l'appariement des homologues est décalé en prophase I, l'échange n'est pas équilibré : l'une des chromatides porte deux copies du gène.", "img": "", "fixes": 0}, {"t": "Une famille multigénique :", "p": ["est un ensemble de gènes issus d'un même gène ancestral par duplications.", "est un ensemble d'allèles d'un même gène.", "comprend des copies qui ont divergé par accumulation de mutations.", "comprend des gènes pouvant coder des protéines de fonctions différentes."], "b": "ACD", "j": "Exemple : la famille des globines. B "points": ["Mon texte relie chaque accident à ses conséquences et s'appuie sur mes schémas et mon arbre."]}, {"nom": "Complétude", "points": ["Pour l'individu : le plus souvent défavorable (non viable, syndromes, risque accru avec l'âge de la mère).", "Pour l'espèce : duplications → familles multigéniques ; fusion, inversions → séparation des lignées (Homme, chimpanzé)."]}]}]}, {"id": 71, "code": "0be80a904d", "titre": "Génétique – Activité 7A : Les transferts horizontaux de gènes", "questions": [{"t": "Un transfert horizontal de gènes est :", "p": ["la transmission de gènes des parents à leurs descendants.", "un échange de matériel génétique entre organismes qui n'ont pas de lien de filiation, parfois d'espèces différentes.", "un échange de portions de chromatides en méiose.", "la transmission d'un caractère par apprentissage."], "b": "B", "j": "A : c'est un transfert vertical, assuré par la reproduction. Les transferts horizontaux se font par des processus variés (transformation, conjugaison, virus).", "img": "", "fixes": 0}, {"t": "Les transferts horizontaux de gènes sont possibles parce que :", "p": ["les mutations sont orientées par l'environnement.", "toutes les espèces possèdent exactement les mêmes gènes.", "l'ADN est le support universel de l'information génétique, de même structure chez tous les êtres vivants.", "un gène transféré peut être exprimé par la cellule receveuse, le code génétique étant commun."], "b": "CD", "j": "L'universalité de l'ADN et du code génétique permet à une cellule d'intégrer et d'exprimer un gène provenant d'une autre espèce.", "img": "", "fixes": 0}, {"t": "La transformation bactérienne correspond à :", "p": ["l'intégration par une bactérie d'ADN libre présent dans son milieu.", "le transfert d'un plasmide par un pilus.", "l'injection d'ADN par un virus.", "la division d'une bactérie en deux."], "b": "A", "j": "Des bactéries détruites libèrent leur ADN ; certaines espèces peuvent l'intégrer et l'exprimer. B : conjugaison.", "img": "", "fixes": 0}, {"t": "La conjugaison bactérienne :", "p": ["correspond à l'intégration d'ADN libre du milieu.", "est le transfert d'un plasmide d'une bactérie à une autre.", "nécessite un contact entre les deux bactéries par un pont (pilus).", "ne peut se produire qu'entre bactéries strictement identiques."], "b": "BC", "j": "Les plasmides sont de petites molécules d'ADN circulaires, distinctes du chromosome bactérien, qui portent souvent des gènes de résistance aux antibiotiques. La conjugaison est possible entre bactéries de la même espèce ou d'espèces différentes.", "img": "", "fixes": 0}, {"t": "Les virus peuvent être des vecteurs de transferts horizontaux car :", "p": ["ils peuvent emporter des gènes d'une cellule hôte et les transférer à une autre.", "ils intègrent leur matériel génétique dans la cellule qu'ils infectent.", "des gènes viraux peuvent s'intégrer durablement dans le génome de l'hôte.", "des séquences d'origine virale sont présentes dans le génome humain."], "b": "ABCD", "j": "Si l'intégration touche des cellules de la lignée germinale, les séquences virales sont ensuite transmises de génération en génération.", "img": "", "fixes": 0}, {"t": "Environ 8 % du génome humain est constitué :", "p": ["d'ADN mitochondrial.", "de gènes d'origine végétale.", "de séquences d'origine virale (rétrovirus endogènes).", "de gènes codant des protéines."], "b": "C", "j": "Ces séquences témoignent d'anciens transferts horizontaux, devenus héréditaires.", "img": "", "fixes": 0}, {"t": "La syncytine, protéine indispensable à la formation du placenta :", "p": ["illustre l'apport d'une fonction nouvelle par un transfert horizontal.", "doit être réintroduite par une infection virale à chaque génération.", "est codée par un gène d'origine virale.", "montre le rôle des transferts horizontaux dans l'évolution des espèces."], "b": "ACD", "j": "Le gène, issu d'un rétrovirus intégré au génome d'un ancêtre des mammifères, est depuis transmis verticalement.", "img": "", "fixes": 0}, {"t": "Selon le gène utilisé pour les construire, les arbres phylogénétiques de certaines espèces ne sont pas cohérents entre eux. Cela s'explique par :", "p": ["la méiose.", "des transferts horizontaux de gènes entre lignées.", "des erreurs systématiques de séquençage.", "l'absence de parenté entre les êtres vivants."], "b": "B", "j": "Un gène acquis par transfert horizontal « raconte » une autre histoire que le reste du génome. En représentant ces transferts, l'arbre devient un réseau phylogénétique.", "img": "", "fixes": 0}, {"t": "À propos de la résistance des bactéries aux antibiotiques :", "p": ["Une bactérie non pathogène peut transmettre un gène de résistance à une bactérie pathogène.", "L'usage excessif d'antibiotiques sélectionne les bactéries résistantes.", "Les antibiotiques provoquent les mutations qui rendent les bactéries résistantes.", "Les gènes de résistance sont souvent portés par des plasmides."], "b": "ABD", "j": "L'antibiotique ne crée pas la résistance : il élimine les bactéries sensibles et laisse se multiplier les résistantes. Les transferts horizontaux accélèrent la diffusion des gènes de résistance.", "img": "", "fixes": 0}, {"t": "Pour produire de l'insuline humaine, on introduit le gène humain de l'insuline dans des bactéries.", "p": ["C'est possible grâce à l'universalité de l'ADN et du code génétique.", "C'est une application biotechnologique des transferts horizontaux.", "La bactérie produit une insuline bactérienne, différente de l'insuline humaine.", "C'est une transgénèse."], "b": "ABD", "j": "La bactérie lit le gène humain et fabrique la protéine humaine. Le même principe permet d'obtenir des organismes génétiquement modifiés.", "img": "", "fixes": 0}], "auto": [{"production": "Mécanismes (consignes 1 et 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Griffith et Avery : chaque expérience comparée à un témoin ; sans ADN, plus de transformation : l'ADN porte l'information."]}, {"nom": "Complétude", "points": ["Mécanismes : ADN libre, conjugaison (plasmide), virus ; possibles car l'ADN et le code génétique sont universels."]}]}, {"production": "Évolution des génomes (consignes 3 et 4)", "criteres": [{"nom": "Exactitude", "points": ["Syncytine : 80 % d'identité avec l'enveloppe d'un rétrovirus et même fonction (fusion de membranes).", "Les cellules infectées étaient germinales : sinon le gène n'aurait pas été transmis."]}, {"nom": "Conformité", "points": ["Schéma de la porphyranase en 4 étapes (algue nori, bactérie marine, transfert, microbiote) ; captures annotées."]}]}, {"production": "Texte explicatif (consigne 5)", "criteres": [{"nom": "Complétude", "points": ["Évolution : génomes enrichis d'un coup (placenta, microbiote, plus de 100 gènes étrangers chez les primates).", "Santé : gènes de résistance sur plasmides (antibiorésistance) ; biotechnologies (protéines humaines produites par des bactéries)."]}, {"nom": "Conformité", "points": ["Texte structuré, vocabulaire précis (transfert horizontal, plasmide, rétrovirus)."]}]}]}, {"id": 72, "code": "15eb72c405", "titre": "Génétique – Activité 7B : Les endosymbioses", "questions": [{"t": "Parmi ces caractéristiques des mitochondries et des chloroplastes, lesquelles sont des arguments en faveur de leur origine endosymbiotique ?", "p": ["Leur double membrane.", "Leur taille, comparable à celle des bactéries.", "Leur ADN propre et leurs ribosomes de type bactérien.", "Leur mode de division, semblable à celui des bactéries."], "b": "ABCD", "j": "S'y ajoute la parenté de leur génome avec celui de bactéries actuelles (théorie endosymbiotique, Lynn Margulis).", "img": "", "fixes": 0}, {"t": "Les mitochondries et les chloroplastes se multiplient :", "p": ["par méiose.", "par assemblage de protéines à partir du noyau.", "par mitose, avec fuseau de division.", "par duplication de leur ADN puis étranglement, comme les bactéries."], "b": "D", "j": "Leur ADN se réplique indépendamment de l'ADN nucléaire : un organite provient toujours d'un organite préexistant.", "img": "", "fixes": 0}, {"t": "La comparaison des génomes montre que :", "p": ["les chloroplastes sont apparentés à des cyanobactéries.", "les mitochondries sont apparentées à des virus.", "les chloroplastes sont apparentés à des α-protéobactéries.", "les mitochondries sont apparentées à des α-protéobactéries."], "b": "AD", "j": "Mitochondries : bactéries aérobies pratiquant la respiration (endosymbiose il y a 1,5 à 2 Ga). Chloroplastes : cyanobactéries photosynthétiques.", "img": "", "fixes": 0}, {"t": "Chez les végétaux, la RuBisCO est formée de deux types de sous-unités : le gène rbcL est situé dans l'ADN du chloroplaste, le gène rbcS dans le noyau.", "p": ["Certains gènes de l'endosymbiote ont été transférés dans le noyau de la cellule hôte.", "Le chloroplaste est totalement autonome vis-à-vis de la cellule.", "La RuBisCO est fabriquée grâce à la coopération des deux génomes.", "Le génome de l'endosymbiote a régressé au cours de l'évolution."], "b": "ACD", "j": "Au fil des générations, une partie des gènes de l'endosymbiote a migré vers le noyau : l'organite est devenu dépendant de la cellule hôte.", "img": "", "fixes": 0}, {"t": "À propos de la répartition des organites :", "p": ["Les bactéries possèdent des mitochondries.", "Presque toutes les cellules eucaryotes possèdent des mitochondries.", "Une cellule chlorophyllienne de feuille possède à la fois des mitochondries et des chloroplastes.", "Seules les cellules eucaryotes photosynthétiques possèdent des chloroplastes."], "b": "BCD", "j": "Les cellules végétales respirent aussi : elles possèdent des mitochondries en plus de leurs chloroplastes.", "img": "", "fixes": 0}], "auto": [{"production": "Entraînement ECE (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Conclusion : le chloroplaste est issu de l'endosymbiose d'une cyanobactérie."]}, {"nom": "Exactitude", "points": ["Feuille et spiruline partagent la chlorophylle a ; la RbcL du radis est très proche de celle des cyanobactéries.", "Le gène rbcS, transféré dans le noyau, a évolué autrement : similitude plus faible."]}, {"nom": "Conformité", "points": ["Chromatogramme titré (dépôt, front, taches légendées) ; tableau des similitudes RbcL et RbcS."]}]}, {"production": "Texte argumenté (consigne 2)", "criteres": [{"nom": "Complétude", "points": ["Endosymbioses actuelles : zooxanthelles des coraux, Buchnera des pucerons (fonction gagnée, génome réduit, transmission).", "Mitochondries et chloroplastes : double membrane, ADN circulaire, ribosomes, division ; parenté bactérienne.", "Gènes transférés vers le noyau : partenaires inséparables ; respiration et photosynthèse acquises d'un coup."]}, {"nom": "Conformité", "points": ["Texte structuré, appuyé sur mes résultats d'ECE."]}]}]}, {"id": 73, "code": "155b1c06d3", "titre": "Génétique – Activité 8A : Hardy-Weinberg et forces évolutives", "questions": [{"t": "Le modèle de Hardy-Weinberg prévoit, pour une population qui respecte certaines conditions :", "p": ["la disparition progressive des allèles récessifs.", "une augmentation de la fréquence des allèles dominants.", "l'apparition régulière de nouveaux allèles.", "la stabilité des fréquences des allèles au cours des générations."], "b": "D", "j": "Une population qui respecte ces conditions n'évolue pas : sa structure génétique reste stable. La dominance d'un allèle n'a aucun effet sur sa fréquence.", "img": "", "fixes": 0}, {"t": "Parmi ces conditions, lesquelles sont requises par le modèle de Hardy-Weinberg ?", "p": ["Des accouplements au hasard.", "Une population de très grande taille.", "L'absence de mutation et de migration.", "Une forte sélection naturelle."], "b": "ABC", "j": "Le modèle suppose l'absence de toute force évolutive : pas de mutation, de migration, de sélection (naturelle ou sexuelle), ni de dérive (effectif très grand).", "img": "", "fixes": 0}, {"t": "Dans une population à l'équilibre de Hardy-Weinberg, l'allèle A a une fréquence de 0,7 et l'allèle a une fréquence de 0,3.", "p": ["La fréquence du génotype (A//a) est de 0,21.", "La fréquence du génotype (a//a) est de 0,09.", "La fréquence du génotype (A//A) est de 0,49.", "La fréquence du génotype (A//a) est de 0,42."], "b": "BCD", "j": "p^{2} = 0,49 ; 2pq = 2 × 0,7 × 0,3 = 0,42 ; q^{2} = 0,09. La somme vaut bien 1.", "img": "", "fixes": 0}, {"t": "Une maladie récessive touche 1 personne sur 2 500 dans une population supposée à l'équilibre de Hardy-Weinberg. La fréquence q de l'allèle responsable est de :", "p": ["1/2 500.", "1/1 250.", "1/50.", "1/25."], "b": "C", "j": "Les malades sont homozygotes : q^{2} = 1/2 500, donc q = 1/50 = 0,02.", "img": "", "fixes": 0}, {"t": "Dans une population à l'équilibre de Hardy-Weinberg, l'allèle récessif responsable d'une maladie a une fréquence q = 0,02. La fréquence des hétérozygotes (porteurs sains) est d'environ :", "p": ["1/2 500.", "1/1 250.", "1/50.", "1/25."], "b": "D", "j": "2pq = 2 × 0,98 × 0,02 ≈ 0,04, soit 1 personne sur 25 : les porteurs sains sont bien plus nombreux que les malades.", "img": "", "fixes": 0}, {"t": "Dans une population de 100 individus, on compte 30 (A//A), 40 (A//a) et 30 (a//a).", "p": ["La fréquence de l'allèle A est de 0,5.", "Les effectifs prévus par le modèle de Hardy-Weinberg seraient 25, 50 et 25.", "La population est à l'équilibre de Hardy-Weinberg.", "On observe un déficit en hétérozygotes par rapport au modèle."], "b": "ABD", "j": "f(A) = (2 × 30 + 40) / 200 = 0,5. Attendus : p^{2} = 0,25, 2pq = 0,5, q^{2} = 0,25. Les effectifs observés s'en écartent : la population n'est pas à l'équilibre.", "img": "", "fixes": 0}, {"t": "Le modèle de Hardy-Weinberg est utile car :", "p": ["il sert de référence théorique.", "il prouve que les populations n'évoluent pas.", "un écart entre la population réelle et le modèle indique que des forces évolutives s'exercent.", "il décrit fidèlement la plupart des populations naturelles."], "b": "AC", "j": "Le modèle n'est presque jamais respecté : c'est justement ce qui permet de détecter qu'une population est en train d'évoluer.", "img": "", "fixes": 0}, {"t": "Parmi ces phénomènes, lesquels font varier les fréquences des allèles dans une population ?", "p": ["La dérive génétique.", "La réplication fidèle de l'ADN.", "Les mutations.", "La sélection naturelle."], "b": "ACD", "j": "Mutations, sélection naturelle, dérive génétique et migrations sont les forces évolutives.", "img": "", "fixes": 0}, {"t": "Les mutations :", "p": ["doivent toucher la lignée germinale pour être transmises.", "apparaissent pour répondre aux besoins de l'individu.", "modifient fortement et rapidement, à elles seules, les fréquences alléliques.", "sont la seule source de nouveaux allèles."], "b": "AD", "j": "Les mutations sont aléatoires. Leur rôle est de créer la diversité sur laquelle agissent ensuite la sélection et la dérive. Rares, elles modifient très peu les fréquences alléliques à elles seules.", "img": "", "fixes": 0}, {"t": "Dans un milieu donné, un allèle confère une meilleure survie et une meilleure reproduction aux individus qui le portent. Au fil des générations, la fréquence de cet allèle :", "p": ["varie uniquement au hasard.", "augmente.", "reste stable.", "diminue."], "b": "B", "j": "Sélection naturelle : les porteurs de l'allèle laissent en moyenne plus de descendants, qui héritent de cet allèle.", "img": "", "fixes": 0}, {"t": "À propos de la sélection naturelle :", "p": ["L'avantage conféré par un allèle dépend de l'environnement.", "Un allèle avantageux dans un milieu peut être désavantageux dans un autre.", "Elle fait apparaître les mutations dont l'individu a besoin.", "Elle agit sur des variations déjà présentes dans la population."], "b": "ABD", "j": "La sélection trie des variations préexistantes, apparues au hasard par mutation ; elle ne les crée pas.", "img": "", "fixes": 0}, {"t": "La queue du paon mâle :", "p": ["est un handicap face aux prédateurs.", "prouve que la sélection naturelle n'existe pas.", "résulte de la sélection sexuelle.", "est un avantage pour accéder aux femelles."], "b": "ACD", "j": "La sélection naturelle porte sur la survie mais aussi sur la reproduction : un caractère défavorable à la survie peut être sélectionné s'il augmente le succès reproducteur.", "img": "", "fixes": 0}, {"t": "La dérive génétique est :", "p": ["l'arrivée d'individus venus d'une autre population.", "l'apparition d'un nouvel allèle.", "la variation aléatoire des fréquences des allèles d'une génération à l'autre.", "l'augmentation de la fréquence des allèles avantageux."], "b": "C", "j": "Tous les individus ne se reproduisent pas et chaque parent ne transmet que la moitié de ses allèles : par simple hasard, certains allèles deviennent plus fréquents, d'autres plus rares.", "img": "", "fixes": 0}, {"t": "La dérive génétique :", "p": ["augmente toujours la diversité génétique de la population.", "favorise toujours l'allèle le plus avantageux.", "peut conduire à la disparition ou à la fixation d'un allèle.", "est d'autant plus marquée que la population est petite."], "b": "CD", "j": "La dérive est due au hasard : elle peut éliminer un allèle avantageux ou fixer un allèle neutre, voire défavorable. En éliminant des allèles, elle réduit la diversité génétique.", "img": "", "fixes": 0}, {"t": "Un allèle neutre a une fréquence de 0,5 dans deux populations isolées, l'une de 20 individus, l'autre de 20 000 individus.", "p": ["Son évolution sera identique dans les deux populations.", "Dans la grande population, sa fréquence restera proche de 0,5.", "Il a plus de chances de disparaître ou de se fixer rapidement dans la petite population.", "Sa fréquence variera plus fortement dans la petite population."], "b": "BCD", "j": "Plus l'effectif est faible, plus l'échantillonnage aléatoire des allèles à chaque génération provoque de fortes variations de fréquence.", "img": "", "fixes": 0}, {"t": "Les migrations :", "p": ["peuvent introduire de nouveaux allèles dans une population.", "créent de nouveaux allèles par mutation.", "modifient les fréquences alléliques lorsque des individus quittent la population.", "n'ont aucun effet sur les fréquences alléliques."], "b": "AC", "j": "L'arrivée ou le départ d'individus modifie la composition génétique de la population (flux de gènes).", "img": "", "fixes": 0}, {"t": "Parmi ces facteurs de sélection, lesquels sont des facteurs biotiques ?", "p": ["La compétition pour les ressources.", "Le parasitisme.", "La température.", "La prédation."], "b": "ABD", "j": "Facteurs biotiques : liés aux êtres vivants. Facteurs abiotiques : conditions physiques et chimiques du milieu (température, humidité...).", "img": "", "fixes": 0}, {"t": "La compétition intraspécifique oppose :", "p": ["des individus de la même espèce.", "un prédateur et sa proie.", "deux espèces différentes.", "un parasite et son hôte."], "b": "A", "j": "Intraspécifique : entre individus d'une même espèce (ressources, partenaires sexuels). Interspécifique : entre espèces différentes.", "img": "", "fixes": 0}], "auto": [{"production": "Le modèle de Hardy-Weinberg (consignes 1 à 3)", "criteres": [{"nom": "Exactitude", "points": ["f(A1) = f(A1//A1) + ½ f(A1//A2) = 0,45 ; à la génération suivante p², 2pq, q² : fréquences inchangées.", "Daphnies : fréquences observées proches des théoriques (S : 0,392 puis 0,387) : proche de l'équilibre."]}]}, {"production": "Forces évolutives (consignes 4 à 8)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["medionigra : plusieurs hypothèses, puis la plus plausible retenue et argumentée (dérive ou sélection)."]}, {"nom": "Complétude", "points": ["Mutations : seule source d'allèles nouveaux, mais effet très lent sur les fréquences.", "Sélection naturelle (rostre des punaises, allèle vg⁻) et sexuelle (guppys : compromis entre plaire et survivre).", "Dérive génétique (Amish, Huttérites, petits effectifs) et migrations (mésanges de Vlieland)."]}]}, {"production": "Tableau bilan et texte (consigne 9)", "criteres": [{"nom": "Complétude", "points": ["Le modèle suppose effectif infini, ni mutation, ni sélection, ni migration : c'est une référence ; tout écart révèle une force."]}, {"nom": "Conformité", "points": ["Tableau complet : force évolutive, effet sur les fréquences, exemple."]}]}]}, {"id": 74, "code": "f46f9f0b66", "titre": "Génétique – Activité 8B : De la notion d'espèce à la spéciation", "questions": [{"t": "Le critère d'interfécondité utilisé pour définir une espèce :", "p": ["ne peut pas s'appliquer aux organismes à reproduction asexuée.", "ne peut pas s'appliquer aux fossiles.", "reste le critère le plus utilisé.", "regroupe des individus capables de se reproduire entre eux et d'avoir une descendance fertile."], "b": "ABCD", "j": "C'est le critère le plus utilisé, mais il a des limites : il est inapplicable dans certains cas, et des espèces distinctes peuvent parfois s'hybrider.", "img": "", "fixes": 0}, {"t": "Homo sapiens et Homo neanderthalensis ont eu des descendants communs. Cela montre que :", "p": ["ce sont des clones.", "le critère d'interfécondité a des limites pour délimiter les espèces.", "l'espèce humaine n'a pas évolué.", "la sélection naturelle n'agit pas sur les humains."], "b": "B", "j": "Les populations actuelles non africaines portent une petite part d'ADN néandertalien, alors que les deux groupes sont classés comme espèces distinctes.", "img": "", "fixes": 0}, {"t": "Une espèce :", "p": ["a une durée d'existence limitée, de son apparition (spéciation) à son extinction.", "évolue au cours du temps.", "est un ensemble de populations.", "est définitivement fixée."], "b": "ABC", "j": "Une espèce est un ensemble hétérogène et temporaire de populations, dont la composition génétique change au fil des générations.", "img": "", "fixes": 0}, {"t": "Deux populations d'une même espèce sont séparées durablement par une barrière géographique.", "p": ["Leur divergence génétique peut aboutir à un isolement reproducteur, c'est-à-dire à une spéciation.", "Elles n'échangent plus de gènes.", "Mutations, sélection et dérive agissent indépendamment dans chacune : elles divergent génétiquement.", "Elles restent nécessairement identiques."], "b": "ABC", "j": "On parle de spéciation lorsque deux populations n'échangent plus de gènes, même si elles sont remises en contact.", "img": "", "fixes": 0}], "auto": [{"production": "La notion d'espèce (consignes 1 à 3)", "criteres": [{"nom": "Complétude", "points": ["Limites de l'interfécondité : éléphants qui ne se croisent plus, fossiles non testables, hybrides Sapiens-Néandertal."]}, {"nom": "Exactitude", "points": ["Deux espèces d'éléphants : morphologie, reproduction, aucune hybridation depuis 500 000 ans, séparation il y a 5,5 Ma.", "Arbres ADN mitochondrial et nucléaire comparés ; 1 à 3 % du génome des Eurasiens d'origine néandertalienne."]}]}, {"production": "Salamandres et texte (consignes 4 et 5)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Hypothèses argumentées : voisines interfécondes, vallée = barrière, isolement reproducteur au sud."]}, {"nom": "Complétude", "points": ["Colonisation du nord vers le sud par deux routes autour de la Vallée centrale, rencontre au sud.", "Effet fondateur, mutations, dérive et sélection : divergence jusqu'à l'isolement reproducteur.", "La spéciation est progressive ; une espèce n'existe que pendant un temps."]}, {"nom": "Conformité", "points": ["Texte structuré, vocabulaire précis (spéciation, isolement reproducteur, divergence)."]}]}]}, {"id": 75, "code": "73c9633edd", "titre": "Génétique – Activité 9A : Diversification sans modification du génome : les comportements", "questions": [{"t": "Un jeune diamant mandarin apprend son chant en écoutant un adulte (son tuteur).", "p": ["Le chant est déterminé uniquement par les gènes.", "Le chant est en partie acquis par apprentissage.", "Cela explique l'existence de « dialectes » propres à certaines populations d'oiseaux.", "Il s'agit d'une transmission culturelle."], "b": "BCD", "j": "Un comportement appris peut se transmettre de génération en génération et différer d'une population à l'autre, sans aucune différence génétique.", "img": "", "fixes": 0}, {"t": "L'utilisation d'outils par certains primates et par les corbeaux :", "p": ["est codée par un gène apparu par mutation.", "s'acquiert par apprentissage et imitation.", "est un comportement réservé à l'espèce humaine.", "se transmet de génération en génération sans modification de l'ADN."], "b": "BD", "j": "Comme le chant des oiseaux, c'est un comportement acquis, transmis par voie non génétique.", "img": "", "fixes": 0}, {"t": "La transmission culturelle dans les sociétés humaines :", "p": ["est inscrite dans l'ADN.", "évolue au cours du temps.", "n'est pas génétique.", "se fait par la transmission de gènes particuliers."], "b": "BC", "j": "Connaissances, techniques et normes sociales se transmettent entre générations et se modifient progressivement, de façon comparable à une évolution. Elle passe par l'enseignement, l'observation et l'imitation.", "img": "", "fixes": 0}], "auto": [{"production": "Chants et chimpanzés (consignes 1 et 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Chimpanzés : un seul paramètre change entre les deux groupes, avoir observé l'expert."]}, {"nom": "Exactitude", "points": ["Diamant mandarin : capacité de chanter innée (oiseau isolé), chant appris par imitation du tuteur (b', d' différents).", "Seul le groupe qui a vu l'expert utilise l'outil (12 sur 16), et encore deux mois après."]}]}, {"production": "ECE étourneaux (consigne 4)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie : comparer dans Audacity les chants des étourneaux aux cris des cinq espèces ; résultat attendu."]}, {"nom": "Complétude", "points": ["Conclusion qui cite les espèces imitées et le milieu d'apprentissage."]}, {"nom": "Conformité", "points": ["Captures légendées côte à côte (ou tableau étourneau / espèce imitée)."]}]}, {"production": "Texte argumenté (consigne 3)", "criteres": [{"nom": "Complétude", "points": ["Comportement appris et transmis par imitation, sans passer par l'ADN : transmission culturelle.", "Diversité entre individus et entre populations (pinsons, 39 pratiques des chimpanzés, étourneaux)."]}, {"nom": "Conformité", "points": ["Texte structuré, chaque argument appuyé sur un document."]}]}]}, {"id": 76, "code": "d43300fb2f", "titre": "Génétique – Activité 9B : Diversification sans modification du génome : la symbiose", "questions": [{"t": "Parmi ces exemples, lesquels illustrent une diversification du vivant sans modification du génome ?", "p": ["L'acquisition d'un microbiote.", "La duplication d'un gène.", "L'apprentissage du chant chez les oiseaux.", "La production de pariétine par un lichen."], "b": "ACD", "j": "Associations entre êtres vivants et transmission de comportements appris modifient les phénotypes sans changer l'ADN. B : modification du génome.", "img": "", "fixes": 0}, {"t": "Le lichen Xanthoria parietina produit de la pariétine, un pigment qui le protège des UV. Ni l'algue seule ni le champignon seul n'en produisent. Cet exemple montre que :", "p": ["la pariétine est inutile.", "le champignon a reçu un gène de l'algue.", "l'algue a subi une mutation.", "un caractère nouveau peut apparaître par l'association de deux organismes, sans modification de leurs génomes."], "b": "D", "j": "La symbiose fait apparaître un caractère que ne possède aucun des deux partenaires isolés.", "img": "", "fixes": 0}, {"t": "Le microbiote intestinal humain :", "p": ["intervient dans la digestion et le fonctionnement du système immunitaire.", "modifie le phénotype de l'hôte.", "est transmis par les gamètes des parents.", "fait partie du génome humain."], "b": "AB", "j": "C'est une association non héréditaire : les micro-organismes ne sont pas codés par nos gènes, mais ils influencent notre phénotype. Il est acquis à partir de la naissance.", "img": "", "fixes": 0}], "auto": [{"production": "ECE : la pariétine (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Lichen éclairé et lichen à l'obscurité, même protocole : une seule différence, l'éclairement."]}, {"nom": "Complétude", "points": ["Interprétation : je vois, je sais, j'en conclus ; démarche complémentaire (polyols fournis à l'obscurité)."]}, {"nom": "Exactitude", "points": ["Sécurité acétone : fenêtre ouverte, aucune flamme ; blouse, gants, lunettes.", "Je conclus « compatible avec le modèle », pas « prouvé »."]}, {"nom": "Conformité", "points": ["Deux captures côte à côte, même grossissement, titrées et légendées."]}]}, {"production": "Texte argumenté (consigne 2)", "criteres": [{"nom": "Complétude", "points": ["Lichen = symbiose : l'algue fournit des polyols (photosynthèse), le champignon hétérotrophe en fait de la pariétine.", "La pariétine est un caractère nouveau, absent chez chaque partenaire seul."]}, {"nom": "Exactitude", "points": ["Aucun génome n'est modifié (ni mutation, ni gène donné) : c'est la mise en commun des métabolismes."]}, {"nom": "Conformité", "points": ["Introduction, développement appuyé sur mes résultats, conclusion ; vocabulaire précis."]}]}]}, {"id": 77, "code": "0323b0d729", "titre": "Génétique – Activité 10A : Circulation des sèves et surfaces d'échange", "questions": [{"t": "Une plante à fleurs vit fixée, à l'interface entre le sol et l'air.", "p": ["Elle développe de grandes surfaces d'échange avec ses deux milieux de vie.", "Ses feuilles captent la lumière et assurent les échanges gazeux.", "Elle se déplace pour rechercher la lumière.", "Ses racines l'ancrent et prélèvent l'eau et les ions minéraux."], "b": "ABD", "j": "La lumière et le CO_{2} se trouvent dans l'air, l'eau et les ions dans le sol : l'organisation de la plante est liée à cette vie fixée.", "img": "", "fixes": 0}, {"t": "Au niveau des racines, la surface d'échange avec le sol est augmentée par :", "p": ["les poils absorbants.", "la cuticule.", "les mycorhizes.", "les stomates."], "b": "AC", "j": "Les poils absorbants, très fins et très nombreux, et les filaments des champignons associés (mycorhizes) multiplient la surface d'absorption. B et D : structures de la feuille.", "img": "", "fixes": 0}, {"t": "Une mycorhize :", "p": ["est un parasite qui détruit la racine.", "est une association entre une racine et un champignon.", "fournit à la plante de la matière organique produite par le champignon.", "est une symbiose : chaque partenaire en tire un bénéfice."], "b": "BD", "j": "Le champignon améliore l'absorption de l'eau et des ions par la plante ; en échange, il reçoit des produits de la photosynthèse.", "img": "", "fixes": 0}, {"t": "La feuille :", "p": ["est plate et fine, ce qui offre une grande surface de captation de la lumière.", "a ses cellules chlorophylliennes surtout du côté de la face inférieure.", "est recouverte d'une cuticule qui limite les pertes d'eau.", "possède des stomates qui permettent les échanges gazeux."], "b": "ACD", "j": "Les cellules chlorophylliennes sont surtout situées du côté de la face supérieure, la plus éclairée. Les gaz circulent dans les lacunes, au contact de ces cellules.", "img": "", "fixes": 0}, {"t": "Par forte chaleur et manque d'eau, les stomates se ferment. Cela :", "p": ["augmente la transpiration.", "n'a aucun effet sur la photosynthèse.", "limite l'entrée du CO_{2}, donc la photosynthèse.", "limite les pertes d'eau."], "b": "CD", "j": "La plante économise l'eau, au prix d'un ralentissement de la photosynthèse.", "img": "", "fixes": 0}, {"t": "Parmi ces caractéristiques, lesquelles sont des adaptations des feuilles aux milieux secs ?", "p": ["Une cuticule épaisse.", "Des stomates nombreux et ouverts en permanence.", "Des feuilles réduites, voire absentes.", "Des stomates abrités au fond de cryptes."], "b": "ACD", "j": "Ces adaptations limitent la transpiration. Certaines feuilles sont aussi couvertes de poils ou capables de s'enrouler sur elles-mêmes.", "img": "", "fixes": 0}, {"t": "Le xylème :", "p": ["transporte la sève brute (eau et ions minéraux).", "conduit la sève des feuilles vers les racines.", "est formé de cellules mortes à paroi renforcée par de la lignine.", "transporte la sève élaborée."], "b": "AC", "j": "La sève brute, absorbée par les poils absorbants, monte dans les vaisseaux du xylème jusqu'aux feuilles.", "img": "", "fixes": 0}, {"t": "Le phloème :", "p": ["transporte la sève élaborée, riche en sucres.", "est formé de cellules mortes à paroi lignifiée.", "transporte uniquement de l'eau et des ions minéraux.", "distribue les produits de la photosynthèse aux organes non chlorophylliens (racines, bourgeons, fruits...)."], "b": "AD", "j": "La sève élaborée circule des organes producteurs (feuilles) vers les organes consommateurs ou de réserve. Le phloème est formé de cellules vivantes.", "img": "", "fixes": 0}, {"t": "Les cellules d'une racine, non chlorophylliennes, reçoivent les glucides dont elles ont besoin par :", "p": ["les stomates.", "le phloème.", "le xylème.", "les poils absorbants."], "b": "B", "j": "Les glucides produits dans les feuilles sont distribués à toute la plante par la sève élaborée, qui circule dans le phloème.", "img": "", "fixes": 0}], "auto": [{"production": "Les vaisseaux (consignes 1 à 4)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Méthode : céleri dans l'eau colorée, coupes à différentes hauteurs, témoin."]}, {"nom": "Exactitude", "points": ["Xylème (vert, lignine) : sève brute, des racines vers les feuilles, en sens unique.", "Phloème (rose, cellulose) : sève élaborée, des feuilles vers tous les organes, vers le bas et vers le haut."]}]}, {"production": "Surfaces d'échange (consignes 5 à 8)", "criteres": [{"nom": "Complétude", "points": ["Poils absorbants et mycorhizes augmentent la surface d'absorption (basilic : 14 cm contre 8,5 cm)."]}, {"nom": "Exactitude", "points": ["Plus de stomates sur la face inférieure : les échanges gazeux se font surtout par elle.", "Surface d'échange par gramme = 2 × surface d'une face ÷ masse (sans oublier les deux faces)."]}]}, {"production": "Schéma fonctionnel (consigne 9)", "criteres": [{"nom": "Complétude", "points": ["Poils absorbants, mycorhizes, stomates ; flèches CO₂, O₂ et vapeur d'eau, lumière.", "Sève brute dans le xylème vers le haut ; sève élaborée dans le phloème vers les racines et vers le bourgeon."]}, {"nom": "Conformité", "points": ["Titre, légendes, flèches de deux couleurs dont le sens est indiqué."]}]}]}, {"id": 78, "code": "60b5824447", "titre": "Génétique – Activité 10B : Organogenèse, méristèmes et élongation", "questions": [{"t": "Un méristème :", "p": ["se trouve à l'extrémité des tiges (dans les bourgeons) et des racines.", "est formé de petites cellules indifférenciées.", "est le siège de nombreuses mitoses.", "est à l'origine des nouveaux organes de la plante."], "b": "ABCD", "j": "Les méristèmes caulinaires et racinaires produisent en permanence de nouvelles cellules, à l'origine de tous les organes de la plante.", "img": "", "fixes": 0}, {"t": "La croissance en longueur d'une tige résulte :", "p": ["du raccourcissement des entre-nœuds.", "de mitoses dans le méristème.", "de l'élongation des cellules produites.", "de méioses dans le méristème."], "b": "BC", "j": "Multiplication cellulaire dans le méristème, puis élongation et différenciation des cellules en tissus spécialisés.", "img": "", "fixes": 0}, {"t": "Un phytomère est :", "p": ["un module de la tige feuillée, formé d'un nœud (portant feuille et bourgeon axillaire) et d'un entre-nœud.", "une racine secondaire.", "un type de pigment.", "une hormone végétale."], "b": "A", "j": "Le fonctionnement du méristème caulinaire construit la tige par répétition de ces modules : c'est une organisation modulaire.", "img": "", "fixes": 0}, {"t": "L'auxine :", "p": ["est produite surtout par les bourgeons apicaux et les jeunes feuilles.", "est produite par les racines et migre vers le haut.", "stimule l'élongation des cellules.", "stimule le développement des bourgeons axillaires."], "b": "AC", "j": "L'auxine migre vers le bas de la plante et favorise aussi la formation de racines secondaires. B : ce sont les cytokinines. L'auxine inhibe le développement des bourgeons axillaires (dominance apicale).", "img": "", "fixes": 0}, {"t": "On coupe le bourgeon terminal d'une tige. Quelques jours plus tard :", "p": ["la plante meurt.", "les feuilles tombent.", "les racines cessent de croître.", "les bourgeons axillaires se développent et la tige se ramifie."], "b": "D", "j": "Le bourgeon terminal, source d'auxine, inhibait les bourgeons axillaires : sa suppression lève cette inhibition. C'est le principe de la taille.", "img": "", "fixes": 0}, {"t": "Les cytokinines :", "p": ["sont produites par les racines.", "ont une action antagoniste de celle de l'auxine sur les bourgeons axillaires.", "inhibent le développement des bourgeons axillaires.", "sont produites par les bourgeons terminaux."], "b": "AB", "j": "Le développement d'un organe dépend de l'équilibre entre plusieurs hormones aux effets opposés. Les cytokinines stimulent le développement des bourgeons axillaires.", "img": "", "fixes": 0}, {"t": "Une jeune tige est éclairée d'un seul côté.", "p": ["L'auxine migre vers la face non éclairée.", "La tige se courbe vers la lumière.", "Les cellules de la face non éclairée s'allongent davantage.", "Les cellules de la face éclairée s'allongent davantage."], "b": "ABC", "j": "Phototropisme : la répartition inégale de l'auxine entraîne une croissance inégale des deux faces, d'où la courbure vers la lumière.", "img": "", "fixes": 0}, {"t": "Le développement d'une plante dépend aussi de son environnement :", "p": ["Un vent dominant modifie le port des arbres.", "Le froid ralentit la croissance des entre-nœuds.", "Le développement ne dépend que du génome.", "La gravité oriente la croissance des tiges et des racines (gravitropisme)."], "b": "ABD", "j": "La mise en place des organes est contrôlée par des hormones et influencée par les conditions du milieu : lumière, gravité, température, vent...", "img": "", "fixes": 0}], "auto": [{"production": "Les méristèmes (consignes 1 à 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Protocole pour la tige : marques équidistantes, photos régulières, plusieurs plantes, mêmes conditions."]}, {"nom": "Complétude", "points": ["Méristèmes (apex, bourgeons axillaires, racines) : mitoses puis élongation (de 10 à 150 µm) ; phytomères."]}, {"nom": "Exactitude", "points": ["Zone d'élongation juste en arrière de l'extrémité ; vitesse ≈ 15 mm en 14 h ≈ 1,1 mm/h, calcul posé."]}]}, {"production": "Auxine et environnement (consignes 4 à 7)", "criteres": [{"nom": "Complétude", "points": ["Auxine : mise en place des organes (mutant pin1), racines secondaires ; produite par l'apex, elle agit à distance.", "Lumière (auxine du côté sombre), gravité (statolithes), vent, climat : même génome, formes différentes."]}, {"nom": "Exactitude", "points": ["Darwin, Boysen-Jensen, Went : chaque expérience reliée à sa conclusion ; dominance apicale (Thimann)."]}]}, {"production": "Texte argumenté (consigne 8)", "criteres": [{"nom": "Complétude", "points": ["Mon texte relie croissance par les méristèmes, contrôle par l'auxine et influence de l'environnement."]}, {"nom": "Conformité", "points": ["Texte structuré, valeurs chiffrées, vocabulaire précis."]}]}]}, {"id": 79, "code": "577a9dd36c", "titre": "Génétique – Activité 11A : La photosynthèse et ses produits", "questions": [{"t": "Une plante chlorophyllienne est autotrophe : cela signifie qu'elle :", "p": ["se nourrit de matière organique prélevée dans le sol.", "ne respire pas.", "produit sa matière organique à partir de matière minérale, grâce à l'énergie lumineuse.", "n'a pas besoin d'eau."], "b": "C", "j": "À partir de CO_{2}, d'eau et d'ions minéraux, la plante fabrique toutes ses molécules organiques par photosynthèse.", "img": "", "fixes": 0}, {"t": "L'équation bilan de la photosynthèse est :", "p": ["C_{6}H_{12}O_{6} + 6 O_{2} → 6 CO_{2} + 6 H_{2}O.", "6 CO_{2} + 6 O_{2} → C_{6}H_{12}O_{6} + 6 H_{2}O.", "6 CO_{2} + 6 H_{2}O → C_{6}H_{12}O_{6} + 6 O_{2}.", "C_{6}H_{12}O_{6} → 2 C_{3}H_{6}O_{3}."], "b": "C", "j": "A : respiration. D : fermentation lactique. La photosynthèse nécessite un apport d'énergie lumineuse.", "img": "", "fixes": 0}, {"t": "Dans l’expérience de Ruben et Kamen, on fournit à des algues éclairées soit de l’eau marquée à l’oxygène 18, soit du CO_{2} marqué à l’oxygène 18, puis on analyse le dioxygène dégagé.", "p": ["On réalise les deux marquages pour savoir laquelle des deux molécules fournit l’oxygène du dioxygène.", "Le marquage sert à rendre la photosynthèse plus rapide.", "Si le dioxygène dégagé suit toujours le marquage de l’eau, on conclut qu’il provient de l’eau.", "Une seule des deux expériences suffirait pour conclure."], "b": "AC", "j": "Il faut tester les deux sources possibles d’oxygène : la comparaison permet de conclure que le dioxygène provient de la photolyse de l’eau.", "img": "", "fixes": 0}, {"t": "Expérience de Hill : des chloroplastes isolés ne dégagent du dioxygène que s'ils sont éclairés et en présence d'un accepteur d'électrons (oxydant).", "p": ["L'oxydation de l'eau nécessite de la lumière.", "L'oxydation de l'eau nécessite un oxydant.", "La photosynthèse met en jeu des réactions d'oxydoréduction.", "Dans cette expérience, le CO_{2} est indispensable au dégagement de dioxygène."], "b": "ABC", "j": "Le dégagement de dioxygène a lieu sans CO_{2}, pourvu qu'un accepteur d'électrons soit présent. Dans la cellule, cet accepteur est le NADP^{+}.", "img": "", "fixes": 0}, {"t": "La réaction 2 H_{2}O → 4 H^{+} + 4 e^{-} + O_{2} :", "p": ["est une oxydation de l'eau.", "est la réduction du CO_{2}.", "fournit les électrons et les protons nécessaires à la réduction du CO_{2}.", "nécessite l'énergie lumineuse captée par les pigments chlorophylliens."], "b": "ACD", "j": "C'est la photolyse de l'eau : l'énergie lumineuse est convertie en énergie chimique, sous la forme d'un transfert d'électrons.", "img": "", "fixes": 0}, {"t": "Dans l’expérience de Calvin et Benson, des algues reçoivent du CO_{2} marqué au carbone 14 et l’on arrête la photosynthèse au bout de temps de plus en plus longs.", "p": ["Le carbone 14 permet de suivre le devenir du carbone du CO_{2}.", "La première molécule formée est celle qui est radioactive dès les temps les plus courts.", "La première molécule formée est la plus abondante à la fin de l’expérience.", "Le carbone 14 est utilisé car il accélère la photosynthèse."], "b": "AB", "j": "Le marquage suit le carbone du CO_{2} ; les molécules radioactives aux temps les plus courts sont les premières formées, les autres en dérivent.", "img": "", "fixes": 0}, {"t": "La réduction du CO_{2} en matière organique :", "p": ["produit des glucides, à l'origine des autres molécules organiques de la plante.", "utilise les hydrogènes (protons et électrons) issus de l'eau.", "libère du dioxygène.", "se déroule dans le stroma du chloroplaste."], "b": "ABD", "j": "6 CO_{2} + 24 H^{+} + 24 e^{-} → C_{6}H_{12}O_{6} + 6 H_{2}O. Le dioxygène est libéré lors de l'oxydation de l'eau, pas lors de cette étape.", "img": "", "fixes": 0}, {"t": "La cellulose :", "p": ["est un polymère d'acides aminés.", "est un polymère de glucose.", "est synthétisée grâce à une enzyme, la cellulose-synthase.", "est le constituant principal de la paroi des cellules végétales."], "b": "BCD", "j": "Une partie des glucides issus de la photosynthèse sert à construire la paroi, qui s'épaissit et se rigidifie au cours de la croissance de la cellule.", "img": "", "fixes": 0}, {"t": "Les jeunes cellules végétales s'allongent car :", "p": ["la lignine les étire.", "elles perdent leur paroi.", "elles se divisent par méiose.", "leur paroi, encore fine et déformable, cède à la pression de turgescence."], "b": "D", "j": "L'eau entre dans la cellule et exerce une pression sur la paroi. Quand la paroi s'épaissit en cellulose, elle devient rigide et la croissance s'arrête.", "img": "", "fixes": 0}, {"t": "La lignine :", "p": ["assouplit les parois et les rend perméables à l'eau.", "est un sucre de réserve.", "imprègne la paroi des cellules du xylème.", "est abondante dans le bois (xylème secondaire), responsable du port dressé des arbres."], "b": "CD", "j": "La lignine est fabriquée à partir d'un acide aminé issu de la photosynthèse. Le bois est un matériau léger et rigide qui permet aux arbres d'atteindre de grandes hauteurs. La lignine rigidifie et imperméabilise les parois.", "img": "", "fixes": 0}], "auto": [{"production": "Expériences historiques (consignes 1 à 4)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie Hill : chloroplastes sans CO₂, lumière avec et sans oxydant, témoin à l'obscurité ; confrontée aux résultats."]}, {"nom": "Complétude", "points": ["Réduction du CO₂ (Calvin : APG, puis trioses et glucose) par les électrons et protons de l'eau ; énergie de la lumière."]}, {"nom": "Exactitude", "points": ["Ruben et Kamen : le ¹⁸O du dioxygène est toujours celui de l'eau : O₂ vient de la photolyse de l'eau.", "Équation 6 CO₂ + 12 H₂O → C₆H₁₂O₆ + 6 O₂ + 6 H₂O, les 12 H₂O justifiées."]}]}, {"production": "Schéma « du CO₂ à la cellulose et aux lignines »", "criteres": [{"nom": "Complétude", "points": ["Feuille et chloroplaste : entrées (CO₂, eau, lumière), photolyse, réduction, glucose.", "Transport par la sève élaborée ; cellulose (croissance des cellules) et lignines (port dressé, xylème)."]}, {"nom": "Exactitude", "points": ["Parois cellulosiques en rose, lignifiées en vert (observations de l'activité 10A)."]}, {"nom": "Conformité", "points": ["Titre et légendes ; réponse à la problématique écrite sous le schéma."]}]}]}, {"id": 80, "code": "0e5b2c1f78", "titre": "Génétique – Activité 11B : Les tanins", "questions": [{"t": "Les tanins :", "p": ["sont produits en plus grande quantité par une plante qui vient d'être attaquée.", "se lient aux protéines alimentaires et aux enzymes digestives de l'ani
