mal qui consomme la plante.", "ont des effets antimicrobiens.", "sont des molécules de défense contre les herbivores."], "b": "ABCD", "j": "Toxiques ou répulsifs, les tanins limitent la prédation et protègent aussi la plante contre des micro-organismes. La plante ajuste son métabolisme aux agressions qu'elle subit.", "img": "", "fixes": 0}], "auto": [{"production": "ECE : des tanins dans les feuilles d'olivier ? (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Coupe observée avant puis après le chlorure de fer III (montée à l'eau, ajout par diffusion, 5 minutes)."]}, {"nom": "Exactitude", "points": ["Sécurité : blouse, gants, lunettes ; lame tenue loin des doigts."]}, {"nom": "Conformité", "points": ["Captures avant / après côte à côte, titrées, légendées (tanins marron-noir dans l'épiderme ou la paroi)."]}]}, {"production": "ECE : les tanins sont-ils antibactériens ? (consigne 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Antibiogramme avec témoins : eau distillée stérile (négatif) et antibiotique (positif)."]}, {"nom": "Exactitude", "points": ["Travail stérile près de la flamme ; position des disques notée sous la boîte."]}, {"nom": "Conformité", "points": ["Tableau ou graphique du diamètre des zones sans bactéries selon la concentration, avec unités."]}]}, {"production": "Bilan (consigne 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Je réponds à la problématique en m'appuyant sur mes résultats des deux ECE."]}, {"nom": "Complétude", "points": ["Les feuilles d'olivier contiennent des tanins, produits de la photosynthèse.", "Les tanins limitent le développement des bactéries, d'autant plus que leur concentration est forte."]}]}]}, {"id": 81, "code": "e5b3caffa6", "titre": "Génétique – Activité 12 : Les pigments de la photosynthèse", "questions": [{"t": "Dans un chloroplaste :", "p": ["les thylakoïdes contiennent les pigments chlorophylliens dans leur membrane.", "la chlorophylle est dissoute dans le stroma.", "l'enveloppe est formée d'une seule membrane.", "le stroma contient les enzymes de la synthèse de matière organique."], "b": "AD", "j": "Thylakoïdes : capture de l'énergie lumineuse. Stroma : réduction du CO_{2} en molécules organiques (on y trouve de l'amidon). L'enveloppe du chloroplaste comporte deux membranes.", "img": "", "fixes": 0}, {"t": "La chromatographie des pigments d'une feuille verte sépare :", "p": ["l'amidon.", "les chlorophylles a et b.", "les carotènes.", "les xanthophylles."], "b": "BCD", "j": "Quatre types de pigments sont séparés. L'amidon est une molécule de réserve, non un pigment.", "img": "", "fixes": 0}, {"t": "Les chlorophylles :", "p": ["absorbent surtout les radiations vertes.", "absorbent surtout les radiations bleues et rouges.", "sont plus efficaces pour la photosynthèse en lumière verte.", "absorbent peu les radiations vertes, d'où la couleur des feuilles."], "b": "BD", "j": "Les radiations absorbées par les pigments sont celles qui sont efficaces pour la photosynthèse.", "img": "", "fixes": 0}, {"t": "À l'automne, les feuilles de nombreux arbres deviennent jaunes ou orangées car :", "p": ["elles fabriquent de nouveaux pigments rouges.", "les chlorophylles ne sont plus fabriquées : il reste les carotènes et les xanthophylles.", "l'amidon devient visible.", "elles ne contiennent plus aucun pigment."], "b": "B", "j": "Les pigments jaunes et orangés, présents toute l'année, étaient masqués par les chlorophylles.", "img": "", "fixes": 0}, {"t": "Au cours de la photosynthèse, il y a conversion :", "p": ["d'énergie chimique en énergie mécanique.", "d'énergie thermique en énergie lumineuse.", "d'énergie lumineuse en énergie chimique.", "d'énergie chimique en énergie lumineuse."], "b": "C", "j": "L'énergie lumineuse captée par les pigments se retrouve dans les liaisons des molécules organiques produites.", "img": "", "fixes": 0}, {"t": "Les anthocyanes :", "p": ["captent la lumière pour la photosynthèse.", "rendent les fleurs attractives pour les pollinisateurs.", "sont des pigments rouges, bleus ou pourpres.", "sont stockées dans les chloroplastes."], "b": "BC", "j": "Elles sont produites par une voie de biosynthèse proche de celle des tanins, à partir des produits de la photosynthèse. Elles sont stockées dans les vacuoles.", "img": "", "fixes": 0}], "auto": [{"production": "Chromatographie et spectres (consignes 1 à 3)", "criteres": [{"nom": "Complétude", "points": ["La chlorophylle a convertit l'énergie lumineuse absorbée en énergie chimique."]}, {"nom": "Exactitude", "points": ["Sécurité : éther de pétrole inflammable : gants, lunettes, fenêtre ouverte, aucune flamme.", "Les chlorophylles absorbent le bleu et le rouge, pas le vert : d'où la couleur des feuilles."]}, {"nom": "Conformité", "points": ["Chromatogramme titré (dépôt, front), chaque pigment légendé : chlorophylles a et b, carotènes, xanthophylles."]}]}, {"production": "Tanins, anthocyanes et schéma bilan (consignes 4 à 7)", "criteres": [{"nom": "Complétude", "points": ["Tanins : produits en réponse aux phytophages, ils protègent l'arbre à suif : interaction antagoniste.", "Anthocyanes : elles attirent les pollinisateurs (pétunias) : interaction mutualiste.", "Schéma : lumière → pigments du chloroplaste → énergie chimique et sucres → tanins, anthocyanes → interactions."]}, {"nom": "Conformité", "points": ["Schéma titré « De la lumière aux interactions », légendé, flèches explicites."]}]}]}, {"id": 82, "code": "8915114311", "titre": "Génétique – Activité 13 : La reproduction des plantes à fleurs", "questions": [{"t": "De l'extérieur vers l'intérieur, les pièces d'une fleur sont disposées dans l'ordre suivant :", "p": ["sépales, pétales, étamines, pistil.", "étamines, pistil, sépales, pétales.", "pétales, sépales, pistil, étamines.", "sépales, étamines, pétales, pistil."], "b": "A", "j": "Quatre verticilles : calice (sépales), corolle (pétales), androcée (étamines), gynécée (pistil).", "img": "", "fixes": 0}, {"t": "Dans une fleur :", "p": ["le pistil contient les ovules, dans l'ovaire.", "les étamines produisent le pollen, dans leurs anthères.", "les sépales protègent la fleur en bouton.", "les pétales produisent les ovules."], "b": "ABC", "j": "Étamines : organes mâles. Pistil (ovaire, style, stigmate) : organe femelle. Les pétales, souvent colorés, attirent les pollinisateurs.", "img": "", "fixes": 0}, {"t": "Chez les plantes à fleurs :", "p": ["le grain de pollen contient les gamètes mâles.", "le pollen doit être déposé sur le stigmate du pistil.", "le grain de pollen est le gamète femelle.", "le gamète femelle (oosphère) est contenu dans l'ovule."], "b": "ABD", "j": "La plante étant fixée, la rencontre des gamètes nécessite le transport du pollen jusqu'au pistil d'une fleur de la même espèce.", "img": "", "fixes": 0}, {"t": "La pollinisation est :", "p": ["la transformation de la fleur en fruit.", "le transport du pollen depuis les étamines jusqu'au stigmate d'un pistil.", "la dispersion des graines.", "la fusion des gamètes mâle et femelle."], "b": "B", "j": "La pollinisation précède la fécondation. Elle est assurée par le vent ou par des animaux.", "img": "", "fixes": 0}, {"t": "Une fois déposé sur le stigmate, le grain de pollen :", "p": ["féconde le stigmate.", "descend entier jusqu'à l'ovaire.", "se transforme directement en graine.", "germe et forme un tube pollinique qui conduit le gamète mâle jusqu'à un ovule."], "b": "D", "j": "Le tube pollinique s'enfonce dans le style jusqu'à l'ovaire : la fécondation a lieu dans l'ovule.", "img": "", "fixes": 0}, {"t": "Les plantes pollinisées par le vent, comme le noisetier :", "p": ["ont des fleurs très colorées et riches en nectar.", "produisent une très grande quantité de pollen.", "dispersent leur pollen au hasard.", "ont un pollen léger, facilement transporté."], "b": "BCD", "j": "La pollinisation par le vent n'est pas ciblée : la production massive de pollen augmente les chances qu'un grain atteigne un stigmate.", "img": "", "fixes": 0}, {"t": "Les fleurs pollinisées par des insectes présentent souvent :", "p": ["du nectar.", "des parfums.", "des couleurs vives.", "un pollen très léger emporté par le vent."], "b": "ABC", "j": "Signaux visuels et olfactifs et récompense alimentaire attirent les pollinisateurs, qui transportent le pollen d'une fleur à l'autre.", "img": "", "fixes": 0}, {"t": "On parle de coévolution entre une plante et son pollinisateur lorsque :", "p": ["les deux espèces évoluent conjointement, chacune exerçant une sélection sur l'autre.", "la plante se reproduit sans pollinisateur.", "les deux espèces ont le même génome.", "l'une des deux espèces disparaît."], "b": "A", "j": "La forme de la fleur et l'organe de récolte de l'animal sont ajustés l'un à l'autre : c'est le résultat d'une évolution commune des deux partenaires.", "img": "", "fixes": 0}, {"t": "Parmi ces dispositifs, lesquels favorisent la fécondation croisée ?", "p": ["Une incompatibilité génétique entre le pollen et le stigmate d'une même plante.", "Des fleurs mâles et des fleurs femelles portées par des pieds différents.", "Un décalage dans le temps entre la maturité des étamines et celle du pistil.", "Des barrières physiques entre les étamines et le pistil d'une même fleur."], "b": "ABCD", "j": "Ces dispositifs limitent l'autofécondation. La fécondation croisée produit une descendance génétiquement plus diversifiée.", "img": "", "fixes": 0}, {"t": "Après la fécondation :", "p": ["chaque ovule fécondé se transforme en graine.", "l'ovaire se transforme en fruit.", "les pétales se transforment en fruit.", "le grain de pollen se transforme en graine."], "b": "AB", "j": "Le fruit, issu de la paroi de l'ovaire, contient et protège les graines. Sépales, pétales et étamines fanent.", "img": "", "fixes": 0}, {"t": "La reproduction asexuée d'une plante :", "p": ["se fait sans fécondation, à partir d'un seul individu.", "produit des clones de la plante mère.", "produit des individus génétiquement très variés.", "permet une colonisation rapide du milieu."], "b": "ABD", "j": "Elle repose sur les méristèmes et sur la capacité des cellules végétales à redonner tous les types cellulaires.", "img": "", "fixes": 0}, {"t": "Parmi ces modes de reproduction, lesquels sont asexués ?", "p": ["Le bouturage d'un rameau.", "La formation de graines après une fécondation croisée.", "Les stolons du fraisier.", "La plantation d'un morceau de tubercule de pomme de terre portant un « œil »."], "b": "ACD", "j": "Un fragment de plante (ou un organe spécialisé) redonne un individu entier, génétiquement identique à la plante mère.", "img": "", "fixes": 0}, {"t": "La totipotence des cellules végétales est :", "p": ["leur capacité à réaliser la photosynthèse.", "leur capacité à absorber l'eau.", "leur résistance au froid.", "leur capacité à se dédifférencier et à redonner tous les types de cellules, donc une plante entière."], "b": "D", "j": "C'est ce qui rend possibles le bouturage et la culture in vitro : quelques cellules suffisent à régénérer une plante.", "img": "", "fixes": 0}, {"t": "Une population de plantes issues de reproduction asexuée est fragile car :", "p": ["toutes les plantes ont le même génotype : elles sont toutes sensibles au même pathogène ou au même changement du milieu.", "elle ne produit pas de racines.", "elle croît trop lentement.", "elle ne peut pas faire de photosynthèse."], "b": "A", "j": "L'uniformité génétique est un avantage dans un milieu stable, mais un risque en cas de changement. La reproduction sexuée, elle, crée de la diversité.", "img": "", "fixes": 0}], "auto": [{"production": "La fleur et l'ECE (consignes 1 à 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["ECE : hermaphrodisme, nectar, taille et ornementation du pollen (oculaire micrométrique) comparés aux documents."]}, {"nom": "Complétude", "points": ["Conclusion : anémophile ou entomophile, avec la conséquence sur le budget de replantation."]}, {"nom": "Exactitude", "points": ["Sépales, pétales, étamines (pollen = gamètes mâles), pistil (ovaire, ovules contenant le gamète femelle)."]}, {"nom": "Conformité", "points": ["Pièces florales collées et légendées, tableau de comptage complet, diagramme floral."]}]}, {"production": "Reproduction asexuée et schéma (consignes 4 à 8)", "criteres": [{"nom": "Complétude", "points": ["Organes : stolons, rhizomes, tubercules, bulbes… ; bouturage, marcottage, greffage, culture in vitro.", "Clonage in vitro : rôle des phytohormones (auxine, cytokinines) et totipotence des cellules.", "Avantages (colonisation rapide, sans partenaire) et inconvénients (clones, même sensibilité aux maladies)."]}, {"nom": "Conformité", "points": ["Schéma « La reproduction d'une plante fixée » : sexuée (pollinisation, fécondation) et asexuée (clones)."]}]}]}, {"id": 83, "code": "120dc81655", "titre": "Génétique – Activité 14 : Le stockage de la matière", "questions": [{"t": "À propos des organes de réserve :", "p": ["Ces organes permettent à la plante de passer la mauvaise saison.", "Les réserves sont surtout constituées d'ions minéraux.", "Le tubercule de pomme de terre stocke de l'amidon dans des amyloplastes.", "Le bulbe d'oignon et la racine de betterave stockent du saccharose."], "b": "ACD", "j": "Bulbes, tubercules, rhizomes et racines tubérisées stockent des matières organiques (surtout des glucides) qui permettront la reprise de la croissance.", "img": "", "fixes": 0}, {"t": "Les réserves des graines peuvent être :", "p": ["identiques chez toutes les espèces.", "des protides (pois, lentille).", "des glucides (blé, riz).", "des lipides (noix, amande)."], "b": "BCD", "j": "La nature des réserves dépend de l'espèce ; elles nourrissent l'embryon puis la plantule lors de la germination.", "img": "", "fixes": 0}, {"t": "Une graine :", "p": ["peut rester longtemps en vie ralentie (dormance).", "contient un embryon.", "contient des réserves.", "est protégée par un tégument."], "b": "ABCD", "j": "La graine mûre est déshydratée et en vie ralentie : elle peut attendre longtemps des conditions favorables.", "img": "", "fixes": 0}, {"t": "Les fruits et les graines peuvent être dispersés :", "p": ["par accrochage au pelage des animaux, grâce à des crochets.", "par des animaux qui mangent les fruits charnus et rejettent les graines.", "par le vent, grâce à des ailes ou des aigrettes.", "par l'eau, comme la noix de coco."], "b": "ABCD", "j": "Animaux, vent, eau : les agents de dispersion sont variés. Certaines plantes projettent même leurs graines elles-mêmes.", "img": "", "fixes": 0}, {"t": "La dispersion des graines loin de la plante mère a pour intérêt :", "p": ["d'empêcher la germination.", "d'éviter la pollinisation.", "de limiter la compétition avec la plante mère et de coloniser de nouveaux milieux.", "de réduire le nombre de graines."], "b": "C", "j": "Une graine qui germe au pied de la plante mère souffre de l'ombre et de la concurrence pour l'eau et les ions minéraux.", "img": "", "fixes": 0}, {"t": "Un oiseau mange des fruits charnus et rejette les graines plus loin dans ses excréments. Cette relation est :", "p": ["une compétition.", "un mutualisme : l'oiseau se nourrit, la plante est dispersée.", "une prédation de la plante par l'oiseau.", "un parasitisme."], "b": "B", "j": "Chaque partenaire tire un bénéfice de la relation. Le passage dans le tube digestif facilite même la germination de certaines graines.", "img": "", "fixes": 0}, {"t": "La germination :", "p": ["s'accompagne de la mobilisation des réserves de la graine.", "nécessite la photosynthèse dès les premières heures.", "commence par l'imbibition de la graine quand les conditions sont favorables.", "se traduit d'abord par la sortie des feuilles, puis de la racine."], "b": "AC", "j": "L'embryon reprend une vie active (respiration intense) en utilisant les réserves ; la photosynthèse ne commence qu'avec les premières feuilles. La racine sort la première.", "img": "", "fixes": 0}], "auto": [{"production": "Organes et tests (consignes 1 à 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["J'ai relié chaque molécule stockée à la fonction de l'organe (germination, dissémination, mauvaise saison)."]}, {"nom": "Complétude", "points": ["Tableau 1 : organes de réserve (fruit, bulbe, rhizome, tubercule, graine…) et molécules stockées."]}, {"nom": "Exactitude", "points": ["Biuret (protéines, bleu-violet), Soudan III (lipides, rouge), Sandell (sucres, rouge brique), eau iodée (amidon).", "Sécurité : soude, acide chlorhydrique et réactif de Sandell corrosifs : blouse, gants, lunettes."]}]}, {"production": "Texte explicatif (consignes 4 et 5)", "criteres": [{"nom": "Complétude", "points": ["Sucres produits par la photosynthèse, transportés surtout sous forme de saccharose par la sève élaborée.", "Stockage sous forme de glucides (saccharose, amidon), de lipides ou de protéines, dans des organes de réserve.", "Rôles : passer la mauvaise saison, germination, reproduction asexuée, dissémination par les animaux."]}, {"nom": "Conformité", "points": ["Objectifs notionnels complétés ; texte structuré."]}]}]}, {"id": 84, "code": "2cb755f53c", "titre": "Génétique – Activité 15 : La plante domestiquée (la carotte)", "questions": [{"t": "La domestication des plantes :", "p": ["a commencé il y a environ 10 000 ans.", "date du XIX^{e} siècle.", "s'est produite en un seul lieu, d'où elle s'est diffusée.", "a concerné les céréales au Proche-Orient."], "b": "AD", "j": "Des communautés de chasseurs-cueilleurs ont peu à peu cultivé des plantes sauvages, à des époques et en des lieux différents.", "img": "", "fixes": 0}, {"t": "La sélection massale (ou empirique) consiste à :", "p": ["provoquer des mutations en laboratoire.", "introduire un gène étranger dans une plante.", "conserver et ressemer les graines des plantes qui présentent les caractères recherchés.", "cultiver des cellules in vitro."], "b": "C", "j": "C'est une sélection sur le phénotype, pratiquée depuis les débuts de l'agriculture. Elle a augmenté, génération après génération, la fréquence des allèles intéressants pour l'Homme.", "img": "", "fixes": 0}, {"t": "Par rapport à son ancêtre sauvage, une plante domestiquée présente généralement :", "p": ["une diversité génétique plus grande.", "une perte de certaines défenses ou de capacités de dissémination.", "une meilleure aptitude à vivre sans l'Homme.", "des organes consommés plus développés."], "b": "BD", "j": "Ces fragilités doivent être compensées par des pratiques culturales (semis, protection contre les maladies et les ravageurs). La sélection a réduit la diversité génétique des plantes cultivées.", "img": "", "fixes": 0}, {"t": "La carotte cultivée :", "p": ["était, à l'origine, violette ou jaune.", "est devenue orange par sélection en Europe, vers les XV^{e}-XVI^{e} siècles.", "descend d'une carotte sauvage à racine orange et charnue.", "a été domestiquée en Asie centrale il y a un peu plus de 1 000 ans."], "b": "ABD", "j": "La carotte orange a une racine charnue, peu ligneuse et riche en carotènes (forte expression des gènes PSY).", "img": "", "fixes": 0}], "auto": [{"production": "ECE : les critères de sélection (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Variété testée comparée à la carotte orange et à la carotte sauvage, conclusion justifiée."]}, {"nom": "Exactitude", "points": ["Sécurité : acide chlorhydrique corrosif, solvant inflammable : gants, lunettes, fenêtre ouverte."]}, {"nom": "Conformité", "points": ["Tableau 1 complet ; chromatogramme et coupe colorée dessinés, titrés et légendés."]}]}, {"production": "Gènes PSY et texte (consignes 2 et 3)", "criteres": [{"nom": "Complétude", "points": ["Caractères sélectionnés : racine charnue, peu de lignine (seulement dans le xylème), riche en carotènes.", "Ils diffèrent de ceux de la carotte sauvage, ligneuse et presque sans caroténoïdes.", "Toutes les variétés ne les ont pas : sélectionnées selon d'autres critères, elles sont une forme de biodiversité."]}, {"nom": "Exactitude", "points": ["Carotte orange : beaucoup de caroténoïdes et forte expression des gènes PSY ; carotte blanche : peu."]}, {"nom": "Conformité", "points": ["Texte structuré, aux échelles de l'organe, des molécules et des gènes."]}]}]}, {"id": 85, "code": "3d39840214", "titre": "Corps humain – Activité 1 : Le réflexe myotatique", "questions": [{"t": "Le réflexe myotatique est :", "p": ["la contraction d'un muscle en réponse à une brûlure.", "le relâchement d'un muscle en réponse à son étirement.", "la contraction d'un muscle en réponse à son propre étirement.", "la contraction volontaire d'un muscle."], "b": "C", "j": "Exemple : la percussion du tendon rotulien étire le muscle antérieur de la cuisse, qui se contracte en retour (extension de la jambe).", "img": "", "fixes": 0}, {"t": "La réponse réflexe myotatique est :", "p": ["involontaire.", "rapide.", "d'amplitude variable selon la force du choc et l'état du sujet.", "toujours de même amplitude."], "b": "ABC", "j": "La réponse est stéréotypée mais son intensité varie : elle dépend du stimulus et peut être exacerbée ou diminuée selon l'état du sujet.", "img": "", "fixes": 0}, {"t": "Le réflexe myotatique :", "p": ["est commandé par l'aire motrice primaire.", "est testé par le médecin pour apprécier le fonctionnement du système neuromusculaire.", "nécessite l'intervention de la volonté.", "participe au maintien du tonus musculaire et de la posture."], "b": "BD", "j": "En s'opposant en permanence à l'étirement des muscles, ce réflexe contribue au maintien de la posture. Son centre nerveux est la moelle épinière.", "img": "", "fixes": 0}, {"t": "Dans quel ordre le message nerveux parcourt-il l'arc réflexe myotatique ?", "p": ["Moelle épinière → fuseau neuromusculaire → neurone sensitif → motoneurone → muscle.", "Fibres musculaires → motoneurone → moelle épinière → neurone sensitif → fuseau neuromusculaire.", "Fuseau neuromusculaire → neurone sensitif → moelle épinière → motoneurone → fibres musculaires.", "Fuseau neuromusculaire → motoneurone → moelle épinière → neurone sensitif → muscle."], "b": "C", "j": "Récepteur sensoriel (fuseau neuromusculaire), voie afférente (neurone sensitif), centre nerveux (moelle épinière), voie efférente (motoneurone), effecteur (fibres musculaires).", "img": "", "fixes": 0}, {"t": "Le récepteur sensoriel du réflexe myotatique est :", "p": ["le fuseau neuromusculaire, situé dans le muscle.", "le ganglion rachidien.", "le tendon.", "la plaque motrice."], "b": "A", "j": "Le fuseau neuromusculaire est sensible à l'étirement du muscle et émet alors un message nerveux sensitif.", "img": "", "fixes": 0}, {"t": "Le neurone sensitif de l'arc réflexe myotatique :", "p": ["a son corps cellulaire dans un ganglion rachidien.", "pénètre dans la moelle épinière par la racine dorsale du nerf rachidien.", "conduit un message efférent.", "a son corps cellulaire dans la substance grise de la moelle épinière."], "b": "AB", "j": "Neurone « en T » : sa fibre vient du fuseau neuromusculaire, son corps cellulaire est dans le ganglion rachidien et il gagne la substance grise par la racine dorsale. Son message, qui se dirige vers le centre nerveux, est afférent.", "img": "", "fixes": 0}, {"t": "Le motoneurone de l'arc réflexe myotatique :", "p": ["a un axone qui quitte la moelle épinière par la racine ventrale.", "a son corps cellulaire dans un ganglion rachidien.", "a son corps cellulaire dans la substance grise de la moelle épinière.", "conduit un message afférent vers la moelle épinière."], "b": "AC", "j": "Le motoneurone transmet le message moteur au muscle au niveau de la plaque motrice. Son message, qui va du centre nerveux vers le muscle, est efférent.", "img": "", "fixes": 0}, {"t": "Le réflexe myotatique est qualifié de monosynaptique car :", "p": ["il ne concerne qu'un seul muscle du corps.", "il ne se produit qu'une seule fois.", "il ne fait intervenir qu'un seul neurone.", "le circuit ne comporte qu'une seule synapse entre neurones, entre le neurone sensitif et le motoneurone."], "b": "D", "j": "Dans la substance grise de la moelle épinière, le neurone sensitif est directement connecté au motoneurone.", "img": "", "fixes": 0}, {"t": "La section de la racine dorsale d'un nerf rachidien entraîne, dans le territoire concerné :", "p": ["la destruction des motoneurones.", "l'arrêt des messages sensitifs vers la moelle épinière.", "une perte de la sensibilité.", "l'abolition du réflexe myotatique."], "b": "BCD", "j": "La racine dorsale contient les fibres sensitives : sans message afférent, il n'y a ni sensibilité ni réflexe, bien que les motoneurones soient intacts.", "img": "", "fixes": 0}, {"t": "La section de la racine ventrale d'un nerf rachidien entraîne, dans le territoire concerné :", "p": ["une paralysie des muscles, la sensibilité étant conservée.", "une perte de la sensibilité, la motricité étant conservée.", "une contraction permanente des muscles.", "aucune conséquence."], "b": "A", "j": "La racine ventrale contient les axones des motoneurones : les messages moteurs ne parviennent plus aux muscles.", "img": "", "fixes": 0}, {"t": "Lors du réflexe rotulien :", "p": ["le relâchement de l'antagoniste met en jeu le même circuit monosynaptique.", "les muscles fléchisseurs (ischio-jambiers) se contractent.", "les muscles fléchisseurs antagonistes se relâchent.", "le muscle extenseur de la jambe (quadriceps) se contracte."], "b": "CD", "j": "L'étirement provoque à la fois la contraction du muscle étiré (circuit monosynaptique) et le relâchement de son antagoniste (circuit polysynaptique), ce qui permet le mouvement.", "img": "", "fixes": 0}, {"t": "Un neurone :", "p": ["reçoit des messages au niveau de ses dendrites et de son corps cellulaire.", "reçoit les messages des autres neurones à l'extrémité de son axone.", "possède un corps cellulaire qui contient le noyau.", "conduit le message nerveux le long de son axone, jusqu'aux terminaisons synaptiques."], "b": "ACD", "j": "Le message circule du corps cellulaire vers l'extrémité de l'axone, où il est transmis à une autre cellule.", "img": "", "fixes": 0}], "auto": [{"production": "Test et documents (consignes 1 à 6)", "criteres": [{"nom": "Complétude", "points": ["Réponse décrite : rapide, involontaire, stéréotypée ; le test renseigne sur l'état du système nerveux."]}, {"nom": "Exactitude", "points": ["Moelle épinière = centre nerveux : corps cellulaires dans la substance grise, fibres dans la substance blanche.", "Neurone en T (corps dans le ganglion rachidien) : sensitif, du fuseau neuromusculaire à la moelle.", "Motoneurone (corps dans la corne ventrale) ; nerf mixte : racine dorsale = entrée, racine ventrale = sortie ; une seule synapse."]}]}, {"production": "Schéma fonctionnel et réponse (consigne 7)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Ma réponse explique pourquoi le réflexe est un outil de diagnostic (chaque élément intact, lésion localisable)."]}, {"nom": "Complétude", "points": ["Stimulus, récepteur, voie sensitive, centre nerveux, voie motrice, effecteur, dans l'ordre du message.", "Muscle antagoniste : interneurone inhibiteur, le muscle fléchisseur se relâche."]}, {"nom": "Conformité", "points": ["Titre, racines et ganglion bien placés, flèches dans le sens du message, mots récepteur, centre nerveux, effecteur."]}]}]}, {"id": 86, "code": "8a2da81baf", "titre": "Corps humain – Activité 2 : La transmission du message nerveux", "questions": [{"t": "Au repos, la différence de potentiel entre les deux faces de la membrane d'un neurone est d'environ :", "p": ["0 mV.", "+30 mV.", "-70 mV, l'intérieur étant positif par rapport à l'extérieur.", "-70 mV, l'intérieur étant négatif par rapport à l'extérieur."], "b": "D", "j": "C'est le potentiel de repos : la membrane est polarisée.", "img": "", "fixes": 0}, {"t": "Un potentiel d'action :", "p": ["dure environ 1 ms.", "a une amplitude d'environ 1 V.", "dure plusieurs secondes.", "est une inversion brève de la polarisation de la membrane."], "b": "AD", "j": "Dépolarisation (de -70 mV à environ +30 mV), puis repolarisation (retour à -70 mV). Son amplitude est d'environ 100 mV.", "img": "", "fixes": 0}, {"t": "On applique à une fibre nerveuse des stimulations d'intensité croissante.", "p": ["L'amplitude du potentiel d'action augmente avec l'intensité de la stimulation.", "Au-dessus du seuil, le potentiel d'action a toujours la même amplitude.", "En dessous d'une intensité seuil, aucun potentiel d'action ne se propage.", "Une stimulation trop faible donne un petit potentiel d'action qui se propage."], "b": "BC", "j": "Loi du « tout ou rien » : soit il n'y a pas de potentiel d'action, soit il est complet, d'amplitude constante.", "img": "", "fixes": 0}, {"t": "Le long d'un axone, le potentiel d'action :", "p": ["se propage de la terminaison synaptique vers le corps cellulaire.", "se propage de proche en proche.", "voit son amplitude diminuer avec la distance.", "se propage sans atténuation."], "b": "BD", "j": "Chaque potentiel d'action déclenche l'ouverture de canaux ioniques dans la zone voisine, où un nouveau potentiel d'action identique se forme. Il se propage du corps cellulaire vers la terminaison synaptique.", "img": "", "fixes": 0}, {"t": "Une fibre nerveuse reçoit deux stimulations successives, toutes deux au-dessus du seuil, la seconde étant plus intense que la première. Par rapport au premier message nerveux, le second se caractérise par :", "p": ["des potentiels d'action plus longs.", "des potentiels d'action de plus grande amplitude.", "une fréquence de potentiels d'action plus élevée, leur amplitude étant inchangée.", "une vitesse de propagation plus grande."], "b": "C", "j": "Le message nerveux est codé en fréquence de potentiels d'action. Par exemple, plus la fréquence du message moteur est élevée, plus la contraction est forte.", "img": "", "fixes": 0}, {"t": "Au niveau d'une synapse :", "p": ["les membranes des deux cellules sont fusionnées.", "des récepteurs du neurotransmetteur sont présents sur la membrane postsynaptique.", "une fente synaptique de 20 à 50 nm sépare les deux cellules.", "des vésicules contenant le neurotransmetteur sont présentes dans l'élément postsynaptique."], "b": "BC", "j": "Le potentiel d'action ne peut pas franchir la fente : la transmission est assurée par un messager chimique. Les vésicules se trouvent dans la terminaison présynaptique.", "img": "", "fixes": 0}, {"t": "Dans quel ordre se déroulent les événements de la transmission synaptique ?", "p": ["Arrivée du potentiel d'action → exocytose des vésicules → fixation du neurotransmetteur sur ses récepteurs → naissance d'un potentiel d'action postsynaptique.", "Fixation du neurotransmetteur → exocytose → arrivée du potentiel d'action.", "Arrivée du potentiel d'action → fixation du neurotransmetteur → exocytose.", "Exocytose → arrivée du potentiel d'action → fixation du neurotransmetteur."], "b": "A", "j": "Le message électrique présynaptique est converti en message chimique, puis de nouveau en message électrique dans la cellule postsynaptique.", "img": "", "fixes": 0}, {"t": "Une synapse ne fonctionne que dans un seul sens car :", "p": ["le potentiel d'action ne peut pas revenir en arrière.", "le neurotransmetteur est immédiatement détruit.", "la fente synaptique est trop large.", "les vésicules ne se trouvent que du côté présynaptique et les récepteurs que du côté postsynaptique."], "b": "D", "j": "Cette asymétrie structurale impose le sens de transmission, de l'élément présynaptique vers l'élément postsynaptique.", "img": "", "fixes": 0}, {"t": "À propos du codage du message nerveux :", "p": ["Au niveau de la synapse, il est codé en concentration de neurotransmetteur.", "Plus la fréquence des potentiels d'action présynaptiques est élevée, plus la quantité de neurotransmetteur libérée est grande.", "Dans une fibre nerveuse, il est codé en fréquence de potentiels d'action.", "Dans une fibre nerveuse, il est codé en amplitude des potentiels d'action."], "b": "ABC", "j": "Codage électrique (fréquence) dans les fibres, codage chimique (concentration) dans la fente synaptique.", "img": "", "fixes": 0}, {"t": "Le neurotransmetteur de la synapse neuromusculaire est :", "p": ["l'adrénaline.", "la dopamine.", "l'acétylcholine.", "le GABA."], "b": "C", "j": "L'acétylcholine, libérée par le motoneurone, se fixe sur les récepteurs de la fibre musculaire.", "img": "", "fixes": 0}, {"t": "L'acétylcholinestérase :", "p": ["dégrade l'acétylcholine dans la fente synaptique, ce qui libère les récepteurs.", "fabrique l'acétylcholine.", "est le récepteur de l'acétylcholine.", "provoque l'exocytose des vésicules."], "b": "A", "j": "Cette enzyme met fin à l'action du neurotransmetteur : la synapse est de nouveau disponible pour un nouveau message.", "img": "", "fixes": 0}, {"t": "Au niveau de la jonction neuromusculaire :", "p": ["l'augmentation de la concentration en Ca^{2+} dans le cytosol déclenche la contraction.", "les ions Ca^{2+} sont libérés dans la fente synaptique.", "la fixation de l'acétylcholine déclenche un potentiel d'action musculaire.", "le potentiel d'action musculaire provoque la libération d'ions Ca^{2+} par le réticulum sarcoplasmique."], "b": "ACD", "j": "Le réticulum sarcoplasmique est un réservoir de calcium interne à la fibre musculaire : le calcium est libéré dans le cytosol.", "img": "", "fixes": 0}], "auto": [{"production": "Propagation et synapse (consignes 1 à 6)", "criteres": [{"nom": "Exactitude", "points": ["Potentiel d'action : inversion brève (1 à 2 ms) de la polarité, propagé de proche en proche sans atténuation.", "Codage en fréquence de potentiels d'action dans la fibre, en concentration de neurotransmetteur à la synapse.", "L'acétylcholine déclenche des potentiels d'action musculaires quand elle est déposée à l'extérieur de la fibre, pas à l'intérieur.", "Six étapes : vésicules, arrivée du message, exocytose, fixation sur les récepteurs, ouverture des canaux, élimination."]}, {"nom": "Conformité", "points": ["Schémas des synapses A et C titrés, à l'échelle, légendés, avec le sens du message ; capture Libmol légendée."]}]}, {"production": "Schéma bilan ou réponse (consigne 7)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Je réponds aux deux questions : le long du neurone, puis d'une cellule à la suivante."]}, {"nom": "Complétude", "points": ["Sens unique : vésicules seulement dans l'élément présynaptique, récepteurs seulement dans le postsynaptique.", "Plus la fréquence est élevée, plus il y a d'exocytoses, d'acétylcholine, et plus la contraction est forte."]}]}]}, {"id": 87, "code": "c10e9f16ca", "titre": "Corps humain – Activité 3A : Mouvement volontaire et plasticité cérébrale", "questions": [{"t": "La gaine de myéline :", "p": ["est produite par des cellules gliales.", "augmente la vitesse de propagation du message nerveux.", "est un isolant électrique.", "impose une propagation « saltatoire » du potentiel d'action."], "b": "ABCD", "j": "Le potentiel d'action ne se reforme qu'entre les manchons de myéline : il « saute » de l'un à l'autre, ce qui accélère la propagation (jusqu'à 100 m/s).", "img": "", "fixes": 0}, {"t": "Les cellules gliales :", "p": ["conduisent le message nerveux moteur jusqu'aux muscles.", "comprennent les oligodendrocytes (cerveau, moelle épinière) et les cellules de Schwann (nerfs).", "produisent la myéline.", "assurent le soutien, la nutrition et la protection des neurones."], "b": "BCD", "j": "Le cerveau n'est pas constitué que de neurones : les cellules gliales sont indispensables à leur fonctionnement.", "img": "", "fixes": 0}, {"t": "L'imagerie par résonance magnétique (IRM) :", "p": ["donne des images précises des structures du cerveau (IRM anatomique).", "enregistre les potentiels d'action de chaque neurone.", "permet de repérer les zones du cerveau actives lors d'une tâche (IRM fonctionnelle).", "permet de localiser une lésion, par exemple après un AVC."], "b": "ACD", "j": "L'IRM fonctionnelle détecte les variations d'activité de zones du cerveau, pas l'activité électrique de neurones isolés.", "img": "", "fixes": 0}, {"t": "À propos de la commande du mouvement volontaire :", "p": ["Ces aires se trouvent dans le cortex cérébral.", "L'aire motrice primaire commande directement les mouvements.", "Les aires prémotrices interviennent dans la planification du mouvement.", "Ces aires se trouvent dans la moelle épinière."], "b": "ABC", "j": "Des structures plus profondes du cerveau participent aussi à la commande des mouvements : leur dégénérescence est à l'origine de la maladie de Parkinson.", "img": "", "fixes": 0}, {"t": "Sur la carte de l'aire motrice primaire, la surface consacrée à une partie du corps dépend :", "p": ["de la taille de cette partie du corps.", "de la finesse et de la mobilité des mouvements qu'elle réalise.", "de la masse de ses muscles.", "de sa distance par rapport au cerveau."], "b": "B", "j": "Les mains et la bouche, capables de mouvements très précis, occupent une surface corticale bien plus grande que le tronc.", "img": "", "fixes": 0}, {"t": "Un AVC détruit une partie de l'aire motrice primaire de l'hémisphère gauche. On observe :", "p": ["une paralysie du côté gauche du corps.", "une perte de la vision.", "une paralysie du côté droit du corps.", "une paralysie des deux côtés du corps."], "b": "C", "j": "Les voies motrices sont croisées : la commande est controlatérale, chaque hémisphère commande la moitié opposée du corps.", "img": "", "fixes": 0}, {"t": "Les voies motrices :", "p": ["commandent le côté du corps situé du même côté que l'hémisphère dont elles partent.", "vont directement du cortex aux muscles, sans relais.", "sont formées de neurones qui partent du cortex et descendent dans la moelle épinière.", "font synapse avec les motoneurones de la moelle épinière."], "b": "CD", "j": "Le motoneurone est le dernier neurone du trajet : il reçoit à la fois les messages venus du cerveau et ceux des circuits réflexes. Les voies motrices sont croisées : la commande est controlatérale.", "img": "", "fixes": 0}, {"t": "Un accident vasculaire cérébral (AVC) :", "p": ["peut provoquer une hémiplégie.", "est dû à l'obstruction d'une artère cérébrale par un caillot ou à la rupture d'un vaisseau.", "laisse une zone du cerveau définitivement détruite (nécrosée).", "prive une zone du cerveau de son irrigation sanguine."], "b": "ABCD", "j": "Si la zone lésée appartient à une aire motrice, la moitié opposée du corps est paralysée (hémiplégie).", "img": "", "fixes": 0}, {"t": "Une section complète de la moelle épinière au niveau du dos entraîne :", "p": ["une paralysie des membres inférieurs (paraplégie).", "la disparition des aires motrices du cortex.", "une paralysie du visage.", "l'interruption des messages moteurs volontaires vers les motoneurones situés sous la lésion."], "b": "AD", "j": "Les aires motrices sont intactes, mais leurs messages ne parviennent plus aux motoneurones situés sous la lésion. Le territoire paralysé dépend du niveau de la lésion.", "img": "", "fixes": 0}, {"t": "Parmi ces atteintes, lesquelles peuvent entraîner des troubles moteurs ?", "p": ["La compression d'une racine rachidienne par une hernie discale.", "Une section de la moelle épinière.", "Une lésion limitée à l'aire visuelle.", "Un AVC touchant une aire motrice."], "b": "ABD", "j": "Le message moteur peut être interrompu à tous les niveaux de son trajet : cortex, moelle épinière, racines et nerfs rachidiens.", "img": "", "fixes": 0}, {"t": "À propos des synapses entre neurones :", "p": ["Une synapse excitatrice favorise la naissance de potentiels d'action dans le neurone postsynaptique.", "Un neurone ne reçoit que des synapses d'un seul type.", "Une synapse inhibitrice rend plus difficile la naissance de potentiels d'action dans le neurone postsynaptique.", "L'effet d'une synapse dépend du neurotransmetteur libéré."], "b": "ACD", "j": "Un motoneurone reçoit des milliers de synapses, excitatrices et inhibitrices.", "img": "", "fixes": 0}, {"t": "Le motoneurone réalise une sommation des messages qu'il reçoit :", "p": ["La sommation temporelle prend en compte des messages provenant de plusieurs neurones différents.", "Le motoneurone fait la somme algébrique des messages excitateurs et inhibiteurs.", "La sommation temporelle prend en compte des messages rapprochés provenant d'un même neurone présynaptique.", "La sommation spatiale prend en compte des messages provenant de plusieurs neurones présynaptiques."], "b": "BCD", "j": "Le corps cellulaire du motoneurone intègre l'ensemble des informations reçues et élabore un message moteur unique.", "img": "", "fixes": 0}, {"t": "Un motoneurone reçoit au même moment des messages excitateurs et des messages inhibiteurs. Il émet des potentiels d'action :", "p": ["dès qu'il reçoit un message excitateur.", "dans tous les cas.", "jamais, tant qu'il reçoit un message inhibiteur.", "seulement si le bilan des messages reçus est une excitation suffisante (seuil atteint)."], "b": "D", "j": "Si la somme des messages n'atteint pas le seuil, le motoneurone reste au repos.", "img": "", "fixes": 0}, {"t": "Contrairement au motoneurone, la fibre musculaire n'a pas de capacité d'intégration car :", "p": ["elle ne contient pas de noyau.", "elle ne produit pas de potentiel d'action.", "elle ne reçoit le message que d'un seul motoneurone.", "elle ne possède pas de récepteurs."], "b": "C", "j": "La fibre musculaire exécute le message unique élaboré par le motoneurone.", "img": "", "fixes": 0}, {"t": "Pendant un test du réflexe rotulien, le sujet contracte volontairement les muscles fléchisseurs de la jambe : la réponse de l'extenseur est diminuée.", "p": ["Cette observation illustre le rôle intégrateur du motoneurone.", "Des messages inhibiteurs s'ajoutent aux messages excitateurs.", "Les motoneurones de l'extenseur reçoivent à la fois des messages venant des fuseaux neuromusculaires et des messages venant des centres supérieurs.", "Le réflexe myotatique est totalement indépendant du cerveau."], "b": "ABC", "j": "La réponse réflexe tient compte d'autres informations reçues au même moment : le cerveau module l'activité réflexe de la moelle épinière.", "img": "", "fixes": 0}, {"t": "La comparaison des cartes motrices de plusieurs personnes montre que :", "p": ["ces différences sont innées et fixées à la naissance.", "ces différences s'acquièrent par l'apprentissage et l'entraînement.", "l'organisation générale du cortex moteur est la même chez tous.", "il existe des différences d'un individu à l'autre."], "b": "BCD", "j": "C'est la plasticité cérébrale : l'organisation du cortex se modifie selon l'expérience de chacun.", "img": "", "fixes": 0}, {"t": "Après plusieurs semaines d'entraînement à un geste précis des doigts, on observe :", "p": ["une extension de l'aire motrice commandant ces doigts.", "une réduction de l'aire motrice commandant ces doigts.", "la formation d'un nouvel hémisphère.", "aucun changement dans le cortex."], "b": "A", "j": "L'amélioration des performances s'accompagne d'une extension du territoire cortical concerné ; cette modification peut être rapide et n'est pas forcément durable.", "img": "", "fixes": 0}, {"t": "Après un AVC, la récupération motrice :", "p": ["est favorisée par une rééducation précoce.", "dépend de l'importance de la lésion.", "repose sur la réorganisation d'autres territoires du cerveau.", "correspond à la remise en service de la zone détruite."], "b": "ABC", "j": "La zone nécrosée est définitivement détruite : ce sont d'autres régions, dans les deux hémisphères, qui prennent en charge la fonction.", "img": "", "fixes": 0}, {"t": "À propos des neurones chez l'adulte :", "p": ["La plasticité cérébrale disparaît à la fin de l'enfance.", "Tout neurone détruit est remplacé.", "Certaines zones du cerveau peuvent produire de nouveaux neurones, mais de façon très limitée.", "Les neurones constituent un capital à préserver."], "b": "CD", "j": "La production de nouveaux neurones ne permet pas de réparer un tissu lésé : la santé du cerveau dépend aussi de nos comportements.", "img": "", "fixes": 0}, {"t": "La plasticité cérébrale est :", "p": ["la destruction progressive des neurones avec l'âge.", "la capacité du cerveau à remanier ses réseaux de neurones en fonction de l'expérience.", "la propagation du message nerveux dans le cortex.", "la fabrication de myéline par les cellules gliales."], "b": "B", "j": "Elle explique les différences entre individus, les effets de l'apprentissage et la récupération après une lésion.", "img": "", "fixes": 0}], "auto": [{"production": "Commande et intégration (consignes 1 à 5)", "criteres": [{"nom": "Exactitude", "points": ["Voie motrice : cortex moteur → bulbe (croisement) → motoneurone de la moelle → muscle ; commande controlatérale.", "Homonculus : la surface dépend de la finesse des mouvements, pas de la taille de l'organe.", "Le motoneurone fait la somme (spatiale, temporelle) des synapses excitatrices et inhibitrices ; un seul message si le seuil est atteint.", "Cellules gliales : nutrition, protection, myéline (conduction plus rapide)."]}, {"nom": "Conformité", "points": ["Captures EduAnat2 titrées (sujet, tâche, seuil), hémisphères repérés ; courbe du dessin en miroir titrée, avec unités."]}]}, {"production": "Plasticité et schéma bilan (consignes 6 à 11)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Critique de l'expérience des sujets âgés : effectifs, un seul exercice, nuancée par le document 12."]}, {"nom": "Complétude", "points": ["Entraînement : carte motrice étendue, d'abord passagère puis durable si l'entraînement est répété.", "AVC (récupération de 58 % à 74 % de force) et greffe des mains : d'autres territoires prennent le relais.", "Schéma : aire motrice, voie croisée, motoneurone intégrateur, synapse neuromusculaire, cartes avant / après."]}]}]}, {"id": 88, "code": "491cefae82", "titre": "Corps humain – Activité 3B : Fonctionnement synaptique et substances exogènes", "questions": [{"t": "Une substance bloque l'acétylcholinestérase au niveau de la jonction neuromusculaire.", "p": ["La stimulation du muscle est prolongée.", "L'acétylcholine s'accumule dans la fente synaptique.", "Le muscle ne reçoit plus aucun message.", "Les récepteurs restent occupés par l'acétylcholine."], "b": "ABD", "j": "Sans dégradation, le neurotransmetteur continue d'agir : la fibre musculaire est stimulée en continu (contractions anormales).", "img": "", "fixes": 0}, {"t": "Une substance se fixe sur les récepteurs de l'acétylcholine de la fibre musculaire, sans les activer (cas du curare).", "p": ["La fibre musculaire se contracte en permanence.", "Aucun potentiel d'action musculaire n'est déclenché.", "L'acétylcholine ne peut plus se fixer sur ses récepteurs.", "Le muscle est paralysé."], "b": "BCD", "j": "La substance occupe les récepteurs à la place du neurotransmetteur : le message n'est plus transmis au muscle.", "img": "", "fixes": 0}, {"t": "À propos des neurotransmetteurs du cerveau :", "p": ["Il en existe plusieurs dizaines.", "Le glutamate a une action inhibitrice.", "Le GABA a une action inhibitrice.", "L'acétylcholine est le seul neurotransmetteur."], "b": "AC", "j": "Selon le neurotransmetteur libéré, une synapse est excitatrice ou inhibitrice. Le glutamate est excitateur, le GABA inhibiteur.", "img": "", "fixes": 0}, {"t": "La nicotine se fixe sur des récepteurs de l'acétylcholine et les active.", "p": ["Elle peut activer le circuit de la récompense.", "Elle mime l'action d'un neurotransmetteur naturel.", "C'est un antagoniste de l'acétylcholine.", "C'est un agoniste de l'acétylcholine."], "b": "ABD", "j": "Les substances exogènes agissent sur les synapses en mimant, en empêchant ou en amplifiant l'action des neurotransmetteurs. Un antagoniste se fixe sur le récepteur sans l'activer.", "img": "", "fixes": 0}, {"t": "Le circuit de la récompense :", "p": ["est associé à des comportements essentiels à la survie (manger, boire, se reproduire).", "a pour neurotransmetteur principal le GABA.", "est activé uniquement par les drogues.", "fait intervenir l'aire tegmentale ventrale et le noyau accumbens."], "b": "AD", "j": "Ce circuit incite à répéter les comportements qui procurent du plaisir. Les drogues le détournent en l'activant artificiellement. Son neurotransmetteur est la dopamine.", "img": "", "fixes": 0}, {"t": "Lors d'une consommation répétée d'une drogue :", "p": ["le nombre de récepteurs synaptiques diminue.", "l'arrêt provoque une sensation de manque.", "des doses de plus en plus faibles suffisent pour obtenir le même effet.", "la synapse devient plus sensible."], "b": "AB", "j": "La synapse s'adapte à la stimulation excessive en réduisant le nombre de ses récepteurs : c'est l'origine de la tolérance et de la dépendance. Il faut au contraire augmenter les doses.", "img": "", "fixes": 0}, {"t": "Le LSD provoque des hallucinations car :", "p": ["il bloque la propagation des potentiels d'action dans le nerf optique.", "il augmente la quantité de lumière captée par la rétine.", "il détruit les neurones du cortex visuel.", "il se fixe sur les récepteurs de la sérotonine et perturbe la transmission des messages visuels."], "b": "D", "j": "Sa forme lui permet de se fixer sur les récepteurs d'un neurotransmetteur naturel, la sérotonine.", "img": "", "fixes": 0}], "auto": [{"production": "LSD et circuit de la récompense (consignes 1 à 4)", "criteres": [{"nom": "Exactitude", "points": ["Hallucinations : formes et couleurs perçues qui n'existent pas ; c'est le traitement cérébral qui est perturbé.", "LSD et sérotonine ont une partie commune (double cycle azoté) : le LSD se fixe sur le récepteur de la sérotonine.", "Drogues : dopamine du noyau accumbens jusqu'à 1 000 % (amphétamine) ; la cocaïne bloque la recapture."]}, {"nom": "Conformité", "points": ["Captures Libmol titrées, molécules orientées de la même façon, partie commune entourée."]}]}, {"production": "Texte explicatif et schéma (consigne 5)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Je réponds aux deux questions : comment la drogue perturbe la synapse, pourquoi elle rend dépendant."]}, {"nom": "Complétude", "points": ["Une drogue prend la place d'un neurotransmetteur ou modifie sa quantité dans la fente synaptique.", "Addiction : circuit de la récompense détourné, puis moins de récepteurs (tolérance, manque)."]}, {"nom": "Conformité", "points": ["Schéma synapse sans / avec drogue, titré et légendé (vésicules, fente, récepteurs, sens du message)."]}]}]}, {"id": 89, "code": "21fa88bfc5", "titre": "Corps humain – Activité 4 : ATP et contraction musculaire", "questions": [{"t": "Dans la contraction musculaire, l'ATP :", "p": ["permet, en se fixant, le détachement de la tête de myosine de l'actine.", "fournit, par son hydrolyse, l'énergie du changement de forme de la tête de myosine.", "démasque les sites de fixation de l'actine.", "est indispensable : sans ATP, les têtes de myosine restent fixées à l'actine."], "b": "ABD", "j": "Il y a conversion d'énergie chimique en énergie mécanique. C : c'est le rôle des ions calcium.", "img": "", "fixes": 0}, {"t": "Au cours de la contraction musculaire, il y a conversion :", "p": ["d'énergie chimique (ATP) en énergie mécanique.", "d'énergie mécanique en énergie chimique.", "d'énergie électrique en énergie lumineuse.", "d'énergie lumineuse en énergie chimique."], "b": "A", "j": "L'énergie libérée par l'hydrolyse de l'ATP permet le mouvement des têtes de myosine ; une partie est dissipée sous forme de chaleur.", "img": "", "fixes": 0}, {"t": "L'ATP :", "p": ["est une protéine.", "est un nucléotide.", "est formé d'adénine, d'un sucre à 5 carbones et de trois groupements phosphate.", "n'est présent que dans les cellules musculaires."], "b": "BC", "j": "Adénosine triphosphate : c'est la molécule qui alimente la plupart des activités cellulaires consommatrices d'énergie. L'ATP est présent dans toutes les cellules.", "img": "", "fixes": 0}, {"t": "L'hydrolyse de l'ATP s'écrit :", "p": ["ADP + P_{i} + énergie → ATP + H_{2}O.", "ATP + H_{2}O → ADP + P_{i} + énergie.", "ATP → glucose + énergie.", "ATP + O_{2} → CO_{2} + H_{2}O."], "b": "B", "j": "Cette réaction libère environ 50 kJ par mole d'ATP dans les conditions cellulaires. La réaction inverse (A), qui régénère l'ATP, nécessite un apport d'énergie.", "img": "", "fixes": 0}, {"t": "À propos de l'ATP dans l'organisme :", "p": ["Les réserves d'ATP des cellules sont très faibles.", "Le stock d'ATP d'un muscle suffit pour plusieurs heures d'effort.", "L'ATP est régénéré en permanence à partir d'ADP et de phosphate.", "La régénération de l'ATP libère de l'énergie."], "b": "AC", "j": "Un adulte ne possède qu'environ 250 g d'ATP à un instant donné, mais en consomme et en régénère chaque jour l'équivalent de son propre poids. Régénérer l'ATP à partir d'ADP et de phosphate consomme de l'énergie.", "img": "", "fixes": 0}], "auto": [{"production": "ECE : les cils consomment-ils de l'ATP ? (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie : même fragment de branchie, avant puis après diffusion d'un inhibiteur de la production d'ATP.", "Témoin : diffusion d'eau de mer à la place de l'inhibiteur."]}, {"nom": "Exactitude", "points": ["Sécurité : gants, lunettes, inhibiteur prélevé avec la pipette (jamais à la bouche), lame immobile."]}, {"nom": "Conformité", "points": ["Tableau ou dessins titrés comparant les deux conditions ; interprétation : je vois, je sais, j'en conclus."]}]}, {"production": "Le rôle de l'ATP (consigne 2)", "criteres": [{"nom": "Complétude", "points": ["L'hydrolyse de l'ATP (ATP + H₂O → ADP + Pi) fournit l'énergie des travaux cellulaires (cils, contraction).", "Le stock d'ATP est minuscule : il doit être régénéré en permanence à partir d'ADP et de Pi."]}, {"nom": "Exactitude", "points": ["Ma conclusion répond au problème posé, avec le vocabulaire : cils vibratiles, branchie, ATP, inhibiteur."]}]}]}, {"id": 90, "code": "818346ff29", "titre": "Corps humain – Activité 5 : Muscle, système musculo-articulaire et contraction", "questions": [{"t": "Dans le système musculo-articulaire :", "p": ["un tendon relie un muscle à un os.", "un ligament relie deux os entre eux.", "le cartilage relie le muscle à l'os.", "un tendon relie deux os entre eux."], "b": "AB", "j": "En se contractant, le muscle tire sur les tendons et fait jouer l'articulation. Le cartilage recouvre les surfaces articulaires des os.", "img": "", "fixes": 0}, {"t": "Lors de la flexion de l'avant-bras sur le bras :", "p": ["le biceps et le triceps se contractent tous les deux.", "le biceps s'allonge activement et pousse l'avant-bras.", "le biceps se contracte et se raccourcit, le triceps est relâché.", "le triceps se contracte, le biceps est relâché."], "b": "C", "j": "Un muscle ne peut que tirer en se raccourcissant : les mouvements opposés sont assurés par des muscles antagonistes.", "img": "", "fixes": 0}, {"t": "Du plus grand au plus petit, l'organisation d'un muscle strié squelettique est :", "p": ["muscle, myofibrille, faisceau, fibre musculaire, myofilaments.", "fibre musculaire, muscle, faisceau, myofibrille, sarcomère.", "faisceau, muscle, myofilaments, fibre musculaire, myofibrille.", "muscle, faisceau de fibres, fibre musculaire (cellule), myofibrille, myofilaments."], "b": "D", "j": "Les myofibrilles sont des successions de sarcomères, eux-mêmes formés de myofilaments d'actine et de myosine.", "img": "", "fixes": 0}, {"t": "Une fibre musculaire striée :", "p": ["contient de nombreuses myofibrilles.", "doit son aspect strié à ses mitochondries.", "résulte de la fusion de plusieurs cellules.", "est une cellule très allongée."], "b": "ACD", "j": "La striation est due à l'organisation très régulière des myofilaments dans les myofibrilles.", "img": "", "fixes": 0}, {"t": "Un sarcomère est :", "p": ["l'unité de la myofibrille comprise entre deux stries Z.", "un réservoir de calcium.", "un filament d'actine.", "une cellule musculaire."], "b": "A", "j": "La myofibrille est une succession de sarcomères ; le raccourcissement simultané de tous les sarcomères raccourcit la fibre.", "img": "", "fixes": 0}, {"t": "Dans un sarcomère :", "p": ["les bandes claires ne contiennent que des filaments d'actine.", "les filaments épais sont constitués de myosine.", "la bande sombre ne contient que de l'actine.", "les filaments fins sont constitués d'actine."], "b": "ABD", "j": "La bande sombre correspond à toute la longueur des filaments de myosine ; les filaments d'actine s'y superposent en partie.", "img": "", "fixes": 0}, {"t": "La bande H, au centre de la bande sombre, correspond à la zone où l'on trouve :", "p": ["uniquement des filaments d'actine.", "uniquement des filaments de myosine.", "de l'actine et de la myosine superposées.", "aucun filament."], "b": "B", "j": "Au centre du sarcomère, les filaments d'actine n'atteignent pas le milieu des filaments de myosine.", "img": "", "fixes": 0}, {"t": "Lors de la contraction d'une fibre musculaire :", "p": ["les filaments d'actine et de myosine raccourcissent.", "la distance entre deux stries Z diminue.", "les bandes claires raccourcissent.", "la bande H se réduit."], "b": "BCD", "j": "Les filaments gardent leur longueur : ils coulissent les uns par rapport aux autres. La bande sombre (longueur des filaments de myosine) reste donc constante.", "img": "", "fixes": 0}, {"t": "Le raccourcissement du sarcomère résulte :", "p": ["de la contraction des stries Z.", "de la disparition des filaments d'actine.", "du raccourcissement des filaments de myosine.", "du coulissement des filaments d'actine entre les filaments de myosine."], "b": "D", "j": "Les têtes de myosine se fixent sur l'actine et pivotent, entraînant les filaments d'actine vers le centre du sarcomère.", "img": "", "fixes": 0}, {"t": "Dans quel ordre se succèdent les étapes du cycle de contraction ?", "p": ["Fixation sur l'actine → fixation d'ATP → basculement → hydrolyse de l'ATP.", "Fixation d'une molécule d'ATP sur la tête de myosine (détachée de l'actine) → hydrolyse de l'ATP → fixation de la tête sur l'actine → libération de l'ADP et basculement de la tête.", "Hydrolyse de l'ATP → fixation d'ATP → basculement → fixation sur l'actine.", "Basculement de la tête → fixation d'ATP → fixation sur l'actine → hydrolyse de l'ATP."], "b": "B", "j": "La fixation d'une nouvelle molécule d'ATP détache ensuite la tête de myosine, et le cycle recommence tant que du calcium et de l'ATP sont disponibles.", "img": "", "fixes": 0}, {"t": "Dans la fibre musculaire, les ions Ca^{2+} :", "p": ["sont repompés dans le réticulum sarcoplasmique, ce qui permet le relâchement.", "sont libérés par le réticulum sarcoplasmique à l'arrivée d'un potentiel d'action musculaire.", "fournissent l'énergie de la contraction.", "rendent accessibles les sites de fixation de la myosine sur l'actine."], "b": "ABD", "j": "Quand le message nerveux cesse, la concentration en calcium du cytosol chute, les sites de l'actine sont de nouveau masqués et le muscle se relâche.", "img": "", "fixes": 0}, {"t": "La myopathie de Duchenne :", "p": ["est due à une anomalie du gène DMD.", "entraîne une dégénérescence progressive des fibres musculaires.", "se caractérise par l'absence de dystrophine fonctionnelle.", "est une maladie infectieuse."], "b": "ABC", "j": "La dystrophine participe à la liaison entre le cytosquelette de la fibre et la matrice extracellulaire : sans elle, les fibres se détériorent lors des contractions.", "img": "", "fixes": 0}, {"t": "Dans certaines myopathies, on observe un déficit en laminine-2 (mérosine). Les fibres musculaires dégénèrent car :", "p": ["elles ne reçoivent plus de message nerveux.", "elles ne peuvent plus produire d'ATP.", "la liaison entre la fibre musculaire et la matrice extracellulaire est défectueuse.", "elles ne contiennent plus d'actine."], "b": "C", "j": "Les interactions entre les protéines de la membrane et la matrice extracellulaire sont indispensables à la solidité et à la réparation du muscle.", "img": "", "fixes": 0}], "auto": [{"production": "Du système musculo-articulaire au sarcomère (consignes 1 à 3)", "criteres": [{"nom": "Exactitude", "points": ["Un nerf est un ensemble de fibres nerveuses ; un muscle tire sur un tendon et fait pivoter l'os autour de l'articulation.", "Muscles antagonistes : gastrocnémien (extension du pied), tibial (flexion) ; un muscle ne peut que tirer.", "Sarcomère contracté : stries Z rapprochées, bandes claires réduites, bande sombre inchangée : les filaments glissent."]}]}, {"production": "Molécules et myopathie (consignes 4 et 5)", "criteres": [{"nom": "Exactitude", "points": ["Myosine : la tête garde sa forme, le bras de levier pivote d'environ 110°.", "Sans laminine-2, la fibre n'est plus ancrée à la matrice extracellulaire : elle s'abîme et dégénère."]}, {"nom": "Conformité", "points": ["Deux captures Libmol côte à côte, même orientation, titrées et légendées (tête, bras de levier)."]}]}, {"production": "Schéma bilan (consigne 6)", "criteres": [{"nom": "Complétude", "points": ["Trois échelles reliées par des zooms : organes, cellule (myofibrilles), sarcomère (actine, myosine).", "Cycle : Ca²⁺ du réticulum, fixation de la myosine, pivotement, fixation d'ATP (détachement), hydrolyse."]}, {"nom": "Conformité", "points": ["Titre ; mots tendon, antagoniste, sarcomère, strie Z, actine, myosine, calcium, ATP ; filaments qui glissent."]}]}]}, {"id": 91, "code": "84862d5124", "titre": "Corps humain – Activité 6A : Origine de l'ATP : la respiration", "questions": [{"t": "La glycolyse se déroule :", "p": ["dans le hyaloplasme (cytosol).", "dans le noyau.", "dans la membrane interne des mitochondries.", "dans la matrice des mitochondries."], "b": "A", "j": "C'est la première étape de la dégradation du glucose, commune à la respiration et à la fermentation.", "img": "", "fixes": 0}, {"t": "La glycolyse :", "p": ["produit 2 ATP par molécule de glucose.", "transforme une molécule de glucose en deux molécules de pyruvate.", "produit des composés réduits (2 NADH).", "consomme du dioxygène."], "b": "ABC", "j": "C'est une oxydation partielle du glucose, qui ne nécessite pas de dioxygène : glucose + 2 NAD^{+} + 2 ADP + 2 P_{i} → 2 pyruvates + 2 NADH + 2 H^{+} + 2 ATP + 2 H_{2}O.", "img": "", "fixes": 0}, {"t": "Au cours de la glycolyse, 2 ATP sont d'abord consommés, puis 4 ATP sont produits. Le bilan net pour une molécule de glucose est de :", "p": ["2 ATP.", "4 ATP.", "6 ATP.", "36 ATP."], "b": "A", "j": "4 - 2 = 2 ATP : la glycolyse nécessite un « investissement » de départ.", "img": "", "fixes": 0}, {"t": "Une mitochondrie :", "p": ["contient de la chlorophylle.", "renferme un compartiment interne appelé matrice.", "a une membrane externe repliée en crêtes.", "est limitée par deux membranes."], "b": "BD", "j": "Les mitochondries sont très nombreuses dans les cellules qui consomment beaucoup d'énergie, comme les fibres musculaires. C'est la membrane interne qui forme les crêtes.", "img": "", "fixes": 0}, {"t": "Le cycle de Krebs :", "p": ["se déroule dans la matrice mitochondriale.", "consomme directement le dioxygène.", "dégrade complètement le pyruvate.", "libère du CO_{2} et produit des composés réduits (NADH)."], "b": "ACD", "j": "Le dioxygène n'intervient qu'à l'étape suivante, la chaîne respiratoire.", "img": "", "fixes": 0}, {"t": "Le CO_{2} rejeté par la respiration provient :", "p": ["de l'hydrolyse de l'ATP.", "de la dégradation du pyruvate dans la matrice mitochondriale (cycle de Krebs).", "du dioxygène inspiré.", "de la chaîne respiratoire."], "b": "B", "j": "Les atomes de carbone du glucose se retrouvent dans le CO_{2} ; le dioxygène consommé, lui, se retrouve dans l'eau.", "img": "", "fixes": 0}, {"t": "Pour deux molécules de pyruvate issues d'une molécule de glucose, le cycle de Krebs produit :", "p": ["2 CO_{2}, 2 NADH et 32 ATP.", "2 molécules d'acide lactique et 2 ATP.", "6 CO_{2}, 10 NADH et 2 ATP.", "6 O_{2} et 36 ATP."], "b": "C", "j": "Le cycle de Krebs produit peu d'ATP directement, mais beaucoup de composés réduits, qui seront réoxydés par la chaîne respiratoire.", "img": "", "fixes": 0}, {"t": "La chaîne respiratoire :", "p": ["est située dans la membrane interne des mitochondries (crêtes).", "crée un gradient de protons de part et d'autre de la membrane interne.", "réoxyde les composés réduits (NADH).", "a pour accepteur final d'électrons le dioxygène, ce qui forme de l'eau."], "b": "ABCD", "j": "C'est une suite de réactions d'oxydoréduction : c'est à ce niveau que le dioxygène est consommé.", "img": "", "fixes": 0}, {"t": "Dans la mitochondrie :", "p": ["l'ATP synthase est située dans la membrane externe.", "les protons retournent vers la matrice en traversant l'ATP synthase.", "le flux de protons permet la synthèse d'ATP à partir d'ADP et de phosphate.", "la chaîne respiratoire accumule des protons H^{+} dans l'espace intermembranaire."], "b": "BCD", "j": "Le gradient de protons créé par la chaîne respiratoire est la source d'énergie de l'ATP synthase, située dans la membrane interne.", "img": "", "fixes": 0}, {"t": "Pour une molécule de glucose, l'étape de la respiration qui produit le plus d'ATP est :", "p": ["la fermentation.", "la glycolyse.", "le cycle de Krebs.", "la réoxydation des composés réduits par la chaîne respiratoire, couplée à l'ATP synthase."], "b": "D", "j": "2 ATP (glycolyse) + 2 ATP (cycle de Krebs) + 32 ATP (chaîne respiratoire et ATP synthase) = 36 ATP.", "img": "", "fixes": 0}, {"t": "L'équation bilan de la respiration cellulaire est :", "p": ["6 CO_{2} + 6 H_{2}O → C_{6}H_{12}O_{6} + 6 O_{2}.", "C_{6}H_{12}O_{6} → 2 C_{3}H_{6}O_{3}.", "C_{6}H_{12}O_{6} → 2 C_{2}H_{6}O + 2 CO_{2}.", "C_{6}H_{12}O_{6} + 6 O_{2} → 6 CO_{2} + 6 H_{2}O."], "b": "D", "j": "A : photosynthèse. B : fermentation lactique. C : fermentation alcoolique. La respiration oxyde complètement le glucose.", "img": "", "fixes": 0}, {"t": "Dans une suspension de mitochondries isolées, l'ajout de glucose ne modifie pas la consommation de dioxygène, alors que l'ajout de pyruvate la fait augmenter. On en déduit que :", "p": ["le pyruvate contient du dioxygène.", "les mitochondries ne respirent pas.", "les mitochondries utilisent le pyruvate, et non le glucose.", "le glucose est toxique pour les mitochondries."], "b": "C", "j": "Le glucose est d'abord transformé en pyruvate dans le hyaloplasme (glycolyse) ; seul le pyruvate entre dans la mitochondrie.", "img": "", "fixes": 0}], "auto": [{"production": "Respiration et mitochondries (consignes 1 à 4)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie levures : ExAO, levures affamées, injection de glucose, témoin avec de l'eau, résultat attendu."]}, {"nom": "Exactitude", "points": ["Cellules chlorophylliennes : elles respirent aussi à la lumière ; la courbe à la lumière est un bilan.", "Mitochondries isolées : rien avec le glucose, consommation d'O₂ avec le pyruvate : glycolyse dans le hyaloplasme.", "ECE : la souche sans crêtes (rho⁻) ne consomme pas d'O₂ : la chaîne respiratoire est sur les crêtes."]}, {"nom": "Conformité", "points": ["Graphique des deux souches superposées, titré, axes et unités, injection repérée."]}]}, {"production": "Schéma ou texte (consigne 5)", "criteres": [{"nom": "Complétude", "points": ["Glycolyse (hyaloplasme) : glucose → 2 pyruvates, 2 ATP, 2 NADH.", "Cycle de Krebs (matrice) : 6 CO₂, 2 ATP, composés réduits ; chaîne respiratoire (crêtes) : O₂ consommé, 32 ATP."]}, {"nom": "Exactitude", "points": ["Bilan C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O, 36 ATP ; c'est le pyruvate, pas le glucose, qui entre dans la mitochondrie."]}]}]}, {"id": 92, "code": "61c7e0ec88", "titre": "Corps humain – Activité 6B : Origine de l'ATP : la fermentation", "questions": [{"t": "Dans une fibre musculaire humaine, l'ATP peut être régénéré par :", "p": ["la fermentation lactique.", "la fermentation alcoolique.", "la respiration cellulaire.", "l'utilisation de la phosphocréatine."], "b": "ACD", "j": "Les cellules musculaires ne réalisent pas la fermentation alcoolique.", "img": "", "fixes": 0}, {"t": "La dégradation complète d'une mole de glucose libère 2 860 kJ ; l'hydrolyse d'une mole d'ATP en libère environ 50. Des estimations récentes retiennent 30 ATP par glucose pour la respiration (et toujours 2 pour la fermentation).", "p": ["Avec 30 ATP, le rendement de la respiration est d'environ 52 %.", "La fermentation produit alors 15 fois moins d'ATP que la respiration.", "L'énergie qui n'est pas récupérée sous forme d'ATP est perdue sous forme de chaleur.", "Avec 30 ATP, la fermentation devient plus rentable que la respiration."], "b": "ABC", "j": "30 × 50 = 1 500 kJ ; 1 500 / 2 860 ≈ 52 %. 30 / 2 = 15. Quel que soit le chiffre retenu, la respiration reste bien plus rentable que la fermentation.", "img": "", "fixes": 0}, {"t": "La fermentation lactique :", "p": ["se déroule dans le hyaloplasme.", "se déroule dans les mitochondries.", "produit 2 ATP par molécule de glucose.", "se déroule sans dioxygène."], "b": "ACD", "j": "Elle comprend la glycolyse, puis la transformation du pyruvate en acide lactique.", "img": "", "fixes": 0}, {"t": "Dans la fermentation lactique, la transformation du pyruvate en acide lactique a pour intérêt :", "p": ["de produire beaucoup d'ATP.", "de régénérer le NAD^{+} nécessaire à la poursuite de la glycolyse.", "de consommer du dioxygène.", "de produire du CO_{2}."], "b": "B", "j": "Cette étape ne produit pas d'ATP : elle réoxyde le NADH formé par la glycolyse, qui peut ainsi continuer à fonctionner.", "img": "", "fixes": 0}, {"t": "À propos des fermentations :", "p": ["La fermentation alcoolique produit de l'éthanol et du CO_{2}.", "Les deux fermentations produisent 2 ATP par molécule de glucose.", "Les cellules musculaires réalisent la fermentation alcoolique.", "La fermentation lactique produit de l'acide lactique."], "b": "ABD", "j": "La fermentation alcoolique est réalisée par des levures, par exemple ; les cellules musculaires ne réalisent que la fermentation lactique.", "img": "", "fixes": 0}, {"t": "Le rendement énergétique de la fermentation est faible car :", "p": ["le glucose n'est que partiellement dégradé : les produits formés (acide lactique, éthanol) contiennent encore beaucoup d'énergie.", "elle consomme trop de dioxygène.", "elle consomme plus d'ATP qu'elle n'en produit.", "elle se déroule trop lentement."], "b": "A", "j": "Seule la respiration dégrade complètement le glucose en CO_{2} et H_{2}O.", "img": "", "fixes": 0}, {"t": "Par rapport à la respiration, la fermentation lactique :", "p": ["est la voie principale des fibres sollicitées lors d'efforts intenses et brefs.", "ne nécessite pas de dioxygène.", "produit 18 fois moins d'ATP par molécule de glucose.", "dégrade complètement le glucose."], "b": "ABC", "j": "2 ATP contre 36. Malgré son faible rendement, elle permet de produire de l'ATP sans dioxygène.", "img": "", "fixes": 0}, {"t": "Les fibres musculaires de type I (fibres lentes, rouges) :", "p": ["sont riches en mitochondries.", "régénèrent leur ATP surtout par la fermentation lactique.", "sont très résistantes à la fatigue.", "sont sollicitées lors des efforts brefs et très puissants."], "b": "AC", "j": "Ce sont les fibres de l'endurance : leur fonctionnement exige un bon approvisionnement en dioxygène. Riches en mitochondries, elles utilisent surtout la respiration.", "img": "", "fixes": 0}, {"t": "Les fibres musculaires de type II (fibres rapides, blanches) :", "p": ["sont très résistantes à la fatigue.", "développent une puissance importante.", "régénèrent leur ATP surtout par la fermentation lactique.", "contiennent peu de mitochondries."], "b": "BCD", "j": "Elles sont sollicitées lors d'exercices intenses et de courte durée, mais elles se fatiguent vite.", "img": "", "fixes": 0}, {"t": "On s'attend à trouver la plus forte proportion de fibres de type I dans les muscles des jambes :", "p": ["d'un sauteur en hauteur.", "d'un sprinter.", "d'un haltérophile.", "d'un marathonien."], "b": "D", "j": "Un effort d'endurance sollicite surtout les fibres de type I. L'entraînement peut modifier les caractéristiques des fibres : il existe une plasticité du muscle.", "img": "", "fixes": 0}, {"t": "La phosphocréatine :", "p": ["constitue une réserve très importante, suffisante pour plusieurs heures d'effort.", "nécessite du dioxygène et des mitochondries.", "est reconstituée pendant la récupération.", "permet de régénérer immédiatement de l'ATP par transfert d'un groupement phosphate sur l'ADP."], "b": "CD", "j": "C'est la voie la plus rapide, utilisée dès les premières secondes d'un effort intense. Le stock de phosphocréatine est épuisé en une trentaine de secondes.", "img": "", "fixes": 0}, {"t": "Au début d'un effort très intense, les voies de régénération de l'ATP interviennent principalement dans l'ordre suivant :", "p": ["fermentation lactique, puis respiration, puis phosphocréatine.", "respiration, puis phosphocréatine, puis fermentation lactique.", "phosphocréatine, puis fermentation lactique, puis respiration.", "respiration, puis fermentation lactique, puis phosphocréatine."], "b": "C", "j": "La part de chaque voie dépend de l'intensité et de la durée de l'effort : phosphocréatine pour quelques secondes, fermentation lactique pour les efforts brefs, respiration pour les efforts prolongés.", "img": "", "fixes": 0}, {"t": "À propos du dopage :", "p": ["Les stéroïdes anabolisants augmentent le nombre de fibres musculaires.", "L'augmentation de masse musculaire correspond à une hypertrophie des fibres.", "Les stéroïdes anabolisants, dérivés de la testostérone, augmentent la masse musculaire.", "L'EPO augmente le nombre de globules rouges, donc le transport du dioxygène."], "b": "BCD", "j": "Les fibres existantes grossissent (fusion avec des cellules satellites, synthèse accrue de protéines) ; leur nombre n'augmente pas.", "img": "", "fixes": 0}, {"t": "La prise de stéroïdes anabolisants peut entraîner :", "p": ["des cancers.", "des lésions musculaires et tendineuses.", "une augmentation de l'espérance de vie.", "une stérilité."], "b": "ABD", "j": "Ces pratiques détournent l'usage médical de certaines molécules et ont des effets secondaires graves, à court et à long terme.", "img": "", "fixes": 0}], "auto": [{"production": "Fermentations et rendements (consignes 1 à 3)", "criteres": [{"nom": "Exactitude", "points": ["L'éthanol n'apparaît qu'une fois le dioxygène épuisé (vers 180 s) : fermentation alcoolique.", "Points communs (glycolyse, réoxydation du NADH) et différences (O₂, lieu, dégradation complète ou non, 36 ou 2 ATP).", "Rendements : 36 × 50 / 2 860 = 63 % ; 2 × 50 / 2 860 = 3,5 % (18 fois moins)."]}]}, {"production": "ECE yaourt et types d'effort (consignes 4 et 5)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["ECE : lait + petit-lait, acide, eau (témoin), éthanol ; seuls l'acide et le petit-lait font cailler : fermentation lactique."]}, {"nom": "Complétude", "points": ["Marathonien : respiration, fibres de type I ; sprinteur : phosphocréatine puis fermentation, fibres de type II.", "Stéroïdes anabolisants : fibres hypertrophiées, mais effets graves (cœur, tendons, stérilité) ; pratique interdite."]}]}, {"production": "Schéma ou texte (consigne 6)", "criteres": [{"nom": "Complétude", "points": ["Glycolyse (2 ATP), puis réoxydation du NADH par le pyruvate : acide lactique ou éthanol + CO₂.", "Fermentation rapide, sans O₂ : ATP des efforts intenses et courts, en relais de la phosphocréatine."]}]}]}, {"id": 93, "code": "1b2207f4f0", "titre": "Corps humain – Activité 7 : Les flux de glucose dans l'organisme", "questions": [{"t": "Chez une personne en bonne santé, la glycémie est maintenue autour de :", "p": ["0,1 g/L.", "1 g/L.", "5 g/L.", "10 g/L."], "b": "B", "j": "La glycémie est la concentration de glucose dans le sang. Elle varie peu (entre 0,7 et 1,1 g/L environ) malgré les repas et les périodes de jeûne.", "img": "", "fixes": 0}, {"t": "À propos du stockage du glucose :", "p": ["Le foie stocke du glucose sous forme de glycogène.", "Les muscles stockent du glucose sous forme de glycogène.", "Le tissu adipeux stocke le glucose sous forme de triglycérides.", "Les muscles peuvent libérer du glucose dans le sang."], "b": "ABC", "j": "Foie, muscles et tissu adipeux prélèvent du glucose après un repas, mais seul le foie peut en libérer dans le sang.", "img": "", "fixes": 0}, {"t": "Le foie :", "p": ["peut fabriquer du glucose à partir d'acides aminés, d'acide lactique ou de glycérol (néoglucogenèse).", "stocke du glucose sous forme de glycogène après un repas.", "peut libérer du glucose dans le sang en hydrolysant son glycogène (glycogénolyse).", "est le seul organe capable de libérer du glucose dans le sang à jeun."], "b": "ABCD", "j": "Après une nuit de jeûne, la glycogénolyse fournit environ 75 % du glucose libéré par le foie et la néoglucogenèse 25 %.", "img": "", "fixes": 0}, {"t": "La glycogénogenèse est :", "p": ["l'hydrolyse du glycogène en glucose.", "la synthèse de glycogène à partir de glucose.", "la synthèse de glucose à partir de molécules non glucidiques.", "la synthèse de triglycérides à partir de glucose."], "b": "B", "j": "A : glycogénolyse. C : néoglucogenèse. D : lipogenèse.", "img": "", "fixes": 0}, {"t": "On dit que le glycogène du muscle est une réserve « privée » car :", "p": ["le glucose issu du glycogène musculaire est utilisé par le muscle lui-même et n'est pas libéré dans le sang.", "le glycogène musculaire ne peut pas être hydrolysé.", "le muscle ne possède pas de récepteurs à l'insuline.", "le muscle ne peut pas stocker de glycogène."], "b": "A", "j": "Le foie, lui, constitue une réserve « publique » : le glucose qu'il libère est mis à la disposition de tout l'organisme.", "img": "", "fixes": 0}], "auto": [{"production": "Manipulations (consigne 1)", "criteres": [{"nom": "Exactitude", "points": ["Foie lavé : du glucose réapparaît en 20 minutes ; muscle : aucun glucose libéré.", "Glycogène dans le foie et le muscle (éthanol, eau iodée), pas dans le rein ; témoins positif et négatif."]}, {"nom": "Conformité", "points": ["Deux tableaux de résultats complets et titrés."]}]}, {"production": "Texte et schéma (consigne 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Les résultats des manipulations sont cités dans le texte."]}, {"nom": "Complétude", "points": ["Réserves : glycogène (foie 100 g, muscles 400 g) et triglycérides (foie, tissu adipeux).", "Seul le foie rend du glucose au sang (hydrolyse du glycogène, néoglucogenèse à partir du glycérol)."]}, {"nom": "Exactitude", "points": ["Aucune flèche de glucose ne sort du muscle ni du tissu adipeux (il en sort du glycérol)."]}, {"nom": "Conformité", "points": ["Schéma titré : sang (1 g/L) au centre, intestin, foie, muscles, tissu adipeux, cerveau ; flèches orientées."]}]}]}, {"id": 94, "code": "28e2f36f18", "titre": "Corps humain – Activité 8A : La régulation de la glycémie", "questions": [{"t": "Dans le pancréas :", "p": ["les îlots de Langerhans constituent la partie endocrine.", "les acini sécrètent l'insuline.", "les cellules α sécrètent le glucagon.", "les cellules β sécrètent l'insuline."], "b": "ACD", "j": "Le reste du pancréas (acini) fabrique des sucs digestifs.", "img": "", "fixes": 0}, {"t": "Une hormone :", "p": ["agit sur des cellules cibles qui possèdent des récepteurs spécifiques.", "est sécrétée par des cellules endocrines.", "est transportée par le sang.", "agit sur toutes les cellules de l'organisme."], "b": "ABC", "j": "Une hormone est un messager chimique, actif à très faible concentration, qui modifie l'activité de ses cellules cibles.", "img": "", "fixes": 0}, {"t": "L'insuline :", "p": ["favorise l'entrée du glucose dans ses cellules cibles et son stockage.", "est une hormone hypoglycémiante.", "stimule l'hydrolyse du glycogène du foie.", "agit uniquement sur les cellules du foie."], "b": "AB", "j": "Sécrétée par les cellules β en cas d'hyperglycémie, elle fait baisser la glycémie. Ses cellules cibles sont les cellules du foie, des muscles et du tissu adipeux.", "img": "", "fixes": 0}, {"t": "Le
