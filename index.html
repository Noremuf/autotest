re ou visuelle", "a lieu entre individus d’une même espèce", "n’existe que chez les espèces vivant en société", "est souvent plus élaborée chez les espèces vivant en société"], "b": "ABD", "j": "La communication intraspécifique existe entre individus d’une même espèce, sous des modalités variées. Elle est souvent plus élaborée chez les espèces vivant en société, mais existe aussi chez les espèces solitaires.", "img": "", "fixes": 0}, {"t": "Le succès reproducteur d’un individu correspond :", "p": ["à sa durée de vie", "à son nombre de descendants", "au nombre de combats qu’il a gagnés", "au nombre d’allèles qu’il possède"], "b": "B", "j": "Le succès reproducteur est le nombre de descendants. Un individu peut avoir un succès reproducteur élevé même si ses chances de survie sont plus faibles.", "img": "", "fixes": 0}, {"t": "Certains caractères, comme une longue queue ou des couleurs vives :", "p": ["diminuent les chances de survie", "sont désavantageux pour la reproduction", "augmentent le succès reproducteur", "deviennent moins fréquents au fil des générations"], "b": "AC", "j": "Ces caractères diminuent les chances de survie mais augmentent le nombre de descendants : les allèles correspondants deviennent plus fréquents. C’est la sélection sexuelle.", "img": "", "fixes": 0}, {"t": "La compétition entre mâles pour l’accès aux femelles (combats, brame du cerf) correspond à :", "p": ["la sélection intersexuelle", "la spéciation", "la sélection intrasexuelle", "la dérive génétique"], "b": "C", "j": "La compétition entre mâles est la sélection intrasexuelle. La sélection intersexuelle correspond au choix du partenaire, majoritairement fait par les femelles.", "img": "", "fixes": 0}, {"t": "La sélection intersexuelle :", "p": ["fait disparaître les différences d’aspect entre mâles et femelles", "correspond au choix du partenaire, fait majoritairement par les femelles", "correspond aux combats entre mâles", "peut aboutir à du dimorphisme sexuel"], "b": "BD", "j": "Si les femelles préfèrent les mâles émettant certains signaux, des différences d’aspect entre mâles et femelles apparaissent (dimorphisme sexuel). Les combats entre mâles relèvent de la sélection intrasexuelle.", "img": "", "fixes": 0}, {"t": "Parmi ces associations, lesquelles sont correctes ?", "p": ["Une phéromone – communication chimique.", "Un cri – communication sonore.", "Un signal lumineux – communication visuelle.", "Un chant – communication chimique."], "b": "ABC", "j": "Un chant est un signal sonore ; une odeur est un signal chimique.", "img": "", "fixes": 0}, {"t": "À propos de la sélection sexuelle :", "p": ["elle fait disparaître les caractères voyants.", "certains caractères diminuent les chances de survie mais augmentent le succès reproducteur.", "les individus portant ces caractères transmettent davantage leurs allèles.", "la fréquence de ces allèles augmente au fil des générations."], "b": "BCD", "j": "Elle explique au contraire le maintien de caractères voyants.", "img": "", "fixes": 0}, {"t": "Le dimorphisme sexuel :", "p": ["est une différence entre deux espèces.", "correspond aux différences d’aspect entre mâles et femelles d’une même espèce.", "peut résulter de la sélection intersexuelle.", "est une différence entre deux populations isolées."], "b": "BC", "j": "Il concerne les deux sexes d’une même espèce.", "img": "", "fixes": 0}, {"t": "Chez une espèce, les mâles portant l’ornement le plus développé ont davantage de partenaires :", "p": ["leur succès reproducteur est plus élevé.", "leurs allèles sont davantage transmis.", "cet ornement augmente forcément leurs chances de survie.", "la fréquence des allèles correspondants augmente au fil des générations."], "b": "ABD", "j": "Sélection sexuelle : un ornement peut être un handicap pour la survie mais un avantage pour la reproduction.", "img": "", "fixes": 0}, {"t": "À propos de la communication et de la spéciation :", "p": ["des difficultés dans la réception du signal peuvent générer un isolement reproducteur.", "cet isolement peut être à l’origine d’une spéciation.", "ce phénomène se produit en une génération.", "des individus isolés sur le plan reproducteur ne se reproduisent plus entre eux."], "b": "ABD", "j": "Ce phénomène se déroule sur le long terme.", "img": "", "fixes": 0}], "auto": [{"production": "Tableau (consigne 1)", "criteres": [{"nom": "Complétude", "points": ["Pour chaque espèce : émetteur, récepteur, nature du signal (sens) et fonction."]}, {"nom": "Exactitude", "points": ["J'ai regroupé les signaux (sonores, chimiques, visuels) et les fonctions (reproduction, nutrition, défense, groupe)."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Conformité", "points": ["Mon texte a une introduction qui dit ce que je cherche à expliquer.", "Il a un développement en paragraphes et une conclusion qui répond au problème.", "J'ai relu l'orthographe et la construction des phrases."]}, {"nom": "Complétude", "points": ["J'ai expliqué la communication : un émetteur produit un signal qui modifie le comportement d'un récepteur de la même espèce.", "J'ai donné des exemples chiffrés (ex. : la phéromone du lait attire 98 % des lapereaux).", "J'ai expliqué que les caractères spectaculaires des mâles ont un coût pour leur survie.", "J'ai montré qu'ils augmentent la reproduction (paon : 6 à 8 partenaires contre 0 à 2 ; hirondelle : 8 naissances contre 3).", "J'ai expliqué que ces mâles transmettent davantage leurs allèles, donc ces caractères se maintiennent.", "J'ai conclu : c'est la sélection sexuelle (avantage pour la reproduction, pas pour la survie)."]}, {"nom": "Exactitude", "points": ["J'ai distingué sélection intrasexuelle (combats entre mâles) et intersexuelle (choix par les femelles).", "J'ai utilisé le vocabulaire scientifique de l'activité, sans erreur."]}, {"nom": "Pertinence", "points": ["Mes idées s'enchaînent logiquement, avec des connecteurs (donc, or, ainsi, en effet…).", "Chaque idée sert à répondre au problème posé (rien d'inutile)."]}]}]}, {"id": 15, "code": "59ea251d6f", "titre": "Thème 2 – Activité 1 : De la fécondation à la puberté", "questions": [{"t": "Jusqu’à la 8e semaine de grossesse, l’appareil génital de l’embryon :", "p": ["est déjà différent chez la fille et chez le garçon.", "est indifférencié : il est identique dans les deux sexes.", "possède à la fois des canaux de Wolff et des canaux de Müller.", "est déjà fonctionnel."], "b": "BC", "j": "Avant la 8e semaine, l’appareil génital est indifférencié : gonades indifférenciées, canaux de Wolff et de Müller présents dans les deux sexes.", "img": "", "fixes": 0}, {"t": "Le sexe chromosomique d’un individu (XX ou XY) est fixé :", "p": ["à la puberté.", "à la 8e semaine de grossesse.", "à la naissance.", "dès la fécondation."], "b": "D", "j": "Les chromosomes sexuels sont ceux de la cellule-œuf : le sexe chromosomique est fixé dès la fécondation.", "img": "", "fixes": 0}, {"t": "Le gène SRY :", "p": ["est normalement porté par le chromosome Y.", "provoque la différenciation de la gonade indifférenciée en testicule.", "est une hormone produite par le testicule.", "est présent sur chaque chromosome X."], "b": "AB", "j": "SRY est un gène du chromosome Y ; il oriente la gonade indifférenciée vers le testicule.", "img": "", "fixes": 0}, {"t": "Un homme possède deux chromosomes X ; l’un d’eux porte le gène SRY. Cet homme possède des testicules. Ce cas montre que :", "p": ["le chromosome Y entier est indispensable à la formation des testicules.", "deux chromosomes X entraînent toujours la formation d’ovaires.", "les testicules se forment sans intervention d’un gène.", "c’est le gène SRY, et non le chromosome Y entier, qui oriente la gonade vers le testicule."], "b": "D", "j": "Sans chromosome Y mais avec SRY, des testicules se forment : c’est le gène SRY qui compte, pas le chromosome Y entier.", "img": "", "fixes": 0}, {"t": "On ajoute le seul gène SRY à un embryon de souris XX. Les gonades de cet embryon deviennent :", "p": ["des testicules.", "des ovaires.", "des gonades qui restent indifférenciées.", "à la fois des ovaires et des testicules."], "b": "A", "j": "L’ajout du seul gène SRY à un embryon XX suffit à faire apparaître des testicules.", "img": "", "fixes": 0}, {"t": "Chez le fœtus de sexe masculin, la testostérone produite par les testicules :", "p": ["permet le maintien des canaux de Wolff, qui deviennent les voies génitales masculines.", "fait disparaître les canaux de Müller.", "transforme la gonade indifférenciée en testicule.", "masculinise les organes génitaux externes."], "b": "AD", "j": "La testostérone maintient les canaux de Wolff et masculinise les organes externes ; c’est l’AMH qui fait régresser les canaux de Müller.", "img": "", "fixes": 0}, {"t": "Chez le fœtus de sexe féminin, les canaux de Müller :", "p": ["disparaissent sous l’action de l’AMH.", "deviennent les ovaires.", "persistent grâce à la testostérone.", "deviennent les trompes, l’utérus et le vagin."], "b": "D", "j": "Sans AMH, les canaux de Müller persistent et deviennent les trompes, l’utérus et le vagin.", "img": "", "fixes": 0}, {"t": "Un fœtus est privé de ses gonades très tôt au cours du développement. Quel que soit son sexe chromosomique, ses voies génitales seront :", "p": ["de type masculin.", "de type féminin.", "absentes.", "à la fois de type masculin et de type féminin."], "b": "B", "j": "Le phénotype féminin se met en place en l’absence d’hormones testiculaires (testostérone et AMH).", "img": "", "fixes": 0}], "auto": [{"production": "Tableau de comparaison (consigne 1)", "criteres": [{"nom": "Conformité", "points": ["Mon tableau a un titre, une ligne par organe et trois colonnes : avant la 8e semaine, fille, garçon."]}, {"nom": "Complétude", "points": ["J'ai rempli les quatre lignes : gonades, canaux de Wolff, canaux de Müller, organes génitaux externes."]}, {"nom": "Exactitude", "points": ["Avant la 8e semaine, tout est identique dans les deux sexes : gonades indifférenciées, deux paires de canaux.", "Chez la fille, les canaux de Müller deviennent trompes, utérus et vagin ; les canaux de Wolff disparaissent.", "Chez le garçon, les canaux de Wolff persistent (épididymes, canaux déférents…) ; les canaux de Müller disparaissent."]}]}, {"production": "Texte argumenté (consigne 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["J'ai choisi les arguments utiles et je les enchaîne avec des connecteurs (d'abord, or, donc, ainsi…)."]}, {"nom": "Complétude", "points": ["J'ai expliqué que la cellule-œuf de la fille est XX et celle du garçon XY : le sexe chromosomique est fixé dès la fécondation (doc. 4).", "J'ai rappelé que, jusqu'à la 8e semaine, l'appareil génital est le même dans les deux sexes (doc. 1).", "J'ai montré avec les cas C, D et E que c'est le gène SRY, et non le chromosome Y entier, qui fait former des testicules (doc. 5).", "Chez le garçon : la testostérone maintient les canaux de Wolff et masculinise les organes externes, l'AMH fait disparaître les canaux de Müller (doc. 6).", "Chez la fille : sans testostérone ni AMH, les canaux de Müller se développent et ceux de Wolff disparaissent.", "J'ai expliqué qu'à la puberté, la hausse des hormones sexuelles rend l'appareil génital fonctionnel (docs 7 et 8)."]}, {"nom": "Exactitude", "points": ["Mes arguments sont exacts, citent un document et des valeurs dès que possible.", "Je n'ai pas écrit que SRY est une hormone : c'est un gène."]}, {"nom": "Conformité", "points": ["Introduction qui pose la problématique, un paragraphe par idée, conclusion qui y répond.", "Phrases claires, vocabulaire scientifique de l'activité, orthographe relue."]}]}]}, {"id": 16, "code": "65581e44dc", "titre": "Thème 2 – Activité 2 : Puberté et fonctionnement des gonades", "questions": [{"t": "Dans le testicule, les spermatozoïdes se forment :", "p": ["dans les cellules interstitielles.", "dans l’épididyme.", "dans les tubes séminifères.", "dans les vésicules séminales."], "b": "C", "j": "Les spermatozoïdes se forment dans les tubes séminifères ; les cellules interstitielles, entre les tubes, produisent la testostérone.", "img": "", "fixes": 0}, {"t": "Parmi ces associations entre une structure et l’hormone qu’elle produit, lesquelles sont exactes ?", "p": ["Cellules interstitielles du testicule : testostérone.", "Tubes séminifères : testostérone.", "Corps jaune : progestérone.", "Cellules des follicules : œstrogènes."], "b": "ACD", "j": "Cellules interstitielles : testostérone ; cellules des follicules : œstrogènes ; corps jaune : progestérone.", "img": "", "fixes": 0}, {"t": "Un coq castré garde une petite crête et ne chante pas. On lui greffe un testicule dans l’abdomen, relié au corps seulement par des vaisseaux sanguins : la crête se développe et le chant revient. Cette expérience montre que le testicule agit :", "p": ["par des messages nerveux.", "par une substance transportée par le sang.", "seulement lorsqu’il est à sa place habituelle.", "grâce aux spermatozoïdes qu’il produit."], "b": "B", "j": "Un testicule greffé loin de sa place, relié par le sang seulement, rétablit les caractères : il agit par une hormone.", "img": "", "fixes": 0}, {"t": "Chez le garçon, la quantité de testostérone dans le sang passe d’environ 25 ng pour 100 mL avant 10 ans à environ 630 ng pour 100 mL à 18 ans. Quelles affirmations sont exactes ?", "p": ["La quantité de testostérone est multipliée par 25 environ.", "La quantité de testostérone est multipliée par 6 environ.", "Cette hausse fait apparaître les caractères sexuels secondaires (mue de la voix, pilosité).", "Les testicules produisent autant de testostérone avant 10 ans qu’à 18 ans."], "b": "AC", "j": "À la puberté, la testostérone est multipliée par 25 environ ; elle fait apparaître les caractères sexuels secondaires.", "img": "", "fixes": 0}], "auto": [{"production": "Dessin d'observation (consigne 1)", "criteres": [{"nom": "Conformité", "points": ["Dessin au crayon, en grand, sans ombres ; légendes reliées par des traits à la règle, qui ne se croisent pas.", "Mon titre indique l'objet, le type de coupe et le grossissement (ex. : « Coupe transversale de testicule, × 400 »)."]}, {"nom": "Exactitude", "points": ["J'ai dessiné ce que je voyais sur ma lame, pas la photographie du document."]}, {"nom": "Complétude", "points": ["Testicule : tube séminifère, spermatozoïdes, cellules interstitielles. Ovaire : follicule, ovocyte, cavité, corps jaune."]}]}, {"production": "Schéma fonctionnel (consigne 2)", "criteres": [{"nom": "Exactitude", "points": ["Tubes séminifères → spermatozoïdes ; cellules interstitielles → testostérone ; follicules → œstrogènes ; corps jaune → progestérone."]}, {"nom": "Complétude", "points": ["J'ai relié chaque hormone à des organes cibles (larynx, peau, muscles ; seins, utérus, bassin)."]}]}, {"production": "Texte argumenté (consigne 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["J'ai choisi les arguments utiles et je les enchaîne avec des connecteurs (d'abord, or, donc, ainsi…)."]}, {"nom": "Complétude", "points": ["J'ai exposé les deux fonctions (gamètes, hormones) du testicule et de l'ovaire, en nommant les cellules ou structures qui les assurent.", "J'ai utilisé les coqs de Berthold : un testicule greffé, relié au corps par le seul sang, suffit ; il agit donc par une hormone (doc. 3).", "J'ai expliqué que les hormones sexuelles augmentent fortement à la puberté (testostérone × 25, œstradiol × 6, doc. 4).", "J'ai utilisé les castrats et la puberté précoce pour montrer que ce sont les hormones, et non l'âge, qui transforment le corps (doc. 5)."]}, {"nom": "Exactitude", "points": ["Mes arguments sont exacts, citent un document et des valeurs dès que possible."]}, {"nom": "Conformité", "points": ["Introduction qui pose la problématique, un paragraphe par idée, conclusion qui y répond.", "Phrases claires, vocabulaire scientifique de l'activité, orthographe relue."]}]}]}, {"id": 17, "code": "2dd08b0c12", "titre": "Thème 2 – Activité 3 : Cerveau, plaisir et sexualité", "questions": [{"t": "Dans l’expérience où des rates privées d’ovaires reçoivent chaque jour une dose d’œstradiol, puis où l’on compte celles qui prennent la posture d’accouplement :", "p": ["le facteur que l’on fait varier est la dose d’œstradiol injectée.", "ce que l’on mesure est le pourcentage de rates qui prennent la posture d’accouplement.", "le lot qui ne reçoit pas d’œstradiol sert de témoin.", "on retire les ovaires pour que les rates produisent davantage d’œstradiol."], "b": "ABC", "j": "On retire les ovaires pour supprimer l’œstradiol produit naturellement : la seule source d’œstradiol est alors celle que l’on injecte. Pour exploiter les résultats, on compare chaque lot au lot témoin en citant les valeurs.", "img": "", "fixes": 0}, {"t": "Une expérience sur des mammifères mâles comporte trois étapes : on observe le comportement sexuel avant la castration, après la castration, puis après des injections de testostérone. La dernière étape :", "p": ["permet de vérifier que c’est le manque de testostérone, et non l’opération elle-même, qui a modifié le comportement.", "est inutile : la castration suffit pour conclure.", "permet de conclure que la testostérone est nécessaire au comportement sexuel, si celui-ci réapparaît.", "montre que la testostérone est produite par le cerveau."], "b": "AC", "j": "La castration supprime la testostérone, mais c’est aussi une opération. Si le comportement réapparaît quand on rend la testostérone seule, c’est bien cette hormone qui lui est nécessaire.", "img": "", "fixes": 0}, {"t": "Chez la brebis, l’activité sexuelle ne dure que 24 à 36 heures par cycle de 17 jours, au moment où l’œstradiol est au plus haut. À partir de cette seule observation, on peut :", "p": ["affirmer que l’œstradiol déclenche le comportement sexuel.", "proposer l’hypothèse que l’œstradiol déclenche le comportement sexuel.", "affirmer que les hormones n’interviennent pas.", "conclure que le comportement sexuel provoque le pic d’œstradiol."], "b": "B", "j": "Une coïncidence permet de formuler une hypothèse, pas de conclure : il faut la mettre à l’épreuve par l’expérience.", "img": "", "fixes": 0}, {"t": "Dans l’expérience d’Olds et Milner (1954), un rat peut stimuler lui-même une zone précise de son cerveau en appuyant sur un levier. Il appuie plusieurs milliers de fois par heure, en délaissant la nourriture. Cette expérience montre que :", "p": ["le rat appuie pour obtenir de la nourriture.", "toutes les zones du cerveau donnent le même résultat.", "la stimulation de certaines zones du cerveau agit comme une récompense, que l’animal cherche à obtenir de nouveau.", "l’appui sur le levier est commandé par les hormones sexuelles."], "b": "C", "j": "Le rat répète l’action qui stimule certaines zones de son cerveau : ces zones forment le système de récompense.", "img": "", "fixes": 0}, {"t": "Le système de récompense :", "p": ["est un ensemble de zones du cerveau reliées par des neurones.", "comprend notamment l’aire tegmentale ventrale, le noyau accumbens et le cortex préfrontal.", "existe uniquement chez l’être humain.", "est activé lors de l’activité sexuelle."], "b": "ABD", "j": "Le système de récompense est un ensemble de zones cérébrales reliées, présent chez tous les mammifères et activé par l’activité sexuelle.", "img": "", "fixes": 0}, {"t": "La dopamine est :", "p": ["une hormone produite par les testicules.", "une hormone produite par les ovaires.", "une molécule libérée par des neurones du système de récompense.", "un gène du chromosome Y."], "b": "C", "j": "La dopamine est le messager du système de récompense : elle est libérée par ses neurones.", "img": "", "fixes": 0}, {"t": "Chez des mammifères comme le mouton ou le rat, l’activité sexuelle :", "p": ["est limitée aux périodes où les hormones sexuelles sont élevées.", "a lieu à tout moment de l’année et du cycle.", "se poursuit normalement après l’ablation des gonades.", "a lieu aux périodes où la fécondation est possible."], "b": "AD", "j": "Chez ces mammifères, le comportement sexuel dépend étroitement des hormones : il n’a lieu qu’aux périodes où la fécondation est possible.", "img": "", "fixes": 0}, {"t": "Chez les primates hominidés (bonobo, être humain), par comparaison avec le mouton ou le rat :", "p": ["l’influence des hormones sur le comportement sexuel a totalement disparu.", "l’influence des hormones sur le comportement sexuel diminue, sans disparaître.", "l’activité sexuelle ne sert pas seulement à la reproduction.", "le système de récompense n’intervient plus."], "b": "BC", "j": "Chez les primates hominidés, l’influence des hormones diminue sans disparaître, au profit du système de récompense ; la sexualité n’est plus liée à la seule reproduction.", "img": "", "fixes": 0}], "auto": [{"production": "Hypothèse et mise à l'épreuve (consigne 1)", "criteres": [{"nom": "Conformité", "points": ["Mon hypothèse est une réponse possible, tirée du doc. 1 (activité sexuelle au pic d'œstradiol ou de testostérone)."]}, {"nom": "Complétude", "points": ["Pour les docs 2 et 3, j'ai dit ce que l'on fait varier (hormone, castration) et ce que l'on mesure (% d'accouplements)."]}, {"nom": "Exactitude", "points": ["Valeurs : 0 % de rates sans œstradiol, plus de 90 % avec 3,2 µg ; cobayes castrés presque à 0, puis 60 % : hypothèse validée."]}]}, {"production": "Capture EduAnat2 (consigne 2)", "criteres": [{"nom": "Exactitude", "points": ["Ma capture a un titre et légende le cortex préfrontal et la zone profonde du système de récompense (pas les aires visuelles)."]}, {"nom": "Complétude", "points": ["J'ai expliqué le système de récompense : des zones reliées par des neurones à dopamine, qui procurent du plaisir et poussent à recommencer."]}]}, {"production": "Tableau comparatif (consigne 3)", "criteres": [{"nom": "Exactitude", "points": ["Mouton, rat : seulement quand les hormones sont élevées. Bonobo, humain : à tout moment, pas seulement pour se reproduire."]}]}, {"production": "Texte argumenté (consigne 4)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["J'ai choisi les arguments utiles et je les enchaîne avec des connecteurs (d'abord, or, donc, ainsi…)."]}, {"nom": "Complétude", "points": ["J'ai montré avec les docs 1 à 3 que les hormones sexuelles contrôlent le comportement sexuel des mammifères.", "J'ai expliqué le rôle du système de récompense (expérience d'Olds et Milner, IRMf).", "Chez les hominidés, l'activité sexuelle dépend moins des hormones ; leur néocortex est très développé (80 % chez l'humain).", "J'ai conclu que l'influence des hormones diminue sans disparaître, au profit du système de récompense et du néocortex."]}, {"nom": "Exactitude", "points": ["Mes arguments sont exacts, citent un document et des valeurs dès que possible."]}, {"nom": "Conformité", "points": ["Introduction qui pose la problématique, un paragraphe par idée, conclusion qui y répond.", "Phrases claires, vocabulaire scientifique de l'activité, orthographe relue."]}]}]}, {"id": 18, "code": "bc3edfaf15", "titre": "Thème 2 – Activité 4 : Sexualité humaine : entre biologie, culture et société", "questions": [{"t": "Pour montrer que les comportements sexuels humains ne dépendent pas seulement de la biologie, quels arguments sont pertinents ?", "p": ["Un comportement qui change en quelques dizaines d’années dans un même pays, alors que le corps humain n’a pas changé.", "Un comportement qui diffère d’une société à l’autre à la même époque.", "La forte augmentation des hormones sexuelles à la puberté.", "L’existence d’un système de récompense chez tous les êtres humains."], "b": "AB", "j": "Le corps, les hormones et le cerveau sont les mêmes d’une époque ou d’une société à l’autre : si le comportement varie, c’est que la culture (lois, savoirs, habitudes) intervient. C et D sont des arguments biologiques.", "img": "", "fixes": 0}, {"t": "L’orientation sexuelle :", "p": ["désigne l’attirance affective et sexuelle pour des personnes de l’autre sexe, du même sexe ou des deux.", "est le fait de se reconnaître femme ou homme.", "relève de l’intimité des personnes.", "désigne les activités qu’une société attend plutôt des femmes ou plutôt des hommes."], "b": "AC", "j": "L’orientation sexuelle est l’attirance affective et sexuelle ; elle relève de l’intimité. À ne pas confondre avec l’identité sexuelle ni avec les rôles.", "img": "", "fixes": 0}, {"t": "Parmi ces situations, lesquelles relèvent du sexe biologique ?", "p": ["Une personne se sent femme.", "Les cellules d’une personne possèdent deux chromosomes X.", "Dans une entreprise, tous les postes de direction sont occupés par des hommes.", "À la puberté, les testicules produisent de la testostérone."], "b": "BD", "j": "Le sexe biologique concerne le corps : chromosomes, gonades, appareil génital, hormones.", "img": "", "fixes": 0}, {"t": "D’après le cours, relèvent de l’espace social :", "p": ["l’orientation sexuelle.", "l’identité sexuelle.", "les rôles.", "les stéréotypes."], "b": "BCD", "j": "Identité sexuelle, rôles et stéréotypes relèvent de l’espace social ; l’orientation sexuelle relève de l’intimité.", "img": "", "fixes": 0}], "auto": [{"production": "Tableau (consigne 1)", "criteres": [{"nom": "Complétude", "points": ["Pour chaque document : ce qui change (valeur ou fait précis), et si c'est selon l'époque, la société ou les deux."]}, {"nom": "Cohérence et pertinence", "points": ["J'ai expliqué que le corps, les hormones et le cerveau n'ont pas changé entre les situations comparées : la biologie ne suffit pas."]}]}, {"production": "Tableau de tri (consigne 2)", "criteres": [{"nom": "Exactitude", "points": ["Sexe biologique : 1, 6 ; identité : 4, 9 ; rôles : 5, 10 ; stéréotypes : 3, 8, 12 ; orientation : 2, 7, 11."]}, {"nom": "Complétude", "points": ["Dernière ligne : identité, rôles et stéréotypes relèvent de l'espace social ; l'orientation sexuelle relève de l'intimité."]}]}, {"production": "Texte argumenté (consigne 3)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["J'ai choisi les arguments utiles et je les enchaîne avec des connecteurs (d'abord, or, donc, ainsi…)."]}, {"nom": "Complétude", "points": ["J'ai rappelé que la sexualité humaine repose, comme chez les autres mammifères, sur les hormones et le système de récompense.", "Les pratiques changent selon les époques (âge au premier rapport, masturbation) et les sociétés (baiser : 46 % des 168 sociétés).", "J'ai expliqué que ces différences s'apprennent : c'est la culture, permise par nos capacités cognitives.", "J'ai expliqué que les rôles et les stéréotypes ne découlent pas du sexe biologique (catalogues de jouets).", "J'ai distingué ce qui relève de l'espace social et ce qui relève de l'intimité, et cité ce que dit la loi."]}, {"nom": "Exactitude", "points": ["Mes arguments sont exacts, citent un document et des valeurs dès que possible.", "Je n'ai pas confondu identité sexuelle et orientation sexuelle."]}, {"nom": "Conformité", "points": ["Introduction qui pose la problématique, un paragraphe par idée, conclusion qui y répond.", "Phrases claires, vocabulaire scientifique de l'activité, orthographe relue."]}]}]}, {"id": 19, "code": "7215c75d6f", "titre": "Thème 2 – Activité 5 : Le contrôle hormonal de la reproduction", "questions": [{"t": "La GnRH :", "p": ["est une neurohormone sécrétée par des neurones de l’hypothalamus.", "est sécrétée par l’hypophyse.", "agit sur l’hypophyse, qui libère alors la FSH et la LH.", "agit directement sur les testicules et les ovaires."], "b": "AC", "j": "L’hypothalamus sécrète la GnRH, qui agit sur l’hypophyse ; celle-ci libère la FSH et la LH.", "img": "", "fixes": 0}, {"t": "La FSH et la LH sont libérées dans le sang par :", "p": ["les ovaires.", "les testicules.", "l’hypothalamus.", "l’hypophyse."], "b": "D", "j": "La FSH et la LH sont les deux hormones de l’hypophyse qui agissent sur les gonades.", "img": "", "fixes": 0}, {"t": "Chez l’homme :", "p": ["la testostérone stimule la sécrétion de FSH et de LH.", "la LH stimule la production de testostérone par les cellules interstitielles.", "le fonctionnement des testicules est cyclique.", "la FSH stimule la production de spermatozoïdes dans les tubes séminifères."], "b": "BD", "j": "LH : testostérone (cellules interstitielles) ; FSH : spermatozoïdes (tubes séminifères) ; la testostérone freine en retour le complexe hypothalamo-hypophysaire.", "img": "", "fixes": 0}, {"t": "Chez un animal, on sectionne les nerfs reliés aux testicules : la production de testostérone et de spermatozoïdes reste normale. On en déduit que le testicule :", "p": ["est commandé par des messages nerveux.", "ne produit plus d’hormones.", "n’est pas commandé par les nerfs : sa commande passe par une autre voie, le sang.", "produit lui-même la GnRH."], "b": "C", "j": "La section des nerfs ne change rien : le testicule est commandé par des hormones transportées par le sang.", "img": "", "fixes": 0}, {"t": "Après une lésion de l’hypophyse, il n’y a plus ni FSH ni LH, et le testicule ne produit plus ni testostérone ni spermatozoïdes, même si l’on injecte de la GnRH. Cela montre que la GnRH :", "p": ["agit sur l’hypophyse, et non directement sur le testicule.", "agit directement sur le testicule.", "est produite par le testicule.", "freine le fonctionnement du testicule."], "b": "A", "j": "Sans hypophyse, la GnRH ne rétablit rien : elle n’agit pas directement sur le testicule mais sur l’hypophyse.", "img": "", "fixes": 0}, {"t": "Après une lésion de l’hypophyse, une injection de LH seule rétablit la production de testostérone, mais pas celle de spermatozoïdes. Une injection de LH et de FSH rétablit les deux. Quelles conclusions sont exactes ?", "p": ["La LH suffit à la production de spermatozoïdes.", "L’hypophyse n’intervient pas dans le fonctionnement du testicule.", "La LH stimule la production de testostérone.", "La FSH est nécessaire à la production de spermatozoïdes."], "b": "CD", "j": "LH seule : testostérone rétablie ; il faut la FSH en plus pour rétablir la production de spermatozoïdes.", "img": "", "fixes"     else if (bonnesCochees === bonnes.length && !fausses) statut = ["juste", "✔ Juste"];
    else if (bonnesCochees) statut = ["partiel", "Presque : il y a une erreur"];
    else statut = ["faux", "✘ Faux"];
    if (statut[0] === "juste") justes++; else ratees.push(x.q);
    if (statut[0] === "partiel" && (bonnes.length - bonnesCochees) + fausses > 1) statut[1] = "En partie juste";
    carte.prepend(el("div", {class: "statut " + statut[0]}, statut[1]));
    carte.querySelectorAll("label.prop").forEach(lab => {
      const cb = lab.querySelector("input"), l = cb.dataset.lettre, bonne = bonnes.includes(l);
      cb.disabled = true;
      let classe = null, texte = null;
      if (bonne && cb.checked) { classe = "bonne-cochee"; texte = "✔ bonne réponse"; }
      else if (bonne) { classe = "oubliee"; texte = "bonne réponse oubliée"; }
      else if (cb.checked) { classe = "fausse-cochee"; texte = "✘ ne fallait pas cocher"; }
      if (classe) { lab.classList.add(classe); lab.append(el("span", {class: "verdict"}, texte)); }
    });
    if (x.q.j) carte.append(el("div", {class: "explication"}, el("b", {}, "Pourquoi ? "), x.q.j));
  });
  const total = questions.length;
  ecrireRecord(s.id, justes, total);
  const message = justes === total ? "Bravo, tout est juste !" : justes / total >= 0.7 ? "C'est bien compris dans l'ensemble : relis les explications des questions ratées."
    : justes / total >= 0.4 ? "Il reste des points à revoir : lis bien les explications, puis réessaie." : "Reprends ton cours et la correction de l'activité, puis réessaie.";
  const bilan = el("div", {class: "carte score"}, el("div", {}, el("b", {}, justes + " / " + total), " questions entièrement justes"), el("div", {class: "consigne"}, message));
  page.insertBefore(bilan, page.querySelector(".carte"));
  const boutons = el("div", {class: "boutons"});
  if (s.auto.length) boutons.append(el("button", {class: "bouton principal", onclick: () => autoeval(s.id)}, "Étape 2 : vérifier ma production"));
  if (ratees.length && ratees.length < total) boutons.append(el("button", {class: "bouton" + (s.auto.length ? "" : " principal"), onclick: () => quiz(s.id, ratees)}, "Refaire les questions ratées"));
  boutons.append(el("button", {class: "bouton", onclick: () => quiz(s.id)}, "Recommencer tout le QCM"));
  boutons.append(el("button", {class: "bouton", onclick: () => { location.hash = ""; }}, "Accueil"));
  valider.parentNode.replaceWith(boutons);
  bilan.scrollIntoView({behavior: "smooth"});
}

function etapes(s, active) {
  if (!s.questions.length || !s.auto.length) return null;
  const bouton = (cle, texte, fn) => el("button", {class: "etape" + (cle === active ? " active" : ""), onclick: () => { if (cle !== active) fn(s.id); }}, texte);
  return el("div", {class: "etapes"}, bouton("s", "1. QCM", quiz), bouton("a", "2. Vérifier ma production", autoeval));
}

function autoeval(id) {
  const trouve = trouverSeance(id);
  if (!trouve || !trouve.seance.auto.length) { location.hash = ""; return; }
  const s = trouve.seance;
  nav.replaceChildren(el("a", {href: "#"}, "← Accueil"));
  page.replaceChildren(el("h2", {}, trouve.niveau + " — " + s.titre));
  page.append(etapes(s, "a") || "", el("p", {class: "consigne"}, "Reprends ta production (texte, schéma, tableau…) et relis-la point par point, en t'appuyant sur les critères de réussite. " +
      "Coche seulement ce qui est vraiment dans ta production : personne d'autre ne voit tes réponses, c'est pour t'aider à t'améliorer."));
  const cases = [];
  for (const g of s.auto) {
    if (g.production) page.append(el("h3", {class: "production"}, g.production));
    for (const c of g.criteres) {
      const carte = el("div", {class: "carte"}, c.nom ? el("div", {class: "critere"}, c.nom) : null);
      for (const p of c.points) {
        const cb = el("input", {type: "checkbox"});
        const lab = el("label", {class: "prop"}, cb, el("span", {}, p));
        cases.push({g, c, p, cb, lab});
        carte.append(lab);
      }
      page.append(carte);
    }
  }
  const voir = el("button", {class: "bouton principal", onclick: () => bilanAuto(s, cases, voir)}, "Voir mon bilan");
  page.append(el("div", {class: "boutons"}, voir));
  window.scrollTo(0, 0);
}

function bilanAuto(s, cases, voir) {
  const bilan = el("div", {class: "carte"}, el("div", {class: "critere"}, "Mon bilan"));
  const aRevoir = [];
  for (const g of s.auto) {
    for (const c of g.criteres) {
      const lignes = cases.filter(x => x.g === g && x.c === c), faits = lignes.filter(x => x.cb.checked).length;
      const etat = faits === lignes.length ? ["juste", "✔ atteint"] : faits ? ["partiel", "en partie"] : ["faux", "✘ pas encore"];
      bilan.append(el("div", {class: "bilan-ligne"}, el("span", {}, (g.production ? g.production + " — " : "") + (c.nom || "")),
        el("span", {class: "statut " + etat[0]}, etat[1] + " (" + faits + "/" + lignes.length + ")")));
    }
  }
  cases.forEach(x => {
    x.lab.classList.toggle("a-revoir", !x.cb.checked);
    if (!x.cb.checked) aRevoir.push(x);
  });
  const criteres = {};
  for (const x of cases) {
    const c = criteres[critereCommun(x.c.nom)] = criteres[critereCommun(x.c.nom)] || {faits: 0, total: 0};
    c.total++; if (x.cb.checked) c.faits++;
  }
  const prog = lireProgression();
  prog.auto[s.id] = {date: aujourdhui(), criteres, manques: aRevoir.map(x => x.p)};
  ecrireProgression(prog);
  if (aRevoir.length) {
    const liste = el("ul", {class: "revoir"});
    aRevoir.forEach(x => liste.append(el("li", {}, x.p)));
    bilan.append(el("div", {class: "explication"}, el("b", {}, "À retravailler avant la prochaine séance :"), liste,
      el("div", {class: "consigne"}, "Complète ou corrige ta production sur ces points (ils sont surlignés en orange plus bas), en t'aidant de la correction.")));
  } else {
    bilan.append(el("div", {class: "explication"}, el("b", {}, "Tous les critères sont atteints : bravo ! "), "Garde ta production comme modèle pour réviser."));
  }
  bilan.append(el("div", {class: "boutons"}, el("button", {class: "bouton", onclick: () => { location.hash = "progression"; }}, "Voir ma progression")));
  const ancien = page.querySelector(".bilan-auto");
  if (ancien) ancien.remove();
  bilan.classList.add("bilan-auto");
  page.insertBefore(bilan, page.querySelector("h3.production, .carte"));
  voir.textContent = "Mettre à jour mon bilan";
  bilan.scrollIntoView({behavior: "smooth"});
}

function seancesDansLOrdre() { return DONNEES.niveaux.flatMap(n => n.seances); }

function progression() {
  const p = lireProgression(), seances = seancesDansLOrdre();
  nav.replaceChildren(el("a", {href: "#"}, "← Accueil"));
  page.replaceChildren(el("h2", {}, "Ma progression"),
    el("p", {class: "consigne"}, "Tes résultats sont enregistrés seulement sur cet appareil, dans ce navigateur. Pour ne pas les perdre (changement de téléphone, données effacées…), pense à les sauvegarder dans un fichier en bas de cette page."));
  const faites = seances.filter(s => p.auto[s.id]);

  // Critères de réussite, activité après activité
  const crit = el("div", {class: "carte"}, el("div", {class: "critere"}, "Mes critères de réussite"));
  if (!faites.length) crit.append(el("p", {class: "consigne"}, "Pas encore d'autoévaluation : après le QCM d'une séance, fais l'étape 2 « Vérifier ma production »."));
  else {
    crit.append(el("div", {class: "legende"}, el("span", {}, el("span", {class: "carre juste"}), "atteint"),
      el("span", {}, el("span", {class: "carre partiel"}), "en partie"), el("span", {}, el("span", {class: "carre faux"}), "pas encore")));
    const noms = CRITERES.concat([...new Set(faites.flatMap(s => Object.keys(p.auto[s.id].criteres)))].filter(n => !CRITERES.includes(n)));
    for (const nom of noms) {
      const suite = faites.filter(s => p.auto[s.id].criteres[nom]).map(s => ({s, r: p.auto[s.id].criteres[nom]}));
      if (!suite.length) continue;
      const taux = suite.map(x => x.r.faits / x.r.total), atteints = taux.filter(t => t === 1).length;
      const carres = el("div", {class: "carres"});
      suite.forEach((x, k) => carres.append(el("span", {class: "carre " + (taux[k] === 1 ? "juste" : taux[k] > 0 ? "partiel" : "faux"),
        title: x.s.titre + " : " + x.r.faits + "/" + x.r.total})));
      let tendance = null;
      if (suite.length >= 4) {
        const m = Math.floor(suite.length / 2), moy = t => t.reduce((a, b) => a + b, 0) / t.length;
        const ecart = moy(taux.slice(m)) - moy(taux.slice(0, m));
        tendance = ecart > 0.1 ? ["juste", "↗ en progrès"] : ecart < -0.1 ? ["faux", "↘ à surveiller"] : ["", "→ stable"];
      }
      crit.append(el("div", {class: "bilan-ligne"}, el("div", {}, el("b", {}, nom), carres,
          el("small", {class: "consigne"}, "atteint dans " + atteints + " activité" + (atteints > 1 ? "s" : "") + " sur " + suite.length)),
        tendance ? el("span", {class: "tendance statut " + tendance[0]}, tendance[1]) : null));
    }
  }
  page.append(crit);

  // Points oubliés dans plusieurs activités
  const compte = {};
  faites.forEach(s => (p.auto[s.id].manques || []).forEach(t => { compte[t] = (compte[t] || 0) + 1; }));
  const souvent = Object.entries(compte).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 6);
  if (souvent.length) {
    const liste = el("ul", {class: "revoir"});
    souvent.forEach(([t, n]) => liste.append(el("li", {}, t, el("small", {class: "consigne"}, "  (dans " + n + " activités)"))));
    page.append(el("div", {class: "carte"}, el("div", {class: "critere"}, "Ce que j'oublie souvent"),
      el("p", {class: "consigne"}, "Vérifie ces points en priorité dans ta prochaine production."), liste));
  }

  // QCM
  const qcm = seances.filter(s => p.qcm[s.id]);
  const cq = el("div", {class: "carte"}, el("div", {class: "critere"}, "Mes QCM"));
  if (!qcm.length) cq.append(el("p", {class: "consigne"}, "Pas encore de QCM fait sur cet appareil."));
  qcm.forEach(s => {
    const q = p.qcm[s.id], d = q.dernier || q.meilleur, b = q.meilleur || d;
    cq.append(el("div", {class: "bilan-ligne"}, el("span", {}, s.titre),
      el("span", {class: "record"}, "dernier " + d.justes + "/" + d.total + " · meilleur " + b.justes + "/" + b.total)));
  });
  page.append(cq);

  // Sauvegarde
  const fichier = el("input", {type: "file", accept: ".json,application/json", style: "display:none", onchange: () => reprendre(fichier)});
  page.append(el("div", {class: "carte"}, el("div", {class: "critere"}, "Sauvegarder ma progression"),
    el("p", {class: "consigne"}, "Le fichier enregistré contient tes résultats. Garde-le (par exemple dans ton espace de l'ENT) : sur un autre appareil, « Reprendre » permet de retrouver ta progression."),
    el("div", {class: "boutons"},
      el("button", {class: "bouton principal", onclick: sauvegarder}, "Enregistrer dans un fichier"),
      el("button", {class: "bouton", onclick: () => fichier.click()}, "Reprendre une sauvegarde"),
      el("button", {class: "bouton danger", onclick: () => { if (confirm("Effacer toute ta progression sur cet appareil ?")) { ecrireProgression({}); progression(); } }}, "Tout effacer")),
    fichier));
  window.scrollTo(0, 0);
}

function sauvegarder() {
  const texte = JSON.stringify({site: DONNEES.titre, version: 1, date: aujourdhui(), progression: lireProgression()});
  const a = el("a", {href: URL.createObjectURL(new Blob([texte], {type: "application/json"})), download: "ma-progression-svt-" + aujourdhui() + ".json"});
  document.body.append(a); a.click(); a.remove();
}

function reprendre(input) {
  const f = input.files[0];
  if (!f) return;
  f.text().then(texte => {
    const lu = JSON.parse(texte).progression;
    if (!lu || typeof lu !== "object") throw new Error();
    const p = lireProgression();
    for (const [id, q] of Object.entries(lu.qcm || {})) {        // meilleur des deux, dernier le plus récent
      const a = p.qcm[id] || {}, ratio = r => r ? r.justes / r.total : -1;
      p.qcm[id] = {meilleur: ratio(q.meilleur) > ratio(a.meilleur) ? q.meilleur : a.meilleur,
                   dernier: !a.dernier || (q.dernier && q.dernier.date > a.dernier.date) ? q.dernier : a.dernier};
    }
    for (const [id, r] of Object.entries(lu.auto || {})) if (!p.auto[id] || r.date >= p.auto[id].date) p.auto[id] = r;
    ecrireProgression(p);
    alert("Progression reprise.");
    progression();
  }).catch(() => alert("Ce fichier n'est pas une sauvegarde de progression."));
  input.value = "";
}

function router() {
  if (location.hash === "#progression") { progression(); return; }
  const m = location.hash.match(/^#([qa])-([0-9a-f]+)$/);
  const s = m && seancesDansLOrdre().find(x => x.code === m[2]);
  if (!s) { accueil(); return; }
  if (m[1] === "a" || !s.questions.length) autoeval(s.id); else quiz(s.id);
}
window.addEventListener("hashchange", router);
router();
</script>
</body>
