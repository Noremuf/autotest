<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement SVT</title>
<style>
:root { --fond:#eef2f7; --carte:#fff; --texte:#16202b; --doux:#5a6777; --bord:#d3dae3; --accent:#2456d3;
        --accent-doux:#dbe6ff; --ok:#1f8a4c; --ok-doux:#e2f5ea; --err:#c93838; --err-doux:#fbe7e7;
        --att:#b86e00; --att-doux:#fdf0dc; }
* { box-sizing: border-box; }
body { margin:0; background:var(--fond); color:var(--texte); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
header { background:#1e2a3a; color:#fff; padding:14px 16px; }
header h1 { margin:0; font-size:1.2rem; }
header a { color:#9fc0ff; text-decoration:none; font-size:.95rem; }
main { max-width:760px; margin:0 auto; padding:16px; }
h2 { font-size:1.1rem; margin:22px 0 10px; color:var(--accent); }
.seance { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
          background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:12px 14px; margin:8px 0;
          font:inherit; color:inherit; cursor:pointer; }
.seance:hover { border-color:var(--accent); background:var(--accent-doux); }
.seance small { color:var(--doux); white-space:nowrap; }
.record { font-size:.8rem; padding:2px 8px; border-radius:20px; background:var(--ok-doux); color:var(--ok); white-space:nowrap; }
.carte { background:var(--carte); border:1px solid var(--bord); border-radius:10px; padding:14px; margin:12px 0; }
.enonce { font-weight:600; margin-bottom:10px; }
.enonce .num { color:var(--accent); margin-right:6px; }
.carte img { max-width:100%; border-radius:6px; margin:6px 0 10px; }
label.prop { display:flex; gap:10px; align-items:flex-start; padding:9px 10px; margin:5px 0; border:1px solid var(--bord);
             border-radius:8px; cursor:pointer; }
label.prop:hover { background:var(--accent-doux); }
label.prop input { width:20px; height:20px; margin:1px 0 0; flex:none; accent-color:var(--accent); }
.lettre { font-weight:700; color:var(--doux); }
.corrige label.prop { cursor:default; }
.corrige label.prop:hover { background:none; }
.prop.bonne-cochee { background:var(--ok-doux)!important; border-color:var(--ok); }
.prop.oubliee { border:2px dashed var(--ok); }
.prop.fausse-cochee { background:var(--err-doux)!important; border-color:var(--err); }
.verdict { font-size:.8rem; margin-left:auto; padding-left:8px; white-space:nowrap; font-weight:600; }
.bonne-cochee .verdict { color:var(--ok); } .oubliee .verdict { color:var(--ok); } .fausse-cochee .verdict { color:var(--err); }
.statut { display:inline-block; font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:20px; margin-bottom:8px; }
.statut.juste { background:var(--ok-doux); color:var(--ok); }
.statut.partiel { background:var(--att-doux); color:var(--att); }
.statut.faux, .statut.vide { background:var(--err-doux); color:var(--err); }
.explication { margin-top:10px; padding:10px 12px; border-left:4px solid var(--accent); background:#f4f7fc; border-radius:0 8px 8px 0; }
.consigne { color:var(--doux); }
.score { text-align:center; font-size:1.15rem; }
.score b { font-size:1.6rem; color:var(--accent); }
.boutons { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
button.bouton { font:inherit; padding:11px 18px; border-radius:8px; border:1px solid var(--bord); background:var(--carte); cursor:pointer; }
button.bouton:hover { border-color:var(--accent); }
button.principal { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.principal:hover { background:#1a3f9e; }
.pied { color:var(--doux); font-size:.8rem; text-align:center; margin:30px 0 10px; }
.etapes { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 8px; }
.etape { font:inherit; font-size:.9rem; padding:6px 12px; border-radius:20px; border:1px solid var(--bord); background:var(--carte); color:var(--doux); cursor:pointer; }
.etape.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; cursor:default; }
h3.production { font-size:1rem; margin:20px 0 6px; }
.critere { font-weight:700; color:var(--accent); margin-bottom:6px; }
.a-revoir { border-color:var(--att)!important; background:var(--att-doux)!important; }
.bilan-ligne { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--bord); }
.bilan-ligne:last-child { border-bottom:none; }
ul.revoir { margin:6px 0 0; padding-left:20px; }
ul.revoir li { margin:4px 0; }
.carres { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.carre { width:22px; height:22px; border-radius:5px; display:inline-block; }
.carre.juste { background:var(--ok); } .carre.partiel { background:#e9a23b; } .carre.faux { background:var(--err); }
.legende { display:flex; flex-wrap:wrap; gap:14px; font-size:.85rem; color:var(--doux); }
.legende .carre { width:14px; height:14px; vertical-align:-2px; margin-right:4px; }
.tendance { font-size:.85rem; font-weight:600; white-space:nowrap; align-self:center; }
.lien-progression { width:100%; text-align:center; font-weight:600; color:var(--accent); }
button.danger { color:var(--err); }
</style>
</head>

<script>
const DONNEES = {"titre": "Entraînement SVT", "maj": "17/10/2026", "niveaux": [{"nom": "Terminale", "seances": [{"id": 52, "code": "359a8fda8d", "titre": "Géologie – Activité 1a : La datation relative (Flamanville)", "questions": [{"t": "Pour établir la chronologie relative d'une série de roches, on peut utiliser :", "p": ["le principe de superposition.", "le principe de recoupement.", "la mesure de la désintégration d'un isotope radioactif.", "la composition chimique des roches."], "b": "AB", "j": "La chronologie relative repose sur des principes (superposition, recoupement, inclusion, continuité, identité paléontologique). C : c'est de la datation absolue. D : la composition chimique ne renseigne pas sur l'ordre des événements.", "img": "", "fixes": 0}, {"t": "D'après la coupe ci-jointe :", "p": ["Le granite G est plus ancien que la faille F.", "Le granite G est postérieur au dépôt de S3.", "La faille F est l'événement le plus récent de la coupe.", "La faille F a fonctionné après le dépôt de S4 et avant le dépôt de S5."], "b": "ABD", "j": "B : G recoupe S3 (recoupement). A : S4 contient des galets de G (inclusion), donc G est antérieur à S4 ; F décale S4 (recoupement), donc F est postérieure à S4 : G est plus ancien que F. C : S5 s'est déposée après le jeu de la faille, qu'elle recouvre sans être décalée. D : F décale S4 mais pas S5.", "img": "3fc3711a5da9.png", "fixes": 0}, {"t": "Dans une série sédimentaire qui n'a pas été renversée, le principe de superposition permet d'affirmer que :", "p": ["une couche est plus récente que celle qui la recouvre.", "une couche est plus ancienne que celle qui la recouvre.", "toutes les couches d'une même série ont le même âge.", "la couche la plus épaisse est la plus ancienne."], "b": "B", "j": "Les sédiments se déposent les uns sur les autres : une couche est plus ancienne que celle qui la recouvre (et plus récente que celle qu'elle recouvre). D : l'épaisseur ne renseigne pas sur l'âge.", "img": "", "fixes": 0}, {"t": "Le principe de superposition ne peut pas être appliqué directement :", "p": ["à des couches sédimentaires horizontales.", "à des coulées de lave empilées les unes sur les autres.", "à des strates qui contiennent des fossiles.", "à une série sédimentaire renversée par un plissement intense."], "b": "D", "j": "Si la série a été retournée par la tectonique, la couche du dessus n'est plus la plus récente : il faut d'abord retrouver la polarité d'origine de la série. A, B, C : le principe s'applique sans difficulté.", "img": "", "fixes": 0}, {"t": "Un filon de basalte traverse des couches de calcaire et de grès. L'ensemble (couches et filon) est décalé par une faille.", "p": ["Le filon est plus ancien que les couches qu'il traverse.", "Le filon est plus récent que le calcaire et le grès.", "La faille est plus récente que le filon.", "La faille est l'événement le plus ancien."], "b": "BC", "j": "Principe de recoupement : une structure est plus récente que ce qu'elle recoupe. Le filon recoupe les couches (B), la faille décale le filon et les couches (C). Ordre : dépôt des couches, mise en place du filon, jeu de la faille.", "img": "", "fixes": 0}, {"t": "Un granite contient des enclaves (fragments) de gneiss. Un conglomérat situé au-dessus du granite contient des galets de ce granite.", "p": ["Le gneiss est plus ancien que le granite.", "Le conglomérat est plus ancien que le granite.", "Ces relations donnent l'âge du granite en millions d'années.", "Le granite est plus ancien que le conglomérat."], "b": "AD", "j": "Principe d'inclusion : un élément inclus dans une roche est plus ancien que cette roche. Le gneiss est inclus dans le granite (A) ; les galets de granite sont inclus dans le conglomérat (D). C : la chronologie relative ne donne pas d'âge chiffré.", "img": "", "fixes": 0}, {"t": "Autour d'un massif de granite, les roches sédimentaires sont transformées sur quelques centaines de mètres (auréole de métamorphisme de contact).", "p": ["Les roches sédimentaires se sont déposées sur le granite déjà refroidi.", "La mise en place du granite est postérieure au dépôt des roches sédimentaires.", "Le métamorphisme de contact est postérieur au dépôt des roches sédimentaires.", "Le principe utilisé ici est le principe de superposition."], "b": "BC", "j": "Le magma granitique a « cuit » les roches déjà en place : le granite et le métamorphisme de contact sont postérieurs aux roches qu'ils affectent (principe de recoupement). A : dans ce cas, les sédiments ne seraient pas métamorphisés.", "img": "", "fixes": 0}, {"t": "Les principes de la chronologie relative s'appliquent :", "p": ["uniquement aux roches qui contiennent des fossiles.", "uniquement aux roches sédimentaires.", "à l'échelle d'une lame mince observée au microscope.", "à l'échelle d'un paysage ou d'un affleurement."], "b": "CD", "j": "Les relations géométriques (superposition, recoupement, inclusion) s'observent à toutes les échelles, du paysage à la lame mince, et concernent aussi les roches magmatiques et métamorphiques, les failles, les plis.", "img": "", "fixes": 0}, {"t": "Dans une lame mince de roche magmatique, un petit cristal de pyroxène est entièrement inclus dans un grand cristal de feldspath.", "p": ["Le feldspath a cristallisé avant le pyroxène.", "Les deux minéraux ont obligatoirement cristallisé en même temps.", "On ne peut rien dire sans datation absolue.", "Le pyroxène a cristallisé avant le feldspath."], "b": "D", "j": "Principe d'inclusion appliqué à l'échelle microscopique : le minéral inclus existait avant le minéral qui l'englobe.", "img": "", "fixes": 0}, {"t": "La chronologie relative permet :", "p": ["d'attribuer un âge chiffré à une roche.", "d'ordonner des événements géologiques les uns par rapport aux autres.", "de mesurer la durée exacte d'un dépôt sédimentaire.", "de reconstituer la succession des événements qui ont affecté une région."], "b": "BD", "j": "La chronologie relative ordonne (plus ancien / plus récent) sans donner d'âge chiffré ni de durée : c'est la datation absolue qui fournit les âges.", "img": "", "fixes": 0}], "auto": [{"production": "Profil (transect Google Earth)", "criteres": [{"nom": "Conformité", "points": ["Mon profil a un titre, la nature et l'âge des roches notés en surface, et une interprétation en profondeur légendée."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Chaque étape est justifiée par un document ou une observation du fichier kmz, avec le principe utilisé.", "Mes idées s'enchaînent avec des connecteurs (d'abord, puis, ensuite, donc)."]}, {"nom": "Complétude", "points": ["J'ai cité et appliqué les trois principes : superposition, recoupement, inclusion.", "Ordre des événements : dépôts (Cambrien à Dévonien), plissement, intrusion du pluton et métamorphisme de contact, érosion."]}, {"nom": "Exactitude", "points": ["Schistes et grès (Ordovicien), calcaires (Dévonien) : plus anciens que la granodiorite qui les a métamorphisés (recoupement).", "Les enclaves de cornéennes sont plus anciennes que la granodiorite qui les contient (inclusion).", "Le plissement des couches dévoniennes est postérieur à leur dépôt ; le métamorphisme se fait à l'état solide."]}, {"nom": "Conformité", "points": ["Introduction, un paragraphe par étape, conclusion ; vocabulaire précis (strate, intrusion, pluton, métamorphisme)."]}]}]}, {"id": 53, "code": "983eb6c988", "titre": "Géologie – Activité 1b : Fossiles stratigraphiques", "questions": [{"t": "Les ammonites sont souvent utilisées comme fossiles stratigraphiques car :", "p": ["de nombreuses espèces ont eu une durée d'existence courte.", "leur coquille permet une datation absolue.", "elles occupaient les mers d'une grande partie du globe.", "elles étaient abondantes."], "b": "ACD", "j": "Un bon fossile stratigraphique réunit trois critères : courte durée d'existence, abondance, large répartition géographique. B : un fossile ne donne qu'un âge relatif.", "img": "", "fixes": 0}, {"t": "Le principe de continuité indique que :", "p": ["une même couche sédimentaire a le même âge sur toute son étendue.", "une couche est plus récente que celle qu'elle recouvre.", "une couche garde partout la même épaisseur.", "deux roches de même couleur ont le même âge."], "b": "A", "j": "Une couche, définie par ses limites inférieure et supérieure, a le même âge en tout point. B : c'est le principe de superposition. C et D : ni l'épaisseur ni la couleur ne sont des critères d'âge.", "img": "", "fixes": 0}, {"t": "Parmi ces espèces fossiles, laquelle ferait le meilleur fossile stratigraphique ?", "p": ["Une espèce abondante, présente sur tous les continents, qui a existé pendant 300 Ma.", "Une espèce rare, connue dans une seule région, qui a existé pendant 2 Ma.", "Une espèce abondante, présente sur tous les continents, qui a existé pendant 2 Ma.", "Une espèce abondante, connue dans un seul lac, qui a existé pendant 300 Ma."], "b": "C", "j": "Un bon fossile stratigraphique réunit trois qualités : courte durée d'existence (faible extension verticale), grand nombre d'individus, large répartition géographique. A : une durée de 300 Ma ne permet pas de dater précisément.", "img": "", "fixes": 0}, {"t": "On trouve des trilobites dans une couche X et des ammonites caractéristiques du Jurassique dans une couche Y. Le contact entre ces deux couches n'est pas visible.", "p": ["La couche Y s'est déposée au Cénozoïque.", "Les deux couches ont le même âge.", "La couche X est plus ancienne que la couche Y.", "La couche X s'est déposée au Paléozoïque (ère primaire)."], "b": "CD", "j": "Les trilobites sont caractéristiques du Paléozoïque, les ammonites datent ici le Jurassique (Mésozoïque) : X est donc plus ancienne que Y, même sans voir leur contact. C'est l'intérêt des fossiles stratigraphiques.", "img": "", "fixes": 0}, {"t": "Deux couches situées dans des régions très éloignées contiennent la même association de fossiles stratigraphiques. On peut en déduire que ces deux couches :", "p": ["ont le même âge.", "se sont déposées à la même profondeur.", "n'ont aucun lien entre elles.", "sont formées exactement de la même roche."], "b": "A", "j": "Deux couches contenant les mêmes fossiles stratigraphiques ont le même âge (principe d'identité paléontologique). C'est ce qui permet de corréler des séries éloignées et de construire une échelle valable à l'échelle mondiale.", "img": "", "fixes": 0}], "auto": [{"production": "Fossiles stratigraphiques (consignes 1 à 3)", "criteres": [{"nom": "Exactitude", "points": ["Les ammonites sont de bons fossiles stratigraphiques : abondantes, large répartition, espèces de courte durée.", "J'ai ordonné l'apparition des espèces avec le principe de superposition.", "Même espèce dans deux formations éloignées (Lyme Regis, Robin Hood's Bay) : ces formations ont le même âge."]}, {"nom": "Complétude", "points": ["Mon texte explique comment les fossiles stratigraphiques datent les couches les unes par rapport aux autres."]}]}, {"production": "Entraînement ECE : Crétacé ou Paléocène ?", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Ma stratégie dit ce que je fais (chercher des microfossiles), comment (loupe, planche) et ce que j'attends."]}, {"nom": "Exactitude", "points": ["Globotruncanidés et hétérohélicidés : Crétacé supérieur ; globigérinidés seuls : Paléocène (limite K/T vers 66 Ma)."]}, {"nom": "Conformité", "points": ["Résultats présentés sous une forme adaptée (dessin légendé ou tableau titré), puis conclusion qui répond au problème.", "Phrases claires, vocabulaire précis (fossile stratigraphique, formation, identité paléontologique)."]}]}]}, {"id": 54, "code": "4896c610a8", "titre": "Géologie – Activité 1c : Le découpage des temps géologiques", "questions": [{"t": "Quelle liste classe les divisions de l'échelle des temps géologiques de la plus longue à la plus courte ?", "p": ["ère > éon > période > étage > époque", "éon > période > ère > époque > étage", "éon > ère > période > époque > étage", "période > ère > éon > époque > étage"], "b": "C", "j": "Hiérarchie de l'échelle chronostratigraphique : éon > ère > période > époque > étage.", "img": "", "fixes": 0}, {"t": "La construction de l'échelle chronostratigraphique :", "p": ["Un stratotype est le fossile caractéristique d'un étage.", "L'échelle a été établie, dans ses grandes lignes, bien avant que l'on connaisse la durée des intervalles de temps.", "Les coupures de l'échelle ont été placées grâce à la radiochronologie.", "Les grandes coupures de l'échelle ont été placées là où des groupes fossiles apparaissent ou disparaissent."], "b": "BD", "j": "C : la radiochronologie a seulement permis, ensuite, d'attribuer des âges chiffrés aux coupures définies par les fossiles. A : un stratotype est un affleurement de référence qui sert d'étalon pour définir un étage.", "img": "", "fixes": 0}, {"t": "Un stratotype :", "p": ["est un fossile caractéristique d'une période.", "est une méthode de datation absolue.", "est un affleurement de référence qui sert d'étalon pour définir un étage.", "donne souvent son nom à l'étage (ex. : Aquitanien, d'après l'Aquitaine)."], "b": "CD", "j": "Chaque étage, unité de base de l'échelle chronostratigraphique, est défini par un affleurement de référence, le stratotype, dont le lieu donne souvent son nom à l'étage.", "img": "", "fixes": 0}, {"t": "Nous vivons actuellement :", "p": ["dans l'éon Phanérozoïque.", "dans l'ère Mésozoïque.", "dans l'ère Cénozoïque.", "dans la période du Quaternaire."], "b": "ACD", "j": "Éon Phanérozoïque, ère Cénozoïque, période Quaternaire, époque Holocène. B : le Mésozoïque (ère secondaire) s'est achevé il y a environ 65 Ma.", "img": "", "fixes": 0}, {"t": "De la plus ancienne à la plus récente, les trois ères du Phanérozoïque sont :", "p": ["Cénozoïque, Mésozoïque, Paléozoïque.", "Mésozoïque, Paléozoïque, Cénozoïque.", "Paléozoïque, Cénozoïque, Mésozoïque.", "Paléozoïque, Mésozoïque, Cénozoïque."], "b": "D", "j": "Paléozoïque (ère primaire), puis Mésozoïque (ère secondaire), puis Cénozoïque (qui regroupe les anciennes ères tertiaire et quaternaire).", "img": "", "fixes": 0}], "auto": [{"production": "Ammonites de Vrines (consignes 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["J'ai situé les trois ammonites dans les horizons de la carrière de Vrines.", "J'ai justifié une coupure entre deux horizons par l'apparition ou la disparition d'espèces."]}, {"nom": "Complétude", "points": ["J'ai expliqué l'intérêt d'une association de fossiles : plus précise qu'une espèce seule."]}]}, {"production": "Texte bilan : construire l'échelle des temps", "criteres": [{"nom": "Complétude", "points": ["Les coupures de l'échelle correspondent à des changements de faune (apparitions, extinctions, crises biologiques).", "Divisions emboîtées : éon > ère > période > époque > étage, chaque étage étant défini par un stratotype.", "Les âges chiffrés ont été ajoutés ensuite, grâce à la datation absolue."]}, {"nom": "Cohérence et pertinence", "points": ["Je réponds à la question posée (les moyens utilisés), sans recopier toute l'échelle."]}, {"nom": "Conformité", "points": ["Texte court mais rédigé et structuré, vocabulaire précis."]}]}]}, {"id": 55, "code": "b29bbee8d9", "titre": "Géologie – Activité 2 : La datation absolue", "questions": [{"t": "Une couche sédimentaire est comprise entre deux coulées de basalte : la coulée située en dessous est datée de 52 Ma, celle située au-dessus de 48 Ma.", "p": ["La couche sédimentaire est plus ancienne que 52 Ma.", "La couche sédimentaire est plus récente que 48 Ma.", "La couche sédimentaire s'est déposée entre 52 et 48 Ma.", "Cet encadrement associe la chronologie relative et la datation absolue."], "b": "CD", "j": "C et D : la superposition situe la couche entre les deux coulées, dont les âges sont obtenus par radiochronologie : la couche est plus récente que 52 Ma et plus ancienne que 48 Ma. A et B : contraires à la superposition.", "img": "", "fixes": 0}, {"t": "Un isotope père a une demi-vie de 700 Ma. Dans un minéral resté fermé, il ne reste que 12,5 % de la quantité initiale de cet isotope.", "p": ["Le système s'est fermé il y a 2,1 Ga.", "Trois demi-vies se sont écoulées depuis la fermeture du système.", "Le système s'est fermé il y a 1,4 Ga.", "Dans 700 Ma, cet isotope aura totalement disparu du minéral."], "b": "AB", "j": "100 % → 50 % → 25 % → 12,5 % : 3 demi-vies, soit 3 × 700 Ma = 2,1 Ga. C : 2 demi-vies (25 % restants). D : il en restera 6,25 % ; la quantité est divisée par deux à chaque demi-vie.", "img": "", "fixes": 0}, {"t": "On dispose de deux chronomètres : l'un de demi-vie 5 700 ans environ, l'autre de demi-vie 49 Ga environ. On veut dater un granite d'environ 2 Ga et un sédiment lacustre d'environ 20 000 ans.", "p": ["Le chronomètre de demi-vie 5 700 ans convient pour le granite.", "Le chronomètre de demi-vie 49 Ga convient pour le sédiment.", "Le chronomètre de demi-vie 5 700 ans convient pour le sédiment.", "Le chronomètre de demi-vie 49 Ga convient pour le granite."], "b": "CD", "j": "La demi-vie doit être adaptée à l'âge à mesurer. A : après 2 Ga, il ne resterait plus d'isotope père mesurable. B : en 20 000 ans, la quantité d'isotope fils formé serait trop faible pour être mesurée.", "img": "", "fixes": 0}, {"t": "Deux granites X et Y sont datés par la méthode ^{87}Rb/^{87}Sr. La droite isochrone de X a une pente plus forte que celle de Y.", "p": ["Les points d'une même droite correspondent à différents minéraux d'un même granite.", "Au moment de la fermeture du système, tous les minéraux d'un granite avaient le même rapport ^{87}Sr/^{86}Sr.", "Plus un minéral est riche en ^{87}Rb, plus son rapport ^{87}Sr/^{86}Sr augmente lentement au cours du temps.", "Le granite X est plus ancien que le granite Y."], "b": "ABD", "j": "D : la pente augmente avec le temps, elle permet de calculer l'âge. B : à la fermeture, la droite est horizontale. C : inversion, plus un minéral contient de ^{87}Rb, plus il produit de ^{87}Sr, donc plus son rapport augmente vite.", "img": "", "fixes": 0}, {"t": "Un basalte daté par la méthode ^{40}K/^{40}Ar donne un âge de 10 Ma. On découvre qu'il a ensuite été réchauffé et a perdu une partie de son argon.", "p": ["La méthode suppose que la roche ne contenait pas d'argon 40 au moment de la fermeture du système.", "L'âge réel de cristallisation du basalte est supérieur à 10 Ma.", "L'argon 40 mesuré provient de la désintégration du potassium 40.", "L'âge réel de cristallisation du basalte est inférieur à 10 Ma."], "b": "ABC", "j": "Une perte d'argon (isotope fils) diminue le rapport ^{40}Ar/^{40}K : l'âge mesuré est trop jeune, l'âge réel est donc supérieur à 10 Ma. A et C : hypothèses de la méthode (argon gazeux absent à la fermeture, donc entièrement radiogénique).", "img": "", "fixes": 0}, {"t": "La datation absolue (radiochronologie) repose sur :", "p": ["la désintégration d'isotopes radioactifs, à une vitesse connue pour chaque isotope.", "l'ordre de superposition des couches.", "la vitesse de sédimentation, supposée constante.", "une décroissance exponentielle du nombre d'isotopes pères au cours du temps."], "b": "AD", "j": "Un isotope père instable se désintègre en isotope fils selon une loi de décroissance exponentielle : N(t) = N_{0}·e^{-λt}. B : c'est de la chronologie relative.", "img": "", "fixes": 0}, {"t": "La demi-vie (ou période) T d'un isotope radioactif est :", "p": ["la durée nécessaire à la fermeture du système.", "la moitié de l'âge de la roche étudiée.", "la durée au bout de laquelle tous les noyaux pères se sont désintégrés.", "la durée au bout de laquelle la moitié des noyaux pères présents au départ se sont désintégrés."], "b": "D", "j": "Après une demi-vie, il reste 50 % des noyaux pères ; après deux demi-vies, 25 % ; etc. La demi-vie est une caractéristique de l'isotope, indépendante de la roche étudiée.", "img": "", "fixes": 0}, {"t": "La demi-vie T et la constante de désintégration λ sont liées par la relation T = ln2 / λ.", "p": ["Chaque isotope radioactif possède sa propre valeur de λ.", "Plus λ est grande, plus la demi-vie est courte.", "La constante λ dépend de la température et de la pression subies par la roche.", "La demi-vie d'un isotope augmente quand la roche vieillit."], "b": "AB", "j": "T et λ sont inversement proportionnelles et caractéristiques de chaque isotope. Elles ne dépendent ni des conditions physiques ni du temps écoulé : c'est ce qui fait de la radioactivité un chronomètre fiable.", "img": "", "fixes": 0}, {"t": "Un isotope père a une demi-vie de 1,25 Ga (cas du ^{40}K). Dans un minéral resté fermé, il reste 25 % de la quantité initiale d'isotope père. L'âge du minéral est de :", "p": ["0,625 Ga.", "1,25 Ga.", "2,5 Ga.", "5 Ga."], "b": "C", "j": "100 % → 50 % (une demi-vie) → 25 % (deux demi-vies) : 2 × 1,25 Ga = 2,5 Ga.", "img": "", "fixes": 0}, {"t": "Après une durée égale à 4 demi-vies, la proportion d'isotope père restante est de :", "p": ["0 %.", "6,25 %.", "12,5 %.", "25 %."], "b": "B", "j": "La quantité est divisée par deux à chaque demi-vie : 50 %, 25 %, 12,5 %, 6,25 % (soit 1/2^{4} = 1/16). A : la décroissance est exponentielle, la quantité ne s'annule pas.", "img": "", "fixes": 0}, {"t": "Dans la loi de désintégration N(t) = N_{0}·e^{-λt} :", "p": ["N_{0} est le nombre d'isotopes pères au moment de la fermeture du système.", "N(t) est le nombre d'isotopes pères encore présents aujourd'hui.", "t est la température de fermeture du système.", "N(t) augmente au cours du temps."], "b": "AB", "j": "t est la durée écoulée depuis la fermeture du système, c'est-à-dire l'âge recherché. D : N(t) diminue, c'est le nombre d'isotopes fils qui augmente.", "img": "", "fixes": 0}, {"t": "En radiochronologie, l'âge mesuré est celui de la « fermeture du système ».", "p": ["Un système fermé n'échange plus d'isotopes pères ni fils avec son environnement.", "La fermeture du système arrête la désintégration radioactive.", "Pour une roche magmatique, la fermeture correspond à la cristallisation et au refroidissement des minéraux.", "Un réchauffement important de la roche peut rouvrir le système et fausser l'âge."], "b": "ACD", "j": "La fermeture dépend du couple d'isotopes et de la température. B : la désintégration ne s'arrête jamais ; dans un système fermé, les isotopes fils produits restent simplement piégés, ce qui permet le calcul.", "img": "", "fixes": 0}, {"t": "Le couple ^{87}Rb/^{87}Sr :", "p": ["a pour isotope père le ^{87}Rb et pour isotope fils le ^{87}Sr.", "convient pour dater des objets âgés de quelques milliers d'années.", "permet de dater des roches continentales âgées de plusieurs milliards d'années.", "repose sur la désintégration du ^{86}Sr en ^{87}Sr."], "b": "AC", "j": "Le ^{87}Rb se désintègre très lentement en ^{87}Sr : ce chronomètre convient aux roches très anciennes. D : le ^{86}Sr est stable, il sert seulement de référence pour construire la droite isochrone.", "img": "", "fixes": 0}, {"t": "Avec le couple Rb/Sr, on construit une droite isochrone à partir de plusieurs minéraux d'une même roche parce que :", "p": ["les quantités initiales d'isotopes père et fils ne sont pas directement connues.", "la demi-vie du rubidium est inconnue.", "les minéraux d'une même roche ont des âges très différents.", "le rubidium n'est pas radioactif."], "b": "A", "j": "On ne connaît ni N_{0} ni la quantité de ^{87}Sr présente au départ. En rapportant les mesures au ^{86}Sr (stable) pour plusieurs minéraux de même âge, on obtient une droite dont la pente donne l'âge.", "img": "", "fixes": 0}, {"t": "Sur une droite isochrone Rb/Sr (^{87}Sr/^{86}Sr en fonction de ^{87}Rb/^{86}Sr) :", "p": ["la pente de la droite permet de calculer l'âge de la roche.", "plus la roche est ancienne, plus la pente est forte.", "l'ordonnée à l'origine correspond au rapport ^{87}Sr/^{86}Sr initial.", "une roche qui vient de se former donnerait une droite verticale."], "b": "ABC", "j": "La pente vaut e^{λt} - 1 : elle augmente avec le temps. D : à la fermeture, tous les minéraux ont le même rapport ^{87}Sr/^{86}Sr, la droite est horizontale.", "img": "", "fixes": 0}, {"t": "On souhaite dater la mise en place d'un massif de granite. Sur quoi peut-on faire les mesures radiochronologiques ?", "p": ["Sur les minéraux du granite, fermés depuis son refroidissement.", "Sur les fossiles contenus dans le granite.", "Sur les sédiments déposés bien plus tard sur le granite érodé.", "Sur la roche totale et plusieurs de ses minéraux, pour construire une isochrone."], "b": "AD", "j": "On date la fermeture des minéraux du granite lui-même. B : une roche magmatique ne contient pas de fossiles. C : ces sédiments sont postérieurs, ils donnent seulement un âge minimal.", "img": "", "fixes": 0}, {"t": "Chronologie relative et datation absolue :", "p": ["Toutes les roches sédimentaires se datent facilement et directement par radiochronologie.", "Elles sont complémentaires pour reconstituer l'histoire géologique d'une région.", "La datation absolue a rendu la chronologie relative inutile.", "La datation absolue a permis d'attribuer des âges chiffrés aux limites de l'échelle chronostratigraphique."], "b": "BD", "j": "L'échelle chronostratigraphique a d'abord été construite par chronologie relative (fossiles, stratotypes), puis calibrée en millions d'années grâce à la radiochronologie des roches magmatiques associées.", "img": "", "fixes": 0}], "auto": [{"production": "Rb/Sr : conditions et ECE (parties 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["Conditions : plusieurs minéraux d'une même roche, de rapports Rb/Sr différents, système resté fermé ; pas un calcaire.", "Âge t = ln(a + 1) / λ (λ = 1,42 × 10⁻¹¹ an⁻¹) ; plus la pente est forte, plus la roche est ancienne."]}, {"nom": "Conformité", "points": ["Graphique ⁸⁷Sr/⁸⁶Sr = f(⁸⁷Rb/⁸⁶Sr) titré, axes légendés, droite de régression et pente affichées."]}]}, {"production": "K/Ar et choix du radiochronomètre (partie 3)", "criteres": [{"nom": "Exactitude", "points": ["K/Ar : t = (1/λ) ln(⁴⁰Ar/⁴⁰K + 1), λ = 5,81 × 10⁻¹¹ an⁻¹ ; Orrorin encadré entre deux niveaux datés (superposition).", "Âge de la Terre tiré de l'isochrone des chondrites, comparé à 4,54 Ga."]}, {"nom": "Complétude", "points": ["L'âge mesuré est celui de la fermeture du système (cristallisation d'une roche, mort d'un être vivant).", "On choisit une demi-vie adaptée à l'âge cherché (¹⁴C : moins de 50 000 ans ; K/Ar, Rb/Sr, U/Pb : roches anciennes)."]}, {"nom": "Cohérence et pertinence", "points": ["Chaque critère de choix est justifié par un exemple des documents."]}, {"nom": "Conformité", "points": ["Calculs posés avec leurs unités ; texte structuré, vocabulaire précis (père, fils, demi-vie, isochrone)."]}]}]}, {"id": 56, "code": "16b27e41c8", "titre": "Géologie – Activité 3 : Des domaines continentaux d'âges variés", "questions": [{"t": "La carte géologique :", "p": ["La couleur d'un terrain indique principalement son âge.", "Elle représente les sols cultivés et la végétation.", "Elle représente les terrains qui affleurent ou qui ne sont recouverts que d'une faible épaisseur de formations superficielles.", "Une coupe géologique est une reconstitution de la structure en profondeur déduite de la carte."], "b": "ACD", "j": "B : sols et végétation ne sont pas représentés. D : la coupe n'est pas une observation directe, elle est construite à partir des données de la carte.", "img": "", "fixes": 0}, {"t": "Le Massif armoricain :", "p": ["a une altitude élevée car c'est une chaîne de montagnes récente.", "présente aujourd'hui des altitudes faibles alors qu'on y trouve des roches formées en profondeur (granites, gneiss).", "a connu l'orogenèse cadomienne avant l'orogenèse varisque.", "présente des roches d'âges très variés, témoins de plusieurs orogenèses successives."], "b": "BCD", "j": "B : les roches formées en profondeur ont été exhumées par l'érosion d'une ancienne chaîne arasée. C et D : orogenèses icartienne (vers 2 Ga), cadomienne (vers 600 Ma), varisque (vers 350-300 Ma). A : chaîne ancienne, arasée par l'érosion.", "img": "", "fixes": 0}, {"t": "Les chaînes de montagnes actuelles :", "p": ["La chaîne alpine s'est formée au Paléozoïque.", "L'Himalaya résulte d'une collision entre deux masses continentales.", "La cordillère des Andes résulte de la subduction d'une lithosphère océanique sous un continent.", "La ceinture alpine est liée à la fermeture de l'océan Téthys."], "b": "BCD", "j": "A : l'orogenèse alpine a débuté à la fin du Mésozoïque et se poursuit au Cénozoïque.", "img": "", "fixes": 0}, {"t": "Indice(s) d'un raccourcissement (compression) de la croûte continentale :", "p": ["des failles inverses.", "des plis.", "des failles normales.", "des chevauchements."], "b": "ABD", "j": "Failles inverses, chevauchements et plis témoignent d'une compression. C : les failles normales témoignent d'une extension (rift).", "img": "", "fixes": 0}, {"t": "Sur la carte géologique de la France au millionième, on observe que :", "p": ["toutes les roches du territoire ont à peu près le même âge.", "les bassins sédimentaires (Bassin parisien, Bassin aquitain) montrent des terrains plus récents.", "les roches les plus anciennes affleurent dans les massifs anciens (Massif armoricain, Massif central, Vosges...).", "les roches les plus anciennes se trouvent dans les bassins sédimentaires."], "b": "BC", "j": "Les continents sont des assemblages de domaines d'âges variés : socles anciens (roches magmatiques et métamorphiques du Paléozoïque ou plus anciennes) et bassins sédimentaires plus récents qui les recouvrent.", "img": "", "fixes": 0}, {"t": "Une orogenèse :", "p": ["est la formation d'une chaîne de montagnes.", "se produit dans un contexte de divergence des plaques.", "résulte de la convergence de plaques lithosphériques.", "ne laisse aucune trace une fois les reliefs érodés."], "b": "AC", "j": "Les chaînes de montagnes se forment en contexte de convergence (subduction puis collision). D : roches métamorphiques, granites et structures de compression subsistent longtemps après la disparition des reliefs.", "img": "", "fixes": 0}, {"t": "La ceinture orogénique alpine :", "p": ["regroupe des chaînes formées au cours d'une même orogenèse (Alpes, Atlas, Balkans, Caucase, Himalaya...).", "est plus ancienne que la chaîne varisque.", "résulte de l'ouverture de l'océan Atlantique.", "s'est formée de la fin du Mésozoïque au Cénozoïque."], "b": "AD", "j": "Une ceinture orogénique est un alignement de chaînes issues d'une même orogenèse. La ceinture alpine, récente, est liée à la fermeture de la Téthys. B : la chaîne varisque date du Paléozoïque.", "img": "", "fixes": 0}, {"t": "Dans une région aujourd'hui peu élevée, quels indices permettent de reconnaître une ancienne chaîne de montagnes érodée ?", "p": ["Des roches métamorphiques à l'affleurement.", "Des granites formés en profondeur, mis à nu par l'érosion.", "Un fossé d'effondrement bordé de failles normales.", "Des failles inverses et des chevauchements."], "b": "ABD", "j": "Le métamorphisme et les structures de compression témoignent du raccourcissement, les granites des racines de la chaîne exhumées par l'érosion. C : failles normales et fossé d'effondrement témoignent d'une extension (rift).", "img": "", "fixes": 0}, {"t": "Les ceintures orogéniques anciennes sont plus difficiles à repérer que les récentes car :", "p": ["elles se sont formées sans aucune déformation.", "elles n'ont laissé aucune roche.", "l'érosion a fait disparaître leurs reliefs.", "elles sont toutes situées sous les océans."], "b": "C", "j": "L'érosion arase les reliefs en quelques dizaines de millions d'années ; il ne reste que les « racines » de la chaîne (roches formées en profondeur), visibles dans les massifs anciens.", "img": "", "fixes": 0}, {"t": "La chaîne varisque (ou hercynienne) :", "p": ["est aujourd'hui en grande partie érodée.", "s'est formée lors du rassemblement des continents en un supercontinent, la Pangée.", "a laissé des traces dans le Massif armoricain, le Massif central et les Vosges.", "s'est formée au Paléozoïque."], "b": "ABCD", "j": "Chaîne de collision du Paléozoïque, aujourd'hui arasée : on en observe les racines dans les massifs anciens. Sa formation accompagne la réunion des continents en Pangée.", "img": "", "fixes": 0}], "auto": [{"production": "Cartes géologiques (consignes 1 à 4)", "criteres": [{"nom": "Exactitude", "points": ["J'ai relevé l'âge et la nature des roches de quelques ceintures orogéniques (carte mondiale, Tectoglob3D).", "Trois orogenèses en France : icartienne (−2 200 à −1 800 Ma), cadomienne (−660 à −540 Ma), varisque (Paléozoïque)."]}, {"nom": "Complétude", "points": ["Massif armoricain : indices tectoniques (failles, plis), pétrographiques (granites, métamorphiques), sédimentaires.", "J'ai relié des éléments de la carte au scénario du document D (collision de blocs continentaux, sutures)."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Complétude", "points": ["Les continents gardent les traces de plusieurs orogenèses successives, d'âges différents.", "Une chaîne ancienne est érodée : on la reconnaît à ses granites et roches métamorphiques mis à l'affleurement."]}, {"nom": "Cohérence et pertinence", "points": ["Mes captures d'écran sont titrées et utilisées dans le raisonnement."]}, {"nom": "Conformité", "points": ["Texte structuré, phrases claires, vocabulaire précis (orogenèse, suture, chaîne de collision)."]}]}]}, {"id": 57, "code": "10859e42fd", "titre": "Géologie – Activité 4 : À la recherche des océans disparus", "questions": [{"t": "Dans le massif du Chenaillet (Alpes), on observe des basaltes en coussins (pillow-lavas) associés à des gabbros et à des péridotites.", "p": ["Leur présence dans les Alpes témoigne de l'existence passée d'un domaine océanique aujourd'hui refermé.", "Dans la lithosphère océanique d'origine, les péridotites occupaient la position la plus superficielle.", "Cet ensemble est un fragment d'ancienne lithosphère océanique (ophiolite).", "Les péridotites de cet ensemble proviennent du manteau."], "b": "ACD", "j": "B : de bas en haut, péridotites (manteau), gabbros, basaltes en coussins, sédiments : les péridotites sont les plus profondes.", "img": "", "fixes": 0}, {"t": "L'obduction :", "p": ["correspond à l'enfoncement de la lithosphère océanique sous une lithosphère continentale.", "correspond au charriage d'un fragment de lithosphère océanique sur une lithosphère continentale.", "Une ophiolite mise en place par obduction n'est pas passée par une subduction profonde : elle ne présente pas de minéraux de haute pression.", "est le mécanisme principal de disparition de la lithosphère océanique."], "b": "BC", "j": "A : c'est la définition de la subduction. D : la lithosphère océanique disparaît essentiellement par subduction ; l'obduction est un phénomène rare et local.", "img": "", "fixes": 0}, {"t": "Dans les Alpes, on trouve des roches issues d'un même gabbro océanique : un métagabbro à chlorite (faciès schiste vert), un métagabbro à glaucophane (faciès schiste bleu) et un métagabbro à grenat (faciès éclogite).", "p": ["Ces roches témoignent d'une fusion du gabbro.", "Ces transformations minéralogiques se sont produites à l'état solide.", "Le métagabbro à grenat a atteint la plus grande profondeur.", "Ces roches témoignent d'un enfouissement dans une zone de subduction."], "b": "BCD", "j": "Métamorphisme : transformation à l'état solide sous l'effet de la pression et de la température. Faciès schiste vert → schiste bleu → éclogite : pression croissante, donc enfouissement croissant (subduction). A : pas de fusion.", "img": "", "fixes": 0}, {"t": "Une ophiolite est :", "p": ["une moraine déposée par un glacier.", "un fragment de lithosphère océanique présent à la surface d'un continent.", "une roche sédimentaire riche en fossiles marins.", "un granite formé dans les racines d'une chaîne de montagnes."], "b": "B", "j": "Les ophiolites montrent la succession typique d'une lithosphère océanique : péridotites, gabbros, basaltes (souvent en coussins) et sédiments marins.", "img": "", "fixes": 0}, {"t": "Dans une chaîne de collision, l'alignement des ophiolites :", "p": ["résulte d'un volcanisme de point chaud.", "marque la suture entre deux blocs continentaux autrefois séparés par un océan.", "prouve qu'un océan a existé à cet endroit, puis s'est refermé.", "indique l'emplacement d'un rift continental en activité."], "b": "BC", "j": "Les ophiolites sont les restes d'un océan disparu, coincés entre deux continents entrés en collision : elles jalonnent la zone de suture.", "img": "", "fixes": 0}, {"t": "Le glaucophane est un minéral caractéristique :", "p": ["du faciès éclogite.", "du faciès schiste vert.", "des granites.", "du faciès schiste bleu."], "b": "D", "j": "Schiste vert : chlorite ; schiste bleu : glaucophane ; éclogite : grenat (et jadéite). Ces minéraux apparaissent à pression croissante, donc à profondeur croissante.", "img": "", "fixes": 0}, {"t": "Une roche d'ophiolite contient des grenats (faciès éclogite). Cette roche :", "p": ["a été entraînée à grande profondeur dans une zone de subduction.", "n'a jamais quitté la surface du globe.", "s'est mise en place par obduction, sans enfouissement.", "a ensuite été ramenée vers la surface (exhumée) lors de la collision."], "b": "AD", "j": "Le faciès éclogite traduit de très fortes pressions, donc une subduction profonde. Si la roche affleure aujourd'hui, c'est qu'elle a été exhumée. C : une ophiolite obductée ne présente pas ce métamorphisme.", "img": "", "fixes": 0}, {"t": "On distingue des ophiolites métamorphisées et des ophiolites non métamorphisées.", "p": ["Les ophiolites non métamorphisées ont été charriées sur le continent par obduction.", "Les ophiolites métamorphisées peuvent contenir du glaucophane ou des grenats.", "Dans les deux cas, elles témoignent d'un océan aujourd'hui disparu.", "Les ophiolites métamorphisées sont passées par une subduction avant d'être exhumées."], "b": "ABCD", "j": "Deux histoires possibles pour un fragment de lithosphère océanique : subduction puis exhumation (métamorphisme de haute pression), ou obduction (charriage sur le continent, sans ce métamorphisme).", "img": "", "fixes": 0}, {"t": "Dans les Alpes, quels indices témoignent de la fermeture d'un océan puis d'une collision ?", "p": ["Des ophiolites.", "Des roches métamorphiques des faciès schiste bleu et éclogite.", "Des moraines glaciaires.", "Des failles inverses et des chevauchements."], "b": "ABD", "j": "Ophiolites : restes de l'océan. Schistes bleus et éclogites : subduction. Failles inverses et chevauchements : raccourcissement lors de la collision. C : les moraines renseignent sur le climat, pas sur la tectonique.", "img": "", "fixes": 0}], "auto": [{"production": "Tableau des roches (consignes 1 et 2)", "criteres": [{"nom": "Complétude", "points": ["Tableau complet pour Chenaillet, Queyras et Viso : aspect, LPNA et LPA, minéraux."]}, {"nom": "Exactitude", "points": ["Faciès : métagabbro à chlorite et actinote (schistes verts), à glaucophane (schistes bleus), éclogite (grenat, jadéite).", "J'ai lu sur le diagramme P/T les conditions de chaque faciès : de plus en plus profond du Chenaillet au Viso."]}]}, {"production": "Texte : histoire de l'ancien océan", "criteres": [{"nom": "Complétude", "points": ["Ces roches sont des ophiolites : fragments d'une lithosphère océanique (gabbro formé à une dorsale).", "Hydratation près de la dorsale (schistes verts), puis subduction : schistes bleus puis éclogites, à l'état solide.", "Exhumation lors de la collision : ces roches témoignent dans les Alpes d'un océan refermé."]}, {"nom": "Exactitude", "points": ["Je n'écris pas que le gabbro a fondu ; un faciès désigne des conditions P/T, pas un nom de roche."]}, {"nom": "Conformité", "points": ["Texte structuré et chronologique, vocabulaire précis."]}]}]}, {"id": 58, "code": "ffb925961b", "titre": "Géologie – Activité 5A : Fragmentation continentale et ouverture océanique", "questions": [{"t": "Dans un bassin sédimentaire bordé de failles normales : les sédiments de 180 Ma ont une épaisseur constante et sont décalés par les failles ; les sédiments de 150 Ma s'épaississent contre les failles (disposition en éventail) ; les sédiments de 120 Ma recouvrent les failles sans être décalés.", "p": ["Le rifting s'est produit avant 180 Ma.", "Les failles ont fonctionné vers 150 Ma.", "Les sédiments de 180 Ma sont anté-rift.", "Les sédiments de 120 Ma sont syn-rift."], "b": "BC", "j": "Sédiments en éventail = dépôt pendant le jeu des failles (syn-rift, vers 150 Ma). 180 Ma : épaisseur constante puis décalés = déposés avant (anté-rift). D : non décalés = post-rift. A : les sédiments de 180 Ma sont décalés, le rifting leur est donc postérieur.", "img": "", "fixes": 0}, {"t": "Un rift continental (ex. : région de l'Afar, en Afrique de l'Est) présente :", "p": ["une croûte continentale amincie.", "des failles inverses et des chevauchements.", "des failles normales.", "un fossé d'effondrement bordé de blocs basculés."], "b": "ACD", "j": "Le rift se forme en contexte d'extension : la croûte s'amincit et se fracture en blocs qui basculent le long de failles normales. B : structures de compression.", "img": "", "fixes": 0}, {"t": "Les failles listriques sont :", "p": ["des failles inverses caractéristiques des chaînes de collision.", "des failles normales à surface courbe, le long desquelles basculent des blocs de croûte.", "des plis couchés.", "des limites de plaques en coulissage."], "b": "B", "j": "Dans un rift, les failles normales sont courbes (listriques) : les blocs de croûte continentale basculent le long de ces failles et délimitent le fossé d'effondrement.", "img": "", "fixes": 0}, {"t": "La fragmentation d'un continent se produit dans un contexte :", "p": ["d'extension (divergence).", "de subduction.", "de collision.", "de compression."], "b": "A", "j": "L'extension étire, amincit et fracture la lithosphère continentale : c'est le rifting, première étape de l'ouverture d'un océan.", "img": "", "fixes": 0}, {"t": "Dans quel ordre se succèdent les étapes de l'ouverture d'un océan ?", "p": ["Bassin océanique étroit → océan large → rift continental.", "Océan large → rift continental → bassin océanique étroit.", "Rift continental → bassin océanique étroit envahi par la mer (type mer Rouge) → océan large bordé de marges passives.", "Rift continental → chaîne de collision → océan large."], "b": "C", "j": "Si la divergence se poursuit, le fossé est envahi par la mer et du plancher océanique se forme (stade mer Rouge), puis l'océan s'élargit (stade Atlantique).", "img": "", "fixes": 0}, {"t": "Sur une marge passive, pour dater la période de rifting, on recherche l'âge :", "p": ["du manteau situé sous la marge.", "des sédiments post-rift.", "des sédiments disposés en éventail (syn-rift).", "de la croûte océanique la plus récente."], "b": "C", "j": "Les sédiments syn-rift se déposent pendant le basculement des blocs, d'où leur disposition en éventail : leur âge est celui du rifting.", "img": "", "fixes": 0}, {"t": "Une marge passive, comme la bordure ouest de l'Europe :", "p": ["est une ancienne bordure de rift continental.", "est une zone de subduction active.", "présente des blocs basculés recouverts de sédiments.", "se situe à la transition entre croûte continentale et croûte océanique."], "b": "ACD", "j": "Les marges passives sont les vestiges des deux lèvres du rift qui a donné naissance à l'océan (ici l'Atlantique). B : « passive » signifie justement qu'il n'y a ni subduction ni forte sismicité.", "img": "", "fixes": 0}, {"t": "Dans un ancien rift, les sédiments post-rift :", "p": ["sont les plus récents des trois ensembles sédimentaires.", "recouvrent les failles sans être décalés.", "sont basculés avec les blocs de croûte.", "sont disposés en éventail."], "b": "AB", "j": "Anté-rift : déposés avant, basculés avec les blocs. Syn-rift : déposés pendant le basculement, en éventail. Post-rift : déposés après, ils scellent l'ensemble.", "img": "", "fixes": 0}], "auto": [{"production": "Le rift d'Assal (consignes 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["Failles normales, fossé d'effondrement, séismes et volcanisme, évaporites ; failles les plus anciennes datées.", "Tectoglob3D : plaques qui s'écartent, croûte et lithosphère amincies, valeurs comparées à une zone éloignée."]}, {"nom": "Cohérence et pertinence", "points": ["J'ai relié la distension (amincissement, remontée de l'asthénosphère, fusion partielle) aux caractéristiques du rift."]}]}, {"production": "Golfe du Lion et texte (consignes 3 à 5)", "criteres": [{"nom": "Exactitude", "points": ["Golfe du Lion : blocs basculés, failles normales, croûte amincie, mais plus d'activité : c'est une marge passive.", "Forage : sédiments anté-rift, syn-rift (en éventail), post-rift (non décalés), datés ; Assal est à une étape précoce."]}, {"nom": "Complétude", "points": ["Rift, puis bassin étroit envahi par la mer, puis océanisation (nouvelle dorsale) ; la marge passive est la trace du rift.", "J'ai mobilisé les deux exemples, Assal et golfe du Lion."]}, {"nom": "Conformité", "points": ["Texte structuré, vocabulaire précis (faille normale, bloc basculé, océanisation)."]}]}]}, {"id": 59, "code": "3b2895061f", "titre": "Géologie – Activité 5B : Géodynamique et cycle de Wilson", "questions": [{"t": "Les cycles de Wilson :", "p": ["La réunion des continents en un supercontinent augmente la longueur totale des côtes.", "La durée d'un cycle est connue avec précision : environ 100 Ma.", "Le dernier supercontinent, la Pangée, a existé approximativement entre 300 et 200 Ma.", "Ils décrivent l'alternance de phases de fragmentation et de regroupement des continents au cours des temps géologiques."], "b": "CD", "j": "A : c'est l'inverse, moins de côtes et de plateaux continentaux, d'où un climat aride à l'intérieur du supercontinent. B : la durée théorique est de l'ordre de 400 à 600 Ma, et cette périodicité est discutée.", "img": "", "fixes": 0}, {"t": "La comparaison des âges des roches à l'échelle du globe montre que :", "p": ["la croûte océanique n'a nulle part plus de 200 Ma environ.", "l'âge des roches continentales est le même partout.", "la croûte continentale comporte des roches âgées de plusieurs milliards d'années.", "les continents sont plus jeunes que les océans."], "b": "AC", "j": "La lithosphère océanique est jeune car elle disparaît par subduction ; la croûte continentale, elle, conserve des roches très anciennes (jusqu'à environ 4 Ga), d'où des âges très variés sur les continents.", "img": "", "fixes": 0}, {"t": "Un cycle de Wilson comprend, dans l'ordre :", "p": ["collision, puis subduction, puis rifting, puis érosion.", "fragmentation d'un continent, ouverture d'un océan, fermeture de l'océan par subduction, collision.", "glaciation, déglaciation, transgression marine.", "ouverture d'un océan, collision, fragmentation, subduction."], "b": "B", "j": "Le cycle de Wilson décrit l'ouverture puis la fermeture d'un domaine océanique, aboutissant à une chaîne de collision ; les continents sont ainsi tour à tour dispersés puis rassemblés en supercontinent.", "img": "", "fixes": 0}, {"t": "La réunion des continents en un supercontinent (Pangée) a eu pour conséquence(s) :", "p": ["une augmentation des zones à climat océanique.", "une réduction de la longueur des côtes et de la surface des plateaux continentaux.", "des bouleversements évoqués parmi les causes de la crise Permien-Trias.", "un climat aride à l'intérieur du supercontinent."], "b": "BCD", "j": "Un seul continent : moins de côtes, moins de mers peu profondes (riches en espèces), et un intérieur très éloigné des océans, donc aride. Les cycles de Wilson ont ainsi des effets sur le climat et la biodiversité.", "img": "", "fixes": 0}, {"t": "La paléogéographie est :", "p": ["la reconstitution de la position des continents et des océans dans le passé.", "l'étude des roches métamorphiques.", "la datation des roches par les isotopes.", "l'étude des fossiles."], "b": "A", "j": "Elle s'appuie sur les traces laissées par les océans disparus (ophiolites), les anciennes marges, les chaînes de montagnes anciennes, les fossiles et les indices climatiques.", "img": "", "fixes": 0}, {"t": "L'océan dont la fermeture est à l'origine de la ceinture alpine s'appelle :", "p": ["l'Atlantique.", "le Pacifique.", "la Téthys.", "la mer Rouge."], "b": "C", "j": "La Téthys s'est refermée à partir de la fin du Mésozoïque ; les ophiolites alpines en sont des fragments.", "img": "", "fixes": 0}], "auto": [{"production": "Frise chronologique (consignes 1 à 3)", "criteres": [{"nom": "Contenu", "points": ["Croûte océanique de moins de 200 Ma, continentale jusqu'à plus de 4 Ga : les océans disparus laissent leurs traces dans les continents.", "Pour chaque période : situation du territoire (position, voisins, océan) associée à une trace géologique du doc. 3.", "Étapes : chaîne cadomienne, ouvertures océaniques, chaîne varisque et Pangée, Téthys et golfe de Gascogne, Alpes et Pyrénées."]}, {"nom": "Communication", "points": ["Frise de 620 Ma à l'actuel, échelle de temps régulière, titre et légende.", "Code couleur : phases de divergence (rift, ouverture) et de convergence (subduction, collision)."]}]}, {"production": "Cycle de Wilson (consignes 4 à 6)", "criteres": [{"nom": "Contenu", "points": ["Schéma complété : collision, chaîne, érosion et distension, rift, ouverture d'un océan, subduction, nouvelle collision."]}, {"nom": "Démarche", "points": ["Étapes du cycle reportées sur la frise ; cycles complets ou partiels identifiés.", "Ma réponse finale s'appuie sur la frise et répond à la problématique en quelques lignes."]}]}]}, {"id": 60, "code": "54686c7eb6", "titre": "Géologie – Activité 6A : Reconstituer des climats passés (palynologie)", "questions": [{"t": "Dans une carotte de tourbière, la proportion de pollens de chêne et de noisetier augmente fortement vers -10 000 ans, tandis que celle des graminées et de l'armoise diminue.", "p": ["Ces données traduisent un réchauffement du climat.", "Ces données renseignent directement sur la température moyenne globale de la planète.", "Cette interprétation suppose que les exigences climatiques de ces espèces végétales n'ont pas changé (actualisme).", "La végétation passe d'une végétation herbacée à une forêt de feuillus."], "b": "ACD", "j": "Chaque espèce végétale a des préférences climatiques : le passage d'une végétation herbacée à une forêt de feuillus traduit un réchauffement (vers -10 000 ans). C : principe d'actualisme. B : un diagramme pollinique renseigne sur le climat d'un lieu donné.", "img": "", "fixes": 0}, {"t": "Les grains de pollen sont de bons marqueurs des climats passés car :", "p": ["chaque espèce végétale a des exigences climatiques qui lui sont propres.", "ils se conservent particulièrement bien dans les milieux pauvres en dioxygène (tourbières, fonds de lacs).", "leur forme permet d'identifier l'espèce végétale qui les a produits.", "leur enveloppe très résistante permet leur conservation."], "b": "ABCD", "j": "On identifie l'espèce productrice d'après la forme du grain ; connaissant ses préférences climatiques actuelles, on en déduit le climat de l'époque (palynologie).", "img": "", "fixes": 0}, {"t": "En palynologie :", "p": ["un diagramme pollinique reconstitue le climat de toute la planète.", "un diagramme pollinique montre l'évolution des proportions de pollens au cours du temps.", "un diagramme pollinique donne la température au degré près.", "un spectre pollinique donne les proportions des différents pollens à un moment donné (un niveau de la carotte)."], "b": "BD", "j": "Le diagramme pollinique rassemble les spectres de tous les niveaux d'une carotte. Il renseigne sur la végétation, donc sur le climat d'un lieu donné, sans fournir de valeur précise de température.", "img": "", "fixes": 0}, {"t": "Dans une carotte de tourbière, un niveau contient surtout des pollens de graminées, d'armoise et de bouleau nain (végétation de steppe et de toundra). On en déduit que, lors du dépôt de ce niveau :", "p": ["le climat local était chaud et humide.", "ce niveau est forcément le plus profond de la carotte.", "la région était couverte d'une forêt dense de feuillus.", "le climat local était froid."], "b": "D", "j": "Ces végétaux sont caractéristiques des climats froids. À l'inverse, l'abondance de pollens de chêne ou de noisetier indique un climat tempéré.", "img": "", "fixes": 0}, {"t": "Une moraine :", "p": ["se forme au fond des tourbières.", "est un dépôt marin riche en coquilles.", "retrouvée loin des glaciers actuels, elle indique une ancienne extension des glaces.", "est un amas de débris rocheux transportés puis déposés par un glacier."], "b": "CD", "j": "Un glacier arrache, transporte et dépose des blocs de toutes tailles. Une moraine située plus bas que le front actuel d'un glacier montre que celui-ci était plus étendu : le climat était plus froid.", "img": "", "fixes": 0}, {"t": "Le principe d'actualisme consiste à admettre que :", "p": ["les climats n'ont jamais changé.", "les roches actuelles sont toutes récentes.", "les processus observés aujourd'hui se déroulaient de la même façon dans le passé.", "le passé de la Terre ne peut pas être connu."], "b": "C", "j": "C'est ce principe qui permet d'interpréter une moraine ancienne (dépôt d'un glacier) ou un pollen fossile (mêmes exigences climatiques qu'aujourd'hui).", "img": "", "fixes": 0}, {"t": "Parmi ces indices, lesquels témoignent du passage d'anciens glaciers ?", "p": ["Des moraines.", "Des basaltes en coussins.", "Des stries creusées à la surface des roches.", "Des roches glauconieuses."], "b": "AC", "j": "Les blocs transportés par la glace rayent les roches sur lesquelles le glacier se déplace (stries glaciaires). B : volcanisme sous-marin. D : dépôt marin de climat chaud.", "img": "", "fixes": 0}, {"t": "Quels indices montrent que le climat de l'Europe a été plus froid à certaines périodes du Quaternaire ?", "p": ["Des récifs coralliens fossiles.", "Des moraines situées bien en avant des glaciers actuels.", "Des peintures rupestres représentant des animaux de climat froid.", "Des pollens de végétation de steppe dans les tourbières."], "b": "BCD", "j": "Ces indices convergents (géologiques, biologiques, préhistoriques) sont confirmés par les mesures de δ^{18}O. A : les coraux indiquent des eaux chaudes.", "img": "", "fixes": 0}], "auto": [{"production": "La palynologie (consigne 1)", "criteres": [{"nom": "Complétude", "points": ["Pollens identifiables (forme, ornementation), très résistants, conservés dans les milieux pauvres en dioxygène.", "Carotte datée par superposition et carbone 14 ; diagramme pollinique : proportions des pollens au cours du temps.", "Chaque espèce a des exigences climatiques ; principe d'actualisme : elles n'ont pas changé depuis."]}, {"nom": "Cohérence et pertinence", "points": ["J'explique la démarche de bout en bout : pollens → végétation → climat."]}]}, {"production": "Entraînement ECE (le Svtunosaure)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie : identifier les pollens des trois niveaux ; préparation à la potasse, microscope, clé ; résultat attendu."]}, {"nom": "Exactitude", "points": ["Sécurité respectée : potasse corrosive (blouse, lunettes, gants)."]}, {"nom": "Conformité", "points": ["Résultats traités au tableur et présentés sous une forme adaptée, puis conclusion sur le climat vers 15 000 ans."]}]}, {"production": "Autres indices (consigne 2)", "criteres": [{"nom": "Complétude", "points": ["Moraines, blocs erratiques, stries, vallées en U : traces d'anciens glaciers, donc d'un climat plus froid."]}, {"nom": "Conformité", "points": ["Réponse structurée, phrases claires, vocabulaire précis."]}]}]}, {"id": 61, "code": "5c60516359", "titre": "Géologie – Activité 6B : Les thermomètres isotopiques", "questions": [{"t": "Les isotopes ^{16}O et ^{18}O de l'oxygène :", "p": ["sont utilisés pour dater les roches par radiochronologie.", "n'ont pas la même masse, le ^{18}O étant le plus lourd.", "sont stables (non radioactifs).", "sont présents en quantités égales dans la nature."], "b": "BC", "j": "Ce sont des isotopes stables : ils ne servent pas à dater, mais à reconstituer des températures. Le ^{16}O est de loin le plus abondant.", "img": "", "fixes": 0}, {"t": "Lors des changements d'état de l'eau :", "p": ["les molécules H_{2}^{16}O s'évaporent plus facilement que les molécules H_{2}^{18}O.", "les molécules H_{2}^{18}O se condensent plus facilement.", "la masse des isotopes n'a aucune influence.", "la vapeur d'eau formée au-dessus de l'océan est enrichie en ^{18}O par rapport à l'eau de mer."], "b": "AB", "j": "La différence de masse entraîne un fractionnement isotopique : le ^{16}O, plus léger, passe plus facilement en phase vapeur ; le ^{18}O, plus lourd, se condense préférentiellement. D : la vapeur est appauvrie en ^{18}O.", "img": "", "fixes": 0}, {"t": "Une masse d'air humide se déplace des basses latitudes vers un pôle.", "p": ["La neige qui tombe au pôle est très pauvre en ^{18}O.", "Plus il fait froid, plus la neige polaire est pauvre en ^{18}O.", "Elle perd progressivement son ^{18}O au fil des précipitations.", "Elle s'enrichit en ^{18}O au fil des précipitations."], "b": "ABC", "j": "Le ^{18}O se condense en premier et « tombe » avant : le nuage s'appauvrit en ^{18}O tout au long de son trajet. Plus le climat est froid, plus la condensation est importante et plus le δ^{18}O de la neige polaire est faible.", "img": "", "fixes": 0}, {"t": "Dans une carotte de glace polaire, un δ^{18}O plus faible (plus négatif) indique :", "p": ["un climat plus froid au moment du dépôt de la neige.", "une atmosphère plus riche en CO_{2}.", "une glace plus récente.", "un climat plus chaud au moment du dépôt de la neige."], "b": "A", "j": "Dans les glaces, δ^{18}O et température varient dans le même sens : δ^{18}O faible = période froide, δ^{18}O plus élevé = période chaude.", "img": "", "fixes": 0}, {"t": "Dans une carotte de glace de l’Antarctique, le δ^{18}O de la glace passe de -40 ‰ dans un niveau ancien à -50 ‰ dans un niveau plus récent.", "p": ["Il faisait plus froid lors du dépôt du niveau à -50 ‰.", "Il faisait plus chaud lors du dépôt du niveau à -50 ‰.", "Cette interprétation applique au passé une relation mesurée aujourd’hui (principe d’actualisme).", "À la même période, le δ^{18}O des foraminifères des sédiments marins a dû baisser lui aussi."], "b": "AC", "j": "Plus il fait froid, plus la neige polaire est pauvre en ^{18}O (δ^{18}O bas). Le δ^{18}O des foraminifères varie en sens inverse : il augmente pendant les périodes froides.", "img": "", "fixes": 0}, {"t": "Dans les glaces, on mesure aussi le δD, qui repose sur :", "p": ["le rapport ^{87}Sr/^{86}Sr.", "le rapport entre le deutérium (^{2}H) et l'hydrogène léger (^{1}H).", "le rapport ^{14}C/^{12}C.", "le rapport ^{18}O/^{16}O."], "b": "B", "j": "Le deutérium est l'isotope lourd de l'hydrogène : le δD de la glace varie avec la température comme le δ^{18}O.", "img": "", "fixes": 0}, {"t": "Dans les carbonates des foraminifères des sédiments océaniques, le δ^{18}O augmente pendant les périodes glaciaires.", "p": ["Cela montre que les océans étaient plus chauds.", "Le δ^{18}O des sédiments marins varie en sens inverse de celui des glaces polaires.", "Cela montre que l'évaporation avait cessé.", "Cela s'explique par le stockage du ^{16}O dans les calottes glaciaires : l'eau de mer est alors enrichie en ^{18}O."], "b": "BD", "j": "En période froide, l'eau évaporée (riche en ^{16}O) reste piégée dans les glaces : l'océan, et donc les coquilles qui s'y forment, s'enrichit en ^{18}O. Glaces et sédiments enregistrent le même signal, avec des variations opposées.", "img": "", "fixes": 0}, {"t": "Les carottes de glace polaire fournissent :", "p": ["des pollens de toutes les forêts du globe.", "sur les 800 000 dernières années, des variations de CO_{2} et de température qui évoluent de façon parallèle.", "le δ^{18}O (ou le δD) de la glace, qui renseigne sur la température.", "des bulles d'air, qui renseignent sur la composition de l'atmosphère passée (CO_{2}, CH_{4})."], "b": "BCD", "j": "Les glaces sont une double archive : température (isotopes de la glace) et composition de l'atmosphère (bulles d'air piégées). Température et teneur en gaz à effet de serre y varient ensemble.", "img": "", "fixes": 0}], "auto": [{"production": "Graphiques (consignes 1 à 3)", "criteres": [{"nom": "Démarche", "points": ["J'ai choisi les bonnes données pour chaque relation à démontrer."]}, {"nom": "Contenu", "points": ["Graphiques montrant : âge = f(profondeur), δ¹⁸O = f(température), δD = f(température).", "Vostok et Dôme C : périodes froides et tempérées repérées et légendées sur 400 000 ans.", "GISP (Groenland) : mêmes variations aux périodes communes : elles concernent toute la planète."]}, {"nom": "Communication", "points": ["Chaque graphique a un titre, des axes légendés avec unités et une échelle adaptée."]}]}, {"production": "Réponse rédigée (consigne 4)", "criteres": [{"nom": "Communication", "points": ["J'explique le thermomètre : plus il fait froid, plus la neige polaire est pauvre en isotopes lourds (δ¹⁸O, δD bas).", "Je décris les variations de température (alternance glaciaire et interglaciaire, cycles d'environ 100 000 ans).", "Je m'appuie sur mes graphiques et j'étends la conclusion aux deux hémisphères."]}, {"nom": "Contenu", "points": ["Je ne confonds pas le δ¹⁸O des glaces et celui des foraminifères, qui varie en sens inverse."]}]}]}, {"id": 62, "code": "e2fe0fe821", "titre": "Géologie – Activité 7 : Milankovitch, albédo et glaciations", "questions": [{"t": "Les paramètres orbitaux étudiés par Milankovitch :", "p": ["La précession correspond à la lente rotation de l'axe de la Terre, à la manière d'une toupie.", "L'obliquité correspond à l'inclinaison de l'axe de rotation de la Terre (environ 23° actuellement).", "La précession correspond à la variation de la distance Terre-Lune.", "L'excentricité correspond à la forme plus ou moins elliptique de l'orbite terrestre."], "b": "ABD", "j": "Excentricité, obliquité et précession des équinoxes varient de façon périodique.", "img": "", "fixes": 0}, {"t": "Les variations des paramètres orbitaux de la Terre :", "p": ["modifient la répartition de l'énergie solaire reçue selon les latitudes et les saisons.", "sont périodiques.", "expliquent en grande partie l'alternance des périodes glaciaires et interglaciaires du Quaternaire.", "expliquent le réchauffement observé depuis 150 ans."], "b": "ABC", "j": "Ces variations astronomiques déclenchent les entrées et sorties de glaciation, amplifiées par des rétroactions (albédo, CO_{2}). D : elles agissent sur des dizaines de milliers d'années, pas à l'échelle du siècle.", "img": "", "fixes": 0}, {"t": "Lors d'un refroidissement, l'extension des surfaces couvertes de glace :", "p": ["diminue l'albédo, ce qui atténue le refroidissement.", "n'a aucun effet sur le climat.", "augmente l'albédo, ce qui réchauffe la planète.", "augmente l'albédo, ce qui amplifie le refroidissement."], "b": "D", "j": "La glace réfléchit davantage le rayonnement solaire : la surface absorbe moins d'énergie et le refroidissement s'accentue. C'est une rétroaction positive (amplificatrice).", "img": "", "fixes": 0}, {"t": "Quand l'océan se refroidit :", "p": ["il libère du CO_{2} vers l'atmosphère.", "la solubilité du CO_{2} dans l'eau augmente.", "la teneur de l'atmosphère en CO_{2} diminue.", "l'effet de serre diminue, ce qui amplifie le refroidissement."], "b": "BCD", "j": "Un gaz se dissout mieux dans une eau froide : l'océan froid absorbe du CO_{2}, l'effet de serre baisse et le refroidissement s'accentue (rétroaction positive). A : c'est ce qui se produit lors d'un réchauffement.", "img": "", "fixes": 0}, {"t": "Les alternances de périodes glaciaires et interglaciaires du Quaternaire s'expliquent principalement par :", "p": ["la tectonique des plaques.", "les variations périodiques des paramètres orbitaux de la Terre.", "les activités humaines.", "la combustion du charbon."], "b": "B", "j": "À l'échelle de dizaines de milliers d'années, ce sont les paramètres de Milankovitch qui modifient l'énergie solaire reçue. A : la tectonique agit à l'échelle de millions d'années.", "img": "", "fixes": 0}], "auto": [{"production": "Albédo (consignes 1 à 3)", "criteres": [{"nom": "Démarche", "points": ["Un seul paramètre varie (la surface) : même lampe, même distance, salle sombre ; trois mesures par feuille."]}, {"nom": "Contenu", "points": ["Albédo = éclairement réfléchi / éclairement reçu ; le blanc a l'albédo le plus élevé, le bleu le plus faible.", "Neige (0,90) > glace (0,60) > sable > océan (0,05 à 0,10) ; énergie absorbée = 1 − albédo.", "Recul des glaces → albédo plus faible → plus d'énergie absorbée → réchauffement → plus de fonte : rétroaction positive."]}]}, {"production": "Simulations SimClimat (consignes 4 à 6)", "criteres": [{"nom": "Communication", "points": ["Tableaux titrés, avec unités, écart au témoin calculé pour chaque simulation."]}, {"nom": "Contenu", "points": ["Sans rétroactions, la température change très peu, contre 6 °C au dernier maximum glaciaire : ces paramètres ne suffisent pas.", "Ils rythment les glaciations (100 000, 41 000, 19 000 à 23 000 ans) : ce sont des déclencheurs.", "Albédo branché : refroidissement net ; océan en plus : CO₂ en baisse et refroidissement un peu plus fort."]}]}, {"production": "Schéma fonctionnel (bilan)", "criteres": [{"nom": "Communication", "points": ["Insolation d'été aux hautes latitudes Nord → fonte → albédo ↓ → réchauffement ; océan plus chaud → CO₂ libéré → effet de serre ↑.", "Chaque flèche est légendée ; je distingue la cause de départ et les rétroactions qui l'amplifient."]}]}]}, {"id": 63, "code": "75bb57bb6b", "titre": "Géologie – Activité 8 : Les variations climatiques au Cénozoïque", "questions": [{"t": "Depuis environ 50 Ma, le climat global a connu :", "p": ["une glaciation ininterrompue.", "un refroidissement progressif, aboutissant aux glaciations du Quaternaire.", "une stabilité remarquable.", "un réchauffement continu."], "b": "B", "j": "Après une période chaude au début du Cénozoïque, la tendance est au refroidissement, avec la mise en place de la calotte antarctique vers 30 Ma, puis les glaciations du Quaternaire.", "img": "", "fixes": 0}, {"t": "Le refroidissement du Cénozoïque est attribué :", "p": ["à l'altération des roches silicatées des chaînes en formation (Alpes, Himalaya), qui consomme du CO_{2}.", "à un volcanisme de dorsale particulièrement intense.", "à l'isolement de l'Antarctique par un courant circumpolaire, favorisant la formation de sa calotte.", "à une baisse de l'effet de serre."], "b": "ACD", "j": "Deux explications complémentaires : baisse du CO_{2} par altération des reliefs des orogenèses alpine et himalayenne, et modification des circulations océaniques par la position des continents. B : cause du climat chaud du Crétacé.", "img": "", "fixes": 0}, {"t": "À long terme, l'altération chimique des roches silicatées :", "p": ["consomme du CO_{2} atmosphérique et diminue l'effet de serre.", "produit du charbon.", "libère du CO_{2} et renforce l'effet de serre.", "n'a aucun lien avec le cycle du carbone."], "b": "A", "j": "L'altération des silicates consomme du CO_{2}, finalement piégé sous forme de carbonates. Elle est intense lorsque de grands reliefs se forment (orogenèses).", "img": "", "fixes": 0}, {"t": "L'indice stomatique (densité de stomates) de feuilles fossiles :", "p": ["renseigne sur la teneur en CO_{2} de l'atmosphère de l'époque.", "est d'autant plus faible que l'atmosphère était riche en CO_{2}.", "donne l'âge absolu de la roche qui les contient.", "renseigne sur la position des continents."], "b": "AB", "j": "Plus l'air est riche en CO_{2}, moins les feuilles forment de stomates. Les feuilles fossiles du Crétacé, pauvres en stomates, témoignent d'une atmosphère riche en CO_{2}.", "img": "", "fixes": 0}, {"t": "À l'échelle de dizaines de millions d'années, les grandes variations climatiques s'expliquent surtout par :", "p": ["les paramètres orbitaux.", "les variations d'activité du Soleil d'une année à l'autre.", "les variations du CO_{2} atmosphérique liées à la tectonique des plaques (orogenèses, activité des dorsales, position des continents).", "les saisons."], "b": "C", "j": "Cénozoïque (orogenèses, refroidissement), Crétacé (dorsales actives, réchauffement), Carbonifère-Permien (chaîne hercynienne, charbon, refroidissement) : la tectonique règle le CO_{2} et les circulations océaniques.", "img": "", "fixes": 0}], "auto": [{"production": "Frise (consigne 1)", "criteres": [{"nom": "Contenu", "points": ["Début chaud, refroidissement et baisse du CO₂, calotte antarctique vers 34 Ma, puis calottes de l'hémisphère Nord.", "Chaque étape est justifiée par un indice : δ¹⁸O des foraminifères (élevé = froid), tillites, isotopes du carbone."]}, {"nom": "Communication", "points": ["Frise à l'échelle et annotée, de 66 Ma à l'actuel."]}]}, {"production": "Stratégie ECE (consigne 2)", "criteres": [{"nom": "Démarche", "points": ["Je mesure l'indice stomatique de Ginkgo fossiles, IS = S / (S + CE) × 100 ; j'attends : IS faible = CO₂ élevé (doc. 8).", "J'ai justifié le choix du Ginkgo (espèce panchronique) et signalé une limite (relation établie de 290 à 335 ppm)."]}]}, {"production": "Tectonique et climat, bilan (consignes 3 et 4)", "criteres": [{"nom": "Communication", "points": ["Tableau Build Your Own Earth complet pour les 6 modèles (continents, biomes, banquise et neige)."]}, {"nom": "Contenu", "points": ["L'altération des chaînes en formation (Alpes, Himalaya) consomme du CO₂ : l'effet de serre diminue.", "Calotte antarctique : baisse du CO₂ (rôle principal) et courant circumpolaire (rôle secondaire).", "Je distingue banquise (glace de mer) et calotte glaciaire (glace sur un continent)."]}]}]}, {"id": 64, "code": "dced928757", "titre": "Géologie – Activité 9 : Le rôle de l'Homme dans les changements climatiques", "questions": [{"t": "Le GIEC :", "p": ["évalue et synthétise les connaissances scientifiques sur le changement climatique.", "n'est pas un laboratoire de recherche.", "a été créé en 1988.", "conclut que le réchauffement actuel est d'origine naturelle."], "b": "ABC", "j": "Le GIEC expertise l'information scientifique, technique et socio-économique publiée dans le monde. Ses rapports établissent que le réchauffement actuel est causé par les activités humaines.", "img": "", "fixes": 0}, {"t": "La cause principale du réchauffement climatique observé depuis la révolution industrielle est :", "p": ["la diminution de l'albédo des océans.", "la variation des paramètres orbitaux de la Terre.", "l'activité des dorsales océaniques.", "les émissions de gaz à effet de serre par les activités humaines, notamment le CO_{2} des combustibles fossiles."], "b": "D", "j": "C'est la conclusion des rapports successifs du GIEC, qui fait consensus dans la communauté scientifique.", "img": "", "fixes": 0}, {"t": "« Il a neigé en avril : le réchauffement climatique est un mensonge. » Cette affirmation :", "p": ["est un raisonnement scientifique valide.", "applique le principe d'actualisme.", "confond météorologie et climatologie.", "peut relever du biais de confirmation."], "b": "CD", "j": "La météo décrit le temps qu'il fait à court terme en un lieu ; le climat se définit par des moyennes sur plusieurs décennies. Ne retenir que l'observation qui conforte son opinion est un biais de confirmation.", "img": "", "fixes": 0}, {"t": "Deux grandeurs varient en même temps et dans le même sens. On peut en conclure que :", "p": ["elles sont corrélées, ce qui ne suffit pas à prouver un lien de cause à effet.", "la première est la cause de la seconde.", "la seconde est la cause de la première.", "elles n'ont aucun rapport."], "b": "A", "j": "Une corrélation n'est pas une causalité : il faut un mécanisme explicatif et des arguments supplémentaires pour établir un lien de cause à effet.", "img": "", "fixes": 0}, {"t": "À propos du débat sur le changement climatique :", "p": ["Les rapports du GIEC présentent l'état de ce consensus.", "Le débat scientifique porte sur l'affinement des modèles et des projections.", "La controverse publique s'explique en partie par des biais cognitifs.", "La réalité du réchauffement et son origine humaine font consensus dans la communauté scientifique."], "b": "ABCD", "j": "Il ne faut pas confondre débat scientifique (qui précise les modèles) et controverse publique ou politique.", "img": "", "fixes": 0}, {"t": "Parmi les conséquences du réchauffement climatique, on peut citer :", "p": ["la montée du niveau marin, qui menace les populations littorales.", "l'extension de maladies transmises par des vecteurs comme le moustique tigre.", "une hausse générale des rendements agricoles grâce au CO_{2}.", "la destruction d'habitats et la perte de biodiversité."], "b": "ABD", "j": "C : l'effet stimulant du CO_{2} sur la croissance des végétaux ne compense pas les baisses de rendement dues à la chaleur, au manque d'eau et à la perte de terres cultivables.", "img": "", "fixes": 0}, {"t": "Parmi ces mesures, lesquelles relèvent de l'atténuation du changement climatique ?", "p": ["Repeindre les toits en blanc pour limiter la chaleur en ville.", "Décarboner la production d'électricité.", "Modifier les périodes de pêche.", "Capter et stocker du CO_{2}."], "b": "BD", "j": "L'atténuation agit sur les causes : réduire les émissions de gaz à effet de serre ou stocker du carbone. A et C : mesures d'adaptation aux conséquences.", "img": "", "fixes": 0}, {"t": "Parmi ces mesures, lesquelles relèvent de l'adaptation au changement climatique ?", "p": ["Repeindre les toits en blanc pour limiter l'absorption de chaleur.", "Remplacer des centrales à charbon par une production d'électricité bas-carbone.", "Construire des digues pour protéger un littoral.", "Modifier les cultures et les calendriers agricoles."], "b": "ACD", "j": "L'adaptation vise à limiter les effe
