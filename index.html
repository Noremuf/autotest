on sommet marque la limite lithosphère/asthénosphère.", "img": "", "fixes": 0}, {"t": "La lithosphère est constituée :", "p": ["de la partie du manteau située sous la LVZ", "de la croûte et de la totalité du manteau", "de la croûte et de la partie du manteau située au-dessus de la LVZ", "de la croûte uniquement"], "b": "C", "j": "Tout ce qui est au-dessus du sommet de la LVZ appartient à la lithosphère : la croûte et le manteau lithosphérique. En dessous se trouve l'asthénosphère.", "img": "", "fixes": 0}, {"t": "De haut en bas, la lithosphère océanique observée au niveau de la faille Vema est constituée de :", "p": ["sédiments, péridotites, gabbros, basaltes en filons, basaltes en pillow-lavas", "sédiments, gabbros, basaltes en filons, basaltes en pillow-lavas, péridotites", "sédiments, basaltes en pillow-lavas, basaltes en filons, gabbros, péridotites", "sédiments, basaltes en filons, basaltes en pillow-lavas, gabbros, péridotites"], "b": "C", "j": "Sous une fine couche de sédiments, on trouve les basaltes en pillow-lavas, puis les basaltes en filons, puis les gabbros (croûte), et enfin les péridotites du manteau lithosphérique.", "img": "", "fixes": 0}, {"t": "À propos de la lithosphère océanique :", "p": ["la croûte océanique est constituée de basaltes et de gabbros", "les pillow-lavas sont des gabbros en forme d'oreiller", "le Moho sépare les gabbros des péridotites du manteau lithosphérique", "les péridotites font partie de la croûte océanique"], "b": "AC", "j": "La croûte océanique comprend les basaltes (pillow-lavas et filons) et les gabbros ; sous le Moho, les péridotites appartiennent au manteau lithosphérique. Les pillow-lavas sont des laves basaltiques.", "img": "", "fixes": 0}, {"t": "Au niveau des dorsales lentes, comme la dorsale médio-atlantique :", "p": ["la vitesse d'expansion est d'environ 17 cm/an", "l'activité magmatique est réduite", "la croûte océanique est particulièrement épaisse", "les péridotites du manteau peuvent être mises directement à l'affleurement"], "b": "BD", "j": "Aux dorsales lentes (2 cm/an), l'activité magmatique est réduite : la croûte est mince, voire absente par endroits, et la divergence fait affleurer les péridotites. 17 cm/an est la vitesse de la dorsale pacifique, rapide.", "img": "", "fixes": 0}, {"t": "Sous une dorsale, la fusion partielle des péridotites :", "p": ["est due à une augmentation de la pression", "est due à l'hydratation des péridotites", "est due à la décompression des péridotites asthénosphériques qui remontent vers la surface", "est possible parce que les roches remontent plus vite qu'elles ne se refroidissent"], "b": "CD", "j": "À l'axe de la dorsale, les péridotites chaudes remontent et subissent une baisse de pression sans avoir le temps de refroidir : elles fondent partiellement. La fusion par hydratation concerne les zones de subduction.", "img": "", "fixes": 0}, {"t": "Plus la profondeur est importante, plus la température de fusion des péridotites :", "p": ["augmente, car la pression diminue", "augmente, car la pression augmente", "reste la même, car elle ne dépend pas de la pression", "diminue, car la pression augmente"], "b": "B", "j": "La pression augmente avec la profondeur et élève la température de fusion des péridotites. C'est pourquoi une décompression (remontée) peut provoquer la fusion.", "img": "", "fixes": 0}, {"t": "Le magma à l'origine des basaltes océaniques provient d'une fusion partielle des péridotites à un taux voisin de :", "p": ["15 %", "50 %", "1 %", "100 %"], "b": "A", "j": "Les expériences de fusion montrent qu'un taux de 15 % donne un magma de composition proche de celle des basaltes océaniques. Une fusion de 100 % donnerait un liquide de même composition que la péridotite.", "img": "", "fixes": 0}, {"t": "Avec un taux de fusion partielle de 15 %, quelle masse de magma obtient-on à partir de 200 kg de péridotite ?", "p": ["185 kg", "15 kg", "170 kg", "30 kg"], "b": "D", "j": "15 % de 200 kg = 0,15 × 200 = 30 kg de magma. Les 170 kg restants constituent le résidu solide non fondu.", "img": "", "fixes": 0}, {"t": "La comparaison des compositions chimiques des roches et des liquides de fusion montre que :", "p": ["les basaltes et les gabbros se forment à partir du magma issu de la fusion partielle des péridotites", "les péridotites lithosphériques résultent de la cristallisation du magma", "les péridotites lithosphériques correspondent au résidu solide, non fondu, des péridotites asthénosphériques", "les gabbros correspondent au résidu solide des péridotites asthénosphériques"], "b": "AC", "j": "Le liquide issu de la fusion partielle donne les roches de la croûte (basaltes et gabbros) ; la partie de la péridotite qui n'a pas fondu constitue les péridotites du manteau lithosphérique.", "img": "", "fixes": 0}, {"t": "À propos des basaltes et des gabbros :", "p": ["le gabbro se forme par refroidissement rapide du magma en surface", "le gabbro a une structure grenue", "le basalte a une structure microlitique", "ils ont la même composition chimique"], "b": "BCD", "j": "Basalte et gabbro proviennent du même magma et ne diffèrent que par leur structure : le gabbro, grenu, a refroidi lentement en profondeur ; le basalte, microlitique, a refroidi rapidement en surface.", "img": "", "fixes": 0}, {"t": "Dans le basalte d'un pillow-lava :", "p": ["les phénocristaux se sont formés lors d'un refroidissement lent en profondeur", "le verre s'est formé lors d'un refroidissement très rapide au contact de l'océan", "tous les minéraux sont visibles à l'œil nu et de taille comparable", "les microlites sont les minéraux de plus grande taille"], "b": "AB", "j": "Les phénocristaux (grande taille) se forment d'abord, lentement, en profondeur ; les microlites (petites baguettes) lors de l'injection du magma dans les fissures ; le verre au contact de l'eau. Des minéraux tous visibles à l'œil nu caractérisent la structure grenue du gabbro.", "img": "", "fixes": 0}, {"t": "L'expérience de cristallisation de la vanilline fondue montre que :", "p": ["plus le refroidissement est lent, plus les cristaux obtenus sont de grande taille", "un refroidissement lent empêche la formation de cristaux", "plus le refroidissement est rapide, plus les cristaux obtenus sont de grande taille", "la taille des cristaux ne dépend pas de la vitesse de refroidissement"], "b": "A", "j": "Refroidie lentement, la vanilline donne de grands cristaux ; refroidie rapidement (sur de la glace), elle donne de petits cristaux. La structure dépend donc de la vitesse de refroidissement.", "img": "", "fixes": 0}, {"t": "Une roche magmatique est entièrement formée de cristaux tous visibles à l'œil nu et de taille comparable. On peut en déduire qu'elle s'est formée :", "p": ["sans passer par l'état liquide", "par refroidissement rapide d'un magma en surface", "par refroidissement très rapide d'un magma au contact de l'eau", "par refroidissement lent d'un magma en profondeur"], "b": "D", "j": "C'est une structure grenue : les minéraux ont eu le temps de se former, ce qui traduit un refroidissement lent en profondeur. Un refroidissement rapide donnerait des microlites et du verre.", "img": "", "fixes": 0}, {"t": "Lors de la formation de la lithosphère océanique à l'axe d'une dorsale :", "p": ["le magma qui parvient en surface refroidit lentement et forme les gabbros", "les liquides issus de la fusion partielle se rassemblent dans un réservoir magmatique", "une partie du magma cristallise lentement le long des parois du réservoir et forme les gabbros", "les péridotites non fondues remontent jusqu'en surface et forment les basaltes"], "b": "BC", "j": "Le magma se rassemble dans un réservoir : une partie y cristallise lentement (gabbros), une autre s'infiltre dans les failles et refroidit rapidement en surface (basaltes). Les péridotites non fondues migrent latéralement et forment le manteau lithosphérique.", "img": "", "fixes": 0}, {"t": "À l'aplomb d'une dorsale :", "p": ["la lithosphère océanique n'a qu'environ 20 km d'épaisseur", "la tomographie sismique révèle une zone anormalement chaude, interprétée comme une remontée de l'asthénosphère", "l'isotherme 1 300 °C est plus profond que sous les plaines abyssales", "le manteau est plus froid que sous les plaines abyssales"], "b": "AB", "j": "Sous la dorsale, l'isotherme 1 300 °C (base de la lithosphère) est atteint dès 20 km de profondeur environ, et le manteau est plus chaud que sous les plaines abyssales voisines.", "img": "", "fixes": 0}, {"t": "En s'éloignant de la dorsale, la lithosphère océanique :", "p": ["s'amincit", "devient de moins en moins dense", "s'épaissit, ce qui augmente progressivement sa densité", "se refroidit"], "b": "CD", "j": "La lithosphère formée à la dorsale se refroidit en s'en éloignant et s'épaissit ; sa densité augmente jusqu'à dépasser celle de l'asthénosphère, ce qui conduit à la subduction.", "img": "", "fixes": 0}], "auto": [{"production": "Consignes 1 à 5", "criteres": [{"nom": "Exactitude", "points": ["De haut en bas : sédiments, basaltes en coussins, basaltes en filons, gabbros, puis péridotites ; Moho sous les gabbros.", "La lithosphère s'arrête au sommet de la LVZ (≈ 100 km) ; l'asthénosphère est ductile, pas liquide.", "Sous la dorsale, le géotherme coupe le solidus (≈ 85 à 25 km) : fusion partielle par décompression, pas par chauffage.", "Taux de fusion ≈ 15 % (Si, Mg, Fe comme le basalte) ; le résidu solide forme le manteau lithosphérique.", "Vanilline : refroidissement lent = grands cristaux (gabbro grenu) ; rapide = petits cristaux et verre (basalte).", "Tableau : e = 9,2 × √t, densité pondérée ; la lithosphère dépasse 3,25 (asthénosphère) vers 40 Ma."]}]}, {"production": "Schéma bilan", "criteres": [{"nom": "Conformité", "points": ["Titre judicieux, couches légendées, Moho et LVZ localisés."]}, {"nom": "Complétude", "points": ["Flèches : remontée de l'asthénosphère sous l'axe, écartement des plaques.", "Étapes : fusion partielle (15 %, 100 à 20 km), réservoir magmatique, gabbros en profondeur, basaltes en surface.", "Loin de la dorsale : la lithosphère se refroidit, s'épaissit et devient plus dense."]}, {"nom": "Cohérence et pertinence", "points": ["Mes légendes expliquent (étapes, conditions), elles ne font pas que nommer."]}]}]}, {"id": 50, "code": "29cba710b3", "titre": "Thème 2 – Activité 5 : Les zones de subduction", "questions": [{"t": "La tomographie sismique du manteau montre que :", "p": ["il est possible de mesurer directement la température des roches en profondeur", "les écarts de vitesse par rapport au modèle PREM sont très importants (plus de 50 %)", "les zones où les ondes vont un peu moins vite que ne le prévoit le modèle PREM sont interprétées comme plus chaudes", "à une profondeur donnée, la température du manteau n'est pas la même partout"], "b": "CD", "j": "La tomographie compare les vitesses mesurées à celles prévues par PREM : des ondes ralenties traduisent une zone plus chaude, des ondes accélérées une zone plus froide. Les écarts ne sont que de quelques % et la méthode ne mesure pas des températures.", "img": "", "fixes": 0}, {"t": "À propos du métamorphisme :", "p": ["un faciès métamorphique est défini par l'assemblage de minéraux de la roche", "c'est une transformation des minéraux d'une roche à l'état solide", "il se produit lorsque les conditions de pression et de température changent", "il nécessite la fusion de la roche"], "b": "ABC", "j": "Les minéraux ne sont stables que dans des conditions précises de pression et de température : quand elles changent, ils se transforment à l'état solide. Chaque faciès, défini par un assemblage de minéraux, correspond à un intervalle de conditions.", "img": "", "fixes": 0}, {"t": "Lors de l'hydrothermalisme subi par la croûte océanique qui s'éloigne de la dorsale :", "p": ["le métamorphisme se produit à haute pression, pendant la subduction", "les roches subissent une déshydratation", "les gabbros s'hydratent au contact de l'eau de mer qui circule dans les fissures", "il se forme de la chlorite, un minéral vert qui témoigne d'une importante hydratation"], "b": "CD", "j": "Le faciès des schistes verts correspond à un refroidissement en présence d'eau, à basse pression : les gabbros deviennent des gabbros à hornblende puis à chlorite. La déshydratation se produit plus tard, lors de la subduction.", "img": "", "fixes": 0}, {"t": "Sous l'action de l'eau de mer qui circule dans les niveaux superficiels du manteau, les péridotites sont transformées en :", "p": ["gabbros à hornblende", "serpentinites", "éclogites", "schistes bleus"], "b": "B", "j": "L'olivine des péridotites est transformée en serpentine, un minéral vert riche en eau : la roche devient une serpentinite. Les autres roches proposées proviennent de la transformation des gabbros.", "img": "", "fixes": 0}, {"t": "Les schistes bleus :", "p": ["contiennent du glaucophane, une amphibole bleue", "sont caractérisés par l'apparition de grenats", "se forment par hydratation des gabbros près de la dorsale", "se forment lorsque les métagabbros s'enfoncent dans la subduction, sous l'effet de l'augmentation de la pression et de la température"], "b": "AD", "j": "Les schistes bleus doivent leur couleur au glaucophane et se forment pendant la subduction, avec une déshydratation de la roche. L'hydratation près de la dorsale donne les schistes verts ; les grenats caractérisent les éclogites.", "img": "", "fixes": 0}, {"t": "Les éclogites :", "p": ["se forment à plus faible profondeur que les schistes bleus", "se forment avec une forte déshydratation des roches", "contiennent des grenats", "contiennent de la jadéite, un pyroxène vert"], "b": "BCD", "j": "Les éclogites proviennent des schistes bleus entraînés davantage en profondeur : grenats et jadéite y apparaissent et la roche se déshydrate fortement.", "img": "", "fixes": 0}, {"t": "De sa formation à la dorsale jusqu'à son enfoncement dans une zone de subduction, un gabbro de la croûte océanique passe successivement par les faciès :", "p": ["schistes bleus, schistes verts, éclogites", "éclogites, schistes bleus, schistes verts", "schistes verts, schistes bleus, éclogites", "schistes verts, éclogites, schistes bleus"], "b": "C", "j": "Le gabbro est d'abord hydraté à basse pression (schistes verts), puis l'augmentation de pression et de température lors de la subduction le transforme en schiste bleu, puis en éclogite à plus grande profondeur.", "img": "", "fixes": 0}, {"t": "Dans une zone de subduction :", "p": ["la plaque chevauchante peut être océanique ou continentale", "une plaque lithosphérique océanique plonge dans l'asthénosphère sous une autre plaque", "la plaque plongeante est une plaque continentale", "les deux plaques s'écartent l'une de l'autre"], "b": "AB", "j": "La subduction est une frontière de plaques convergente : une lithosphère océanique plonge obliquement dans l'asthénosphère sous une autre plaque, océanique ou continentale.", "img": "", "fixes": 0}, {"t": "Dans une zone de subduction, les foyers des séismes dessinent :", "p": ["un nuage de points sans organisation particulière", "une bande verticale à l'aplomb des volcans, qui témoigne de la remontée du magma", "une ligne horizontale située à la base de la croûte", "un plan incliné qui s'enfonce jusqu'à 700 km de profondeur et témoigne du plongement de la lithosphère océanique froide et rigide"], "b": "D", "j": "Les séismes se produisent dans la lithosphère plongeante, froide et rigide, qui s'enfonce dans l'asthénosphère chaude et ductile : leurs foyers dessinent un plan incliné jusqu'à 700 km.", "img": "", "fixes": 0}, {"t": "À propos du volcanisme des zones de subduction :", "p": ["les volcans sont situés sur la plaque chevauchante", "les volcans sont situés sur la plaque plongeante", "le magma est pauvre en eau", "il est explosif, car le magma est riche en silice, ce qui le rend visqueux"], "b": "AD", "j": "Les volcans de subduction, portés par la plaque chevauchante, sont explosifs : leur magma, riche en silice, est visqueux. Ce magma est aussi riche en eau.", "img": "", "fixes": 0}, {"t": "À propos des roches magmatiques des zones de subduction :", "p": ["les roches volcaniques et les roches plutoniques se forment à partir d'un même magma", "les andésites et les rhyolites sont des roches volcaniques", "les granitoïdes sont des roches plutoniques à structure grenue", "les andésites ont une structure grenue"], "b": "ABC", "j": "Andésites et rhyolites (volcaniques) ont une structure microlitique due à un refroidissement rapide en surface ; les granitoïdes (plutoniques) ont une structure grenue due à un refroidissement lent. Leur composition chimique apparentée indique un même magma.", "img": "", "fixes": 0}, {"t": "Un pluton est :", "p": ["une chambre magmatique d'où le magma parvient en surface lors d'une éruption", "une grosse « bulle » de magma qui cristallise lentement en profondeur, sans atteindre la surface", "une lentille granitique contenue dans un gneiss", "un volcan de type explosif"], "b": "B", "j": "Les roches plutoniques proviennent de magmas qui ne gagnent pas la surface et cristallisent en profondeur en formant des plutons de granitoïdes, que l'érosion dégage plus tard.", "img": "", "fixes": 0}, {"t": "À propos des minéraux des roches étudiées dans les zones de subduction :", "p": ["les micas (muscovite, biotite) et les amphiboles sont des minéraux hydroxylés", "l'olivine est un minéral hydroxylé", "les pyroxènes et l'olivine des péridotites sont des minéraux anhydres", "les granitoïdes ne contiennent aucun minéral hydroxylé"], "b": "AC", "j": "Les granitoïdes contiennent des minéraux hydroxylés (riches en groupements OH) : micas et amphiboles. Les péridotites du manteau, elles, sont faites de minéraux anhydres, ce qui pose la question de l'origine de l'eau.", "img": "", "fixes": 0}, {"t": "Les magmas des zones de subduction ont pour origine la fusion partielle :", "p": ["des péridotites du manteau de la plaque plongeante", "de la croûte océanique de la plaque plongeante", "des péridotites du manteau de la plaque chevauchante", "des sédiments entraînés par la plaque plongeante"], "b": "C", "j": "Les magmas ne peuvent pas provenir de la fusion des matériaux de la plaque plongeante : ils naissent de la fusion partielle du manteau de la plaque chevauchante, au-dessus du plan de Wadati-Benioff.", "img": "", "fixes": 0}, {"t": "À propos de la fusion des péridotites en zone de subduction :", "p": ["l'hydratation des péridotites abaisse leur température de fusion", "l'hydratation des péridotites élève leur température de fusion", "la fusion est due à la décompression de péridotites qui remontent vers la surface", "sans eau, à la profondeur où naissent les magmas, la température n'est pas suffisante pour faire fondre la péridotite"], "b": "AD", "j": "En zone de subduction, c'est l'apport d'eau qui permet la fusion partielle en abaissant le point de fusion de la péridotite. La fusion par décompression est le mécanisme des dorsales.", "img": "", "fixes": 0}, {"t": "L'eau nécessaire à la fusion des péridotites en zone de subduction :", "p": ["provient des minéraux du manteau de la plaque chevauchante, naturellement riches en eau", "a été incorporée à la croûte océanique par les circulations hydrothermales, pendant son histoire océanique", "provient directement de l'océan, par infiltration à travers la plaque chevauchante", "provient de la déshydratation des roches de la plaque plongeante au cours de leur métamorphisme"], "b": "BD", "j": "La croûte océanique, hydratée près de la dorsale (schistes verts), se déshydrate en devenant schistes bleus puis éclogites : l'eau libérée percole dans le manteau de la plaque chevauchante, dont les minéraux sont anhydres.", "img": "", "fixes": 0}, {"t": "À l'aplomb de l'arc magmatique, la fusion partielle des péridotites hydratées se produit vers :", "p": ["100 à 150 km de profondeur", "7 à 12 km de profondeur", "700 km de profondeur", "20 km de profondeur"], "b": "A", "j": "C'est vers 100 à 150 km de profondeur que la température est suffisante pour atteindre le point de fusion de la péridotite hydratée. 700 km est la profondeur maximale des séismes du plan incliné.", "img": "", "fixes": 0}, {"t": "On considère les quatre événements suivants : 1 = fusion partielle des péridotites ; 2 = hydratation de la croûte océanique par hydrothermalisme ; 3 = percolation de l'eau dans le manteau de la plaque chevauchante ; 4 = déshydratation des roches de la plaque plongeante. L'ordre chronologique correct est :", "p": ["1 - 2 - 4 - 3", "2 - 4 - 3 - 1", "2 - 3 - 4 - 1", "4 - 2 - 3 - 1"], "b": "B", "j": "La croûte océanique est d'abord hydratée (2), puis se déshydrate en subduction (4) ; l'eau libérée percole dans le manteau de la plaque chevauchante (3), dont les péridotites hydratées fondent partiellement (1).", "img": "", "fixes": 0}, {"t": "À propos de l'évolution des magmas en zone de subduction :", "p": ["les roches finalement produites sont essentiellement de composition basaltique", "le magma s'appauvrit en silice en fondant les matériaux de la croûte continentale", "le magma s'enrichit en silice, car les premiers minéraux qui cristallisent sont les plus pauvres en silice", "le magma originel, issu de la fusion partielle des péridotites hydratées, a une composition basaltique"], "b": "CD", "j": "Le magma basaltique de départ s'enrichit en silice par cristallisation progressive et par contamination (fusion de la croûte continentale encaissante) : les roches produites sont essentiellement granitiques ou dioritiques.", "img": "", "fixes": 0}, {"t": "À propos de la mise en place des roches magmatiques en zone de subduction :", "p": ["les roches plutoniques proviennent de magmas parvenus en surface lors d'une éruption", "les magmas migrent vers la surface car leur température est beaucoup plus élevée que celle des matériaux encaissants", "les roches volcaniques proviennent de magmas qui cristallisent lentement en profondeur", "les plutons de granitoïdes cristallisent en profondeur et sont dégagés par l'érosion plusieurs millions d'années plus tard"], "b": "BD", "j": "Les magmas très chauds montent rapidement, s'accumulent dans une chambre magmatique et donnent les roches volcaniques lors des éruptions ; ceux qui n'atteignent pas la surface cristallisent en profondeur en plutons.", "img": "", "fixes": 0}, {"t": "L'accrétion continentale :", "p": ["désigne la production de croûte continentale par le magmatisme des zones de subduction", "se traduit aujourd'hui par une augmentation rapide de la surface totale de croûte continentale", "a été très importante entre -3 et -1 Ga, puis a beaucoup diminué", "désigne la formation de la croûte océanique à l'axe des dorsales"], "b": "AC", "j": "La production de magmas en zone de subduction est le principal « fabricant » de croûte continentale récente. Aujourd'hui, formation et destruction s'équilibrent à peu près : la surface de croûte continentale est stable.", "img": "", "fixes": 0}, {"t": "À propos du rôle de la subduction dans la mobilité des plaques :", "p": ["en plongeant, la lithosphère océanique tire le reste de la plaque", "en vieillissant, la lithosphère océanique devient plus dense que l'asthénosphère", "les plaques sont des radeaux transportés passivement par le manteau", "la lithosphère froide qui s'enfonce constitue le mouvement descendant de la convection du manteau"], "b": "ABD", "j": "La lithosphère océanique s'épaissit et se densifie en vieillissant, puis plonge en tirant la plaque. Les plaques ne sont pas des radeaux portés par le manteau : elles font elles-mêmes partie de la convection.", "img": "", "fixes": 0}, {"t": "Une plaque est bordée par de grandes zones de subduction. On peut prévoir que sa dorsale est :", "p": ["lente, car la subduction freine le déplacement de la plaque", "inactive, car la subduction remplace l'accrétion", "rapide, car la plaque est tirée par la lithosphère qui plonge", "de vitesse quelconque, car la subduction n'a pas d'effet sur l'accrétion"], "b": "C", "j": "Les plaques bordées par de grandes zones de subduction (plaque Pacifique) ont une dorsale rapide ; celles qui ne subductent pas ou peu (de part et d'autre de l'Atlantique) ont une dorsale lente.", "img": "", "fixes": 0}], "auto": [{"production": "Subduction et roches des Alpes (consignes 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["Tomographie : bande inclinée où les ondes vont plus vite, donc plus froide ; les séismes y dessinent le plan de Benioff.", "Gabbro → schistes verts (hornblende, chlorite, actinote) → schistes bleus (glaucophane) → éclogite (grenat, jadéite).", "Transformations à l'état solide : hydratation près de la dorsale, déshydratation en subduction."]}, {"nom": "Complétude", "points": ["Tableau des 4 roches rempli : aspect, LPNA, LPA, domaine de stabilité, conclusion."]}]}, {"production": "Magmatisme (consignes 3 et 4)", "criteres": [{"nom": "Exactitude", "points": ["L'eau libérée hydrate le manteau de la plaque chevauchante : la péridotite hydratée fond en partie vers 100 km.", "Andésite (microlitique, en surface, refroidissement rapide) et diorite (grenue, en profondeur) : un même magma."]}]}, {"production": "Schéma bilan", "criteres": [{"nom": "Conformité", "points": ["Titre, couches légendées, fosse, flèche du mouvement de la plaque plongeante."]}, {"nom": "Complétude", "points": ["Foyers des séismes le long de la plaque ; roches de la croûte dans l'ordre jusqu'à 60 km.", "Trajet de l'eau, zone de fusion partielle et ses conditions, roches plutoniques et volcaniques, volcans de l'arc."]}, {"nom": "Cohérence et pertinence", "points": ["Aucune fusion dessinée dans la plaque plongeante ; aucun séisme dans l'asthénosphère."]}]}]}, {"id": 51, "code": "218b73d50f", "titre": "Thème 2 – Activité 6 : Les zones de collision", "questions": [{"t": "Au début d'une collision, la lithosphère continentale ne peut pas être entraînée dans la subduction car :", "p": ["la densité de ses matériaux est plus faible que celle du manteau asthénosphérique", "elle est en grande partie fondue", "elle est trop mince pour plonger", "la densité de ses matériaux est plus élevée que celle du manteau asthénosphérique"], "b": "A", "j": "Les matériaux continentaux, moins denses que le manteau asthénosphérique, ne peuvent pas s'y enfoncer : la lithosphère continentale doit alors s'adapter à la compression en se raccourcissant et en s'épaississant.", "img": "", "fixes": 0}, {"t": "Parmi les structures suivantes, lesquelles témoignent du raccourcissement et de l'empilement des roches dans une chaîne de collision ?", "p": ["Les alignements de volcans de point chaud", "Les nappes de charriage", "Les failles inverses", "Les plis"], "b": "BCD", "j": "Plis, failles inverses, chevauchements et nappes de charriage sont les structures tectoniques qui attestent du raccourcissement et de l'empilement. Les alignements de point chaud relèvent du volcanisme intra-plaque.", "img": "", "fixes": 0}, {"t": "À propos des déformations observées dans les chaînes de collision :", "p": ["les failles inverses se forment surtout en profondeur, là où la température est élevée", "les failles inverses traduisent une déformation cassante et un raccourcissement", "les plis traduisent une déformation souple (ductile) des roches", "la direction des contraintes est parallèle à l'axe des plis"], "b": "BC", "j": "En profondeur, où la température est importante, les roches se déforment de façon ductile (plis) ; dans les zones superficielles, plus froides, la déformation est cassante (failles inverses). Les contraintes sont perpendiculaires à l'axe des plis.", "img": "", "fixes": 0}, {"t": "Une nappe de charriage est :", "p": ["une grosse « bulle » de magma cristallisée en profondeur", "un pli affectant une série sédimentaire restée en place", "une couche de sédiments déposée sur le plancher océanique", "un ensemble de formations géologiques, parfois de très grande taille, qui a glissé sur plusieurs kilomètres en chevauchant les formations en place"], "b": "D", "j": "Les nappes de charriage mettent en « contact anormal » des roches initialement très éloignées, ce qui permet de les repérer ; elles contribuent à l'empilement et à l'épaississement de la croûte.", "img": "", "fixes": 0}, {"t": "Sous la plaine du Gange, le Moho est à environ 35 km de profondeur ; sous le plateau du Tibet, au cœur de la chaîne himalayenne, il est à environ 70 km. L’épaississement de la croûte sous la chaîne est d’environ :", "p": ["35 km", "70 km", "105 km", "0 km : la croûte a la même épaisseur partout"], "b": "A", "j": "70 − 35 = 35 km : la croûte est épaissie d’environ 35 km sous la chaîne. Cet épaississement en profondeur constitue la racine crustale, comme sous les Alpes.", "img": "", "fixes": 0}, {"t": "À propos de la structure profonde des chaînes de collision :", "p": ["les profils ECORS sont des images de la croûte en profondeur obtenues grâce aux ondes sismiques", "les profils ECORS sont obtenus par des forages qui traversent toute la croûte", "sous les Alpes, le Moho est moins profond que sous le reste du continent", "sous la chaîne, la croûte est épaissie : on parle de racine crustale"], "b": "AD", "j": "ECORS signifie Étude de la Croûte Continentale et Océanique par Réflexion Sismique. Ces profils montrent sous les Alpes un Moho plus profond et une croûte découpée en écailles empilées.", "img": "", "fixes": 0}, {"t": "À propos de la collision :", "p": ["elle aboutit à un amincissement de la croûte continentale", "elle correspond à l'affrontement de deux masses continentales qui bordaient un océan disparu", "la chaîne de l'Himalaya résulte de la collision entre le sous-continent indien et le bloc eurasiatique", "elle oppose deux lithosphères de densités très différentes"], "b": "BC", "j": "La collision est le terme ultime de la subduction. L'affrontement de lithosphères de même densité conduit à un épaississement crustal.", "img": "", "fixes": 0}, {"t": "La coésite, minéral que l'on peut trouver dans des roches continentales d'une chaîne de collision, témoigne :", "p": ["d'une hydratation des roches par l'eau de mer", "d'une fusion partielle de la croûte continentale", "d'un métamorphisme sous des pressions et des températures très importantes, lié à une subduction continentale", "du refroidissement rapide d'un magma en surface"], "b": "C", "j": "La lithosphère continentale peut légèrement entrer en subduction : ses roches, soumises à des pressions et températures très importantes, subissent un métamorphisme au cours duquel se forme par exemple la coésite.", "img": "", "fixes": 0}, {"t": "Des roches argileuses (pélites) enfouies de plus en plus profondément se transforment successivement en :", "p": ["gneiss, micaschistes, schistes", "schistes, gneiss, micaschistes", "micaschistes, schistes, gneiss", "schistes, micaschistes, gneiss"], "b": "D", "j": "Avec un enfouissement croissant, les argiles sont de plus en plus transformées : on observe successivement des schistes, puis des micaschistes et des gneiss.", "img": "", "fixes": 0}, {"t": "Lors du métamorphisme des roches enfouies dans une chaîne de collision :", "p": ["de nouveaux minéraux cristallisent", "les transformations se font à l'état solide", "la composition chimique de la roche change fortement", "la texture de la roche est modifiée : une schistosité apparaît"], "b": "ABD", "j": "Quand pression et température augmentent, les minéraux devenus instables réagissent entre eux et donnent de nouveaux minéraux, à l'état solide. La composition chimique de la roche, elle, ne change pas.", "img": "", "fixes": 0}, {"t": "L'anatexie :", "p": ["est la fusion partielle d'une roche métamorphique lorsque la température et la pression continuent d'augmenter", "concerne d'abord les minéraux dont la température de fusion est la plus faible", "est une transformation des minéraux à l'état solide", "est une fusion totale de la roche"], "b": "AB", "j": "Si température et pression continuent de croître, une partie de la roche métamorphique fond et donne un magma : seuls les minéraux les moins réfractaires fondent. La transformation à l'état solide est le métamorphisme.", "img": "", "fixes": 0}, {"t": "Une migmatite est :", "p": ["une roche argileuse de surface qui n'a pas été transformée", "un gneiss contenant des lentilles granitiques issues de la cristallisation d'un magma d'anatexie", "une roche volcanique à structure microlitique des zones de subduction", "un métagabbro contenant du glaucophane"], "b": "B", "j": "Les migmatites sont des gneiss dans lesquels une fusion partielle (anatexie) a produit un magma qui a cristallisé sous forme de lentilles granitiques.", "img": "", "fixes": 0}, {"t": "Les ophiolites observées dans les Alpes :", "p": ["sont des fragments de croûte continentale", "se forment par anatexie de la croûte continentale", "sont les témoins d'un océan aujourd'hui refermé", "sont constituées, de haut en bas, de basaltes en coussins, de gabbros et de péridotites"], "b": "CD", "j": "On retrouve dans les ophiolites la succession des roches d'une lithosphère océanique (basaltes en coussins, gabbros, péridotites) : c'est un ancien plancher océanique, témoin de la fermeture d'un océan.", "img": "", "fixes": 0}, {"t": "L'épaississement de la croûte dans une chaîne de collision :", "p": ["résulte d'un raccourcissement et d'un empilement des matériaux", "enfouit des roches, qui sont alors soumises à des pressions et des températures croissantes", "se traduit par un Moho qui peut dépasser 50 km de profondeur sous la chaîne", "résulte de l'accumulation de magma basaltique produit à l'axe d'une dorsale"], "b": "ABC", "j": "L'épaississement crustal est d'origine tectonique (raccourcissement, empilement par chevauchements et nappes de charriage). Les roches enfouies se transforment alors par métamorphisme.", "img": "", "fixes": 0}], "auto": [{"production": "Indices tectoniques et ECORS (consignes 1 et 2)", "criteres": [{"nom": "Conformité", "points": ["Deux dessins titrés (couches non tassées, tassées), sens de la poussée ; raccourcissement (Li − Lf) ÷ Li × 100, en %."]}, {"nom": "Exactitude", "points": ["Plis : déformation souple ; failles inverses, chevauchements, nappes de charriage : cassure et empilement.", "ECORS : Moho à 36 km hors de la chaîne, 57 km sous les Alpes : racine crustale faite d'écailles empilées."]}]}, {"production": "Indices pétrographiques (consigne 3)", "criteres": [{"nom": "Exactitude", "points": ["Schiste → micaschiste → gneiss : même composition chimique, nouveaux minéraux et schistosité, à l'état solide.", "Minéraux repères (biotite, grenat, staurotide) : plus de 500 °C, ≈ 20 km : les roches ont été enfouies."]}]}, {"production": "Texte explicatif illustré (bilan)", "criteres": [{"nom": "Complétude", "points": ["J'utilise les deux types d'indices : tectoniques (raccourcissement, empilement) et pétrographiques (métamorphisme)."]}, {"nom": "Cohérence et pertinence", "points": ["Je relie chaque indice à ce qu'il prouve : la croûte s'épaissit par raccourcissement et empilement."]}, {"nom": "Complétude", "points": ["Schéma : compression, plis, failles inverses, nappe, Moho et racine crustale, zone de métamorphisme, titre."]}, {"nom": "Exactitude", "points": ["Je n'écris pas que les roches ont fondu (l'anatexie est partielle) ni que du magma épaissit la croûte."]}, {"nom": "Conformité", "points": ["Introduction, un paragraphe par idée, conclusion qui répond ; vocabulaire précis."]}]}]}]}, {"nom": "2nd", "seances": [{"id": 1, "code": "5a9591ca6a", "titre": "Activité 1 : Rappels méthodologiques et cellules", "questions": [{"t": "Toutes les cellules possèdent :", "p": ["une membrane plasmique.", "un noyau.", "un cytoplasme.", "du matériel génétique."], "b": "ACD", "j": "Membrane plasmique, cytoplasme et matériel génétique sont communs à toutes les cellules ; noyau et paroi ne sont pas toujours présents.", "img": "", "fixes": 0}, {"t": "Une cellule procaryote :", "p": ["ne possède pas de noyau.", "a son matériel génétique libre dans le cytoplasme.", "possède des mitochondries.", "mesure quelques micromètres."], "b": "ABD", "j": "Les procaryotes n’ont ni noyau ni compartiments internes (donc pas de mitochondries).", "img": "", "fixes": 0}, {"t": "Une cellule eucaryote :", "p": ["possède un noyau.", "possède des compartiments internes.", "peut constituer à elle seule un organisme.", "ne possède jamais de paroi."], "b": "ABC", "j": "Elle mesure quelques dizaines de micromètres (plus grande qu’un procaryote) ; il existe des unicellulaires eucaryotes ; les cellules végétales et fongiques ont une paroi.", "img": "", "fixes": 0}, {"t": "Une paroi rigide entoure la membrane plasmique des cellules :", "p": ["animales.", "végétales.", "de champignons.", "bactériennes."], "b": "BCD", "j": "La paroi est présente chez les cellules végétales, fongiques et bactériennes, absente chez les cellules animales.", "img": "", "fixes": 0}, {"t": "Les chloroplastes :", "p": ["sont présents dans toutes les cellules eucaryotes.", "sont présents chez les végétaux chlorophylliens.", "sont présents chez les bactéries.", "sont des organites."], "b": "BD", "j": "Parmi les eucaryotes, seuls les végétaux chlorophylliens possèdent des chloroplastes ; les procaryotes n’ont pas de compartiments internes.", "img": "", "fixes": 0}, {"t": "Un organisme pluricellulaire :", "p": ["est constitué de plusieurs cellules.", "peut être constitué de cellules procaryotes.", "est constitué de cellules eucaryotes.", "est par exemple un animal."], "b": "ACD", "j": "Les organismes pluricellulaires sont constitués de cellules eucaryotes.", "img": "", "fixes": 0}, {"t": "Un organisme unicellulaire :", "p": ["est constitué d’une seule cellule.", "est toujours procaryote.", "peut être eucaryote.", "peut être procaryote."], "b": "ACD", "j": "Les unicellulaires peuvent être procaryotes ou eucaryotes.", "img": "", "fixes": 0}, {"t": "La membrane plasmique :", "p": ["délimite la cellule.", "n’existe que chez les eucaryotes.", "évite que les molécules de la cellule soient diluées dans le milieu environnant.", "est remplacée par la paroi chez les végétaux."], "b": "AC", "j": "Toutes les cellules ont une membrane plasmique ; la paroi s’y ajoute, elle ne la remplace pas.", "img": "", "fixes": 0}, {"t": "À propos des tailles :", "p": ["une bactérie mesure quelques micromètres.", "une cellule eucaryote mesure généralement quelques dizaines de micromètres.", "une cellule eucaryote mesure généralement quelques millimètres.", "une cellule procaryote est en général plus petite qu’une cellule eucaryote."], "b": "ABD", "j": "Procaryote : quelques µm ; eucaryote : quelques dizaines de µm.", "img": "", "fixes": 0}, {"t": "Le matériel génétique :", "p": ["est présent dans toutes les cellules.", "est toujours enfermé dans un noyau.", "est contenu dans le noyau chez les eucaryotes.", "est libre dans le cytoplasme chez les procaryotes."], "b": "ACD", "j": "Toutes les cellules possèdent du matériel génétique ; seule sa localisation diffère.", "img": "", "fixes": 0}, {"t": "Parmi ces êtres vivants, lesquels sont constitués de cellules eucaryotes ?", "p": ["Un chêne.", "Un champignon.", "Une bactérie.", "Une levure."], "b": "ABD", "j": "Animaux, végétaux et champignons sont eucaryotes ; la levure possède des mitochondries, c’est un eucaryote unicellulaire.", "img": "", "fixes": 0}, {"t": "Quelle structure est commune à toutes les cellules ?", "p": ["la membrane plasmique", "la paroi", "les chloroplastes", "le noyau"], "b": "A", "j": "Toutes les cellules possèdent une membrane plasmique, un cytoplasme et du matériel génétique. Le noyau, la paroi et les chloroplastes ne sont présents que dans certaines cellules.", "img": "", "fixes": 0}, {"t": "La membrane plasmique et les mitochondries ne sont pas visibles au microscope optique car :", "p": ["elles sont trop fines", "elles sont absentes des cellules animales", "elles n’existent que chez les procaryotes", "elles sont situées dans le noyau"], "b": "A", "j": "Ces structures sont trop fines pour le microscope optique : elles ne sont visibles qu’au microscope électronique.", "img": "", "fixes": 0}, {"t": "Une cellule procaryote :", "p": ["mesure quelques micromètres", "ne possède pas de noyau", "possède des mitochondries", "ne possède pas de matériel génétique"], "b": "AB", "j": "Les cellules procaryotes sont de petites cellules sans noyau ni compartiments internes (donc sans mitochondries). Leur matériel génétique existe : il est libre dans le cytoplasme.", "img": "", "fixes": 0}, {"t": "Les cellules eucaryotes sont celles :", "p": ["des animaux", "des végétaux", "des champignons", "des bactéries"], "b": "ABC", "j": "Animaux, végétaux et champignons ont des cellules eucaryotes (avec noyau). Les cellules des bactéries sont procaryotes.", "img": "", "fixes": 0}, {"t": "Sur une photographie, une cellule mesure 4 cm. L’échelle indique que 1 cm sur la photographie représente 10 micromètres. Quelle est la taille réelle de cette cellule ?", "p": ["4 micromètres", "40 micromètres", "14 micromètres", "400 micromètres"], "b": "B", "j": "4 cm × 10 micromètres par cm = 40 micromètres. L’échelle associée à une photographie permet de calculer la taille réelle.", "img": "", "fixes": 0}, {"t": "Une cellule possède un noyau, une paroi et des chloroplastes. Il s’agit d’une cellule :", "p": ["de champignon", "animale", "bactérienne", "de végétal chlorophyllien"], "b": "D", "j": "Seuls les végétaux chlorophylliens possèdent des chloroplastes. Une cellule de champignon a bien un noyau et une paroi, mais pas de chloroplastes.", "img": "", "fixes": 0}, {"t": "Les organismes pluricellulaires :", "p": ["peuvent être procaryotes", "sont constitués d’une cellule isolée", "sont une association de plusieurs cellules", "sont constitués de cellules eucaryotes"], "b": "CD", "j": "Un organisme pluricellulaire est une association de plusieurs cellules, toujours eucaryotes. Ce sont les unicellulaires qui peuvent être procaryotes ou eucaryotes.", "img": "", "fixes": 0}], "auto": [{"production": "Dessins d'observation", "criteres": [{"nom": "Conformité", "points": ["Chaque dessin a un titre qui dit ce qui est observé (mousse, épiderme d'oignon).", "J'ai indiqué le grossissement utilisé.", "Mes légendes sont écrites à l'horizontale, reliées par des traits tirés à la règle.", "J'ai dessiné au crayon à papier, avec des traits nets, sans ombrer."]}, {"nom": "Exactitude", "points": ["J'ai dessiné seulement ce que j'ai vu au microscope, pas ce que je sais.", "J'ai légendé la paroi, la membrane plasmique, le cytoplasme et le noyau quand ils sont visibles.", "J'ai légendé les chloroplastes sur les cellules de mousse."]}]}, {"production": "Tableau de comparaison", "criteres": [{"nom": "Complétude", "points": ["J'ai rempli toutes les cases avec + ou −, et donné un titre au tableau."]}, {"nom": "Exactitude", "points": ["Toutes les cellules ont une membrane plasmique et un cytoplasme.", "La cellule bactérienne n'a ni noyau ni mitochondrie : elle est procaryote.", "Seule la cellule végétale chlorophyllienne a des chloroplastes."]}]}, {"production": "Réponse à la problématique", "criteres": [{"nom": "Complétude", "points": ["J'ai cité les points communs à toutes les cellules (membrane, cytoplasme, matériel génétique).", "J'ai distingué les cellules eucaryotes (noyau, organites) des cellules procaryotes."]}]}]}, {"id": 2, "code": "b58ab4c113", "titre": "Activité 2 : Cellules, spécialisation cellulaire et tissus", "questions": [{"t": "Parmi ces fonctions, lesquelles sont des fonctions vitales d’un organisme ?", "p": ["La nutrition.", "La reproduction.", "La communication.", "La fossilisation."], "b": "ABC", "j": "Nutrition, reproduction, communication, défense… sont les fonctions vitales citées dans le cours.", "img": "", "fixes": 0}, {"t": "Un organite :", "p": ["est une structure située à l’intérieur d’une cellule.", "assure une fonction précise.", "mesure généralement quelques micromètres.", "est présent dans les cellules procaryotes."], "b": "ABC", "j": "Un ensemble de cellules est un tissu ; les procaryotes n’ont pas de compartiments internes.", "img": "", "fixes": 0}, {"t": "La mitochondrie :", "p": ["est un organite.", "permet la respiration.", "permet la photosynthèse.", "n’est visible qu’au microscope électronique."], "b": "ABD", "j": "La photosynthèse a lieu dans le chloroplaste ; les bactéries n’ont pas de compartiments internes.", "img": "", "fixes": 0}, {"t": "Le chloroplaste :", "p": ["permet la photosynthèse.", "est présent dans les cellules animales.", "est un organite.", "est présent chez tous les eucaryotes."], "b": "AC", "j": "Seuls les végétaux chlorophylliens en possèdent.", "img": "", "fixes": 0}, {"t": "Les cellules spécialisées :", "p": ["assurent chacune une fonction précise.", "peuvent différer par leur équipement en organites.", "se rencontrent chez les eucaryotes pluricellulaires.", "n’existent que chez les bactéries."], "b": "ABC", "j": "C’est la différence d’équipement en organites qui explique la diversité des fonctions.", "img": "", "fixes": 0}, {"t": "Un tissu :", "p": ["est un ensemble de cellules d’un même type.", "est un ensemble fonctionnel.", "est constitué de plusieurs organes.", "a ses cellules maintenues entre elles par la matrice extracellulaire."], "b": "ABD", "j": "C’est l’organe qui est constitué de plusieurs tissus, pas l’inverse.", "img": "", "fixes": 0}, {"t": "La matrice extracellulaire :", "p": ["est située entre les cellules.", "est située à l’intérieur du noyau.", "assure l’adhérence et la cohésion des cellules d’un tissu.", "est un réseau de molécules de nature chimique variée."], "b": "ACD", "j": "La matrice est extracellulaire : elle se trouve à l’extérieur des cellules.", "img": "", "fixes": 0}, {"t": "L’espace situé entre les cellules d’un tissu se nomme :", "p": ["le cytoplasme.", "la matrice extracellulaire.", "la paroi.", "la membrane plasmique."], "b": "B", "j": "Définition de la matrice extracellulaire.", "img": "", "fixes": 0}, {"t": "Un organe :", "p": ["est généralement constitué de plusieurs tissus.", "regroupe des tissus qui participent à une même fonction.", "est un organite de grande taille.", "est une structure plus complexe qu’un tissu."], "b": "ABD", "j": "Plusieurs tissus signifie plusieurs types de cellules ; un organite est une structure interne à la cellule.", "img": "", "fixes": 0}, {"t": "À propos des niveaux d’organisation du vivant :", "p": ["un organite est plus petit que la cellule qui le contient.", "un organe est constitué de tissus.", "une cellule est constituée de tissus.", "un tissu est constitué de cellules."], "b": "ABD", "j": "Organite < cellule < tissu < organe < organisme.", "img": "", "fixes": 0}, {"t": "Chez un organisme unicellulaire :", "p": ["toutes les fonctions vitales sont assurées par la même cellule.", "il existe des tissus.", "la cellule doit assurer sa nutrition.", "la cellule peut être eucaryote."], "b": "ACD", "j": "Tissus et organes n’existent que chez les pluricellulaires.", "img": "", "fixes": 0}, {"t": "Un organite :", "p": ["est une petite structure située dans une cellule", "est constitué de plusieurs tissus", "assure une fonction", "est un ensemble de cellules d’un même type"], "b": "AC", "j": "Un organite est une petite structure, au sein d’une cellule, assurant une fonction. Un ensemble de cellules d’un même type est un tissu ; une structure faite de plusieurs tissus est un organe.", "img": "", "fixes": 0}, {"t": "Un tissu est :", "p": ["une petite structure à l’intérieur d’une cellule", "un ensemble fonctionnel de cellules d’un même type", "l’espace situé entre les cellules", "une structure constituée de plusieurs organes"], "b": "B", "j": "Des cellules d’un même type associées forment un tissu. La structure à l’intérieur d’une cellule est un organite ; l’espace entre les cellules est la matrice extracellulaire.", "img": "", "fixes": 0}, {"t": "La matrice extracellulaire :", "p": ["se trouve à l’intérieur des cellules", "permet la communication entre les cellules d’un tissu", "est constituée d’un seul type de molécule", "  0}, {"t": "Un écosystème :", "p": ["est l’ensemble biotope + biocénose.", "comprend un milieu de vie, le biotope.", "comprend les espèces vivant dans ce milieu, la biocénose.", "est le siège d’interactions entre les êtres vivants."], "b": "ABCD", "j": "Définition complète de l’écosystème.", "img": "", "fixes": 0}, {"t": "À propos de la notion d’espèce :", "p": ["le critère d’interfécondité repose sur la capacité à donner une descendance fertile.", "ce critère n’est pas utilisable pour les fossiles.", "ce critère est utilisable pour tous les êtres vivants sans exception.", "l’espèce est un concept créé par l’être humain."], "b": "ABD", "j": "Le critère d’interfécondité a des limites (fossiles, bactéries…).", "img": "", "fixes": 0}, {"t": "La disparition d’une espèce dans un écosystème :", "p": ["a un impact sur l’ensemble de l’écosystème.", "diminue la richesse spécifique.", "peut affecter d’autres espèces, car les espèces sont en relation entre elles.", "augmente la richesse spécifique."], "b": "ABC", "j": "Chaque espèce joue un rôle dans l’écosystème.", "img": "", "fixes": 0}], "auto": [{"production": "Tableau de synthèse", "criteres": [{"nom": "Conformité", "points": ["J'ai extrait des documents des informations en lien avec les échelles de la biodiversité."]}, {"nom": "Complétude", "points": ["Mon tableau a trois lignes : les écosystèmes, les espèces, les individus d'une même espèce.", "Pour chaque ligne, j'ai donné ce qu'on compare, des exemples et l'origine des différences.", "J'ai cité des valeurs (ex. : plus de 5 000 espèces en forêt tropicale, 100 à 200 dans la taïga)."]}, {"nom": "Pertinence", "points": ["J'ai relié les écosystèmes au climat (température, précipitations).", "J'ai expliqué que les individus d'une même espèce diffèrent par leurs allèles."]}, {"nom": "Précision", "points": ["J'ai utilisé les mots : écosystème, espèce, gène, allèle, diversité génétique."]}]}, {"production": "Réponse à la problématique", "criteres": [{"nom": "Complétude", "poin : "Une mutation modifie la séquence de nucléotides de l’ADN. Le changement de fréquence d’un allèle dans une population relève de la dérive génétique ou de la sélection naturelle.", "img": "", "fixes": 0}, {"t": "Une portion de gène a pour séquence ATGCCA. Après une mutation, elle devient ATGTCA. Cette mutation est :", "p": ["une délétion", "une addition", "une copie de l’ADN", "une substitution"], "b": "D", "j": "Le nombre de nucléotides n’a pas changé : un C a été remplacé par un T. C’est une substitution.", "img": "", "fixes": 0}, {"t": "Les mutations :", "p": ["peuvent n’avoir aucun effet visible", "sont toujours provoquées par des agents mutagènes", "se produisent au hasard", "se produisent le plus souvent lors de la copie de l’ADN"], "b": "ACD", "j": "Les mutations sont spontanées et aléatoires, surtout lors de la copie de l’ADN, et la plupart n’ont pas d’effet visible. Les agents mutagènes augmentent seulement leur fréquence.", "img": "", "fixes": 0}, {"t": "Les rayons UV sont des agents mutagènes. Cela signifie :", "p": ["qu’ils rendent les mutations avantageuses", "qu’ils empêchent les mutations", "qu’ils augmentent la fréquence des mutations", "qu’ils sont la seule cause des mutations"], "b": "C", "j": "Un agent mutagène augmente la fréquence des mutations. Les mutations se produisent aussi spontanément, sans agent mutagène.", "img": "", "fixes": 0}, {"t": "Une mutation peut être transmise aux descendants si elle est présente :", "p": ["dans une cellule exposée à un agent mutagène", "dans n’importe quelle cellule de l’organisme", "dans une cellule de la peau", "dans une cellule à l’origine des gamètes"], "b": "D", "j": "Seules les mutations présentes dans les cellules à l’origine des gamètes (spermatozoïdes, ovules) peuvent être transmises aux descendants.", "img": "", "fixes": 0}, {"t": "À propos du gène ABO :", "p": ["l’allèle O donne une enzyme fonctionnelle", "A, B et O sont trois gènes différents", "l’allèle O présente une délétion", "les allèles A et B diffèrent par quelques substitutions"], "b": "CD", "j": "A, B et O sont trois allèles d’un même gène. A et B diffèrent par quelques substitutions ; l’allèle O présente une délétion et donne une enzyme non fonctionnelle.", "img": "", "fixes": 0}, {"t": "À propos des types de mutations :", "p": ["une substitution est le remplacement d’un nucléotide par un autre.", "une délétion est la perte d’un nucléotide.", "une addition est l’ajout d’un nucléotide.", "une délétion est l’ajout d’un nucléotide."], "b": "ABC", "j": "Addition = ajout ; délétion = perte ; substitution = remplacement.", "img": "", "fixes": 0}, {"t": "Parmi ces facteurs, lesquels sont des agents mutagènes ?", "p": ["Les rayons UV.", "Des substances de la fumée de tabac.", "Les rayonnements radioactifs.", "Le glucose."], "b": "ABC", "j": "Un agent mutagène augmente la fréquence des mutations.", "img": "", "fixes": 0}], "auto": [{"production": "Tableau des différences", "criteres": [{"nom": "Complétude", "points": ["J'ai relevé les 4 différences entre A et B, et la différence entre A et O (position 258)."]}, {"nom": "Exactitude", "points": ["J'ai nommé le type de différence : substitution (A/B), délétion (A/O)."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Conformité", "points": ["Mon texte a une introduction qui dit ce que je cherche à expliquer.", "Il a un développement en paragraphes et une conclusion qui répond au problème.", "J'ai relu l'orthographe et la construction des phrases."]}, {"nom": "Complétude", "points": ["J'ai expliqué que les allèles d'un gène ont des séquences presque identiques (A et B : 4 nucléotides sur 1 062).", "J'ai expliqué que ces modifications de la séquence sont des mutations (substitution, délétion, addition).", "J'ai dit quand elles se produisent : lors de la copie de l'ADN, avant une division cellulaire.", "J'ai dit qu'elles sont rares (environ 1 pour 100 millions de nucléotides) et se produisent au hasard.", "J'ai cité des agents mutagènes (UV, fumée de turelle.", "img": "", "fixes": 0}, {"t": "La dérive génétique est causée par :", "p": ["le hasard qui fait qu’un individu se reproduit ou non", "le hasard des rencontres entre spermatozoïdes et ovules", "les agents mutagènes", "les prédateurs qui éliminent les individus les plus visibles"], "b": "AB", "j": "La dérive est due à des phénomènes aléatoires (rencontre des gamètes, survie et reproduction des individus). L’élimination des individus les plus visibles par les prédateurs relève de la sélection naturelle.", "img": "", "fixes": 0}, {"t": "Chez les Amish de Pennsylvanie, communauté fondée au XVIIIe siècle par quelques centaines de personnes puis restée isolée, une maladie génétique rare ailleurs (le syndrome d’Ellis-van Creveld) est beaucoup plus fréquente que dans le reste du monde. Cela s’explique par le fait que :", "p": ["cette population est de très grande taille", "des agents mutagènes ont fait apparaître l’allèle chez de nombreux membres de la communauté", "cette population a été fondée par un petit nombre d’individus, parmi lesquels l’allèle était présent", "l’allèle responsable de la maladie est avantageux dans leur milieu"], "b": "C", "j": "C’est l’effet fondateur : par hasard, quelques fondateurs portaient l’allèle ; dans une petite population isolée, la dérive génétique a fortement augmenté sa fréquence. Ce n’est pas une sélection : l’allèle n’apporte aucun avantage.", "img": "", "fixes": 0}, {"t": "La fréquence d’un allèle :", "p": ["est la proportion de cet allèle parmi tous les allèles du même gène dans la population.", "s’exprime en pourcentage.", "reste forcément constante dans une petite population.", "peut changer d’une génération à l’autre."], "b": "ABD", "j": "Dans une petite population, la dérive fait au contraire varier fortement les fréquences.", "img": "", "fixes": 0}, {"t": "Dans une population de petite taille :", "p": ["la dérive génétique est marquée.", "un allèle peut devenir très fréquent en quelques générations.", "la diversité génétique diminue.", "la fréquence des allèles reste constante."], "b": "ABC", "j": "C’est dans les grandes populations que la fréquence reste, en théorie, constante.", "img": "", "fixes": 0}, {"t": "Deux populations isolées l’une de l’autre et soumises à la dérive génétique :", "p": ["deviennent génétiquement différentes.", "se différencient par le seul effet du hasard.", "évoluent de façon prévisible.", "conservent forcément les mêmes fréquences alléliques."], "b": "AB", "j": "La dérive est aléatoire et imprévisible : elle diffère d’une population à l’autre.", "img": "", "fixes": 0}], "auto": [{"production": "Modélisation (consigne 3)", "criteres": [{"nom": "Complétude", "points": ["J'ai comparé 15 et 100 individus : une seule couleur reste beaucoup plus vite avec 15.", "J'ai remarqué que la couleur qui reste change d'un essai à l'autre : c'est imprévisible."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Conformité", "points": ["Mon texte a une introduction qui dit ce que je cherche à expliquer.", "Il a un développement en paragraphes et une conclusion qui répond au problème.", "J'ai relu l'orthographe et la construction des phrases."]}, {"nom": "Complétude", "points": ["J'ai expliqué que les allèles transmis à la génération suivante sont en quelque sorte « tirés au hasard ».", "J'ai dit que, sans qu'aucun allèle soit avantagé, des fréquences changent et des allèles disparaissent.", "J'ai expliqué que cet effet est d'autant plus fort que la population est petite.", "J'ai utilisé l'exemple des huttérites : A10 à 13,6 % contre 6 % en Europe, A11 et A28 absents.", "J'ai expliqué l'effet fondateur : 443 fondateurs, puis une population isolée et petite.", "J'ai conclu : c'est la dérive génétique, qui rend différentes des populations séparées."]}, {"nom": "Exactitude", "points": ["Je n'ai pas confondu dérive génétique (hasard) et sélection naturelle (avantage).", "J'ai utilisé le vocabulaire scientifique de l'activité, sans erreur."]}, {"nom": "Pertinence", "points": ["Mes idées s'enchaînent logiquement, avec des connecteurs (donc, or, ainsi, en effet…).", "Chaque idée sert à répondre au problème posé (rien d'inutile)."]}]}]}, {"id": 13, "code": "ce4e1ca4b3", "titre": "Activité 13 : Sélection naturelle et spéciation", "questions": [{"t": "Au XIXe siècle, en Angleterre, la suie des usines noircit les troncs d’arbres. Posées sur ces troncs, les phalènes (papillons de nuit) de forme claire sont plus facilement repérées par les oiseaux que celles de forme sombre. Au fil des générations, la fréquence de l’allèle à l’origine de la forme sombre :", "p": ["varie uniquement au hasard", "augmente", "diminue", "reste constante"], "b": "B", "j": "Sur les troncs noircis, les phalènes sombres, moins visibles, survivent mieux et transmettent davantage leur allèle : sa fréquence augmente. C’est la sélection naturelle ; le même raisonnement s’applique aux souris des Sand Hills.", "img": "", "fixes": 0}, {"t": "La sélection naturelle :", "p": ["transforme les individus pour qu’ils s’adaptent", "fait apparaître les allèles dont les individus ont besoin", "augmente la fréquence des allèles avantageux dans un milieu donné", "n’est pas due au hasard"], "b": "CD", "j": "Les individus ne se transforment pas : c’est la fréquence des allèles de la population qui change. Les allèles apparaissent au hasard par mutation, pas selon les besoins.", "img": "", "fixes": 0}, {"t": "Contrairement à la sélection naturelle, la dérive génétique :", "p": ["n’agit que dans les grandes populations", "est due au hasard", "dépend de l’avantage apporté par les allèles", "ne modifie pas la fréquence des allèles"], "b": "B", "j": "La dérive génétique modifie la fréquence des allèles de façon aléatoire, surtout dans les petites populations. La sélection naturelle dépend de l’avantage apporté par les allèles dans le milieu.", "img": "", "fixes": 0}, {"t": "À propos des souris des Sand Hills :", "p": ["le pelage sombre est désavantageux dans tous les milieux", "sur le sable clair, les souris sombres sont plus visibles pour les prédateurs", "les souris changent de couleur de pelage pour s’adapter au sol", "sur les sols sombres voisins, ce sont les souris claires qui survivent moins bien"], "b": "BD", "j": "Un caractère est avantageux ou désavantageux selon le milieu : le pelage sombre est défavorable sur le sable clair, mais c’est l’inverse sur les sols sombres. Les individus ne se transforment pas pour s’adapter.", "img": "", "fixes": 0}, {"t": "La spéciation est :", "p": ["la spécialisation d’une cellule dans une fonction précise", "la modification aléatoire de la fréquence des allèles", "la formation de nouvelles espèces à partir d’une même espèce d’origine", "la disparition de nombreuses espèces en un temps court"], "b": "C", "j": "La spéciation est l’apparition de nouvelles espèces à partir d’une espèce d’origine. À ne pas confondre avec la spécialisation cellulaire, ni avec une crise biologique.", "img": "", "fixes": 0}, {"t": "Lors d’une spéciation, les deux populations issues d’une même espèce :", "p": ["restent toujours capables de se reproduire entre elles", "échangent de plus en plus d’allèles", "deviennent de plus en plus différentes au niveau génétique", "sont isolées l’une de l’autre, souvent par une séparation géographique"], "b": "CD", "j": "Isolées, les deux populations n’échangent plus d’allèles : leurs différences génétiques s’accumulent jusqu’à ce qu’elles ne puissent plus se reproduire entre elles.", "img": "", "fixes": 0}, {"t": "Chez les salamandres Ensatina de Californie :", "p": ["aucune population ne peut se reproduire avec une autre", "les populations des deux extrémités de l’aire de répartition ne se reproduisent pratiquement plus entre elles", "les populations voisines se reproduisent encore entre elles", "toutes les populations sont génétiquement identiques"], "b": "BC", "j": "Les populations voisines se reproduisent encore entre elles, mais celles des deux extrémités, trop différentes génétiquement, ne se reproduisent pratiquement plus entre elles.", "img": "", "fixes": 0}, {"t": "Darwin a observé que :", "p": ["la descendance des espèces est trop importante pour que tous les individus survivent.", "il existe une compétition entre les individus.", "cette compétition porte sur l’accès aux ressources ou à la reproduction.", "les espèces ne changent pas au cours du temps."], "b": "ABC", "j": "C’est le point de départ de l’idée de sélection naturelle.", "img": "", "fixes": 0}, {"t": "Un caractère avantageux :", "p": ["l’est dans un milieu donné.", "est avantageux quel que soit le milieu.", "augmente les chances de survie ou de reproduction.", "tend à devenir plus fréquent dans la population au fil des générations."], "b": "ACD", "j": "L’avantage est toujours relatif aux conditions du milieu.", "img": "", "fixes": 0}, {"t": "Deux populations sont devenues deux espèces distinctes quand :", "p": ["elles ne peuvent plus se reproduire entre elles.", "elles vivent à des altitudes différentes.", "elles n’ont plus la même couleur.", "leurs fréquences alléliques sont légèrement différentes."], "b": "A", "j": "Critère d’interfécondité.", "img": "", "fixes": 0}, {"t": "Parmi ces éléments, lesquels interviennent dans la spéciation ?", "p": ["Les mutations, à l’origine des allèles.", "La sélection naturelle.", "L’échange permanent d’allèles entre les deux populations.", "L’isolement des populations."], "b": "ABD", "j": "La spéciation exige au contraire que les populations n’échangent plus d’allèles.", "img": "", "fixes": 0}], "auto": [{"production": "Consignes 1 à 3", "criteres": [{"nom": "Exactitude", "points": ["Sur sol clair, 60 % des souris claires survivent contre 30 % des sombres : le pelage sombre est désavantagé.", "J'ai expliqué que la fréquence de l'allèle « Clair » augmente au fil des générations."]}]}, {"production": "Histoire évolutive (consigne 5)", "criteres": [{"nom": "Complétude", "points": ["J'ai raconté les étapes : une population au nord, extension autour
