 glucagon :", "p": ["est une hormone hyperglycémiante.", "agit sur les cellules musculaires.", "agit sur les cellules du foie.", "stimule la libération de glucose dans le sang."], "b": "ACD", "j": "Sécrété par les cellules α en cas d'hypoglycémie, il fait remonter la glycémie en agissant sur le foie.", "img": "", "fixes": 0}, {"t": "Le glucagon n'agit pas sur les cellules musculaires car :", "p": ["il ne circule pas dans le sang.", "les cellules musculaires ne possèdent pas de récepteurs au glucagon.", "il est détruit par l'insuline.", "les muscles ne contiennent pas de glycogène."], "b": "B", "j": "Une hormone n'agit que sur les cellules qui possèdent ses récepteurs spécifiques : pour le glucagon, les cellules hépatiques.", "img": "", "fixes": 0}, {"t": "Outre le glucagon, quelles hormones sont hyperglycémiantes ?", "p": ["L'acétylcholine.", "L'adrénaline.", "Le cortisol.", "L'insuline."], "b": "BC", "j": "Adrénaline et cortisol, hormones du stress, mobilisent le glucose. L'insuline est la seule hormone hypoglycémiante.", "img": "", "fixes": 0}], "auto": [{"production": "Documents 1 à 9", "criteres": [{"nom": "Complétude", "points": ["Banting et Best : un extrait de pancréas (pas bouilli) fait baisser la glycémie : une hormone, l'insuline."]}, {"nom": "Exactitude", "points": ["Îlots de Langerhans : cellules β (insuline), cellules α (glucagon) ; acini = fonction exocrine.", "Insuline hypoglycémiante (1 → 0,45 g/L) ; glucagon hyperglycémiant ; les îlots détectent eux-mêmes la glycémie.", "Cibles : foie, muscles, tissu adipeux pour l'insuline ; foie seul pour le glucagon (récepteurs, GLUT 2 / GLUT 4)."]}]}, {"production": "Schéma bilan", "criteres": [{"nom": "Complétude", "points": ["Paramètre réglé (1 g/L), capteur et commande (îlots), messages (deux hormones), effecteurs.", "Hyperglycémie : plus d'insuline, stockage ; hypoglycémie : plus de glucagon, le foie libère du glucose."]}, {"nom": "Exactitude", "points": ["Aucune flèche de glucose ne sort du muscle ; la flèche de retour vers le pancréas ferme la boucle."]}, {"nom": "Conformité", "points": ["Titre, légendes, mots hypoglycémiante et hyperglycémiant."]}]}]}, {"id": 95, "code": "d6de21919c", "titre": "Corps humain – Activité 8B : Un modèle de la régulation de la glycémie", "questions": [{"t": "Après un repas riche en glucides :", "p": ["la sécrétion de glucagon augmente.", "la glycémie augmente.", "le foie libère du glucose dans le sang.", "la sécrétion d'insuline augmente."], "b": "BD", "j": "Le rapport insuline/glucagon augmente : le glucose est mis en réserve et la glycémie revient vers sa valeur de référence. La sécrétion de glucagon, elle, diminue.", "img": "", "fixes": 0}, {"t": "Au cours d'un jeûne prolongé :", "p": ["la sécrétion de glucagon augmente.", "la sécrétion d'insuline augmente.", "les muscles libèrent du glucose dans le sang.", "le foie libère du glucose dans le sang."], "b": "AD", "j": "Le rapport insuline/glucagon diminue : le foie libère du glucose (glycogénolyse, néoglucogenèse), ce qui évite l'hypoglycémie.", "img": "", "fixes": 0}, {"t": "Le message hormonal est codé par :", "p": ["la vitesse de circulation du sang.", "la nature de l'hormone uniquement.", "la fréquence de potentiels d'action.", "la concentration de l'hormone dans le sang."], "b": "D", "j": "L'hormone est le messager ; le message, c'est sa concentration. Pour la glycémie, c'est le rapport insuline/glucagon qui détermine la réponse des cellules cibles.", "img": "", "fixes": 0}, {"t": "Dans la boucle de régulation de la glycémie :", "p": ["les effecteurs sont les cellules α et β du pancréas.", "les messagers sont l'insuline et le glucagon.", "les capteurs sont les cellules α et β des îlots de Langerhans.", "le paramètre réglé est la glycémie."], "b": "BCD", "j": "Les effecteurs sont le foie, les muscles et le tissu adipeux. Les cellules α et β détectent les variations de la glycémie et sécrètent les hormones.", "img": "", "fixes": 0}, {"t": "La régulation de la glycémie est une rétroaction négative car :", "p": ["elle ne fonctionne qu'en cas d'hypoglycémie.", "elle fait toujours baisser la glycémie.", "toute variation de la glycémie déclenche une réponse qui s'oppose à cette variation.", "elle amplifie les variations de la glycémie."], "b": "C", "j": "Hyperglycémie : insuline, d'où stockage et baisse de la glycémie. Hypoglycémie : glucagon, d'où libération de glucose et hausse de la glycémie.", "img": "", "fixes": 0}], "auto": [{"production": "Schéma bilan vérifié (consigne 1)", "criteres": [{"nom": "Complétude", "points": ["Les huit réponses du tableau sont sur mon schéma (hormones, cellules, cibles, effets, sens des sécrétions)."]}, {"nom": "Conformité", "points": ["Chaque schéma a un titre qui nomme la glycémie, le pancréas et les deux hormones."]}]}, {"production": "Compte rendu médical (consigne 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Démarche : sujet normal comme témoin, puis le patient en ne changeant qu'un paramètre à la fois."]}, {"nom": "Complétude", "points": ["Diagnostic : hyperglycémie persistante, glucose dans les urines, valeurs relevées citées.", "Étape en panne : insuline nulle et injection efficace → sécrétion ; insuline présente et injection inefficace → cellules cibles.", "Conseils adaptés (injections d'insuline, ou alimentation et activité physique) ; limites du modèle."]}, {"nom": "Exactitude", "points": ["Le nom de la maladie n'est pas attendu ici (activité 9) ; je justifie avec des captures avant / après."]}, {"nom": "Conformité", "points": ["Compte rendu structuré : présentation, diagnostic, justification, lien avec le schéma, conseils."]}]}]}, {"id": 96, "code": "364cb81173", "titre": "Corps humain – Activité 9 : Les diabètes", "questions": [{"t": "L'index glycémique (IG) du glucose est de 100 ; celui des pétales de maïs (corn flakes) est d'environ 80, celui d'une pomme d'environ 40.", "p": ["Après des corn flakes, la glycémie monte plus fortement qu'après une pomme.", "Pour une personne diabétique, privilégier les aliments à IG bas limite les fortes hausses de glycémie.", "Un aliment à IG élevé entraîne une sécrétion d'insuline plus faible.", "Tous les aliments contenant des glucides ont le même IG."], "b": "AB", "j": "Plus l'IG est élevé, plus la glycémie monte vite et haut, et plus la sécrétion d'insuline doit être forte : un repère utile dans l'alimentation des diabétiques.", "img": "", "fixes": 0}, {"t": "Un diabète est diagnostiqué lorsque :", "p": ["la glycémie à jeun dépasse 1,26 g/L à deux reprises.", "la glycémie à jeun est de 1 g/L.", "la glycémie augmente après un repas.", "la glycémie à jeun est inférieure à 0,7 g/L."], "b": "A", "j": "Le diabète est une hyperglycémie chronique, due à un dysfonctionnement de la régulation de la glycémie (une glycémie supérieure à 2 g/L est aussi un critère de dépistage).", "img": "", "fixes": 0}, {"t": "Le diabète de type 1 :", "p": ["est une maladie auto-immune.", "se déclare surtout chez des sujets jeunes.", "est dû à la destruction des cellules β des îlots de Langerhans.", "se caractérise par une sécrétion d'insuline très faible ou nulle."], "b": "ABCD", "j": "Des lymphocytes détruisent les cellules β, reconnues à tort comme étrangères. Il représente 5 à 15 % des cas de diabète.", "img": "", "fixes": 0}, {"t": "Le diabète de type 2 :", "p": ["représente 5 à 15 % des cas de diabète.", "s'accompagne d'abord d'une sécrétion d'insuline élevée, qui diminue ensuite.", "est dû à une destruction auto-immune des cellules β.", "est dû à une baisse de la sensibilité des cellules cibles à l'insuline."], "b": "BD", "j": "Les cellules β compensent d'abord l'insulinorésistance en sécrétant davantage, puis s'épuisent : l'hyperglycémie chronique s'installe. Il représente 85 à 95 % des cas de diabète.", "img": "", "fixes": 0}, {"t": "Un enfant de 12 ans, mince, a beaucoup maigri en quelques semaines et urine abondamment. Sa glycémie à jeun est de 2,5 g/L et son insulinémie est presque nulle. Il s'agit probablement :", "p": ["d'une glycémie normale.", "d'un diabète de type 1.", "d'une hypoglycémie.", "d'un diabète de type 2."], "b": "B", "j": "Sujet jeune, sans surpoids, amaigrissement rapide, insulinémie effondrée : tableau du diabète de type 1.", "img": "", "fixes": 0}, {"t": "Un homme de 58 ans, en surpoids et sédentaire, a une glycémie à jeun de 1,4 g/L (mesurée deux fois) et une insulinémie élevée. Il s'agit probablement :", "p": ["d'une glycémie normale.", "d'une maladie auto-immune.", "d'un diabète de type 1.", "d'un diabète de type 2."], "b": "D", "j": "Âge, surpoids, sédentarité et insuline présente mais inefficace : tableau du diabète de type 2.", "img": "", "fixes": 0}, {"t": "À propos des traitements des diabètes :", "p": ["À un stade avancé, le diabète de type 2 peut nécessiter des injections d'insuline.", "Le diabète de type 1 nécessite des injections d'insuline.", "Le diabète de type 1 se soigne par un simple régime.", "Le diabète de type 2 est d'abord pris en charge par l'alimentation, l'activité physique et des médicaments."], "b": "ABD", "j": "Les injections d'insuline font baisser la glycémie, mais ne rétablissent pas la régulation naturelle.", "img": "", "fixes": 0}, {"t": "Parmi les facteurs impliqués dans le diabète de type 1 :", "p": ["certains allèles des gènes HLA (DR3, DR4) augmentent le risque.", "gènes de prédisposition et facteurs de l'environnement interagissent.", "une infection par un entérovirus augmente le risque.", "l'obésité est la cause principale."], "b": "ABC", "j": "C'est une maladie multifactorielle. L'obésité et la sédentarité sont des facteurs de risque du diabète de type 2.", "img": "", "fixes": 0}, {"t": "Le diabète de type 2 touche près de 40 % des Indiens Pima vivant aux États-Unis, 7 % des Pima vivant au Mexique (plus actifs, moins d'obésité) et 3 % des Mexicains non Pima ayant le même mode de vie.", "p": ["Le diabète de type 2 résulte de l'interaction entre des gènes et l'environnement.", "Les Pima présentent une prédisposition génétique.", "Le diabète de type 2 est uniquement d'origine génétique.", "Le mode de vie influence le risque de diabète de type 2."], "b": "ABD", "j": "Même patrimoine génétique, modes de vie différents : 40 % contre 7 % (effet de l'environnement). Même mode de vie, patrimoines génétiques différents : 7 % contre 3 % (effet des gènes).", "img": "", "fixes": 0}, {"t": "Lorsqu'un jumeau vrai est diabétique, l'autre l'est aussi dans 30 à 50 % des cas pour le diabète de type 1 et dans 50 à 90 % des cas pour le diabète de type 2.", "p": ["Les gènes n'expliquent pas tout, puisque la concordance n'atteint pas 100 %.", "Le diabète de type 1 est une maladie purement génétique.", "Il existe une composante génétique dans les deux types de diabète.", "La composante génétique semble plus forte pour le diabète de type 2."], "b": "ACD", "j": "Des jumeaux vrais ont le même génotype : s'ils ne sont pas toujours tous deux atteints, c'est que des facteurs de l'environnement interviennent.", "img": "", "fixes": 0}, {"t": "À long terme, l'hyperglycémie chronique des diabètes peut provoquer :", "p": ["des atteintes des nerfs.", "des lésions des vaisseaux sanguins.", "des accidents vasculaires cérébraux.", "des atteintes des reins."], "b": "ABCD", "j": "Ces complications font la gravité du diabète, d'où l'importance du dépistage et de l'équilibre de la glycémie.", "img": "", "fixes": 0}], "auto": [{"production": "Origine des diabètes (consignes 1 et 2)", "criteres": [{"nom": "Exactitude", "points": ["Critère commun : deux glycémies à jeun supérieures à 1,26 g/L ; type 1 jeune et mince, type 2 après 50 ans, surpoids.", "Type 1 : insuline presque nulle (2 à 3 µU/mL), cellules β détruites par une réaction auto-immune.", "Type 2 : insuline présente mais en retard, insulinorésistance (10 % contre 45 % d'entrée du glucose).", "Index glycémique : lentilles (29) plutôt que pain blanc (69) : hausse de glycémie faible et étalée."]}]}, {"production": "Logiciel et schémas (consigne 3)", "criteres": [{"nom": "Complétude", "points": ["Pancréas à 0 : diabète de type 1, corrigé par l'insuline ; sensibilité à 0 : type 2, injection presque sans effet."]}, {"nom": "Exactitude", "points": ["Croix sur la cellule β (type 1), sur le récepteur et l'entrée du glucose de la cellule cible (type 2)."]}]}, {"production": "Réponse à la problématique", "criteres": [{"nom": "Complétude", "points": ["Dans les deux cas le glucose reste dans le sang : hyperglycémie chronique.", "Traitements : insuline (type 1) ; alimentation, activité physique, médicaments, puis insuline (type 2)."]}, {"nom": "Conformité", "points": ["Quelques lignes structurées, vocabulaire précis (auto-immune, insulinorésistance)."]}]}]}, {"id": 97, "code": "6c719c2367", "titre": "Corps humain – Activité 10A : Le stress aigu", "questions": [{"t": "Le stress aigu :", "p": ["met en jeu le système nerveux et le système hormonal.", "est une maladie.", "se traduit par des réponses totalement différentes selon la nature de l'agent stresseur.", "est un ensemble de réponses adaptatives de l'organisme face à un agent stresseur."], "b": "AD", "j": "C'est un mécanisme d'adaptation qui prépare l'organisme à réagir ; on parle d'adaptabilité de l'individu. Les réponses sont les mêmes quelle que soit la nature de l'agent stresseur.", "img": "", "fixes": 0}, {"t": "Les phases de la réponse au stress se succèdent dans l'ordre suivant :", "p": ["épuisement, alarme, résistance.", "alarme, résistance, épuisement.", "résistance, alarme, épuisement.", "alarme, épuisement, résistance."], "b": "B", "j": "La phase d'épuisement ne survient que si l'agent stresseur persiste : on sort alors du stress aigu pour entrer dans le stress chronique.", "img": "", "fixes": 0}, {"t": "Parmi ces manifestations, lesquelles s'observent lors d'un stress aigu ?", "p": ["Une baisse de la glycémie.", "Une accélération du rythme cardiaque.", "Une dilatation des pupilles.", "Une accélération de la ventilation."], "b": "BCD", "j": "Le foie libère du glucose : la glycémie augmente. L'ensemble de ces réponses prépare l'organisme à un effort immédiat.", "img": "", "fixes": 0}, {"t": "L'« adaptabilité » de l'organisme face au stress désigne :", "p": ["la capacité d'un individu à ajuster son fonctionnement face à une perturbation.", "l'apparition de mutations favorables.", "la résistance des bactéries aux antibiotiques.", "l'évolution d'une population par sélection naturelle."], "b": "A", "j": "Ne pas confondre l'adaptabilité d'un individu (physiologique, réversible) avec l'adaptation évolutive d'une population (génétique, sur plusieurs générations).", "img": "", "fixes": 0}, {"t": "Le système limbique comprend notamment :", "p": ["l'aire motrice primaire.", "l'amygdale, impliquée dans la peur et les émotions.", "l'hippocampe, impliqué dans la mémoire.", "l'hypothalamus."], "b": "BCD", "j": "Le système limbique, ou « cerveau émotionnel », communique avec le cortex préfrontal et stimule l'hypothalamus lors d'un stress.", "img": "", "fixes": 0}, {"t": "Lors d'un stress aigu, la voie de réponse la plus rapide est :", "p": ["hypothalamus → hypophyse → corticosurrénale → cortisol.", "système limbique → hypothalamus → système nerveux sympathique → médullosurrénale → adrénaline.", "pancréas → insuline → foie.", "moelle épinière → motoneurone → muscle."], "b": "B", "j": "C'est une commande nerveuse : la réponse apparaît en quelques secondes. A : voie hormonale, plus lente.", "img": "", "fixes": 0}, {"t": "La médullosurrénale :", "p": ["sécrète l'adrénaline (et la noradrénaline).", "est commandée par le système nerveux sympathique.", "est stimulée par l'ACTH.", "n'intervient que plusieurs heures après le début du stress."], "b": "AB", "j": "La glande surrénale comprend deux parties : la médullosurrénale (interne, à commande nerveuse) et la corticosurrénale (externe, à commande hormonale). Sa réponse apparaît en quelques secondes.", "img": "", "fixes": 0}, {"t": "L'adrénaline :", "p": ["augmente le débit sanguin vers la peau et l'intestin.", "contracte les bronchioles, ce qui limite l'entrée d'air.", "stimule la libération de glucose par le foie.", "augmente la fréquence cardiaque."], "b": "CD", "j": "L'adrénaline augmente la disponibilité du glucose et du dioxygène. Elle réduit l'apport de sang à la peau, à l'intestin et aux reins au profit des muscles, du cœur et du cerveau. Elle dilate les bronchioles.", "img": "", "fixes": 0}, {"t": "La réponse hormonale au stress fait intervenir, dans l'ordre :", "p": ["l'ACTH, puis la CRH, puis le cortisol.", "l'adrénaline, puis l'insuline, puis le glucagon.", "la CRH, puis l'ACTH, puis le cortisol.", "le cortisol, puis l'ACTH, puis la CRH."], "b": "C", "j": "L'hypothalamus sécrète la CRH, qui stimule l'hypophyse ; celle-ci sécrète l'ACTH, qui stimule la corticosurrénale ; celle-ci sécrète le cortisol.", "img": "", "fixes": 0}, {"t": "À propos des hormones du stress :", "p": ["La CRH est sécrétée par l'hypothalamus.", "Le cortisol est sécrété par la corticosurrénale.", "L'ACTH est sécrétée par l'hypophyse.", "Le cortisol est sécrété par la médullosurrénale."], "b": "ABC", "j": "La médullosurrénale sécrète l'adrénaline ; le cortisol est un glucocorticoïde produit par la corticosurrénale.", "img": "", "fixes": 0}, {"t": "La succession de plusieurs hormones (CRH, ACTH, cortisol) permet :", "p": ["de remplacer la voie nerveuse.", "de ralentir inutilement la réponse.", "de supprimer l'intervention du cerveau.", "d'amplifier le signal et de le réguler."], "b": "D", "j": "Une très petite quantité de CRH suffit à déclencher la sécrétion d'une quantité importante de cortisol (amplification), et chaque étage peut être freiné (régulation).", "img": "", "fixes": 0}, {"t": "Le cortisol :", "p": ["met en veille des fonctions non urgentes (croissance, reproduction, prise alimentaire).", "est sécrété par le pancréas.", "mobilise les réserves énergétiques de l'organisme.", "agit plus rapidement que l'adrénaline."], "b": "AC", "j": "Le cortisol a aussi un rythme quotidien, avec un pic le matin avant le réveil. À faible dose, il facilite la mobilisation des cellules immunitaires. Son action est plus lente et plus prolongée que celle de l'adrénaline.", "img": "", "fixes": 0}, {"t": "Les deux voies de la réponse au stress aigu :", "p": ["sont toutes deux déclenchées à partir de l'hypothalamus.", "la voie nerveuse (adrénaline) est la plus rapide.", "fonctionnent indépendamment du cerveau.", "la voie hormonale (cortisol) est plus lente et plus durable."], "b": "ABD", "j": "Ces voies nerveuses et hormonales sont coordonnées : l'organisme répond comme un système complexe.", "img": "", "fixes": 0}, {"t": "Le cortisol exerce un rétrocontrôle sur l'hypothalamus et l'hypophyse.", "p": ["Il agit sur des récepteurs situés dans le cerveau.", "Il freine la sécrétion de CRH et d'ACTH.", "Il permet le retour à l'état initial après le stress.", "C'est un rétrocontrôle négatif."], "b": "ABCD", "j": "En limitant sa propre production, le cortisol évite l'emballement du système.", "img": "", "fixes": 0}, {"t": "On injecte du cortisol à un sujet. On observe ensuite :", "p": ["une hausse de la CRH et de l'ACTH.", "une baisse de la CRH et de l'ACTH.", "aucun changement de la CRH et de l'ACTH.", "une hausse de l'ACTH seulement."], "b": "B", "j": "Cette expérience met en évidence le rétrocontrôle négatif exercé par le cortisol sur l'hypothalamus et l'hypophyse.", "img": "", "fixes": 0}, {"t": "La résilience est :", "p": ["l'incapacité de l'organisme à répondre au stress.", "la phase d'alarme du stress.", "la capacité d'un système à retrouver son état initial après une perturbation.", "l'augmentation durable du taux de cortisol."], "b": "C", "j": "Dans le cas du stress, elle repose sur le rétrocontrôle négatif du cortisol, qui ramène les paramètres physiologiques à leurs valeurs habituelles (homéostasie).", "img": "", "fixes": 0}], "auto": [{"production": "ECE : le stress des poissons (consigne 1)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Stratégie : dosage du cortisol par ELISA, deux conditions comparées à une gamme et à un témoin."]}, {"nom": "Complétude", "points": ["Conclusion : variation brutale = cortisol élevé ; progressive = presque pas ; critique (un poisson, lecture à l'œil)."]}, {"nom": "Conformité", "points": ["Tableau ou photo titrés : puits identifiés, témoin et gamme signalés."]}]}, {"production": "Mécanismes et retour à l'état initial (consignes 2 et 3)", "criteres": [{"nom": "Exactitude", "points": ["Détection : cortex préfrontal et système limbique (amygdale, hippocampe) activent l'hypothalamus.", "Voie nerveuse rapide (sympathique → médullosurrénale → adrénaline) ; voie hormonale lente (CRH → ACTH → cortisol).", "Effets : glycémie, fréquences cardiaque et respiratoire augmentées ; réponse selon le récepteur (α, β).", "Le cortisol freine CRH et ACTH : rétrocontrôle négatif, retour à l'état initial (résilience)."]}]}, {"production": "Schéma fonctionnel", "criteres": [{"nom": "Complétude", "points": ["Agent stresseur, voie rapide à gauche, voie lente à droite, effets, flèche « – » de rétrocontrôle."]}, {"nom": "Conformité", "points": ["Titre, organes légendés, flèches nerveuses et hormonales de deux couleurs."]}]}]}, {"id": 98, "code": "c31ffcd204", "titre": "Corps humain – Activité 10B : Le stress chronique", "questions": [{"t": "Le stress chronique :", "p": ["correspond à un dépassement des capacités d'adaptation de l'organisme.", "est une réponse normale et bénéfique de l'organisme.", "apparaît lorsque les agents stresseurs sont trop intenses, répétés ou durables.", "s'accompagne d'un rétrocontrôle du cortisol moins efficace."], "b": "ACD", "j": "Le système de régulation se dérègle et la résilience est limitée : les effets néfastes s'accumulent.", "img": "", "fixes": 0}, {"t": "Parmi les conséquences possibles d'un stress chronique :", "p": ["un renforcement durable des défenses immunitaires.", "une amélioration durable des performances intellectuelles.", "des troubles de la mémoire et de l'attention.", "un stockage accru de graisses."], "b": "CD", "j": "Sécrétées en continu, les hormones du stress perdent leurs effets bénéfiques. Les défenses immunitaires sont au contraire diminuées.", "img": "", "fixes": 0}, {"t": "Sous l'effet d'un stress chronique, certaines structures du système limbique et du cortex préfrontal se modifient. On parle :", "p": ["de résilience.", "de rétrocontrôle négatif.", "de réflexe myotatique.", "de plasticité mal-adaptative."], "b": "D", "j": "La plasticité cérébrale n'est pas toujours bénéfique : ici, elle perturbe l'attention, la mémoire et les performances cognitives.", "img": "", "fixes": 0}, {"t": "Face à un même agent stresseur, la réponse de l'organisme :", "p": ["varie selon les individus, leur âge et leur expérience.", "est strictement identique chez tous les individus.", "est toujours pathologique.", "ne dépend que du génotype."], "b": "A", "j": "La perception de la situation, la capacité à y faire face et la résilience diffèrent d'une personne à l'autre.", "img": "", "fixes": 0}, {"t": "Le GABA est :", "p": ["une hormone du stress.", "un neurotransmetteur inhibiteur.", "une enzyme.", "un neurotransmetteur excitateur."], "b": "B", "j": "En se fixant sur ses récepteurs, le GABA rend plus difficile la naissance de potentiels d'action dans le neurone postsynaptique.", "img": "", "fixes": 0}, {"t": "Les benzodiazépines :", "p": ["bloquent le récepteur du GABA.", "renforcent l'inhibition exercée par le GABA.", "ont des effets anxiolytique et myorelaxant.", "se fixent sur le récepteur du GABA et augmentent son affinité pour ce neurotransmetteur."], "b": "BCD", "j": "En renforçant l'effet d'un neurotransmetteur inhibiteur, elles diminuent l'hyperactivité cérébrale associée à l'anxiété.", "img": "", "fixes": 0}, {"t": "Le traitement par benzodiazépines :", "p": ["agit en renforçant l'effet du GABA.", "peut entraîner une dépendance.", "peut provoquer une baisse de la vigilance et une somnolence.", "doit respecter une posologie et une durée strictes."], "b": "ABCD", "j": "Ces effets indésirables expliquent que l'on encourage aussi les pratiques non médicamenteuses.", "img": "", "fixes": 0}, {"t": "Parmi ces pratiques, lesquelles peuvent aider à lutter contre le stress chronique ?", "p": ["Une activité physique régulière.", "La méditation de pleine conscience.", "L'augmentation des doses de benzodiazépines sans avis médical.", "Une thérapie cognitive et comportementale."], "b": "ABD", "j": "Ces pratiques limitent les dérèglements et favorisent la résilience ; le choix dépend des troubles et de la personne.", "img": "", "fixes": 0}, {"t": "Des études montrent que la méditation de pleine conscience :", "p": ["détruit les récepteurs du GABA.", "n'a aucun effet mesurable.", "augmente la sécrétion de cortisol.", "diminue l'activité de l'amygdale et peut abaisser la sécrétion de cortisol."], "b": "D", "j": "En concentrant son attention sur la respiration et le relâchement musculaire, le sujet réagit moins aux agents stresseurs.", "img": "", "fixes": 0}, {"t": "Dans une étude, la fréquence cardiaque diminue chez des volontaires qui regardent une vidéo d'ASMR, mais aussi, plus faiblement, chez ceux qui regardent une vidéo témoin (une recette de cuisine).", "p": ["Le groupe témoin est indispensable pour interpréter le résultat.", "La baisse observée est due uniquement à l'ASMR.", "Regarder une vidéo au calme a déjà, en soi, un effet apaisant.", "La baisse est plus marquée avec la vidéo d'ASMR."], "b": "ACD", "j": "Sans groupe témoin, on attribuerait toute la baisse à l'ASMR ; seul l'écart entre les deux groupes peut lui être attribué.", "img": "", "fixes": 0}], "auto": [{"production": "Stress qui dure et benzodiazépines (consignes 1 à 3)", "criteres": [{"nom": "Exactitude", "points": ["Excès de cortisol : hippocampe réduit (de 44 à 24 unités), amygdale renforcée : plasticité mal-adaptative.", "Rétrocontrôle moins efficace : cortisol élevé, mémoire, immunité, sommeil perturbés, graisses stockées.", "Benzodiazépine : fixée sur le récepteur du GABA (autre site), plus d'ions Cl⁻, inhibition renforcée."]}, {"nom": "Conformité", "points": ["Capture Libmol titrée : chaînes du récepteur, GABA et diazépam fixés à des endroits différents."]}]}, {"production": "Sans médicament (consignes 4 et 5)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Je ne conclus pas sans témoin : il faudrait un groupe témoin, une répartition au hasard, plus de participants."]}, {"nom": "Exactitude", "points": ["ASMR : baisse de 3,4 battements/min contre 1,9 pour le témoin : c'est l'écart qui mesure l'effet."]}]}, {"production": "Texte argumenté", "criteres": [{"nom": "Complétude", "points": ["Système débordé, cerveau modifié, traitements avec et sans médicament (sport, sommeil, TCC, méditation).", "Benzodiazépines : effets anxiolytique et myorelaxant, mais addiction et sédation : protocole rigoureux."]}, {"nom": "Conformité", "points": ["Introduction, un paragraphe par idée, conclusion ; arguments appuyés sur les documents."]}]}]}]}, {"nom": "Première spécialité", "seances": [{"id": 22, "code": "606f3be6a2", "titre": "Thème 1 – Activité 1A : Gène, protéine et phénotype (1/2)", "questions": [{"t": "Dans le cas de la drépanocytose, le phénotype cellulaire correspond à :", "p": ["une anémie sévère et des douleurs au niveau des organes", "des globules rouges rigides en forme de faucille", "la présence d'une hémoglobine HbS fibreuse", "la présence d'un allèle muté du gène de l'hémoglobine"], "b": "B", "j": "Hémoglobine fibreuse = phénotype moléculaire ; anémie et douleurs = phénotype macroscopique ; l'allèle muté relève du génotype.", "img": "", "fixes": 0}, {"t": "Concernant les relations entre génotype et phénotype :", "p": ["le phénotype macroscopique impose le phénotype cellulaire", "le génotype détermine le phénotype moléculaire", "l'environnement n'a aucune influence sur le phénotype moléculaire", "le phénotype moléculaire impose le phénotype cellulaire"], "b": "BD", "j": "Génotype -> phénotype moléculaire -> cellulaire -> macroscopique. L'environnement intervient aussi (ex. : HbS devient fibreuse en cas de manque de dioxygène).", "img": "", "fixes": 0}], "auto": [{"production": "Question 1 et tableau (tâches intermédiaires)", "criteres": [{"nom": "Comparaison des séquences", "points": ["βA et βS ne diffèrent que par un nucléotide : substitution A → T en position 20 (même longueur).", "Dans la protéine, un seul acide aminé change : acide glutamique → valine (position 6 ou 7)."]}, {"nom": "Tableau", "points": ["Mon tableau a un titre, des lignes et des colonnes titrées, une observation (pas une explication) par case.", "Molécule : HbA dispersée / HbS en fibres sans dioxygène. Cellule : disque souple / faucille rigide. Organisme : capillaires bouchés."]}]}, {"production": "Courrier aux parents (questions 1 et 2)", "criteres": [{"nom": "Réponse aux questions", "points": ["J'ai répondu explicitement à la question 1 (d'où vient la maladie) et à la question 2 (pourquoi ces symptômes)."]}, {"nom": "Raisonnement", "points": ["Je suis la chaîne sans sauter d'étape : allèle βS → HbS → fibres → hématies en faucille → capillaires bouchés → symptômes.", "J'ai nommé les trois échelles du phénotype : moléculaire, cellulaire, macroscopique.", "Je n'ai écrit ni « le gène est malade » (c'est un allèle) ni que la maladie s'attrape."]}, {"nom": "Communication", "points": ["J'ai expliqué chaque mot technique (gène, allèle, protéine, hémoglobine, hématie, capillaire).", "Mon ton s'adresse aux parents, en phrases courtes ; je n'ai pas traité les questions 3 et 4."]}]}]}, {"id": 23, "code": "17ae2e13ee", "titre": "Thème 1 – Activité 1B : Gène, protéine et phénotype (2/2)", "questions": [{"t": "Les cellules d'un même organisme possèdent la même information génétique, mais elles sont spécialisées. Cela s'explique par le fait que :", "p": ["elles perdent les gènes inutiles au cours de leur spécialisation", "chaque type cellulaire n'exprime qu'une partie de ses gènes", "elles possèdent des allèles différents", "elles ne possèdent pas les mêmes gènes"], "b": "B", "j": "Toutes les cellules ont les mêmes gènes mais n'en expriment qu'une partie, différente selon le type cellulaire.", "img": "", "fixes": 0}, {"t": "Les facteurs de transcription :", "p": ["activent toujours l'expression du gène concerné", "sont des protéines", "se fixent sur des séquences régulatrices non codantes de l'ADN", "peuvent voir leur fixation déclenchée par des signaux de l'environnement"], "b": "BCD", "j": "Ce sont des protéines qui se fixent sur des séquences régulatrices et activent OU répriment l'expression d'un gène, notamment en réponse à des signaux internes ou externes.", "img": "", "fixes": 0}], "auto": [{"production": "Électrophorèse (gel, questions 3 et 4)", "criteres": [{"nom": "Électrophorèse", "points": ["J'ai noté l'ordre des dépôts avant la migration et respecté les consignes de sécurité."]}, {"nom": "Schéma du gel", "points": ["Titre, ligne de dépôt côté cathode (−), anode (+), puits nommés, chaque tache à sa hauteur."]}, {"nom": "Phénotype et génotype", "points": ["Le parent donne deux taches, aux hauteurs de HbA et de HbS : il fabrique les deux hémoglobines.", "Il a donc les allèles βA et βS ; l'enfant malade est βS/βS : l'autre parent lui a forcément transmis un βS.", "HbS migre moins loin car la valine n'est pas chargée : c'est la charge qui change, pas la masse."]}]}, {"production": "Courrier aux parents (questions 3 et 4)", "criteres": [{"nom": "Phénotype et génotype", "points": ["Ma réponse 3 s'appuie sur le gel ; je distingue ce que j'affirme (parent testé) et ce que je déduis (autre parent)."]}, {"nom": "Rôle de l'environnement", "points": ["J'ai donné au moins deux conseils justifiés (boire : sang moins visqueux ; éviter l'altitude : plus de dioxygène…).", "Un même génotype peut donner des phénotypes différents : le milieu modifie l'expression des gènes, pas les gènes (doc. 8)."]}, {"nom": "Communication", "points": ["Mots techniques expliqués, ton adapté à des parents."]}]}]}, {"id": 24, "code": "08582afecc", "titre": "Thème 1 – Activité 2 : Transcription", "questions": [{"t": "Chez les eucaryotes, un intermédiaire entre l'ADN et les protéines (l'ARNm) est nécessaire parce que :", "p": ["l'ADN ne peut être lu qu'une seule fois", "l'ADN est détruit après chaque utilisation", "l'ADN est localisé dans le noyau alors que les protéines sont synthétisées dans le cytoplasme", "les ribosomes sont localisés dans le noyau"], "b": "C", "j": "L'ADN reste dans le noyau ; la synthèse des protéines est cytoplasmique. L'ARNm transporte l'information de l'un à l'autre.", "img": "", "fixes": 0}, {"t": "Le brin transcrit d'un gène a pour séquence TACGGATTC. Quelle est la séquence de l'ARNm obtenu ?", "p": ["GAAUCCGUA", "AUGCCUAAG", "UACGGAUUC", "ATGCCTAAG"], "b": "B", "j": "L'ARNm est complémentaire du brin transcrit, avec U à la place de T : TAC GGA TTC -> AUG CCU AAG.", "img": "", "fixes": 0}, {"t": "À propos de la transcription :", "p": ["elle se déroule dans le cytoplasme", "un même gène peut être transcrit par plusieurs ARN polymérases à la suite", "les deux brins du gène sont copiés en ARNm", "elle est réalisée par l'ARN polymérase"], "b": "BD", "j": "La transcription a lieu dans le noyau ; un seul brin (brin transcrit) sert de matrice. Plusieurs ARN polymérases se suivent sur un gène : amplification.", "img": "", "fixes": 0}, {"t": "Par rapport au brin non transcrit (brin codant) du gène, la séquence de l'ARNm est :", "p": ["sans aucun rapport", "strictement identique", "complémentaire", "identique, à ceci près que l'uracile remplace la thymine"], "b": "D", "j": "L'ARNm est complémentaire du brin transcrit : il a donc la même séquence que le brin codant, U remplaçant T.", "img": "", "fixes": 0}, {"t": "Une bactérie dans laquelle on a transféré un gène humain produit la protéine humaine correspondante. Cette expérience de transgenèse est un argument en faveur :", "p": ["de l'existence de l'épissage alternatif", "de l'universalité du code génétique", "d'une origine commune des êtres vivants", "de la redondance du code génétique"], "b": "BC", "j": "La bactérie « lit » le gène humain avec le même code : le code est universel, ce qui renforce l'idée d'un ancêtre commun à tous les êtres vivants.", "img": "", "fixes": 0}], "auto": [{"production": "Consignes 1 à 10", "criteres": [{"nom": "Analyse des documents", "points": ["GFP : le gène transféré fait fabriquer la protéine à la souris : un gène gouverne la synthèse d'une protéine.", "Sans noyau, les protéines sont encore fabriquées dans le cytoplasme : il faut un intermédiaire (doc. 3).", "L'ARN est fabriqué dans le noyau puis passe dans le cytoplasme ; détruit par la ribonucléase, plus de synthèse (doc. 4)."]}, {"nom": "Réponses aux consignes", "points": ["ADN : deux brins, A T C G, désoxyribose. ARN : un brin, A U C G, ribose, plus court.", "L'ARNm est identique au brin non transcrit (U à la place de T) et complémentaire du brin transcrit.", "J'ai justifié « transcription » (même langage) et « messager » (du noyau au cytoplasme)."]}]}, {"production": "Texte explicatif", "criteres": [{"nom": "Contenu", "points": ["J'ai posé le problème : l'ADN reste dans le noyau, les protéines sont fabriquées dans le cytoplasme.", "L'ARN polymérase ouvre l'ADN et assemble des nucléotides complémentaires du brin transcrit : la transcription.", "L'ARNm, court et à un brin, sort du noyau et porte l'information dans le cytoplasme."]}, {"nom": "Démarche", "points": ["Mon texte répond explicitement à la problématique ; je n'ai pas confondu transcription et traduction."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 25, "code": "efaba6920c", "titre": "Thème 1 – Activité 3 : Traduction", "questions": [{"t": "À propos des protéines :", "p": ["elles sont construites à partir de 20 acides aminés différents", "ce sont des polymères de nucléotides", "leur fonction dépend de leur forme dans l'espace", "une protéine est toujours constituée d'un seul polypeptide"], "b": "AC", "j": "Une protéine est formée d'un ou plusieurs polypeptides, polymères d'acides aminés (20 différents). Son repliement dans l'espace lui confère sa fonction.", "img": "", "fixes": 0}, {"t": "À propos de l'épissage de l'ARN pré-messager :", "p": ["il a lieu dans le noyau", "l'ARNm mature obtenu est plus court que l'ARN pré-messager", "il consiste à supprimer les exons", "il modifie la séquence du gène"], "b": "AB", "j": "L'épissage supprime les introns et relie les exons, dans le noyau. Il agit sur l'ARN, pas sur l'ADN.", "img": "", "fixes": 0}, {"t": "L'épissage alternatif :", "p": ["explique que le nombre de protéines différentes soit bien supérieur au nombre de gènes", "repose sur des combinaisons différentes des exons conservés dans l'ARNm", "modifie l'ordre des nucléotides de l'ADN", "permet à un même gène de conduire à plusieurs protéines différentes"], "b": "ABD", "j": "Un même ARN pré-messager peut donner plusieurs ARNm matures selon les exons conservés : environ 20 000 gènes, mais un protéome bien plus vaste.", "img": "", "fixes": 0}, {"t": "Le code génétique comporte 64 codons. Parmi eux :", "p": ["61 codons codent pour un acide aminé", "un même codon peut coder pour plusieurs acides aminés", "3 codons sont des codons stop", "chaque acide aminé est codé par un seul codon"], "b": "AC", "j": "61 codons significatifs + 3 codons stop. Le code est redondant (plusieurs codons pour un même acide aminé) mais univoque (un codon = un seul acide aminé).", "img": "", "fixes": 0}, {"t": "Dire que le code génétique est redondant (dégénéré) signifie que :", "p": ["un même ARNm peut être traduit plusieurs fois", "le code est le même chez presque tous les êtres vivants", "plusieurs codons différents peuvent coder pour le même acide aminé", "un codon peut coder pour plusieurs acides aminés"], "b": "C", "j": "Redondant : 61 codons pour 20 acides aminés. « Même code chez res qui protègent l'organisme :", "p": ["la peau est une barrière physique", "la flore intestinale est une barrière biologique", "le mucus des voies respiratoires est une barrière biologique", "les larmes constituent une barrière chimique"], "b": "ABD", "j": "Le mucus, qui fixe et évacue les agents pathogènes, est une barrière physique comme la peau.", "img": "", "fixes": 0}, {"t": "L'immunité innée :", "p": ["est opérationnelle dès la naissance, sans apprentissage", "est spécifique d'un antigène précis", "est apparue avant l'immunité adaptative au cours de l'évolution", "n'existe que chez les vertébrés"], "b": "AC", "j": "Immunité innée : très répandue chez les animaux, apparue vers -800 Ma, immédiate et stéréotypée. L'immunité adaptative (-400 Ma) est propre aux vertébrés.", "img": "", "fixes": 0}, {"t": "Les récepteurs PRR :", "p": ["sont chacun spécifiques d'un seul antigène", "sont portés par les cellules de l'immunité innée", "sont des anticorps membranaires", "reconnaissent des motifs moléculaires communs à de nombreux micro-organismes"], "b": "BD", "j": "Les PRR assurent une reconnaissance non spécifique de motifs très conservés (paroi bactérienne, génome viral...).", "img": "", "fixes": 0}, {"t": "Parmi ces cellules, lesquelles résident principalement dans les tissus, en position de « sentinelles » ?", "p": ["Les macrophages", "Les granulocytes", "Les lymphocytes T", "Les cellules dendritiques"], "b": "AD", "j": "Macrophages, cellules dendritiques et mastocytes résident dans les tissus. Les granulocytes sont surtout dans le sang ; les lymphocytes circulent dans le sang et la lymphe.", "img": "", "fixes": 0}, {"t": "Lors d'une réaction inflammatoire, la rougeur et la chaleur s'expliquent par :", "p": ["une dilatation locale des vaisseaux sanguins entraînant un afflux de sang", "la stimulation des nocicepteurs", "une sortie de plasma dans les tissus", "la phagocytose des agents pathogènes"], "b": "A", "j": "Vasodilatation -> afflux de sang -> rougeur et chaleur. La sortie de plasma provoque le gonflement ; les nocicepteurs, la douleur.", "img": "", "fixes": 0}, {"t": "L'histamine :", "p": ["est libérée par les mastocytes", "est une molécule vasodilatatrice", "est un anticorps", "provoque une contraction des vaisseaux sanguins"], "b": "AB", "j": "Les mastocytes libèrent de l'histamine, molécule vasodilatatrice, lors de la lésion des tissus.", "img": "", "fixes": 0}, {"t": "La diapédèse correspond à :", "p": ["l'ingestion d'un agent pathogène par un phagocyte", "la migration d'une cellule dendritique vers un ganglion lymphatique", "la multiplication des lymphocytes sélectionnés", "la traversée de la paroi d'un vaisseau sanguin par des granulocytes attirés vers le tissu infecté"], "b": "D", "j": "Attirés par les chimiokines, les granulocytes s'insèrent entre les cellules de la paroi du vaisseau et gagnent le tissu infecté.", "img": "", "fixes": 0}, {"t": "À propos de la phagocytose :", "p": ["elle permet aussi d'éliminer les débris des cellules lésées", "la particule à ingérer est reconnue grâce aux récepteurs PRR", "elle nécessite un premier contact préalable avec l'agent pathogène", "la particule est digérée dans une vacuole, à l'intérieur du phagocyte"], "b": "ABD", "j": "La phagocytose relève de l'immunité innée : elle est immédiate et ne nécessite aucun contact préalable.", "img": "", "fixes": 0}, {"t": "Les anti-inflammatoires non stéroïdiens (aspirine, ibuprofène...) agissent en :", "p": ["bloquant l'activité d'enzymes nécessaires à la synthèse des prostaglandines", "détruisant les agents pathogènes", "stimulant la phagocytose", "empêchant la libération d'histamine par les mastocytes"], "b": "A", "j": "Ils empêchent la synthèse des prostaglandines, médiateurs de la vasodilatation, de la douleur et de la fièvre.", "img": "", "fixes": 0}, {"t": "Le paracétamol :", "p": ["fait baisser la fièvre", "a un puissant effet anti-inflammatoire", "est un anti-inflammatoire non stéroïdien", "calme la douleur"], "b": "AD", "j": " t l'ARN en ADN). L'ARN du coronavirus reste dans le cytoplasme.", "img": "", "fixes": 0}, {"t": "Le VIH conduit à terme à une immunodéficience car :", "p": ["il détruit les anticorps présents dans le sang", "il empêche la réplication de l'ADN dans toutes les cellules", "il détruit progressivement les lymphocytes T CD4, qui coordonnent la réponse adaptative", "il infecte les hématies"], "b": "C", "j": "Sans LT CD4 (auxiliaires), ni les LB ni les LT CD8 ne sont correctement activés : l'organisme ne peut plus se défendre, même contre des agents opportunistes.", "img": "", "fixes": 0}, {"t": "Parmi ces liquides biologiques, lesquels peuvent transmettre le VIH ?", "p": ["Le sang", "La salive", "Le lait maternel", "La sueur"], "b": "AC", "j": "Sang, sperme, sécrétions vaginales et lait maternel sont contaminants. Dans la salive, la sueur ou les larmes, le virus est en quantité trop faible.", "img": "", "fixes": 0}], "auto": [{"production": "Cycle et évolution (consigne 1)", "criteres": [{"nom": "Contenu", "points": ["Le VIH, virus à ARN, infecte les LT CD4, s'intègre à leur ADN, fait produire environ 1 000 virus, puis la cellule meurt.", "Trois phases chiffrées : primo-infection, phase asymptomatique (environ 8 ans), SIDA sous 200 LT CD4 par mm³.", "J'ai lu la charge virale sur une échelle en puissances de dix."]}]}, {"production": "Texte explicatif (consigne 2)", "criteres": [{"nom": "Explication", "points": ["La destruction des LT CD4 l'emporte peu à peu sur leur renouvellement.", "Sans LT CD4 (LT auxiliaires, interleukines), plus de plasmocytes ni de LT cytotoxiques efficaces.", "D'où les maladies opportunistes, qui apparaissent à mesure que les LT CD4 diminuent (doc. 3)."]}, {"nom": "Démarche", "points": ["Je n'ai pas confondu séropositivité et SIDA ; je parle des maladies opportunistes, pas de « mourir du VIH »."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 38, "code": "78194fdcc6" nce apparaissent au hasard, à chaque réplication : l'antibiotique ne les provoque pas.", "L'antibiotique tue les bactéries sensibles et sélectionne les résistantes, qui se multiplient (doc. 2).", "J'explique « de plus en plus fréquente » : surutilisation, traitements inutiles, multirésistances.", "Je relie mon texte à l'antibiogramme de José."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 39, "code": "637043eda0", "titre": "Thème 1 – Activité 15A : Les enzymes, catalyseurs biologiques", "questions": [{"t": "Une enzyme :", "p": ["rend possible une réaction qui n'aurait jamais lieu sans elle", "est consommée au cours de la réaction qu'elle catalyse", "accélère une réaction chimique", "se retrouve dans son état initial à la fin de la réaction"], "b": "CD", "j": "Biocatalyseur : l'enzyme accélère une réaction qui aurait lieu sans elle, mais très lentement, et n'apparaît pas dans le bilan.", "img": "", "fixes": 0}, {"t": "L'amylase catalyse l'hydrolyse de l'amidon mais n'agit pas sur l'ovalbumine (une protéine). Cette observation illustre :", "p": ["la spécificité de substrat de l'enzyme", "l'influence du pH sur l'enzyme", "la dénaturation de l'enzyme", "la spécificité d'action de l'enzyme"], "b": "A", "j": "Une enzyme n'agit que sur un substrat (ou des molécules très proches). La spécificité d'action concerne le type de réaction catalysée.", "img": "", "fixes": 0}], "auto": [{"production": "Protocoles 1 et 2 (consignes 1 et 2)", "criteres": [{"nom": "Interprétation", "points": ["Enzyme : protéine qui catalyse une réaction sans être consommée ; l'amylase hydrolyse l'amidon."]}, {"nom": "Protocoles", "points": ["Tableaux complétés et soignés, avec le témoin (amidon + eau)."]}, {"nom": "Interprétation", "points": ["Tube amylase à 35 °C hydrolysé en 20 min environ, comme le tube HCl à 100 °C ; le témoin reste bleu-noir.", "Banane : amidon de 58,6 % à 6,3 %, sucres de 1,3 % à 31,2 % : une a vitesse initiale.", "Plus de substrat → vitesse plus grande, jusqu'à saturation des sites actifs (vitesse maximale).", "pH éloigné de l'optimum ou 100 °C : forme du site actif modifiée ; à 100 °C, dénaturation irréversible.", "Je n'ai pas confondu vitesse initiale et vitesse maximale."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 42, "code": "c31d536e25", "titre": "Thème 1 – Activité 16 : Altération du génome et cancérisation", "questions": [{"t": "À propos de l'immunothérapie des cancers :", "p": ["les anticorps monoclonaux ciblent des molécules portées par les cellules tumorales", "les vaccins thérapeutiques sont identiques pour tous les patients", "les vaccins thérapeutiques activent le système immunitaire contre les cellules cancéreuses", "ces thérapies ne sont utilisées que contre les cancers"], "b": "AC", "j": "Les vaccins thérapeutiques sont personnalisés selon la tumeur du patient. Ces thérapies servent aussi à soigner d'autres maladies.", "img": "", "fixes": 0}, {"t": "À propos de la cancérisation :", "p": ["elle implique des gènes qui régulent les divisions cellulaires", "un cancer est toujours une maladie héréditaire", "des facteurs génétiques hérités peuvent modifier la susceptibilité d'un individu à certains cancers", "elle a pour origine des mutations survenant dans des cellules somatiques"], "b": "ACD", "j": "Les mutations en cause surviennent au cours de la vie dans des cellules somatiques ; il existe cependant des facteurs génétiques hérités de prédisposition.", "img": "", "fixes": 0}], "auto": [{"production": "Préparation (étapes 1 et 2)", "criteres": [{"nom": "Justesse scientifique", "points": ["J'ai dégagé les idées clés qui répondent à la question de mon sujet, chiffres à l'appui.", "Mes informations sont justes et sourcées ; je ne présente pas une corrélation comme une preuve."]}, {"nom": "Support de présentation", "points": ["Diaporama lisible et organisé, illustré, peu de texte, documents sourcés."]}]}, {"production": "Exposé oral", "criteres": [{"nom": "Vulgarisation", "points": ["J'explique les mots techniques (mutation, oncogène, métastase…) pour des camarades qui n'ont pas mes documents.", "Je relie mon sujet à la problématique : des mutations de gènes qui contrôlent les divisions."]}, {"nom": "Justesse scientifique", "points": ["Je ne dis pas que le cancer est contagieux ou toujours héréditaire, ni qu'un facteur de risque est une cause certaine."]}, {"nom": "Expression orale", "points": ["Je parle clairement, sans lire, pendant 5 à 10 minutes ; la parole est répartie dans le groupe."]}]}]}, {"id": 43, "code": "dccdd2bfb2", "titre": "Thème 1 – Activité 17 : La transmission des mutations", "questions": [{"t": "Une mutation peut être transmise à la descendance d'un individu :", "p": ["uniquement si elle est provoquée par un agent mutagène", "quelle que soit la cellule touchée", "si elle touche une cellule germinale", "si elle touche une cellule de la peau"], "b": "C", "j": "Seules les mutations des cellules germinales (à l'origine des gamètes) sont héréditaires.", "img": "", "fixes": 0}], "auto": [{"production": "Consigne 1 et calcul", "criteres": [{"nom": "Exploitation des documents", "points": ["Mutation somatique : clone de cellules mutées, non transmis aux enfants ; germinale : dans les gamètes, transmissible.", "Doc. 2 : plus de 100 000 mutations dans 140 cellules de moelle d'un homme de 59 ans.", "Calcul : 35 + 23 × (20 − 15) = 150 divisions à 20 ans, 610 à 40 ans, contre 24 pour un ovule."]}]}, {"production": "Texte argumenté (consigne 2)", "criteres": [{"nom": "Explication", "points": ["Seules les mutations présentes dans un gamète passent à l'enfant, dans toutes ses cellules, germinales comprises.", "Une mutation de l'enfant est héritée d'un parent ou nouvelle (de novo), apparue dans un gamète.", "Plus le père est âgé, plus il y a eu de divisions, donc de réplications : plus de mutations d'origine paternelle.", "Je n'ai pas confondu transmission par mitose et transmission aux enfants, ni mutation de novo et somatique."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 44, "code": "9335cbee04", "titre": "Thème 1 – Activité 18 : La méiose", "questions": [{"t": "Une cellule humaine (2n = 46) entre en méiose. À la fin de la première division, on obtient :", "p": ["deux cellules à 46 chromosomes à une chromatide", "quatre cellules à 23 chromosomes à une chromatide", "deux cellules à 23 chromosomes à une chromatide", "deux cellules à 23 chromosomes à deux chromatides"], "b": "D", "j": "La première division (réductionnelle) sépare les chromosomes homologues : n chromosomes, encore à deux chromatides.", "img": "", "fixes": 0}, {"t": "La méiose :", "p": ["produit des cellules génétiquement identiques à la cellule mère", "comprend deux divisions successives", "voit chacune de ses divisions précédée d'une réplication de l'ADN", "produit quatre cellules haploïdes à partir d'une cellule diploïde"], "b": "BD", "j": "Seule la première division est précédée d'une réplication. Les cellules obtenues sont haploïdes, donc différentes de la cellule mère.", "img": "", "fixes": 0}, {"t": "Lors de l'anaphase I de la méiose :", "p": ["les chromosomes homologues s'apparient en bivalents", "les chromosomes homologues de chaque paire se séparent", "les deux chromatides de chaque chromosome se séparent", "l'ADN est répliqué"], "b": "B", "j": "Anaphase I : séparation des homologues. La séparation des chromatides a lieu en anaphase II ; l'appariement en bivalents, en prophase I.", "img": "", "fixes": 0}, {"t": "À propos du cycle de développement de l'être humain :", "p": ["les gamètes sont des cellules diploïdes", "la fécondation rétablit la diploïdie", "la cellule-œuf se multiplie par méioses", "l'alternance méiose / fécondation permet le maintien du caryotype"], "b": "BD", "j": "Méiose : 2n -> n (gamètes) ; fécondation : n + n -> 2n. La cellule-œuf se divise ensuite par mitoses.", "img": "", "fixes": 0}, {"t": "En métaphase I de la méiose, les bivalents se positionnent de façon aléatoire sur la plaque équatoriale. La conséquence est :", "p": ["une répartition variable, d'un gamète à l'autre, des chromosomes d'origine paternelle et maternelle", "un nombre de chromosomes variable d'un gamète à l'autre", "la formation de gamètes tous identiques", "l'apparition de nouveaux allèles"], "b": "A", "j": "Chaque gamète reçoit bien n chromosomes, mais la combinaison de chromosomes paternels et maternels diffère. Les nouveaux allèles proviennent des mutations.", "img": "", "fixes": 0}], "auto": [{"production": "Préparation et phases (consignes 1 et 2)", "criteres": [{"nom": "Préparation", "points": ["J'ai montré au professeur une cellule en division, et dit pourquoi elle n'est pas en interphase."]}, {"nom": "Ordre des phases", "points": ["Huit phases ordonnées et nommées, avec un commentaire sur les chromosomes à chaque étape.", "Anaphase 1 : séparation des homologues ; anaphase 2 : séparation des chromatides."]}]}, {"production": "Courbe, schémas et texte (consignes 3 à 5)", "criteres": [{"nom": "Courbe et schémas", "points": ["Courbe annotée : réplication (2 → 4), fin de la 1re division (4 → 2), fin de la 2e (2 → 1).", "2n = 4 : deux bivalents en métaphase 1, puis quatre cellules à n = 2 chromosomes à une chromatide."]}, {"nom": "Explication", "points": ["Deux divisions successives, sans réplication entre elles ; passage de 2n à n à la première.", "On obtient quatre cellules haploïdes : les futurs gamètes.", "La fécondation rétablit la diploïdie : l'alternance méiose-fécondation maintient le caryotype."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 45, "code": "ce786c3243", "titre": "Thème 1 – Activité 19 : L'histoire de l'humanité lue dans son génome", "questions": [{"t": "Concernant la capacité à digérer le lactose à l'âge adulte (phénotype « lactase persistant ») :", "p": ["c'est la consommation de lait qui a provoqué la mutation", "elle concerne tous les êtres humains adultes", "elle est due à une mutation apparue au hasard", "elle a été favorisée par la sélection naturelle dans les populations pratiquant l'élevage"], "b": "CD", "j": "La mutation est aléatoire ; l'environnement (accès au lait) ne la provoque pas mais avantage ceux qui la portent.", "img": "", "fixes": 0}, {"t": "L'étude des génomes humains actuels et anciens a montré que :", "p": ["on peut séquencer l'ADN extrait de restes fossiles humains", "Néanderthal est l'ancêtre direct de tous les êtres humains actuels", "une partie de la population actuelle porte des séquences héritées de Néanderthal ou de Denisova", "la comparaison des génomes permet de reconstituer des relations de parenté"], "b": "ACD", "j": "Néanderthal et Denisova sont d'autres espèces humaines, aujourd'hui disparues, avec lesquelles des croisements ont eu lieu.", "img": "", "fixes": 0}], "auto": [{"production": "Parties 1 et 2 (consignes 1 et 2)", "criteres": [{"nom": "Exploitation des documents", "points": ["Mutations partagées (haplogroupes) → ancêtre commun ; origine africaine il y a 150 000 à 300 000 ans.", "Diversité génétique de 70-75 % en Afrique à 45-50 % en Amérique : migrations successives, effet fondateur."]}, {"nom": "Manipulations", "points": ["Mutations LP différentes en Europe et en Afrique : la persistance de la lactase est apparue plusieurs fois."]}, {"nom": "Exploitation des documents", "points": ["Mutation LP rare au Néolithique, fréquente après l'élevage : sélection naturelle liée à une pratique culturelle."]}]}, {"production": "Texte explicatif (consigne 3)", "criteres": [{"nom": "Explication", "points": ["Les génomes actuels montrent une origine africaine récente et des migrations qui réduisent la diversité.", "Ils révèlent des sélections récentes (persistance de la lactase chez les éleveurs).", "L'ADN fossile : Sapiens et Néandertal, deux lignées distinctes qui se sont croisées (plus de 40 000 ans).", "Je n'ai écrit ni que Sapiens descend de Néandertal, ni que boire du lait provoque la mutation."]}, {"nom": "Rédaction", "points": ["Vocabulaire scientifique correct, connecteurs logiques, une idée par paragraphe."]}]}]}, {"id": 46, "code": "a0fb10423c", "titre": "Thème 2 – Activité 1 : Des rappels sur la tectonique des plaques", "questions": [{"t": "Selon la théorie des continents effondrés (Suess, Haug), les océans se forment par :", "p": ["l'effondrement, par endroits, de la surface d'une Terre qui se refroidit et dont le volume diminue", "l'affleurement d'une couche profonde dense sur laquelle reposent des continents présents depuis toujours", "l'écartement de deux plaques de part et d'autre d'une dorsale", "la translation des continents à la surface du globe"], "b": "A", "j": "Pour Suess et Haug, la Terre se contracte en se refroidissant : sa surface est comprimée (montagnes) ou s'effondre (océans). L'affleurement d'une couche dense correspond à la théorie de Dana et Willis.", "img": "", "fixes": 0}, {"t": "D'après la théorie soutenue par Dana et Willis :", "p": ["les continents se déplacent horizontalement à la surface du globe", "les océans se forment par effondrement de la surface terrestre", "les continents ont toujours été présents depuis la formation de la Terre", "les continents sont des blocs légers reposant sur une couche profonde plus dense"], "b": "CD", "j": "Dana et Willis voient les continents comme des blocs légers, permanents, posés sur une couche dense qui affleure dans les océans. L'effondrement est l'idée de Suess et Haug, le déplacement horizontal celle de Wegener.", "img": "", "fixes": 0}, {"t": "À propos de Wegener :", "p": ["il propose la translation des continents pour expliquer l'allure de la surface de la Terre", "son modèle n'a pas été validé à l'époque car il ne pouvait pas expliquer la cause des déplacements", "son modèle a été rejeté parce qu'il ne s'appuyait sur aucun fait scientifique", "il soutenait la théorie des continents effondrés"], "b": "AB", "j": "Wegener ne croit à aucune des deux théories de l'époque et propose la translation des continents, en s'appuyant sur des faits scientifiques. C'est son incapacité à expliquer le moteur des déplacements qui a empêché la validation de son modèle.", "img": "", "fixes": 0}, {"t": "La discontinuité de Gutenberg, située vers 3 000 km de profondeur, sépare :", "p": ["la croûte et le manteau", "le manteau et le noyau externe", "la lithosphère et l'asthénosphère", "le noyau externe et le noyau interne"], "b": "B", "j": "La discontinuité de Gutenberg est la limite manteau/noyau externe. La limite noyau externe/noyau interne (5 100 km) est la discontinuité de Lehman.", "img": "", "fixes": 0}, {"t": "L'étude de la propagation des ondes S permet d'affirmer que :", "p": ["la graine (noyau interne) est liquide", "le manteau est liquide, puisqu'il est animé de mouvements de convection", "le noyau externe est liquide", "les ondes S ne se propagent que dans les milieux solides"], "b": "CD", "j": "Les ondes S ne traversent pas les liquides : elles traversent le manteau (solide) mais pas le noyau externe (liquide). La graine est solide, et le manteau convecte en restant solide.", "img": "", "fixes": 0}, {"t": "Les « zones d'ombre », dans lesquelles les ondes sismiques ne se propagent pas :", "p": ["sont dues à la présence de couches concentriques séparées par des discontinuités", "s'expliquent par une Terre formée d'une seule couche homogène", "sont prévues par le modèle mais ne sont pas observées sur le terrain", "correspondent à la LVZ, où les ondes sont ralenties"], "b": "A", "j": "Les ondes rebondissent sur les discontinuités qui séparent les enveloppes concentriques, ce qui crée des zones d'ombre. Les données de terrain montrent exactement ce que prévoit le modèle.", "img": "", "fixes": 0}], "auto": [{"production": "Arguments et tableau du débat (consignes 1 et 2)", "criteres": [{"nom": "Cohérence et pertinence", "points": ["Chaque argument est dans la bonne colonne (fixiste ou mobiliste), avec son groupe et son document."]}, {"nom": "Complétude", "points": ["Mobilistes : côtes et roches qui se prolongent, fossiles communs, stries glaciaires, deux niveaux d'altitude, convection de Holmes.", "Fixistes : contraction de la Terre, ponts continentaux effondrés, Terre solide (ondes S), forces de Wegener trop faibles."]}, {"nom": "Exactitude", "points": ["Pour chaque fait, j'ai dit ce qu'il prouve (pas seulement « on trouve les mêmes fossiles »).", "La convection est de Holmes, pas de Wegener ; les ponts continentaux sont un argument fixiste.", "Les ondes S traversent le manteau jusqu'à 2 900 km : il est solide, pas liquide."]}]}, {"production": "Texte bilan (consigne 3)", "criteres": [{"nom": "Complétude", "points": ["Rejet : Wegener n'explique pas la cause des déplacements (forces trop faibles, Terre solide, Holmes non testable).", "Raison donnée à Wegener : la surface est mobile, et ses observations sont toujours utilisées.", "Tort : ce sont des plaques lithosphériques (croûte + manteau supérieur) qui bougent, avec un autre moteur."]}, {"nom": "Cohérence et pertinence", "points": ["Je réponds à la problématique : les meilleurs faits étaient mobilistes, mais il manquait un mécanisme."]}, {"nom": "Exactitude", "points": ["Je n'écris ni « rejetée parce que fausse », ni « Wegener avait entièrement raison », ni « continents sur du magma »."]}, {"nom": "Conformité", "points": ["Introduction, un paragraphe par idée, conclusion ; phrases claires, vocabulaire précis."]}]}]}, {"id": 47, "code": "0b510cfa6c", "titre": "Thème 2 – Activité 2 : Domaines continental et océanique", "questions": [{"t": "Qu'est-ce qu'une lame mince de roche ?", "p": ["Un filtre qui ne laisse passer que la lumière vibrant dans une seule direction", "Un fragment de roche collé sur une lame de verre puis poncé jusqu'à devenir extrêmement mince et transparent", "Une fine couche de roche fondue puis refroidie sur une lame de verre", "Le filtre placé après l'échantillon dans le microscope polarisant"], "b": "B", "j": "La lame mince est un fragment de roche collé sur du verre et aminci par ponçage jusqu'à être transparent. Les filtres décrits sont le polariseur et l'analyseur.", "img": "", "fixes": 0}, {"t": "À propos de la lumière utilisée en microscopie polarisante :", "p": ["le filtre analyseur est placé entre la source de lumière et l'échantillon", "la biréfringence est le fait qu'un cristal bloque totalement la lumière polarisée", "après avoir traversé le filtre polarisant, la lumière ne vibre plus que dans une seule direction", "la lumière ordinaire vibre dans toutes les directions dans un plan perpendiculaire à son trajet"], "b": "CD", "j": "Le polariseur transforme la lumière ordinaire en lumière polarisée (une seule direction de vibration). L'analyseur est placé après l'échantillon, et la biréfringence est le dédoublement du rayon en deux rayons de vitesses différentes.", "img": "", "fixes": 0}, {"t": "Au microscope polarisant, le polariseur et l'analyseur sont placés perpendiculairement l'un à l'autre et aucune lame n'est posée sur la platine. Qu'observe-t-on ?", "p": ["La lumière traverse les deux filtres et vibre dans un seul sens", "On passe de phases d'extinction à des phases éclairées en tournant la platine", "La lumière se dédouble en deux rayons de vitesses différentes", "Aucune lumière n'arrive à l'œil de l'observateur"], "b": "D", "j": "La lumière polarisée par le premier filtre ne peut pas traverser l'analyseur placé perpendiculairement : sans lame, tout est noir. C'est la présence d'un minéral qui dévie la lumière et permet d'observer extinctions et éclairements.", "img": "", "fixes": 0}, {"t": "Une lame mince est placée entre le polariseur et l'analyseur, disposés perpendiculairement l'un à l'autre :", "p": ["en faisant tourner la platine, on passe de phases d'extinction à des phases éclairées", "aucune lumière ne peut arriver à l'œil de l'observateur, quel que soit le minéral observé", "les cristaux apparaissent plus ou moins lumineux, voire de couleurs différentes, selon leur nature", "les cristaux quasiment isotropes, comme les cristaux cubiques, provoquent une forte biréfringence"], "b": "AC", "j": "Les minéraux dévient la lumière polarisée, qui peut alors en partie traverser l'analyseur : leur aspect dépend de leur nature. Les cristaux quasiment isotropes (cubiques) ne provoquent pas de biréfringence.", "img": "", "fixes": 0}, {"t": "À propos des domaines continental et océanique :", "p": ["le granite est la roche représentative du domaine continental", "les roches du domaine océanique (basalte, gabbro) sont plus denses que le granite", "la densité du granite est d'environ 3", "le domaine continental est constitué uniquement de granite"], "b": "AB", "j": "Le granite (densité environ 2,7) est représentatif du domaine continental, même si on y trouve beaucoup d'autres roches ; basalte et gabbro (densité environ 3) caractérisent le domaine océanique.", "img": "", "fixes": 0}, {"t": "La distribution bimodale des altitudes à la surface de la Terre :", "p": ["signifie que les altitudes se répartissent autour d'une seule valeur moyenne", "montre que les continents et les fonds océaniques sont constitués des mêmes roches", "reflète un contraste géologique entre continents et océans, visible dans la nature et la densité des roches", "s'explique par une épaisseur d'eau variable au-dessus d'une croûte partout identique"], "b": "C", "j": "Bimodale signifie deux valeurs dominantes (continents et fonds océaniques). Ce contraste d'altitude traduit une différence de roches et de densité : granite d'un côté, basalte et gabbro de l'autre.", "img": "", "fixes": 0}, {"t": "Un séisme correspond à :", "p": ["une remontée de magma à travers la croûte", "la réflexion d'ondes sur une discontinuité profonde", "une déformation lente et ductile des roches de l'asthénosphère", "une libération brutale d'énergie lors de la rupture de roches soumises à des contraintes"], "b": "D", "j": "Le séisme résulte de la rupture brutale de roches soumises à des contraintes ; l'énergie libérée se propage sous forme d'ondes sismiques.", "img": "", "fixes": 0}, {"t": "À propos des ondes sismiques et des discontinuités :", "p": ["la vitesse des ondes sismiques dépend de la nature et de la densité des matériaux traversés", "une discontinuité est la frontière entre deux formations rocheuses aux propriétés très nettement différentes", "une discontinuité est une zone du globe dans laquelle aucune onde sismique ne se propage", "les ondes sismiques se propagent à vitesse constante dans tout le globe"], "b": "AB", "j": "La vitesse des ondes varie avec les matériaux traversés ; une variation brusque signale une discontinuité, c'est-à-dire une frontière entre deux milieux différents. Une zone sans ondes est une zone d'ombre, pas une discontinuité.", "img": "", "fixes": 0}, {"t": "À propos de la discontinuité de Mohorovicic (Moho) :", "p": ["elle sépare la lithosphère de l'asthénosphère", "elle est plus profonde sous les continents que sous les océans", "elle correspond à un changement de nature des roches : sous le Moho, on trouve de la péridotite", "elle sépare la croûte du manteau lithosphérique"], "b": "BCD", "j": "Le Moho sépare la croûte (granite, ou basalte et gabbro) du manteau lithosphérique (péridotite) ; il est situé à 7-12 km sous les océans et 30-70 km sous les continents. La limite lithosphère/asthénosphère est plus profonde (sommet de la LVZ).", "img": "", "fixes": 0}, {"t": "Lorsque les ondes P franchissent le Moho en allant vers la profondeur :", "p": ["leur vitesse augmente, car le manteau est plus dense que la croûte", "elles passent de la croûte au manteau", "elles cessent de se propager, car le milieu est liquide", "leur vitesse diminue, car la roche y est partiellement fondue"], "b": "AB", "j": "Sous le Moho se trouve le manteau lithosphérique, plus dense : les ondes y sont plus rapides. Le ralentissement lié à une très légère fusion concerne la LVZ, et le milieu liquide est le noyau externe.", "img": "", "fixes": 0}], "auto": [{"production": "Consignes 1 à 4", "criteres": [{"nom": "Exactitude", "points": ["Deux niveaux d'altitude (+ 100 m, − 4 700 m), différents de la courbe théorique : deux matériaux différents.", "Roches identifiées en comparant vitesses du terrain et du laboratoire : granite, basalte et gabbro, péridotite (8 km/s).", "Moho à 30 km sous le continent ; à 12 km sous la surface de l'océan, moins 5 km d'eau : croûte océanique de 7 km.", "Densité = masse ÷ volume déplacé, sans unité : granite (≈ 2,7) < basalte et gabbro (≈ 3) < péridotite (≈ 3,2)."]}, {"nom": "Complétude", "points": ["Tableau des 4 roches complet : structure (basalte microlitique, les autres grenues), minéraux, provenance."]}]}, {"production": "Schéma comparatif (bilan)", "criteres": [{"nom": "Conformité", "points": ["Titre, deux colonnes (continent, océan), échelle de profondeur, légendes bien orthographiées."]}, {"nom": "Complétude", "points": ["Altitudes moyennes, eau, croûte continentale (granite), croûte océanique (basalte puis gabbro), péridotite sous les deux.", "Pour chaque couche : densité, vitesse des ondes P, épaisseur ; le Moho est tracé sous chaque croûte."]}, {"nom": "Exactitude", "points": ["Croûte continentale environ 4 fois plus épaisse ; le même manteau sous les deux croûtes."]}, {"nom": "Cohérence et pertinence", "points": ["Seul l'essentiel est représenté, de façon compréhensible par un professeur des écoles."]}]}]}, {"id": 48, "code": "646b8666b3", "titre": "Thème 2 – Activité 3 : Des preuves d'une mobilité lithosphérique", "questions": [{"t": "Un alignement de volcans de point chaud, comme celui d'Hawaï, se caractérise par le fait que :", "p": ["il est situé à la frontière entre deux plaques", "plus on s'éloigne du volcan actif, plus les volcans sont anciens", "tous les volcans de l'alignement sont actifs en même temps", "seul le volcan situé à une extrémité de l'alignement est actif"], "b": "BD", "j": "Dans un alignement intra-plaque, tous les volcans sont éteints sauf celui de l'extrémité, et l'âge augmente en s'éloignant du volcan actif. Ce volcanisme se produit à l'intérieur de la plaque, pas à sa frontière.", "img": "", "fixes": 0}, {"t": "Comment explique-t-on la formation d'un alignement de volcans intra-plaque ?", "p": ["La plaque lithosphérique se déplace au-dessus d'un point chaud pratiquement immobile", "Une plaque plonge sous une autre le long de l'alignement", "Deux plaques s'écartent de part et d'autre de l'alignement", "Le point chaud se déplace sous une plaque lithosphérique immobile"], "b": "A", "j": "Le point chaud, pratiquement immobile dans le manteau, alimente un volcan à sa verticale ; la plaque, mobile, emporte ce volcan qui s'éteint et un nouvel édifice se forme. Les volcans éteints marquent les anciennes positions de la plaque.", "img": "", "fixes": 0}, {"t": "Dans un alignement de volcans de point chaud, un volcan éteint daté de 5 Ma se trouve à 400 km du volcan actif. La vitesse moyenne de déplacement de la plaque est de :", "p": ["1,25 cm/an", "80 cm/an", "8 cm/an", "0,8 cm/an"], "b": "C", "j": "400 km en 5 Ma, soit 80 km par million d'années ; 80 km = 8 000 000 cm, donc 8 cm/an. 1,25 correspond à la division inverse (âge divisé par distance).", "img": "", "fixes": 0}, {"t": "L'étude d'un alignement de volcans de point chaud permet de déterminer :", "p": ["la vitesse de déplacement de la plaque, à partir des distances entre les volcans et de l'âge des roches", "la direction et le sens du déplacement de la plaque", "la profondeur du Moho sous la plaque", "l'âge des inversions du champ magnétique terrestre"], "b": "AB", "j": "L'alignement donne la direction et le sens du déplacement ; la distance entre édifices et l'âge des roches donnent la vitesse.", "img": "", "fixes": 0}, {"t": "L'étude des archipels des Empereurs et d'Hawaï montre que, depuis 65 Ma, la plaque Pacifique :", "p": ["s'est toujours déplacée dans la même direction", "est restée immobile pendant que le point chaud se déplaçait", "a changé de vitesse il y a 44 Ma, tout en conservant la même direction", "a changé de direction de déplacement il y a 44 Ma, tout en conservant la même vitesse (76 mm/an)"], "b": "D", "j": "La plaque Pacifique s'est déplacée dans une direction Sud-Nord de 65 à 44 Ma, puis E-SE / W-NW de 44 Ma à aujourd'hui, à 76 mm/an pendant les deux périodes.", "img": "", "fixes": 0}, {"t": "À propos du GPS :", "p": ["il ne permet pas d'enregistrer les déplacements brutaux qui se produisent lors des séismes", "une station reçoit les signaux émis par 4 satellites choisis parmi les 24 qui gravitent autour de la Terre", "les GPS scientifiques ont une précision de quelques mètres", "il fournit la latitude, la longitude et l'altitude d'une balise réceptrice placée au sol"], "b": "BD", "j": "Les GPS scientifiques ont une précision de quelques millimètres, ce qui permet de mesurer le mouvement des plaques, mais aussi des déplacements brutaux comme celui du Japon (2,4 m) lors du séisme de mars 2011.", "img": "", "fixes": 0}, {"t": "Pour une station GPS, les droites obtenues ont une pente positive pour la latitude et une pente négative pour la longitude. Cette station se déplace vers :", "p": ["le Nord-Ouest", "le Sud-Ouest", "le Sud-Est", "le Nord-Est"], "b": "A", "j": "Une pente positive en latitude traduit un déplacement vers le Nord ; une pente positive en longitude traduirait un déplacement vers l'Est, donc une pente négative traduit un déplacement vers l'Ouest. La résultante est dirigée vers le Nord-Ouest.", "img": "", "fixes": 0}, {"t": "Sur les graphiques qui représentent, au cours du temps, l'écart de position d'une station GPS par rapport à une mesure de référence :", "p": ["une pente positive pour la longitude correspond à un déplacement vers l'Ouest", "le vecteur vitesse de la station s'obtient en construisant la résultante des vecteurs latitude et longitude", "la pente de la droite donne la vitesse selon la composante étudiée (latitude ou longitude)", "une pente positive pour la latitude correspond à un déplacement vers le Sud"], "b": "BC", "j": "La pente de chaque droite donne la vitesse selon une composante : positive, elle indique un déplacement vers le Nord (latitude) ou vers l'Est (longitude). Le vecteur vitesse est la résultante des deux.", "img": "", "fixes": 0}, {"t": "Les forages réalisés dans les fonds océaniques montrent que :", "p": ["l'âge des sédiments océaniques ne dépasse pas 180 Ma", "les sédiments les plus anciens se trouvent à l'axe de la dorsale", "plus on s'éloigne de la dorsale, plus l'âge des sédiments au contact des basaltes augmente", "plus on s'éloigne de la dorsale, plus l'épaisseur des sédiments augmente"], "b": "ACD", "j": "Le plancher océanique est de plus en plus ancien en s'éloignant de la dorsale, de part et d'autre de celle-ci : les sédiments qui le recouvrent sont donc plus vieux et plus épais (temps de dépôt plus long).", "img": "", "fixes": 0}, {"t": "Les sédiments océaniques n'ont jamais plus de 180 Ma. Cette observation confirme que :", "p": ["la Terre s'est formée il y a 180 Ma", "les sédiments ne se déposent pas loin des dorsales", "la lithosphère océanique finit par disparaître par subduction", "les dorsales ont cessé de fonctionner il y a 180 Ma"], "b": "C", "j": "L'absence de fonds océaniques plus anciens confirme la théorie de Hess : la destinée de la lithosphère océanique est de disparaître par subduction.", "img": "", "fixes": 0}, {"t": "À propos de la vitesse d'expansion des dorsales :", "p": ["la dorsale médio-atlantique est une dorsale lente (environ 2 cm/an)", "la dorsale pacifique est une dorsale lente", "la vitesse d'expansion est la même pour toutes les dorsales et à toutes les époques", "les dorsales rapides sont associées à des plaques qui subductent"], "b": "AD", "j": "La dorsale pacifique (17 cm/an) est rapide et associée à des subductions, la dorsale médio-atlantique (2 cm/an) est lente. La vitesse varie selon les périodes, les côtés de la dorsale et les dorsales.", "img": "", "fixes": 0}, {"t": "À propos des frontières de plaques :", "p": ["les dorsales sont des zones de convergence", "les séismes dessinent les limites des plaques lithosphériques", "le flux géothermique est élevé au niveau des dorsales", "le flux géothermique est faible au niveau des fosses océaniques"], "b": "BCD", "j": "Le flux géothermique est élevé aux dorsales (remontée de manteau chaud) et faible aux fosses (enfoncement d'une lithosphère froide). Les dorsales sont des zones de divergence ; la convergence concerne la subduction et la collision.", "img": "", "fixes": 0}, {"t": "D'après les arguments étudiés, le fonctionnement des dorsales :", "p": ["forme le plancher océanique dans l'axe de la dorsale, d'où il s'écarte ensuite des deux côtés", "produit toujours autant de lithosphère de chaque côté de la dorsale", "est indépendant de l'existence d'une subduction", "compense le « vide » créé par la plaque qui subducte"], "b": "AD", "j": "L'épanchement des dorsales est géré par l'existence ou non d'une subduction : la plaque qui plonge crée un vide que la dorsale compense. La production n'est pas toujours symétrique : la dorsale Pacifique est plus productive côté Est.", "img": "", "fixes": 0}], "auto": [{"production": "Hawaï (consigne 1)", "criteres": [{"nom": "Conformité", "points": ["Graphique titré, axes nommés avec unités, droite de tendance ; vitesse convertie en cm/an (1 km/Ma = 0,1 cm/an)."]}, {"nom": "Exactitude", "points": ["Volcans plus âgés vers le nord-ouest au-dessus d'un point chaud fixe : la plaque va vers le nord-ouest, ≈ 9 cm/an.", "GPS de Kauai : résultante de 34,7 mm/an (nord) et 62,3 mm/an (ouest), ≈ 7 cm/an vers l'ouest-nord-ouest."]}]}, {"production": "Islande, GPS et sédiments (consignes 2 à 4)", "criteres": [{"nom": "Conformité", "points": ["Carte titrée et légendée : plaques nord-américaine (ouest) et eurasiatique (est), dorsale SO-NE, volcans, failles parallèles."]}, {"nom": "Complétude", "points": ["Arguments : limite de plaques dans le prolongement de la dorsale, volcans et séismes alignés, failles d'écartement."]}, {"nom": "Exactitude", "points": ["Vecteurs à l'échelle ; écartement = 13,9 − (− 9,7) = 23,6 mm/an ≈ 2,4 cm/an (et non 22 + 20).", "Sédiments plus vieux loin de la dorsale ; ≈ 20 km/Ma = 2 cm/an d'un côté de la dorsale."]}]}, {"production": "Liste d'idées (bilan)", "criteres": [{"nom": "Complétude", "points": ["Quatre idées (point chaud, GPS, dorsale, âge des sédiments), chacune avec un argument chiffré."]}, {"nom": "Cohérence et pertinence", "points": ["Pour chaque idée, je dis ce qu'elle apporte : direction, sens ou vitesse du mouvement."]}, {"nom": "Exactitude", "points": ["Je n'écris pas que le point chaud se déplace ; mes vitesses sont en cm/an."]}]}]}, {"id": 49, "code": "6fa2ca2e16", "titre": "Thème 2 – Activité 4 : La formation de la lithosphère océanique", "questions": [{"t": "À propos de la lithosphère et de l'asthénosphère :", "p": ["l'asthénosphère a un comportement ductile", "la lithosphère correspond uniquement à la croûte", "la base de la lithosphère est située au niveau de l'isotherme 1 300 °C", "la lithosphère a un comportement rigide et cassant"], "b": "ACD", "j": "La lithosphère (croûte + manteau lithosphérique) est rigide, l'asthénosphère située en dessous est ductile ; la limite entre les deux correspond à l'isotherme 1 300 °C.", "img": "", "fixes": 0}, {"t": "La LVZ (Low Velocity Zone) :", "p": ["est une zone dans laquelle les ondes sismiques se déplacent moins vite que prévu", "a son sommet vers 100 km de profondeur, ce qui correspond à la base de la lithosphère", "est une zone dans laquelle la roche est entièrement fondue", "correspond au noyau externe liquide"], "b": "AB", "j": "Dans la LVZ, moins de 1 % de la roche pourrait entrer en fusion, ce qui suffit à ralentir les ondes : la roche reste donc essentiellement solide. S
